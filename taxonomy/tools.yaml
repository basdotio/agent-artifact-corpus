# The scanners this corpus can carry rule-level expectations for.
#
# Read this first, because it is the part people get backwards:
#
#   A label's `truth` block is enough to score ANY scanner. It says what the sample is, how
#   deeply it is buried and how bad it is, so a runner can ask "did the tool report this at
#   or above truth.severity" without knowing anything about the tool's rule ids. Nobody needs
#   an entry here to benchmark their scanner against this corpus.
#
#   An entry here buys two things: `expect.<tool>` blocks in labels, and part 2 of the
#   measurement below.
#
# ---------------------------------------------------------------------------------------
# The measurement has two parts, and an entry here is what makes the second one possible.
#
#   Part 1 — did it find a problem at all?  Scored from `truth` alone. Needs nothing here.
#   Part 2 — having found one, did it say what KIND?  Needs `dimension_map`.
#
# Part 2 is where scanners separate. Two tools at the same recall can differ completely: one
# names the technique, the other only reports that something is encoded. Both "caught" it;
# only one told you what you are dealing with.
#
# ---------------------------------------------------------------------------------------
# `dimension_map` translates the tool's own finding categories into this corpus's dimensions.
#
# It is keyed on SECTION NAME, not on rule id and not on rule id prefix. Prefix would be
# wrong: in AgentGuard, `PERM-*` rules live under three different dimensions, and `LLM-*`
# under six. The per-rule assignment is read from the tool's own generated rule reference, so
# it cannot drift from the tool; this file only has to map its dimension names onto ours,
# which is a dozen lines rather than seventy-three.
#
# A null value means the category maps to no dimension of ours. That is not a gap to be
# filled — it is a real and interesting outcome. A scanner whose only finding on a
# base64-wrapped reverse shell is "Obfuscation" passes part 1 and fails part 2: it detected
# that something was hidden, not that there was a backdoor.
#
# `rules_source` locates the generated reference. `env` names an environment variable holding
# the path; `path` is relative to this repository's root and MAY NOT leave it — the validator
# rejects one that does. Both optional, and for an external scanner `env` is the only correct
# choice: a tool with no reachable reference downgrades to "rule ids not checked for this
# tool" and says so, rather than silently passing everything.
#
# Why `path` is forbidden from escaping: aguard's used to be `../agent-guard/docs/rules.md`, a
# sibling directory on one machine. Nothing broke — which was the problem. `make validate`
# reported "73 ids, 56 carry a dimension" on that machine and "not checked" on every other,
# so the corpus's own validation result depended on the author's directory layout. A
# tool-neutral corpus cannot have an output conditional on having one particular tool.
#
# A scanner's rule list belongs to that scanner, and so does the check that a label's rule
# ids exist in it. That check is scorer-adjacent, and the Makefile header already states
# where the scorer lives: in the scanner's repository, which should clone this corpus and
# validate its own `expect` blocks against its own rules. Setting the env var below is how
# someone with a local checkout gets the same check here — opt-in, and visibly so.
#
# `severity_ladder` is that tool's own ladder, ordered most to least severe, last entry being
# its name for "nothing". Expectation bounds in a label are checked against the ladder of the
# tool whose block they sit in, which is why two tools with different ladders can annotate
# the same sample without either adopting the other's.

tools:
  - id: aguard
    name: AgentGuard
    url: https://github.com/basdotio/agent-guard
    severity_ladder: [critical, high, medium, low, none]
    # The suffix is NOT always numeric: REP-GOOD and REP-BAD are reputation verdicts. A
    # digits-only pattern finds 71 of the 73 ids and then rejects any label citing those two
    # as "not a rule the tool can emit" — a validator confidently wrong about the thing it
    # validates.
    rule_id_pattern: '\b([A-Z]{2,10}-[A-Z0-9]{3,4})\b'
    # Captures the section name from headings like "## 3 — Data exfiltration" and
    # "## Scan notes (dimension 0)". One capture group, the name.
    section_pattern: '^## (?:[0-9]+ — )?(.+)$'
    rules_source:
      # No `path`. aguard is a separate repository, so there is no location inside this one
      # that could hold its rules; an aguard developer exports AGUARD_RULES_MD to get the
      # rule-id check locally, and everyone else sees "not checked", which is the truth.
      env: AGUARD_RULES_MD
    native_format: sarif-2.1.0
    dimension_map:
      Prompt injection: injection
      Excessive permissions: permission
      Data exfiltration: exfiltration
      Code execution: execution
      Supply chain: supply-chain
      Backdoor: backdoor
      Resource abuse: resource-abuse
      Filesystem: filesystem
      # Deliberately unmapped. Obfuscation is this corpus's `tier`/`evasion` axis, not a
      # dimension; a finding here says the sample was hidden, never what it does.
      Obfuscation: ~
      # Deliberately unmapped. A mismatch between stated purpose and behaviour is a property
      # of the artifact's honesty, not a category of attack.
      Intent mismatch: ~
      # Dimension 0. These describe the scan, not the artifact.
      Scan notes (dimension 0): ~
      Load-time gate: ~

  - id: ccaudit
    name: cc-audit
    url: https://github.com/ryo-ebata/cc-audit
    # Its findings ladder has four rungs and no name for "nothing"; `safe` is the bottom of the
    # separate 0-100 risk_score ladder (RiskLevel::Safe, score 0) and is the only word the tool
    # has for a clean result, so it serves as the last entry here.
    severity_ladder: [critical, high, medium, low, safe]
    # Three letters as well as two: DEP-004 and MW-123 are both real, so the {2,3} is load
    # bearing. Observed prefixes at v3.23.9: DEP DK EX MW OB OP PE PI PS SA SC SL.
    rule_id_pattern: '\b([A-Z]{2,3}-[0-9]{3})\b'
    # Unused for this tool, and present so its absence is not read as an oversight: cc-audit
    # puts the category on each FINDING, so nothing has to be recovered from a heading.
    section_pattern: '^#+ (.+)$'
    rules_source:
      # No `path`. cc-audit is a separate repository (docs/RULES.md there), so there is no
      # location inside this one that could hold its rules, and a path escaping this repository
      # is what made aguard's validation depend on one machine's directory layout.
      env: CCAUDIT_RULES_MD
    native_format: sarif-2.1.0
    # Keyed on the `category` field cc-audit puts on every finding — not on a section name and
    # not on a rule-id prefix. Two spellings exist in one document: findings say `supplychain`,
    # risk_score.by_category says `supply_chain`. The finding spelling is authoritative here
    # because that is where a per-finding kind is read from.
    #
    # DECIDED BY MEASUREMENT, 2026-09-23, not by reading the names — two of these were wrong on
    # the first pass. Method: over the 159 read-basis malicious samples where cc-audit reported
    # a category, cross-tabulate categories against truth dimensions and rank by LIFT over the
    # base rate, P(dimension | category) / P(dimension). Raw share is useless: cc-audit emitted
    # 5,612 `supplychain` findings corpus-wide, so it co-occurs with everything and its biggest
    # raw overlap is `execution` only because `execution` is common.
    dimension_map:
      # lift 4.33 — the strongest signal in the table.
      persistence: backdoor
      # lift 3.42.
      overpermission: permission
      # lift 2.83.
      promptinjection: injection
      # lift 2.38, beating execution by 0.10. The weakest of the five that mapped; re-measure
      # if the corpus grows.
      supplychain: supply-chain
      # lift 1.96.
      exfiltration: exfiltration
      # Deliberately unmapped, and the corpus's own worked example: the measurement splits the
      # signal between execution (2.32) and exfiltration (1.87) with neither dominant. A finding
      # here says the sample was hidden, never what it does. aguard's Obfuscation is unmapped
      # for the same reason, so this is symmetric rather than a penalty.
      obfuscation: ~
      # Deliberately unmapped, and the interesting one. It fires on 61 of the 159 samples — more
      # than any other category — and NOTHING clears the bar: filesystem 1.50 at n=9, then
      # permission 1.42, then injection 1.38. A category that common carrying that little
      # information about the KIND of attack is exactly what part 2 exists to surface. Mapping
      # it to `permission` on the strength of its name would credit the tool for naming a kind
      # the evidence says it did not name.
      privilegeescalation: ~
      # Unmeasurable rather than judged: one read-basis malicious sample carries it, so there is
      # no evidence either way. Null is the conservative reading — a credential being present is
      # not a finding that it leaves the machine — and it moves the figure by at most one sample.
      secretleak: ~
