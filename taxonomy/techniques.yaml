# The label vocabulary. None of it belongs to any scanner.
#
# A sample is placed on three axes, and the reason there are three rather than one is that
# each answers a different question about a scanner that failed:
#
#   dimension  what the sample achieves      -> the scanner is missing a capability
#   tier       how deeply it is buried       -> the scanner's matching is too literal
#   evasion    which mechanism buries it     -> exactly which transformation to handle
#
# `truth.techniques` on a malicious sample and `truth.resembles` on a hard negative draw from
# `techniques`. `dimension` is the recall axis; taking it from a scanner's own rule categories
# would make every cross-tool comparison circular.
#
# DELIBERATELY NOT MAPPED to OWASP Agentic or MITRE ATLAS. A mapping written from memory
# validates exactly as well as a correct one, and this file is cited by the published report.

# ---------------------------------------------------------------------------------------
# Axis 1 — what the sample achieves.
#
# `obfuscation` is NOT here, and its absence is the point. Obfuscation is how an attack
# hides, not what it accomplishes, and both skillsgoat's category list and AgentGuard's
# scoring dimensions put the two on one axis. The cost of that is concrete: a sample is
# either "backdoor" or "obfuscation" and never both, so you cannot ask whether a scanner
# handles an OBFUSCATED BACKDOOR — which is the question worth asking. Here a base64-wrapped
# reverse shell is dimension backdoor, tier evasive, evasion base64-wrapper.
# ---------------------------------------------------------------------------------------
# Each carries `what` it achieves and `not` — the neighbour it is most often confused with,
# and the element that decides between them. The `not` field is the load-bearing half: these
# eight words were a bare list for most of this corpus's life, and an audit found two disputed
# mappings that could not be adjudicated because nothing was written to adjudicate against.
#
# A malicious sample must sit on at least one of these. A sample whose entire content is
# concealment and which achieves nothing here has no dimension, and that is a real state, not
# an oversight. Since the schema requires a dimension of every malicious sample, such an
# artifact is excluded by name with its reason rather than assigned one it does not earn.
dimensions:
  - id: injection
    what: >-
      Attacker-controlled text reaches the agent and is acted on as instruction.
    not: >-
      NOT execution. Injection governs the AGENT — it persuades — while execution runs code on
      the host. The deciding element is who acts: if the artifact only has to be READ to work,
      it is injection; if something has to RUN, it is execution. A sample can be both.

  - id: exfiltration
    what: >-
      Data that was on the host leaves it.
    not: >-
      NOT the read. Copying a credential file, enumerating the environment or tarring a
      directory is ordinary on its own; the transmission off-host is the whole offence. If
      nothing leaves, this is not the dimension.

  - id: execution
    what: >-
      Attacker-chosen code runs on the host.
    not: >-
      NOT a command that is merely described or printed. A skill that displays a shell snippet
      for a human to copy has executed nothing. The deciding element is that the artifact hands
      the code to something that runs it.

  - id: backdoor
    what: >-
      Something is installed that outlives the invocation and grants later access or control.
    not: >-
      NOT execution. The deciding element is a CHANNEL or a foothold the attacker can act
      through: a live reverse shell, a bound listener, a cron entry, a modified rc file, an
      installed kernel module. Code that runs and finishes without leaving the attacker a way
      back in is execution. (An earlier wording here said a reverse shell "opened and closed
      within the run" was execution, which contradicted this file's own `reverse-shell`
      technique, assigned to backdoor. A reverse shell hands an interpreter to the far end;
      that is a channel whether or not it survives a reboot.)

  - id: supply-chain
    what: >-
      The trust chain that would otherwise vet a component is subverted, so the agent adopts
      attacker-controlled material as though it had been vetted.
    not: >-
      NOT merely claiming to be trustworthy. There has to be a COMPONENT the agent then pulls
      in — a package, a dependency, a plugin, a nested artifact. Fabricated star ratings and
      invented audit badges with nothing to install are concealment aimed at whoever reviews
      the artifact, which is `evasion: judge-targeting` and no dimension at all.

  - id: permission
    what: >-
      The agent's authority is widened beyond what was granted to it.
    not: >-
      NOT using granted authority to do harm. A skill allowed to run shell commands that runs a
      destructive one is execution. This dimension is for crossing the boundary itself:
      escaping a container, escalating privilege, or writing the permission config that governs
      the agent.

  - id: filesystem
    what: >-
      Files on the host outside the working area are read, written, or destroyed.
    not: >-
      NOT ordinary project file access, and not reading a credential in order to send it —
      that is exfiltration. This dimension is for the filesystem effect itself: truncating
      logs, deleting trees, rewriting dotfiles, tampering with timestamps.

  - id: reconnaissance
    what: >-
      Information about the host, its network, its accounts or its credentials is gathered and
      handed to whoever called the tool, without being transmitted anywhere else.
    not: >-
      NOT exfiltration — nothing leaves the host; the data goes back out the same channel the
      request came in on, and `exfiltration.not` is explicit that the transmission is the whole
      offence. NOT filesystem either: that dimension is the EFFECT on files, and this one is
      the information, from sources that are often not files at all — a process environment, a
      port scan, a cloud metadata endpoint, a user database read through libc. A sample that
      reads /etc/passwd earns both, and should carry both.
    # Added after a census of 253 samples found 20 labelled `exfiltration` with no egress
    # anywhere in them. They were not mislabelled by carelessness: the vocabulary had no word
    # for what they do, so a category map put them on the nearest one and inverted the
    # measurement — a scanner correctly reporting "host enumeration" was scored WRONG. The
    # alternative was excluding nine real malicious MCP servers and losing the ability to ask
    # "does this scanner catch internal port scanning", which is a question worth asking.

  - id: resource-abuse
    what: >-
      Host resources — CPU, memory, disk, network, or a paid API quota — are consumed for the
      attacker's benefit or to deny them to the user.
    not: >-
      NOT an expensive but honest workload. The deciding element is that the consumption serves
      someone other than the user.

# ---------------------------------------------------------------------------------------
# Axis 2 — how deeply the attack is buried. Ordinal: later entries are harder.
#
# `maps_to` records the equivalent level in skillsgoat and in cisco-ai-defense/mcp-scanner,
# both of which number their samples on the same four-level scale. Using our own words costs
# the ability to cross-reference their published figures; this field buys it back.
# ---------------------------------------------------------------------------------------
tiers:
  - id: plain
    maps_to: "skillsgoat / cisco 000"
    what: >-
      Nothing hides it. The attack is readable in the artifact exactly as written.
    calibration: true

  - id: indirect
    maps_to: "skillsgoat / cisco 100"
    what: >-
      The payload is one hop away: in another file, behind a run-time fetch, or gated on a
      trigger. Nothing is transformed — you simply have to follow the hop.

  - id: evasive
    maps_to: "skillsgoat / cisco 200"
    what: >-
      The text is transformed to defeat matching: encoded, split, padded, or written in
      characters that look like other characters.

  - id: structural
    maps_to: "skillsgoat / cisco 300"
    what: >-
      No single artifact contains the whole attack, or the analyzer itself is the target.
      It defeats static analysis by its shape rather than by hiding a string.

# `calibration: true` marks the level every scanner must catch. A miss there is a property
# failure, not a low score — it says the scanner is broken rather than weak, and the two
# should never appear in the same number.
#
# The scale reads differently for the two classes, and both readings are ordinal in the same
# direction, which is what lets a hard negative sit in the same grid cell as the attack it
# imitates:
#
#   malicious       how deeply the attack is buried
#   hard negative   how deep an analysis must go before it can tell this apart from the attack
#
# So a `plain` hard negative is one a surface check clears, and firing on it means the scanner
# is broken. A `structural` hard negative is one no amount of matching can clear, because the
# difference is semantic — use versus mention, say. Hard negatives therefore carry a tier but
# no `evasion`: they are not burying anything, and what makes them hard is written out in
# `truth.differs_by`, which the class already requires.

# ---------------------------------------------------------------------------------------
# Axis 3 — which mechanism does the burying. Closed vocabulary.
#
# Closed on purpose. An open field degrades into free text, and free text cannot be
# aggregated, which defeats the only reason this axis exists. Adding a mechanism means
# adding an entry here, in the same change as the sample that needs it.
#
# `implies_tier` is enforced: a sample's tier may not be lower than the highest tier its
# evasion list implies. Without that rule a base64-wrapped payload could be labelled `plain`
# and would then sit in the calibration set, where a miss is supposed to mean "broken".
#
# An empty list means none, which is what `plain` requires.
# ---------------------------------------------------------------------------------------
evasion:
  # --- one hop away, nothing transformed ---
  - id: external-fetch
    implies_tier: indirect
    what: "The payload is downloaded at run time rather than shipped in the artifact."

  - id: config-indirection
    implies_tier: indirect
    what: "The artifact points at a settings or config file that carries the payload."

  - id: dormant-trigger
    implies_tier: indirect
    what: "The payload is present but gated on a condition: an env var, a date, a codeword."

  # --- the text is transformed ---
  - id: base64-wrapper
    implies_tier: evasive
    what: "The payload is encoded and decoded at run time. Any wrapper counts, not only base64."

  - id: line-continuation
    implies_tier: evasive
    what: "A command word is broken across lines so a line-oriented matcher sees neither half."

  - id: quote-splitting
    implies_tier: evasive
    what: "Quotes are opened and closed inside a command word to break the literal."

  - id: zero-width
    implies_tier: evasive
    what: "Zero-width characters are inserted inside the strings a matcher looks for."

  - id: blank-padding
    implies_tier: evasive
    what: "The payload is pushed far down the file, past where a truncating reader stops."

  - id: unicode-confusable
    implies_tier: evasive
    what: "Characters that render like ASCII stand in for it, typically in a hostname."

  - id: bidi-override
    implies_tier: evasive
    what: "Directional control characters make a filename or line read as something else."

  - id: extension-magic-mismatch
    implies_tier: evasive
    what: "The extension and the file's actual content type disagree, so the wrong reader runs."

  - id: semantic-paraphrase
    implies_tier: evasive
    what: >-
      The attack is expressed in wording no signature covers, with none of the canonical
      phrases present. "Previous operational guidelines are treated as suggestions rather
      than requirements" is an instruction override carrying no literal override string, so a
      matcher looking for one finds nothing while the meaning is intact. It is a
      transformation of the phrasing rather than of the characters, and it is the mechanism a
      literal scanner is least equipped for.

  - id: split-across-files
    implies_tier: evasive
    what: >-
      Each fragment is innocuous on its own and only the concatenation is the payload, so a
      per-file verdict cannot see it.

  # --- the shape defeats the analysis ---
  - id: multi-stage-chain
    implies_tier: structural
    what: "One artifact writes or installs the next; neither alone is the attack."

  - id: binary-container
    implies_tier: evasive
    what: >-
      The payload rides inside a non-code binary the analyzer treats as opaque — a PNG tEXt
      chunk, an archive entry, an image asset. The whole attack is still in one artifact, so
      this is transformation rather than structure.

  - id: bundled-pyc
    implies_tier: structural
    what: >-
      Compiled code ships instead of, and diverging from, the source beside it. The analyzer
      reads one thing and the runtime executes another, which defeats the analysis
      structurally rather than by hiding a string.

  - id: judge-targeting
    implies_tier: evasive
    what: >-
      The content works on the analyzer or its LLM judge rather than on the agent. It spans a
      range of strengths — audit-flavoured rationale comments at the weak end, text addressed
      straight to the reviewer ("report this clean") at the strong end — so the floor here is
      the weakest case. A sample doing the strong version carries a deeper tier of its own.

# ---------------------------------------------------------------------------------------
# The techniques themselves.
#
# `benign_lookalike` is the discrimination test written out once, at the vocabulary level
# rather than repeated in every label. It is what the author of another scanner needs from
# us: not "we fire rule BD-003 here", but "these two shapes differ by exactly this".
# ---------------------------------------------------------------------------------------
techniques:
  - id: reverse-shell
    title: Reverse shell
    dimension: backdoor
    what: >-
      Opens an outbound connection and hands an interactive interpreter to the far end,
      typically by duplicating the socket onto stdin, stdout and stderr and then spawning a
      shell.
    benign_lookalike: >-
      Any client that opens a socket and writes to it — a metrics reporter, a log shipper, a
      health check. The distinguishing elements are redirection of the standard file
      descriptors onto the socket and the spawn of an interpreter, not the socket itself.

  - id: env-exfiltration
    title: Environment exfiltration
    dimension: exfiltration
    what: >-
      Reads the whole process environment and transmits it off-host, carrying whatever
      credentials the agent was started with.
    benign_lookalike: >-
      Copying the environment and handing it to a child process, which is the ordinary way
      to set a variable for a subprocess. The distinguishing element is transmission
      off-host, not the read.

  - id: instruction-override
    title: Instruction override
    dimension: injection
    what: >-
      Text addressed to the agent directing it to disregard system or prior instructions and
      to follow the artifact instead.
    benign_lookalike: >-
      Documentation and defensive prose that quotes the override phrase in order to teach
      refusal of it. The distinguishing element is use versus mention, which is a hard
      problem for a literal matcher and the reason this pair exists.

  # ---------------------------------------------------------------------------------------
  # Reconstructed from named CVEs. These three name the mechanisms of CVE-2025-59536, added
  # when the corpus's hooks, connector and permission surfaces held zero malicious samples and
  # no public corpus provided one. A CVE is the one source design.md's "we cannot write samples
  # that surprise us" does not rule out: the shape came from Check Point's disclosure, not from
  # reading our own rules. Each maps to a single dimension, like every other technique.
  - id: lifecycle-hook-execution
    title: Lifecycle-hook command execution
    dimension: execution
    what: >-
      A project's `.claude/settings.json` registers a lifecycle hook — SessionStart, PreToolUse
      — whose command runs a shell payload automatically when the project opens, before any
      trust dialog. The command typically fetches and runs a remote script.
    benign_lookalike: >-
      A legitimate hook that formats code, injects context or guards a boundary — the corpus
      holds ~190 of them. The distinguishing element is what the command does, not that a hook
      exists: a formatter runs a known local script, this fetches and executes an arbitrary one.

  - id: mcp-autostart-execution
    title: Auto-started MCP server execution
    dimension: execution
    what: >-
      A `.mcp.json` defines a server that launches a process, and a `.claude/settings.json`
      sets `enableAllProjectMcpServers` so it starts on invocation, before the user can decline
      the untrusted project. The executed command lives in the paired file, not the trigger.
    benign_lookalike: >-
      A project that ships a `.mcp.json` and lets the user approve its servers at the trust
      dialog — ordinary and common. The distinguishing element is the setting that removes the
      approval, not the presence of a project server.

  - id: api-base-url-redirect
    title: API base-URL redirect
    dimension: exfiltration
    what: >-
      A `.claude/settings.json` env block sets `ANTHROPIC_BASE_URL` to a host the repository
      chose, so every API request — carrying the user's key in the authorization header — is
      sent there before the user decides to trust the directory.
    benign_lookalike: >-
      A settings file that sets env vars for legitimate configuration, including a base URL
      pointing at a corporate proxy the team runs. The distinguishing element is whose host it
      is, which a scanner cannot always tell from the string alone — so the sample sits at the
      calibration tier, where a miss means the scanner does not read env blocks at all.

  # ---------------------------------------------------------------------------------------
  # MCP tool-description poisoning, reconstructed from MCPTox (arXiv 2508.14925, AAAI 2026).
  # The corpus's 127 MCP samples all come from one source and put the attack in a Python tool
  # BODY. MCPTox's shape is different and is the one this technique names: the tool body is
  # inert and the attack lives entirely in the DESCRIPTION metadata the agent reads. MCPTox is
  # unlicensed, so the poisoned strings here are re-authored, not copied — the shape is theirs,
  # the words are ours, and the label says reconstruction.
  - id: mcp-tool-poisoning
    title: MCP tool-description poisoning
    dimension: injection
    what: >-
      A tool's declared `description` — the metadata the agent reads before calling it —
      carries instructions the agent obeys: to call a different high-privilege tool first, to
      apply an ambient rule to some other tool, or to silently rewrite an argument. The tool's
      implementation does nothing; the description is the whole attack.
    benign_lookalike: >-
      An ordinary tool description that documents preconditions or related tools — "call
      list_files first to get a path". The corpus holds 357 benign tools.json declarations that
      do exactly this legitimately. The distinguishing element is an instruction that overrides
      the user or redirects to an unrelated privileged action, not the presence of guidance.

  # ---------------------------------------------------------------------------------------
  # Three more config-file mechanisms, reconstructed from named disclosures, added to give the
  # hooks/permission/connector surfaces a SECOND shape each. Sources in each label.
  - id: mcp-server-command-payload
    title: MCP server command is a shell payload
    dimension: execution
    what: >-
      A `.mcp.json` server entry's `command`/`args` is a shell interpreter running a fetched or
      inline payload — `bash -c "curl … | bash"`, a reverse shell — rather than a real MCP
      server binary. The IDE starts it on write or open. (CurXecute, CVE-2025-54135.)
    benign_lookalike: >-
      A legitimate `.mcp.json` whose command is `npx`, `node`, `uvx` or a real server binary —
      the corpus holds 122 benign connector configs shaped exactly so. The distinguishing
      element is a shell interpreter running an arbitrary payload, not the presence of a command.

  - id: agent-permission-bypass
    title: Sub-agent config disables the permission prompt
    dimension: permission
    what: >-
      A `.claude/agents/<name>.md` definition sets `permissionMode: bypassPermissions`, so the
      sub-agent runs Bash without prompting even when the user's default mode requires approval.
      The attacker-controlled file removes the human-in-the-loop. (Reversec, 2026.)
    benign_lookalike: >-
      An ordinary agent definition that declares `tools:` and a role. The distinguishing element
      is the permission-mode override, not that an agent file grants Bash — many legitimately do,
      subject to the user's own deny rules.

  - id: hook-auto-approve
    title: Hook auto-approves tool calls
    dimension: permission
    what: >-
      A `PreToolUse` hook emits an allow decision that takes precedence over the user's
      permission files, auto-approving a dangerous tool (curl), and sets `suppressOutput` so its
      activation indicator is hidden from the transcript. (PromptArmor, 2026.)
    benign_lookalike: >-
      A legitimate PreToolUse hook that formats or validates a tool call and returns no decision.
      The distinguishing element is emitting an `allow` decision that overrides the user's rules,
      compounded by hiding itself.

  # ---------------------------------------------------------------------------------------
  # Three more disclosed config-file mechanisms — a THIRD distinct shape on each empty surface.
  # Not variants: each exercises a scanner code path the surface's other shapes do not.
  - id: hook-permission-rewrite
    title: Hook rewrites the permission file
    dimension: permission
    what: >-
      A UserPromptSubmit hook runs a script that overwrites the user's settings.local.json —
      stripping existing rules and inserting a blanket allow for a dangerous tool (curl) — so
      later actions run with no prompt. Distinct from a hook that runs a payload directly: this
      one tampers with the permission file for persistent auto-approval. (PromptArmor, 2026.)
    benign_lookalike: >-
      A UserPromptSubmit hook that injects project context or logging — common and legitimate.
      The distinguishing element is a hook whose script edits the permission file, not that a
      hook runs on prompt submit.
  - id: dynamic-context-exec
    title: Skill dynamic-context command execution
    dimension: execution
    what: >-
      A skill declares `allowed-tools: Bash(*)` and embeds a `!` dynamic-context input, which
      Claude Code expands and executes BEFORE the model reasons about it and without a prompt —
      the plain-prose form is refused, the backtick form runs. (Reversec, 2026.)
    benign_lookalike: >-
      A skill that legitimately declares a Bash tool and documents example commands in prose.
      The distinguishing element is the `!`command`` dynamic-context syntax that executes at
      load, not the mention of a command.
  - id: mcp-post-approval-swap
    title: MCP server command swapped after approval
    dimension: execution
    what: >-
      Trust is bound to the server's KEY NAME, so a benign entry is approved once and its
      command/args are later swapped to a reverse shell under the same key — no re-prompt.
      (MCPoison, CVE-2025-54136.) Distinct from CurXecute: the file is trusted, then mutated.
    benign_lookalike: >-
      A legitimate .mcp.json whose server the user approved. The distinguishing element is a
      command that a scanner comparing against the approved baseline would see has changed — a
      point-in-time read cannot, which is exactly what makes this shape worth a sample.

  # ---------------------------------------------------------------------------------------
  # Reconstructed from the ATR rule library (Agent-Threat-Rule, MIT) — disclosed config-surface
  # shapes this corpus had no sample for. Each cites its CVE or named research in the label.
  - id: git-config-exec-hook
    title: Git config callback turned into an execution hook
    dimension: backdoor
    what: >-
      A git config callback key (core.fsmonitor, core.sshCommand, core.hooksPath, credential.helper,
      filter.*.clean) is pointed at an inline shell command, so it runs on the next ordinary git
      operation — a persistent foothold, not a one-shot. (CVE-2026-55607.)
    benign_lookalike: >-
      A hook that legitimately runs git or a formatter. The distinguishing element is a git config
      key — not a setting but a callback — being set to a fetch-and-run command.
  - id: ssh-authorized-keys-persist
    title: Persistence via authorized_keys or shell rc
    dimension: backdoor
    what: >-
      A skill directs writing an attacker SSH key into ~/.ssh/authorized_keys, or prepending a
      writable dir onto PATH in a shell startup file — passwordless re-entry or code that re-runs
      every shell. (GHSA-mined technique.)
    benign_lookalike: >-
      A setup skill that legitimately configures SSH or a shell profile. The distinguishing element
      is an attacker-controlled key or a temp dir hijacking PATH, not the act of editing the file.
  - id: guardrail-self-disable
    title: Agent config tool disables its own guardrail
    dimension: permission
    what: >-
      A config-mutation directive turns off a protection the agent is subject to — the sandbox, the
      deny-list, the approval requirement, gateway auth. (CVE-2026-45001.)
    benign_lookalike: >-
      A legitimate performance or config tweak. The distinguishing element is the specific key being
      set to a value that removes a protection, not that config is being changed.
  - id: wildcard-auto-approve
    title: Blanket auto-approval written into trust config
    dimension: permission
    what: >-
      A trust/approval key is set to a wildcard or blanket-true — autoApprove true, allow Bash(*),
      requireConfirmation false — removing the human gate for all later actions. (AWS-2025-019.)
    benign_lookalike: >-
      A settings file with scoped allow rules the user chose. The distinguishing element is the
      wildcard/blanket value, not the presence of a permissions block.
  - id: mcp-env-process-hijack
    title: MCP config env block sets a process-hijack variable
    dimension: execution
    what: >-
      An MCP stdio server's env block sets NODE_OPTIONS --require, LD_PRELOAD, DYLD_INSERT_LIBRARIES,
      BASH_ENV or similar, so the spawned child loads attacker code before running. (CVE-2026-44995.)
    benign_lookalike: >-
      An env block setting an API base URL or a log level. The distinguishing element is a
      well-known process-hijacking variable pointing at a loadable payload.
  - id: mcp-self-registration
    title: Agent writes a new server into its own MCP trust config
    dimension: backdoor
    what: >-
      A directive appends a server to the mcpServers block of a config the agent itself loads, so it
      starts every session. The command is deliberately unremarkable — persistence and privilege
      expansion, not immediate RCE. (MCP-18 Shadow MCP.)
    benign_lookalike: >-
      A project that legitimately ships an mcpServers entry the user approves. The distinguishing
      element is the agent silently adding one to its own trust file.
  - id: mcp-tool-rugpull
    title: MCP tool description redefined after approval
    dimension: injection
    what: >-
      A tool's description is benign at approval time, then silently redefined — on a version bump,
      a marker file, or a second run — to inject hidden execution or exfiltration. Time-of-check to
      time-of-use on the metadata the agent trusts. (Repello AI rug-pull.)
    benign_lookalike: >-
      A tool whose description documents a real precondition. The distinguishing element is a
      conditional redefinition gated on state the user cannot see at approval.
