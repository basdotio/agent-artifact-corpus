# The regression gate this repository's README describes.
#
# Until this file existed, that gate was a design and not a mechanism: every invariant the
# corpus depends on lives in `make validate`, and every one of them breaks from ordinary
# editing rather than from bad code — renaming a sample, adding one, translating a document
# in one language only, re-deriving an entry. Those are exactly the things a person forgets
# to check.
#
# It runs on a CLEAN CHECKOUT, which is the other half of the point. This corpus is meant to
# be usable by someone benchmarking a scanner we did not write, so `make validate` has to pass
# on a fresh clone with nothing else installed. That property is unverifiable on the machine
# where the corpus was built, because that machine has everything.
#
# NOTHING HERE MAY DEPEND ON A SCANNER. No checkout of one, no environment variable pointing
# at one, no step that installs one. What this job proves is that the corpus validates on its
# own; the moment it needs a particular tool to go green, the claim of tool-neutrality becomes
# a claim about this machine. Running a scanner over the corpus belongs in that scanner's
# repository — see the Makefile header.

name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. Nothing here should ever need to write to the repository, and saying so means a
# compromised action in the chain cannot.
permissions:
  contents: read

defaults:
  run:
    # Not the implicit `bash -e`: pipefail is load-bearing below, where `make validate` is
    # piped into tee. Without it a failing validate would be masked by tee's exit code.
    shell: bash

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # From harness/go.mod rather than pinned here, so the toolchain cannot drift away
          # from what the module declares.
          go-version-file: harness/go.mod
          cache-dependency-path: harness/go.sum

      - name: gofmt
        working-directory: harness
        run: |
          # `gofmt -l` lists unformatted files and exits 0, so it has to be checked by hand.
          # `make fmt` has the same shape and the same hole; this is the version that fails.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: harness
        run: go vet ./...

      - name: go test
        working-directory: harness
        # -race matches `make test`. The harness has no concurrency today, so this is cheap
        # insurance rather than a live concern.
        run: go test -race ./...

      - name: make validate
        # Rule ids in `expect.<tool>` blocks are deliberately NOT verified here, and their
        # absence from this run is not a gap in it. A scanner's rule list belongs to that
        # scanner; `taxonomy/tools.yaml` reaches it only through an environment variable, and
        # the validator refuses a path that would leave this repository — because such a path
        # made `make validate` report 73 verified rule ids on one machine and "not checked"
        # everywhere else. The check belongs in the scanner's own repository, which should
        # clone this corpus and validate its own expect blocks. Setting AGUARD_RULES_MD here
        # would restore precisely the asymmetry that rule exists to prevent.
        run: make validate

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: pytest
        run: |
          python -m pip install --quiet pytest
          # Deliberately no pandas / pyarrow / fastparquet: the tested code is the harvest's
          # classification logic, which decides what the false-positive denominator contains.
          # The parquet scripts are extraction plumbing and need a 534MB download to exercise.
          python -m pytest scripts/ -q

      - name: composition
        # Not a gate. The corpus's own numbers appear in the README and in published figures,
        # and this puts the real ones in the run summary so the two can be compared without
        # trusting either.
        run: |
          {
            echo '## Corpus composition'
            echo '```'
            make stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
