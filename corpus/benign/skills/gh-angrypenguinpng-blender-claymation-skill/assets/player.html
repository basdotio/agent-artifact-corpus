<!-- Claymation player template. To use: set the <title> to the film's name, keep one .reel
     button per film (data-src = the mp4's published file name, first one also in <video src>),
     and publish with the mp4s alongside. Films autoplay muted, play in order, then loop.
     With a single film, delete the <nav> and the page plays it on a loop. -->
<title>Clay Spark</title>
<style>
  :root {
    --ground: #f3f2ef;
    --stage: #e9e7e2;
    --ink: #262521;
    --muted: #7b776e;
    --line: #d9d6cf;
    --bar: #ffffff;
    --accent: #c8633f;
    --track: #d6d3cc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #1d1c1a; --stage: #262522; --ink: #ecebe6; --muted: #9c988f;
      --line: #36342f; --bar: #2a2926; --accent: #e07a55; --track: #45423c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #1d1c1a; --stage: #262522; --ink: #ecebe6; --muted: #9c988f;
    --line: #36342f; --bar: #2a2926; --accent: #e07a55; --track: #45423c;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
    padding-inline: 16px;
    box-sizing: border-box;
  }
  .reels {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    padding-block: 14px 0;
  }
  .reel {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
    font: inherit; font-size: 12.5px; letter-spacing: .02em;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  .reel[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  .reel:focus-visible, .ctl:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stage {
    flex: 1; min-height: 0;
    display: grid; place-items: center;
    padding-block: 16px;
  }
  video {
    display: block; width: 100%; max-width: 100%; max-height: 100%;
    aspect-ratio: 16 / 9; background: var(--stage);
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 32px -12px rgba(0,0,0,.28);
  }
  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    margin-bottom: 12px;
    background: var(--bar); border: 1px solid var(--line); border-radius: 10px;
  }
  .ctl {
    appearance: none; border: 0; background: none; color: var(--ink); cursor: pointer;
    width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; padding: 0;
  }
  .ctl svg { width: 16px; height: 16px; fill: currentColor; }
  .time { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .time b { color: var(--ink); font-weight: 500; }
  input[type=range] {
    flex: 1; min-width: 60px; appearance: none; height: 4px; border-radius: 4px;
    background: linear-gradient(to right, var(--ink) var(--p, 0%), var(--track) var(--p, 0%));
  }
  input[type=range]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--ink); }
  .credit { font-size: 12px; color: var(--muted); white-space: nowrap; }
  @media (max-width: 520px) { .credit { display: none; } }
</style>

<nav class="reels" aria-label="Films">
  <button class="reel" id="reel-spark" aria-pressed="true" data-src="clay-spark.mp4">Clay Spark</button>
  <button class="reel" id="reel-igloo" aria-pressed="false" data-src="igloo.mp4">Igloo</button>
</nav>
<main class="stage">
  <video id="film" src="clay-spark.mp4" autoplay muted playsinline preload="auto"></video>
</main>
<div class="bar">
  <button class="ctl" id="play" aria-label="Pause">
    <svg viewBox="0 0 16 16" id="ico"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>
  </button>
  <button class="ctl" id="restart" aria-label="Restart">
    <svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7l1.4.5A4 4 0 1 0 8 4v2L4.8 3.2 8 .5z"/></svg>
  </button>
  <span class="time"><b id="cur">0:00</b> / <span id="dur">0:20</span></span>
  <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Seek">
  <span class="credit">Blender · Cycles · 12 fps</span>
  <button class="ctl" id="full" aria-label="Fullscreen">
    <svg viewBox="0 0 16 16"><path d="M2 2h4.5v1.5h-3v3H2zm7.5 0H14v4.5h-1.5v-3h-3zM2 9.5h1.5v3h3V14H2zm10.5 0H14V14H9.5v-1.5h3z"/></svg>
  </button>
</div>

<script>
  const v = document.getElementById('film');
  const reels = [...document.querySelectorAll('.reel')];
  const scrub = document.getElementById('scrub');
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const PAUSE = '<rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/>';
  const PLAY = '<path d="M4 2.2v11.6c0 .6.7 1 1.2.6l8.3-5.8a.8.8 0 0 0 0-1.2L5.2 1.6C4.7 1.2 4 1.6 4 2.2z"/>';

  function select(i, play = true) {
    reels.forEach((r, k) => r.setAttribute('aria-pressed', String(k === i)));
    v.src = reels[i].dataset.src;
    if (play) v.play().catch(() => {});
  }
  reels.forEach((r, i) => r.addEventListener('click', () => select(i)));
  // play the reel through: Clay Spark, then Igloo, then loop
  v.addEventListener('ended', () => {
    if (reels.length < 2) { v.currentTime = 0; v.play().catch(() => {}); return; }
    const i = reels.findIndex(r => r.getAttribute('aria-pressed') === 'true');
    select((i + 1) % reels.length);
  });
  const sync = () => {
    const p = v.duration ? v.currentTime / v.duration : 0;
    scrub.value = Math.round(p * 1000);
    scrub.style.setProperty('--p', (p * 100).toFixed(2) + '%');
    document.getElementById('cur').textContent = fmt(v.currentTime || 0);
  };
  v.addEventListener('timeupdate', sync);
  v.addEventListener('loadedmetadata', () => { document.getElementById('dur').textContent = fmt(v.duration); sync(); });
  const icon = () => {
    document.getElementById('ico').innerHTML = v.paused ? PLAY : PAUSE;
    document.getElementById('play').setAttribute('aria-label', v.paused ? 'Play' : 'Pause');
  };
  v.addEventListener('play', icon);
  v.addEventListener('pause', icon);
  document.getElementById('play').addEventListener('click', () => v.paused ? v.play().catch(() => {}) : v.pause());
  v.addEventListener('click', () => v.paused ? v.play().catch(() => {}) : v.pause());
  document.getElementById('restart').addEventListener('click', () => { v.currentTime = 0; v.play().catch(() => {}); });
  scrub.addEventListener('input', () => { if (v.duration) v.currentTime = scrub.value / 1000 * v.duration; });
  document.getElementById('full').addEventListener('click', () => {
    (v.requestFullscreen ? v.requestFullscreen() : Promise.reject()).catch(() => {});
  });
</script>
