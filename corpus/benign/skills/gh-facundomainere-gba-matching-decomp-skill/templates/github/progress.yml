# Publishes objdiff progress reports for decomp.dev (artifacts <version>_report).
# Needs no ROM: tools/objdiff_report.py works from splits.txt and the committed address tables in
# versions/. That the C actually matches is checked locally with `make compare` (it needs the ROM).
name: Progress report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [metabee, rokusho]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate objdiff report
        run: python3 tools/objdiff_report.py --version ${{ matrix.version }} -o report.json
      - name: Upload progress report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: report.json
