<!-- Berries (a recipe screen topped with raspberries, blackberries, blueberries and mint):
     the toppings spill out past the bezel onto a raspberry-red light. Swap the drawn fruit
     for whatever the photo on your screen shows. -->
<style>
  #s3 { position: absolute; inset: 0;
        background:
          radial-gradient(55% 30% at 50% 58%, rgba(255, 170, 170, .5), transparent 70%),
          radial-gradient(40% 20% at 4% 40%, rgba(255, 120, 170, .45), transparent 70%),
          radial-gradient(45% 25% at 96% 90%, rgba(255, 196, 120, .45), transparent 70%); }
  #s3 svg { position: absolute; inset: 0; }
</style>
<div id="s3"></div>
<script>
document.addEventListener('store:layout', ({ detail: L }) => {
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const r = mulberry32((window.SCENE || {}).seed || 1);
  const { w: W, h: H } = L.canvas, d = L.device, top = L.headerBottom + 70;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>
    <filter filterUnits="userSpaceOnUse" x="-400" y="-400" width="2400" height="3800" id="sh"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5a0a25" flood-opacity=".45"/></filter>
    <radialGradient id="rasp" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff7d93"/><stop offset=".6" stop-color="#e02648"/><stop offset="1" stop-color="#9c0f2c"/></radialGradient>
    <radialGradient id="black" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#6d4a8a"/><stop offset=".6" stop-color="#2a1638"/><stop offset="1" stop-color="#12081a"/></radialGradient>
    <radialGradient id="blue" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#6c7fd0"/><stop offset=".6" stop-color="#2a3372"/><stop offset="1" stop-color="#141a44"/></radialGradient></defs>`;

  // Drupelet berry: raspberry or blackberry
  const drupe = (x, y, R, fill, rot) => {
    s += `<g transform="translate(${x} ${y}) rotate(${rot})" filter="url(#sh)">`;
    const cells = [];
    for (let row = 0; row < 5; row++) {
      const count = [3, 4, 5, 4, 3][row], yy = (row - 2) * R * .34;
      for (let k = 0; k < count; k++) cells.push([(k - (count - 1) / 2) * R * .34, yy]);
    }
    for (const [cx, cy] of cells) s += `<circle cx="${cx}" cy="${cy}" r="${R * .22}" fill="url(#${fill})"/>
      <circle cx="${cx - R*.07}" cy="${cy - R*.07}" r="${R * .06}" fill="#fff" opacity=".45"/>`;
    if (fill === 'rasp') s += `<path d="M${-R*.3} ${-R*.78} Q 0 ${-R*1.05} ${R*.3} ${-R*.78} Q 0 ${-R*.6} ${-R*.3} ${-R*.78}Z" fill="#3e8f3a"/>`;
    s += `</g>`;
  };
  const blueberry = (x, y, R) => {
    s += `<g filter="url(#sh)"><circle cx="${x}" cy="${y}" r="${R}" fill="url(#blue)"/></g>
          <circle cx="${x + R*.1}" cy="${y - R*.55}" r="${R*.22}" fill="none" stroke="#0e1333" stroke-width="3"/>`;
  };
  const mint = (x, y, size, rot) => {
    const w = size * .5, h = size;
    s += `<g transform="translate(${x} ${y}) rotate(${rot})" filter="url(#sh)">
      <path d="M0 0 C ${w} ${-h*.2} ${w*.8} ${-h*.85} 0 ${-h} C ${-w*.8} ${-h*.85} ${-w} ${-h*.2} 0 0Z" fill="#43b04a"/>
      <path d="M0 0 L0 ${-h*.9}" stroke="#2c7d31" stroke-width="4"/>`;
    for (let k = 1; k < 5; k++) { const yy = -h * k * .18;
      s += `<path d="M0 ${yy} L${w*.55} ${yy - h*.12} M0 ${yy} L${-w*.55} ${yy - h*.12}" stroke="#2c7d31" stroke-width="3"/>`; }
    s += `</g>`;
  };

  const gl = d.left * .5, gr = W - (W - d.right) * .5;
  drupe(gl + 10, top + 180, 78, 'rasp', -20);  mint(gl + 60, top + 120, 120, 40);
  blueberry(gl - 40, top + 320, 34);
  drupe(gr - 5, d.top + 420, 70, 'black', 15);  blueberry(gr + 50, d.top + 530, 30);
  drupe(gl, d.top + 1050, 72, 'black', -8);     mint(gl - 30, d.top + 960, 100, -35);
  drupe(gr + 10, d.top + 1150, 80, 'rasp', 22);  blueberry(gr - 50, d.top + 1260, 32);
  drupe(gl + 20, d.bottom - 180, 82, 'rasp', 8);  blueberry(gl - 55, d.bottom - 70, 34); blueberry(gl + 80, d.bottom - 40, 28);
  mint(gr + 20, d.bottom - 120, 130, -30); drupe(gr - 30, d.bottom - 300, 64, 'black', -20);

  // A few loose oat flakes
  for (let i = 0; i < 14; i++) {
    const left = r() < .5, x = left ? 30 + r() * (d.left - 60) : d.right + 30 + r() * (W - d.right - 60), y = top + 150 + r() * (H - top - 400), sz = 11 + r() * 8;
    s += `<ellipse cx="${x}" cy="${y}" rx="${sz * 1.5}" ry="${sz}" transform="rotate(${r() * 180} ${x} ${y})" fill="#fbecc8" opacity=".9"/>`;
  }
  document.getElementById('s3').innerHTML = s + '</svg>';
});
</script>
