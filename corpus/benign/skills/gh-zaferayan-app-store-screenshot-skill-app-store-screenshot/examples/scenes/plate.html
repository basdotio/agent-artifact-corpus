<!-- Plate (a meal-plan screen whose photo shows a dish on a plate with brushed radial stripes):
     the phone sits on that plate, so its stripes ring the device in both gutters, on a
     terracotta tablecloth with a few mushrooms. Change the stripe and rim colors to your plate. -->
<style>
  #s4 { position: absolute; inset: 0;
        background:
          radial-gradient(60% 35% at 50% 60%, rgba(255, 190, 140, .35), transparent 70%),
          radial-gradient(40% 20% at 96% 12%, rgba(255, 220, 160, .35), transparent 70%); }
  #s4 svg { position: absolute; inset: 0; }
</style>
<div id="s4"></div>
<script>
document.addEventListener('store:layout', ({ detail: L }) => {
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const r = mulberry32((window.SCENE || {}).seed || 1);
  const { w: W, h: H } = L.canvas, d = L.device;
  const cx = W / 2, cy = (d.top + d.bottom) / 2 + 40, R = Math.min(cy - L.headerBottom - 60, W * .72);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>
    <filter filterUnits="userSpaceOnUse" x="-400" y="-400" width="2400" height="3800" id="plate"><feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#3a1208" flood-opacity=".55"/></filter>
    <radialGradient id="rim" cx=".5" cy=".45" r=".55"><stop offset=".8" stop-color="#21484d"/><stop offset="1" stop-color="#0f2b2f"/></radialGradient></defs>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#rim)" filter="url(#plate)"/>`;
  // Brushed stripes: tapered wedges from the well to the rim
  const n = 64, r0 = R * .5, r1 = R * .95;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + (r() - .5) * .02, w0 = .006, w1 = .022 + r() * .01;
    const p = (rad, aa) => `${cx + Math.cos(aa) * rad} ${cy + Math.sin(aa) * rad}`;
    s += `<path d="M${p(r0, a - w0)} L${p(r1, a - w1)} L${p(r1 * (.97 + r() * .03), a + w1)} L${p(r0, a + w0)} Z" fill="#eef1ea" opacity="${.78 + r() * .2}"/>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="${R * .5}" fill="#f1e3c6"/>
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#0b2226" stroke-width="10" opacity=".6"/>`;

  // Parsley sprigs and a few shimeji mushrooms on the cloth
  const parsley = (x, y, sz, rot) => {
    s += `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0 L0 ${-sz}" stroke="#2f7a2c" stroke-width="5" stroke-linecap="round"/>`;
    for (let k = 0; k < 5; k++) { const a = -1.2 + k * .6;
      s += `<circle cx="${Math.sin(a) * sz * .32}" cy="${-sz + Math.cos(a) * -sz * .2}" r="${sz * .2}" fill="#3f9b35"/>`; }
    s += `</g>`;
  };
  const mushroom = (x, y, sz, rot) => {
    s += `<g transform="translate(${x} ${y}) rotate(${rot})">
      <rect x="${-sz*.12}" y="${-sz*.6}" width="${sz*.24}" height="${sz*.9}" rx="${sz*.1}" fill="#f2e6d2"/>
      <ellipse cx="0" cy="${-sz*.62}" rx="${sz*.34}" ry="${sz*.2}" fill="#7a4a2c"/>
      <ellipse cx="${-sz*.08}" cy="${-sz*.68}" rx="${sz*.12}" ry="${sz*.06}" fill="#b27a52"/></g>`;
  };
  const gl = d.left * .5, gr = W - (W - d.right) * .5;
  mushroom(gl + 10, H - 150, 130, -18); mushroom(gl + 60, H - 90, 100, 14);
  mushroom(gr, H - 130, 120, 20); mushroom(gr - 50, H - 90, 90, -10);
  document.getElementById('s4').innerHTML = s + '</svg>';
});
</script>
