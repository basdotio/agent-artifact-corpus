# .controlled-language.yml
#
# Project configuration for the controlled-language skill.
# Copy this file to the root folder of your project as `.controlled-language.yml`.
# Delete the fields that you do not need. All fields are optional.
# Full description: controlled-language/references/configuration.md

# Default level for the project.
#   1 = Light    (about 50% of the rules: clear structure, free vocabulary)
#   2 = Standard (about 85%: strict structure, soft vocabulary)
#   3 = Strict   (all rules, approved general vocabulary only)
level: 2

# Spelling variant for Levels 1 and 2: us or uk. Level 3 always uses us.
spelling: us

# Files that the rules apply to (glob patterns).
include:
  - "README.md"
  - "docs/**/*.md"

# Files that the rules do not apply to. Exclude is stronger than include.
exclude:
  - "CHANGELOG.md"
  - "docs/legal/**"

# Different levels for some paths. The first match applies.
overrides:
  - path: "docs/safety/**"
    level: 3
  - path: "blog/**"
    level: 1

glossary:
  # Names of things in your domain: products, components, UI elements,
  # data types, tools. Each term counts as one word.
  technical_nouns:
    - API key
    - access token
    - dashboard
    - webhook

  # Actions of your domain that have no simple general word.
  technical_verbs:
    - deploy
    - click
    - download
    - sign

  # One concept, one term. The skill replaces each "not" form with "use".
  preferred_terms:
    - use: sign in
      not: [log in, login, log on]
    - use: API key
      not: [API token, access key]

# Extra words that your project does not want.
avoid_words:
  - word: seamless
    use: (delete the word)
  - word: leverage
    use: use

# Strings that the skill never changes.
keep_verbatim:
  - "Terms of Service"

# The language of the documents:
#   auto = find the language of each file
#   en, ru, de, fr, es, ... = use this language for all files
language: auto

# Text that is not in English:
#   apply = use the universal rules and the rules of the language file
#           (controlled-language/references/languages/<code>.md)
#   off   = do not change it
non_english: apply
