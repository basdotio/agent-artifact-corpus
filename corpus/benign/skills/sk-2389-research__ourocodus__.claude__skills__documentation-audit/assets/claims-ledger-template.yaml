# Claims Ledger Template
#
# Use this template to track documentation claims across audit runs.
# This enables incremental verification and prevents re-verifying unchanged claims.

audit_metadata:
  audit_id: ""  # UUID for this audit run
  started_at: ""  # ISO 8601 timestamp
  completed_at: ""  # ISO 8601 timestamp
  repository_path: ""
  focus_paths: []  # List of paths audited (empty = all)
  parameters:
    dry_run: true
    risk_tier: "user_approval"
    verification_method: "auto"
    skip_gap_analysis: false

repository_index:
  # Pass 0 results
  exported_symbols: []  # List of {name, file, package, type}
  canonical_sources: []  # List of {type, path, description}
  documentation_links: {}  # Map of doc_path -> [linked_doc_paths]

claims:
  # Each claim tracked during the audit
  # Example:
  # - claim_id: "README-001"
  #   doc_path: "README.md"
  #   span_offsets: {start: 150, end: 250}
  #   type: "behavioral"  # behavioral | structural | api | config | usage
  #   content: "Service retries three times before failing"
  #   referenced_symbols: ["pkg/service.Retry"]
  #   canonical_source: null
  #   evidence:
  #     files: ["pkg/service/retry.go"]
  #     spans: [{file: "pkg/service/retry.go", line_start: 45, line_end: 52}]
  #     verification_method: "symbolic"  # canonical | symbolic | deep_investigation
  #   status: "verified"  # verified | contradicted | unknown | requires_review
  #   confidence: "high"  # exploring | low | medium | high | very_high | almost_certain | certain
  #   risk_tier: "user_approval"  # auto_fix | user_approval | user_review
  #   last_verified_at: "2025-11-12T10:30:00Z"
  #   proposed_change: null  # String containing proposed fix, if applicable

documents:
  # Document classification results from Pass 1
  # Example:
  # - path: "docs/ARCHITECTURE.md"
  #   classification: "living"  # living | point_in_time | obsolete
  #   last_commit: "2025-11-01T14:23:00Z"
  #   link_centrality: 8  # Number of incoming links
  #   confidence: "high"
  #   action: "audit"  # audit | archive | ignore

gaps:
  # Documentation gaps identified
  # Example:
  # - type: "missing_readme"
  #   path: "pkg/relay/"
  #   description: "Package has multiple exported symbols but no README"
  #   status: "pending"  # pending | addressed | user_review
  # - type: "undocumented_feature"
  #   symbol: "pkg/session.Manager.Cleanup"
  #   description: "Exported method not mentioned in documentation"
  #   status: "pending"

changes:
  # Changes applied or proposed during Pass 4
  # Example:
  # - change_id: "FIX-001"
  #   type: "auto_fix"  # auto_fix | user_approval | user_review
  #   category: "broken_link"  # broken_link | typo | technical_correction | new_documentation | archival
  #   doc_path: "docs/ARCHITECTURE.md"
  #   description: "Fixed broken link to SESSION_LIFECYCLE.md"
  #   evidence_trail: ["Link target moved in commit abc123"]
  #   applied: true
  #   applied_at: "2025-11-12T11:00:00Z"

summary:
  total_claims: 0
  claims_verified: 0
  claims_contradicted: 0
  claims_requiring_review: 0
  confidence_distribution:
    exploring: 0
    low: 0
    medium: 0
    high: 0
    very_high: 0
    almost_certain: 0
    certain: 0
  auto_fixes_applied: 0
  changes_pending_approval: 0
  changes_requiring_review: 0
  documentation_gaps: 0
  documents_audited: 0
  documents_archived: 0
