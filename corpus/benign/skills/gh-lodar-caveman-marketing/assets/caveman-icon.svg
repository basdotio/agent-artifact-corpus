<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120" role="img" aria-label="Caveman marketing">
  <!-- The caveman-marketing mark (DIVE-6608): the OpenAgent icon's dark tile and pill eyes, with wild hair, one heavy
       brow and a beard, in one flat colour. The eyes blink like OpenAgent's, on a different loop. Reduced motion: no blink. -->
  <defs>
    <style>
      .eye { transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: no-preference) { .eye { animation: blink 9s infinite; } }
      @keyframes blink {
        0%, 52%, 54%, 100% { transform: scaleY(1); }
        53% { transform: scaleY(0.1); }
      }
    </style>
  </defs>
  <rect width="100" height="100" rx="23" fill="#1a1a1f"/>
  <path d="M15 37 L17 17 L27 22 L33 9 L42 18 L50 7 L58 18 L67 9 L73 22 L83 17 L85 37 L76 29 L68 36 L59 28 L50 35 L41 28 L32 36 L24 29 Z" fill="#f2c46d"/>
  <path d="M21 44 Q21 39 26 39 L74 39 Q79 39 79 44 Q79 49 74 49 L56 49 Q50 49 50 52 Q50 49 44 49 L26 49 Q21 49 21 44 Z" fill="#f2c46d"/>
  <rect class="eye" x="30" y="53" width="12" height="13" rx="6" fill="#f2c46d"/>
  <rect class="eye" x="58" y="53" width="12" height="13" rx="6" fill="#f2c46d"/>
  <path d="M17 71 Q50 64 83 71 L81 82 L71 77 L65 90 L57 81 L50 93 L43 81 L35 90 L29 77 L19 82 Z" fill="#f2c46d"/>
</svg>
