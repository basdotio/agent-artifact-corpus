name: A harness bug, or an idea
description: A script that refuses when it shouldn't, a wrong message, a missing command, a rule you think is wrong.
labels: ["harness"]
body:
  - type: markdown
    attributes:
      value: "**Nothing about your project, please** — no paths, host names, accounts or real data."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      placeholder: "`ui.py tap \"text=…\"` said NOT found while the screenshot showed it. Expected it to tap."
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The command or the rule, the platform, the device or emulator and its OS version.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you did instead
