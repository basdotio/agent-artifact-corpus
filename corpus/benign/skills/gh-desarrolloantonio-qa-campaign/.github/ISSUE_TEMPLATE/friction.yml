name: Friction log from a campaign
description: The SKILL-FRICTION.md a campaign wrote — where this skill made the agent guess, assumed something untrue, or where a harness command lied or was missing.
title: "Friction: <kind of product>, skill <version>"
labels: ["friction"]
body:
  - type: markdown
    attributes:
      value: |
        **Nothing about your project, please.** No paths, host names, URLs, account or person names,
        no data or titles from the product, no file:line of your code. The agent writes
        `SKILL-FRICTION.public.md` for exactly this; paste that one.
  - type: input
    id: version
    attributes:
      label: Skill version
      description: The commit or tag the campaign started with (`Skill at start` in CAMPAIGN.md).
      placeholder: "d0bffac"
    validations:
      required: true
  - type: textarea
    id: product
    attributes:
      label: What kind of product, and how it was driven
      description: Platform, architecture in one line, devices or browsers, how many processes, over how long.
      placeholder: "An Android fleet app, offline-first (local store + realtime cloud database). Two API 35 emulators, 12 processes, three days."
    validations:
      required: true
  - type: textarea
    id: lines
    attributes:
      label: The friction lines
      description: One line each — tag, where in the skill, what happened, what you did instead.
      value: |
        - **GUESS** — `SKILL.md` R…: … Did: …
        - **FALSE-ASSUMPTION** — `SKILL.md` §…: … Did: …
        - **TOOL** — `ui.py …`: … Did: …
        - **NONSENSE** — …: … Did: …
    validations:
      required: true
  - type: textarea
    id: worst
    attributes:
      label: Which one cost the most, and what it cost
      description: Optional. A wrong finding, a lost hour, a defect that got through.
