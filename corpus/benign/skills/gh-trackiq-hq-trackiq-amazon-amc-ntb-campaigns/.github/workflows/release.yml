name: Validate and publish skill

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gate everything on the standard. A skill that fails here would fail
      # silently in a user's account instead.
      - name: Validate skill
        run: python scripts/validate.py

      - name: Build zip and registry
        run: python scripts/build.py --base-url https://trackiq.com/skills

      - uses: actions/upload-artifact@v4
        with:
          name: skill-dist
          path: dist/

      # Tagging publishes the zip as a release asset, so the manual-install
      # path works without the website. Swap for Pages when trackiq.com/skills
      # exists and the in-skill update check needs registry.json served.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/registry.json
             --repo "${GITHUB_REPOSITORY}"
             --title "${GITHUB_REF_NAME}"
             --notes "$(python -c "import json;d=json.load(open('dist/registry.json'));s=d['skills'][0];print(s['changelog'])")"
