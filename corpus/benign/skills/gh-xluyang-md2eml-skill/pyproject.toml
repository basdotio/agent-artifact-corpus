[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-markdown-to-email"
version = "0.1.0"
description = "Convert local Markdown notes into email-ready HTML, EML, or clipboard content."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Local Markdown to Email contributors"}]
keywords = ["email", "eml", "markdown", "clipboard", "skill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]

[project.scripts]
local-markdown-to-email = "local_markdown_to_email:main"

[tool.setuptools]
py-modules = ["local_markdown_to_email"]
package-dir = {"" = "scripts"}
