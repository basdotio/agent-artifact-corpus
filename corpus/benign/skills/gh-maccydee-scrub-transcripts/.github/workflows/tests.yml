name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: demo profile scan finds the planted secrets
        shell: bash
        run: |
          python examples/make_demo.py demo-home
          python scripts/scrub.py --root demo-home || test $? -eq 1
          python scripts/scrub.py --root demo-home --apply
          python scripts/scrub.py --root demo-home
