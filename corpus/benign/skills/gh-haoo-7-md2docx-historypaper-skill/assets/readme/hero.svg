<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="480" viewBox="0 0 1200 480"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">md2docx-historypaper-skill</title>
  <desc id="hero-desc">左侧为 Markdown 源稿卡片，中间三行朱笔批注写明转换动作，右侧为按《历史研究》体系排出的投稿级 docx 页面：黑体三号标题、楷体关键词、宋体正文、①当页下脚注与页码。图中论文与引证均为合成样例。</desc>

  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
      .song { font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, STSong, serif; }
      .hei  { font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", SimHei, sans-serif; }
      .kai  { font-family: "Kaiti SC", KaiTi, STKaiti, "Noto Serif SC", "Songti SC", serif; }
      .lat  { font-family: "Times New Roman", "Nimbus Roman No9 L", Times, serif; }
    </style>
    <filter id="page-lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1F1B16" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- 纸面 + 版框 -->
  <rect width="1200" height="480" rx="26" fill="#F7F4EC"/>
  <rect x="20" y="20" width="1160" height="440" rx="16" fill="none" stroke="#E3DBC9" stroke-width="1"/>

  <!-- 标题区 -->
  <text x="56" y="62" class="mono" font-size="16" letter-spacing="2" fill="#B23529">AGENT SKILL · 论文投稿排版</text>
  <text x="56" y="116" class="mono" font-size="46" font-weight="700" fill="#1F1B16">md2docx-historypaper-skill</text>
  <text x="56" y="152" class="hei" font-size="23" fill="#1F1B16" fill-opacity="0.86">把 Markdown 论文排成《历史研究》体系的投稿级 docx</text>

  <!-- 版面参数（右侧页面的排版依据） -->
  <text x="1144" y="76" class="mono" font-size="15" text-anchor="end" fill="#6B6357"><tspan fill="#A39A89">标题</tspan> 黑体三号 · 居中</text>
  <text x="1144" y="100" class="mono" font-size="15" text-anchor="end" fill="#6B6357"><tspan fill="#A39A89">正文</tspan> 宋体小四 · 1.5 倍行距 · 缩进 2 字符</text>
  <text x="1144" y="124" class="mono" font-size="15" text-anchor="end" fill="#6B6357"><tspan fill="#A39A89">脚注</tspan> 小五 · 当页下① · 每页重排</text>

  <line x1="56" y1="176" x2="1144" y2="176" stroke="#DCD4C2" stroke-width="1"/>

  <text x="56" y="200" class="mono" font-size="14" letter-spacing="1.5" fill="#A39A89">MARKDOWN 源稿</text>
  <text x="720" y="200" class="mono" font-size="14" letter-spacing="1.5" fill="#A39A89">投稿级 DOCX · 合成样例</text>

  <!-- 左：Markdown 源稿（编辑器卡片） -->
  <g>
    <rect x="56" y="216" width="424" height="180" rx="12" fill="#2B2721"/>
    <path d="M56 228a12 12 0 0 1 12-12h400a12 12 0 0 1 12 12v20H56z" fill="#211E19"/>
    <text x="78" y="240" class="mono" font-size="15" fill="#C9C2B3">示例论文.md</text>
    <text x="458" y="240" class="mono" font-size="12" letter-spacing="1.5" text-anchor="end" fill="#7E776A">OBSIDIAN</text>
    <line x1="70" y1="264" x2="70" y2="380" stroke="#4A443B" stroke-width="1"/>

    <text x="86" y="280" class="mono" font-size="18" fill="#E8E2D4"><tspan fill="#E17A63">#</tspan> 近代商会与市场价格信息的形成</text>
    <text x="86" y="313" class="mono" font-size="18" fill="#E8E2D4">行会信用网络维系着价格传导<tspan fill="#E17A63">〔FN01〕</tspan></text>
    <text x="86" y="346" class="mono" font-size="18" fill="#E8E2D4">参见 <tspan fill="#B0A896">[[Chamberlain - Civil Society]]</tspan></text>
    <text x="86" y="379" class="mono" font-size="18" fill="#E8E2D4">market information <tspan class="song">的传递链条</tspan></text>
  </g>

  <!-- 中：朱笔批注 -->
  <g>
    <text x="658" y="250" class="kai" font-size="16" font-weight="500" text-anchor="end" fill="#B23529">①编号每页重排</text>
    <line x1="666" y1="245" x2="694" y2="245" stroke="#B23529" stroke-width="2"/>
    <polygon points="694,240 706,245 694,250" fill="#B23529"/>

    <text x="658" y="306" class="kai" font-size="16" font-weight="500" text-anchor="end" fill="#B23529">中西文字体分治</text>
    <line x1="666" y1="301" x2="694" y2="301" stroke="#B23529" stroke-width="2"/>
    <polygon points="694,296 706,301 694,306" fill="#B23529"/>

    <text x="658" y="362" class="kai" font-size="16" font-weight="500" text-anchor="end" fill="#B23529">引证体例规范化</text>
    <line x1="666" y1="357" x2="694" y2="357" stroke="#B23529" stroke-width="2"/>
    <polygon points="694,352 706,357 694,362" fill="#B23529"/>
  </g>

  <!-- 右：投稿级 docx（排出的页面，字号按三号/小四/小五比例） -->
  <g filter="url(#page-lift)">
    <rect x="720" y="216" width="424" height="180" rx="4" fill="#FFFCF5" stroke="#D9D1BF" stroke-width="1"/>
  </g>
  <g>
    <text x="932" y="248" class="hei" font-size="21" font-weight="700" text-anchor="middle" fill="#1F1B16">近代商会与市场价格信息的形成</text>
    <text x="744" y="274" class="kai" font-size="16" font-weight="500" fill="#1F1B16"><tspan fill="#6B6357">关键词：</tspan>商会；价格信息；市场网络</text>
    <text x="776" y="300" class="song" font-size="16" fill="#1F1B16">行会信用网络维系着交易价格的传导。<tspan font-size="11" dy="-4" fill="#B23529">①</tspan></text>
    <text x="776" y="324" class="song" font-size="16" fill="#1F1B16"><tspan class="lat">market information</tspan> 的传递链条……</text>
    <line x1="744" y1="338" x2="832" y2="338" stroke="#D9D1BF" stroke-width="1"/>
    <text x="744" y="353" class="lat" font-size="13" fill="#1F1B16"><tspan fill="#B23529">①</tspan> Heath B. Chamberlain, "On the Search for Civil Society in China,"</text>
    <text x="758" y="368" class="lat" font-size="13" fill="#1F1B16"><tspan font-style="italic">Modern China</tspan>, vol. 19, no. 2 (April 1993), pp. 199-215.</text>
    <text x="932" y="390" class="lat" font-size="12" text-anchor="middle" fill="#B0A896">2</text>
  </g>

  <!-- 页脚 -->
  <text x="56" y="434" class="mono" font-size="14" fill="#6B6357">Python ≥3.10 · 仅标准库 · Windows + Git Bash 实测 · 无凭据，不联网</text>
  <rect x="698" y="412" width="446" height="34" rx="17" fill="#FFFCF5" stroke="#DCD4C2" stroke-width="1"/>
  <text x="921" y="434" class="mono" font-size="15" text-anchor="middle" fill="#1F1B16">npx skills add Haoo-7/md2docx-historypaper-skill</text>
</svg>
