<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">四步流水线</title>
  <desc id="pipe-desc">写内容规格 spec.json，经 build_paper.py 构建 docx，postprocess.py 做 XML 规范化，verify_docx.py 做 21 项交付前检查；退出码非 0 时逐项修完复跑，后处理幂等。</desc>

  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
      .hei  { font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", SimHei, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="26" fill="#F7F4EC"/>
  <rect x="20" y="20" width="1160" height="280" rx="16" fill="none" stroke="#E3DBC9" stroke-width="1"/>

  <text x="56" y="52" class="hei" font-size="21" font-weight="700" fill="#1F1B16">四步全部脚本化：失败即报错，可复跑</text>
  <text x="1144" y="52" class="mono" font-size="15" text-anchor="end" fill="#6B6357">Python ≥3.10 · 仅标准库 · 无凭据，不联网</text>

  <!-- 站 1 -->
  <g>
    <rect x="56" y="80" width="230" height="160" rx="10" fill="#FFFCF5" stroke="#DCD4C2" stroke-width="1"/>
    <circle cx="250" cy="110" r="13" fill="none" stroke="#B23529" stroke-width="1.5"/>
    <text x="250" y="115" class="mono" font-size="15" text-anchor="middle" fill="#B23529">1</text>
    <text x="76" y="116" class="hei" font-size="18" font-weight="700" fill="#1F1B16">写内容规格</text>
    <text x="76" y="140" class="mono" font-size="15" fill="#6B6357">spec.json</text>
    <line x1="76" y1="160" x2="266" y2="160" stroke="#E3DBC9" stroke-width="1"/>
    <text x="76" y="186" class="hei" font-size="15" fill="#4E4940">脚注重排 · 补页码 · 斜体</text>
    <text x="76" y="218" class="mono" font-size="14" fill="#B23529">格式参数集中在 spec</text>
  </g>
  <line x1="294" y1="160" x2="324" y2="160" stroke="#B23529" stroke-width="2"/>
  <polygon points="324,155 338,160 324,165" fill="#B23529"/>

  <!-- 站 2 -->
  <g>
    <rect x="342" y="80" width="230" height="160" rx="10" fill="#FFFCF5" stroke="#DCD4C2" stroke-width="1"/>
    <circle cx="536" cy="110" r="13" fill="none" stroke="#B23529" stroke-width="1.5"/>
    <text x="536" y="115" class="mono" font-size="15" text-anchor="middle" fill="#B23529">2</text>
    <text x="362" y="116" class="hei" font-size="18" font-weight="700" fill="#1F1B16">构建 docx</text>
    <text x="362" y="140" class="mono" font-size="15" fill="#6B6357">build_paper.py</text>
    <line x1="362" y1="160" x2="552" y2="160" stroke="#E3DBC9" stroke-width="1"/>
    <text x="362" y="186" class="hei" font-size="15" fill="#4E4940">占位符转真页下注</text>
    <text x="362" y="218" class="mono" font-size="14" fill="#B23529">依赖 edsdk 本地服务</text>
  </g>
  <line x1="580" y1="160" x2="610" y2="160" stroke="#B23529" stroke-width="2"/>
  <polygon points="610,155 624,160 610,165" fill="#B23529"/>

  <!-- 站 3 -->
  <g>
    <rect x="628" y="80" width="230" height="160" rx="10" fill="#FFFCF5" stroke="#DCD4C2" stroke-width="1"/>
    <circle cx="822" cy="110" r="13" fill="none" stroke="#B23529" stroke-width="1.5"/>
    <text x="822" y="115" class="mono" font-size="15" text-anchor="middle" fill="#B23529">3</text>
    <text x="648" y="116" class="hei" font-size="18" font-weight="700" fill="#1F1B16">XML 后处理</text>
    <text x="648" y="140" class="mono" font-size="15" fill="#6B6357">postprocess.py</text>
    <line x1="648" y1="160" x2="838" y2="160" stroke="#E3DBC9" stroke-width="1"/>
    <text x="648" y="186" class="hei" font-size="15" fill="#4E4940">①编号 · 字体分治 · 斜体</text>
    <text x="648" y="218" class="mono" font-size="14" fill="#B23529">幂等：重跑自动跳过</text>
  </g>
  <line x1="866" y1="160" x2="896" y2="160" stroke="#B23529" stroke-width="2"/>
  <polygon points="896,155 910,160 896,165" fill="#B23529"/>

  <!-- 站 4 -->
  <g>
    <rect x="914" y="80" width="230" height="160" rx="10" fill="#FFFCF5" stroke="#DCD4C2" stroke-width="1"/>
    <circle cx="1108" cy="110" r="13" fill="none" stroke="#B23529" stroke-width="1.5"/>
    <text x="1108" y="115" class="mono" font-size="15" text-anchor="middle" fill="#B23529">4</text>
    <text x="934" y="116" class="hei" font-size="18" font-weight="700" fill="#1F1B16">交付前验证</text>
    <text x="934" y="140" class="mono" font-size="15" fill="#6B6357">verify_docx.py</text>
    <line x1="934" y1="160" x2="1124" y2="160" stroke="#E3DBC9" stroke-width="1"/>
    <text x="934" y="186" class="hei" font-size="15" fill="#4E4940">21 项可机械判定检查</text>
    <text x="934" y="218" class="mono" font-size="14" fill="#B23529">exit 0 才交付</text>
  </g>

  <!-- 失败回路 -->
  <path d="M1029 240v22H457v-16" fill="none" stroke="#B23529" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5"/>
  <polygon points="452,248 457,238 462,248" fill="#B23529" opacity="0.5"/>
  <text x="743" y="288" class="mono" font-size="14" text-anchor="middle" fill="#B23529">exit 1 → 逐项修完再复跑 · 后处理幂等</text>
</svg>
