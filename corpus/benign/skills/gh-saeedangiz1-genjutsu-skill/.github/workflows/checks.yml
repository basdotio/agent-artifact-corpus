name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: assets/workflow/requirements.txt
      - name: Install local test dependencies
        run: python -m pip install -r assets/workflow/requirements.txt
      - name: Validate public skill package
        run: python scripts/check.py
      - name: Run offline regressions
        run: python scripts/run_tests.py
