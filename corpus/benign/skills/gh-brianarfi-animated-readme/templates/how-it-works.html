<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How it works</title>
<!-- Scene template: how-it-works. Filled by scripts/render.py from readme-scenes.json.
     Runs once in about 12 s: three or four steps appear left to right with an arrow between
     each, the last step's items land one by one, then the loop line draws back to the start. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #F1F3EE; --field: #0D453E; --ink: #072B27; --signal: #C8F751; --warn: #F2A65A;
          --head: "Archivo", Arial, sans-serif; --body: "Inter", "Segoe UI", sans-serif;
          --mono: "JetBrains Mono", Consolas, monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 660px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); font-family: var(--body); position: relative; }
  h1 { position: absolute; left: 40px; top: 30px; font: 900 38px/1 var(--head); letter-spacing: -.03em; }
  .row { position: absolute; left: 40px; right: 40px; top: 104px; height: 420px; display: flex; align-items: stretch; gap: 0; }
  .step { flex: 1; background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 var(--ink);
          padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .step.hi { background: var(--signal); }
  .step .n { width: 40px; height: 40px; border-radius: 11px; background: var(--ink); color: var(--signal);
             display: grid; place-items: center; font: 900 21px var(--head); }
  .step.hi .n { background: var(--ink); }
  .step h2 { font: 800 23px/1.15 var(--head); letter-spacing: -.01em; }
  .step ul { list-style: none; display: flex; flex-direction: column; gap: 7px; margin-top: 2px; }
  .step li { font: 600 16.5px/1.3 var(--body); background: #F1F3EE; border: 2px solid #D8DED4; border-radius: 9px; padding: 6px 9px; }
  .step.hi li { background: rgba(255,255,255,.65); border-color: var(--ink); }
  .step li code { font: 500 15px var(--mono); }
  .arrow { flex: none; width: 46px; display: grid; place-items: center; font: 900 30px var(--head); color: var(--field); }
  .loop { position: absolute; left: 40px; right: 40px; top: 548px; height: 76px; border: 3px dashed var(--field); border-radius: 16px;
          display: flex; align-items: center; gap: 16px; padding: 0 22px; background: #fff; }
  .loop b { font: 900 30px var(--head); color: var(--field); }
  .loop p { font: 700 21px/1.3 var(--body); }
  .cover { position: absolute; inset: 0; background: var(--paper); z-index: 9; }
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="row" id="row"></div>
<div class="loop" id="loop"><b>↺</b><p id="loopText"></p></div>
<div class="cover" id="cover"></div>
<script>
const D = /*DATA*/null;
(function () {
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const code = t => esc(t).replace(/`(.+?)`/g, '<code>$1</code>');
  const ms = s => s * 1000;
  const anim = (el, frames, dur, delay, easing) => el.animate(frames, { duration: ms(dur), delay: ms(delay), fill: 'both', easing: easing || 'cubic-bezier(.2,.8,.2,1)' });
  const rise = [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }];
  if (D.theme) for (const [k, v] of Object.entries(D.theme)) document.documentElement.style.setProperty('--' + k, v);

  $('title').textContent = D.title || '';
  anim($('title'), rise, 0.5, 0.1);
  const steps = (D.steps || []).slice(0, 4);
  let t = 0.6;
  steps.forEach((s, i) => {
    if (i > 0) {
      const a = document.createElement('div');
      a.className = 'arrow'; a.textContent = '→';
      $('row').appendChild(a);
      anim(a, [{ opacity: 0, transform: 'translateX(-10px)' }, { opacity: 1, transform: 'none' }], 0.4, t - 0.2);
    }
    const el = document.createElement('div');
    el.className = 'step' + (s.highlight ? ' hi' : '');
    el.innerHTML = `<div class="n">${i + 1}</div><h2>${esc(s.title)}</h2><ul>${(s.items || []).map(x => `<li>${code(x)}</li>`).join('')}</ul>`;
    $('row').appendChild(el);
    anim(el, [{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'none' }], 0.5, t);
    let u = t + 0.35;
    el.querySelectorAll('li').forEach(li => { anim(li, rise, 0.4, u); u += 0.28; });
    t = u + 0.45;
  });
  $('loopText').innerHTML = code(D.loop || '');
  anim($('loop'), [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }], 0.6, t);
  const dur = (D._dur || 12) - 0.6;
  anim($('cover'), [{ opacity: 0 }, { opacity: 1 }], 0.5, dur, 'linear');
})();
</script>
</body>
</html>
