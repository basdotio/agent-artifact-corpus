<!doctype html>
<!--
  Self-test fixture for page-smoke.mjs. `page-smoke.mjs --selftest` loads it and checks the
  expectations below automatically. To look at it by hand, open it as a file:// URL (no
  server needed), with <skill-dir> standing for this skill's directory:

    node <skill-dir>/scripts/page-smoke.mjs "file://<skill-dir>/scripts/fixtures/overflow.html" --widths 375

  Expected at 375 px: horizontalOverflow { scrollWidth: 900 }, and the FIRST culprit is the
  900 px table inside <section id="report">. Everything else here sticks out of the viewport
  but cannot widen the page, so none of it may be reported:
    - the slides of a carousel whose track is clipped by overflow:hidden
    - an off-canvas drawer that is position:fixed
    - a 2000 px strip that scrolls inside its own overflow-x:auto wrapper
  At 1280 px the page fits and the result must be clean.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>page-smoke overflow fixture</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .carousel { overflow: hidden; width: 100%; }
    .track { display: flex; width: max-content; }
    .slide { flex: none; width: 300px; height: 40px; background: #ddd; }
    .drawer { position: fixed; top: 0; left: 100%; width: 300px; height: 100vh; background: #eee; }
    .drawer p { width: 280px; }
    .scroller { overflow-x: auto; }
    .scroller .strip { width: 2000px; height: 16px; background: #cfc; }
    .report-table { width: 900px; border-collapse: collapse; }
  </style>
</head>
<body>
  <main>
    <h1>Overflow fixture</h1>
    <div class="carousel" aria-label="Featured">
      <div class="track">
        <div class="slide"></div><div class="slide"></div><div class="slide"></div>
        <div class="slide"></div><div class="slide"></div><div class="slide"></div>
      </div>
    </div>
    <aside class="drawer"><p>Off-canvas menu</p></aside>
    <div class="scroller"><div class="strip"></div></div>
    <section id="report">
      <div>
        <table class="report-table">
          <tr><td>Quarterly revenue by region (the real overflow)</td></tr>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
