[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instruction-audit"
version = "1.0.0"
description = "Read-only auditing helpers for AGENTS.md and SKILL.md instructions"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
