# Use this only when a platform ships as experimental or untested.
# Replace PLATFORM, and write the checklist from the README's feature list.
name: PLATFORM test report
description: Tell us how PROJECT behaved on a real PLATFORM machine
labels: ["PLATFORM_LABEL"]
body:
  - type: markdown
    attributes:
      value: |
        PLATFORM support has not been run on a real machine by its author. A report of what worked and what did not is a real contribution, even if everything worked.
  - type: input
    id: version
    attributes:
      label: PLATFORM version
    validations:
      required: true
  - type: checkboxes
    id: worked
    attributes:
      label: What worked
      options:
        - label: Install finished without errors
        - label: REPLACE with one line per feature a tester can check
        - label: A screen reader announced the output or notification
  - type: textarea
    id: failed
    attributes:
      label: What did not work
      description: Include any error text exactly as it appeared.
    validations:
      required: false
