name: Bug report
description: Something is not working the way the README says it should
labels: ["bug"]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PROJECT version
      description: The output of the version command, or the release you downloaded.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic output
      description: Paste the output of the project's diagnostic command, or any error text exactly as it appeared. Remove anything private first.
      render: text
    validations:
      required: false
  - type: input
    id: assistive-tech
    attributes:
      label: Assistive technology, if relevant
      description: For example VoiceOver, NVDA, JAWS, a braille display, or voice control.
    validations:
      required: false
