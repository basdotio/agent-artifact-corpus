<!doctype html>
<html lang="en" data-theme="dim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hot-seat</title>
<!-- Design source: Lavish's recommended DaisyUI v5 theme tokens (lavish-axi design, step 3). Only the prebuilt
     component CSS is loaded, not the Tailwind runtime, so one bad class can never blank the page; every colour
     below has a dark fallback so the page stays readable if the CDN is unreachable. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/daisyui.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/themes.css">
<style>
:root{
  color-scheme: dark light;
  --bg: var(--color-base-100,#14161b);
  --bg2: var(--color-base-200,#1b1e25);
  --bg3: var(--color-base-300,#262a33);
  --fg: var(--color-base-content,#e7e7ea);
  --muted: color-mix(in oklab, var(--fg) 66%, transparent);
  --line: color-mix(in oklab, var(--fg) 16%, transparent);
  --pri: var(--color-primary,#d7a94b);
  --pri-fg: var(--color-primary-content,#14110a);
  --ok: var(--color-success,#4fbf85);
  --warn: var(--color-warning,#e2a63a);
  --err: var(--color-error,#ea5f57);
  --info: var(--color-info,#55a8e6);
  --radius: 10px;
  --mono: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
:where(.grid,.flex,.hs-grid,.hs-choices,.hs-bar,.hs-top)>*{min-width:0}
:where(p,h1,h2,h3,h4,li,dd,blockquote,label,summary,td,th,small,span,button){overflow-wrap:anywhere}
:where(img,svg,video,canvas,iframe){max-width:100%;height:auto}
h1,h2,h3,h4{margin:0;line-height:1.25}
p{margin:0 0 .6em}
code{font-family:var(--mono);font-size:.88em;background:var(--bg3);padding:.08em .35em;border-radius:5px}
button{font:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.hs-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.hs-brand{font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.hs-brand svg{width:22px;height:22px;flex:none}
.hs-topic{flex:1 1 260px;color:var(--muted);font-size:.95em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:.8em;line-height:1.6;background:var(--bg);white-space:nowrap}
.chip.pri{border-color:var(--pri);color:var(--pri)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.err{border-color:var(--err);color:var(--err)}
.chip.info{border-color:var(--info);color:var(--info)}
.chip.mute{color:var(--muted)}
button.chip{font:inherit;font-size:.8em;cursor:pointer;min-height:32px}
.jump{display:none}
@media (max-width:899px){.jump{display:inline-flex}}

/* layout */
.hs-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:16px;max-width:1240px;margin:0 auto}
@media (min-width:900px){.hs-grid{grid-template-columns:minmax(0,1fr) minmax(0,340px);align-items:start}.hs-side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.hs-main{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.panel>summary{cursor:pointer;font-weight:650;min-height:32px;display:flex;align-items:center}
.panel h2{font-size:1.1em;font-weight:700;margin-bottom:6px}
.panel.note{border-left:4px solid var(--info)}
.panel.warn{border-left:4px solid var(--warn)}
.panel.trail{border-left:4px solid var(--ok)}
.muted{color:var(--muted)}
.small{font-size:.86em}

/* cards */
.hs-card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hs-card[data-state=draft]{border-color:color-mix(in oklab,var(--pri) 55%,var(--line))}
.hs-card[data-state=sent]{opacity:.85}
.hs-card>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.hs-qn{font-family:var(--mono);font-weight:700;color:var(--pri)}
.hs-card h3{flex:1 1 220px;font-size:1.05em}
.hs-body p:last-child{margin-bottom:0}
.hs-body ul,.panel ul{margin:.3em 0 .6em;padding-left:1.2em;list-style:disc}
.panel li{margin:.2em 0}
.hs-choices{display:grid;gap:8px;border:0;margin:0;padding:0;min-width:0}
.hs-choice{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.hs-choice:hover{border-color:color-mix(in oklab,var(--pri) 60%,var(--line))}
.hs-choice:has(input:checked){border-color:var(--pri);background:color-mix(in oklab,var(--pri) 12%,var(--bg))}
.hs-choice input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--pri)}
.hs-choice b{display:block;font-weight:650}
.hs-choice small{display:block;color:var(--muted);margin-top:2px}
.reco{border:1px dashed color-mix(in oklab,var(--ok) 70%,var(--line));border-radius:8px;padding:8px 12px;background:color-mix(in oklab,var(--ok) 8%,var(--bg));display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.reco>div{flex:1 1 240px}
.reco strong{color:var(--ok)}
textarea.hs-text{width:100%;min-height:64px;resize:vertical;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.hs-flags{display:flex;flex-wrap:wrap;gap:8px}
.flag{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--bg);user-select:none}
.flag:has(input:checked){border-color:var(--warn);color:var(--warn);background:color-mix(in oklab,var(--warn) 10%,var(--bg))}
.flag input{width:16px;height:16px;accent-color:var(--warn)}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);cursor:pointer;font-weight:600;transition:transform .05s,background .15s,border-color .15s}
.btn2:hover:not(:disabled){border-color:var(--pri)}
.btn2:active:not(:disabled){transform:translateY(1px)}
.btn2:disabled{opacity:.5;cursor:not-allowed}
.btn2.primary{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.btn2.sm{min-height:34px;padding:0 10px;font-weight:550;font-size:.9em}
.err-msg{color:var(--err);font-size:.9em}
figure{margin:0}
figure svg,figure img{border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.hs-mock{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:12px;overflow:auto}
.hs-frame{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
figcaption{color:var(--muted);font-size:.85em;margin-top:4px}

/* sticky bar */
.hs-bar{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 -8px 18px -12px #000}
.hs-bar .counts{flex:1 1 160px;display:flex;flex-wrap:wrap;gap:6px}
.hs-bar .btn2{flex:0 0 auto}
.hs-nudge{flex:1 1 100%;color:var(--warn);font-size:.9em}
.hs-steer{display:flex;flex-direction:column;gap:6px}

/* history */
.hs-round>summary{cursor:pointer;min-height:36px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.hs-hist{display:grid;gap:10px;margin-top:8px}
.hs-hq{border-top:1px solid var(--line);padding-top:8px}
.hs-hq q{quotes:"\201C" "\201D";font-style:italic}
blockquote{margin:.3em 0;padding:.2em .8em;border-left:3px solid var(--line);color:var(--muted)}

/* sidebar */
.hs-side{display:flex;flex-direction:column;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.tabs2{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:4px}
.tab2{min-height:38px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;white-space:nowrap}
.tab2[aria-selected=true]{background:var(--bg);color:var(--fg);border-color:var(--line)}
.tab2 .n{margin-left:5px;font-size:.8em;color:var(--pri)}
.tabpane{display:none;min-width:0}
.tabpane.on{display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8em;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
#tree{width:100%;display:block}
#tree text{font:12px system-ui,sans-serif;fill:var(--fg)}
#tree .dim{fill:var(--muted)}
.dec{border-bottom:1px solid var(--line);padding:8px 0}
.dec:last-child{border-bottom:0}
.dec h4{font-size:.95em;margin-bottom:3px}
.gates{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
pre{margin:0;font-family:var(--mono);font-size:.8em;line-height:1.45;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;max-width:100%;white-space:pre}
pre.wrap{white-space:pre-wrap;overflow-wrap:anywhere}
.diff .a{color:var(--ok)}
.diff .d{color:var(--err)}
.diff .h{color:var(--muted)}
.rule{padding:6px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule b{font-family:var(--mono);color:var(--pri);margin-right:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
.hs-empty{padding:28px 16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p class="hs-empty">This page needs JavaScript to render the session.</p></noscript>
<script id="hs-state" type="application/json">null</script>
<script>
(() => {
'use strict';
const S = JSON.parse(document.getElementById('hs-state').textContent);
const $app = document.getElementById('app');
if (!S) { $app.innerHTML = '<p class="hs-empty">hot-seat template: no session state embedded. Run <code>hot-seat.mjs init</code>.</p>'; return; }

// ---------------------------------------------------------------- utils
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const arr = (x) => (Array.isArray(x) ? x : x == null || x === '' ? [] : [x]);
const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
function md(t) {
  const blocks = String(t ?? '').trim().split(/\n{2,}/);
  return blocks.map((b) => {
    const ls = b.split('\n');
    if (ls.every((l) => /^\s*[-*] /.test(l))) return '<ul>' + ls.map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ''))}</li>`).join('') + '</ul>';
    return `<p>${ls.map(inline).join('<br>')}</p>`;
  }).join('');
}
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage blocked */ } } };
const round = S.rounds[S.rounds.length - 1];
const prevRounds = S.rounds.slice(0, -1);
const DRAFT_KEY = `hs:${S.session}:${round.n}`;
const SENT_KEY = `hs:sent:${S.session}:${round.n}`;
const interactive = S.status !== 'done' && round.questions.length > 0;
let draft = store.get(DRAFT_KEY) || { answers: {}, steer: '' };
let sentAt = store.get(SENT_KEY);
const A = (id) => (draft.answers[id] ||= { choice: null, choices: [], text: (round.questions.find((x) => x.id === id) || {}).prefill || '', dontKnow: false, prototype: false, skip: false });
const inLavish = () => typeof window.lavish !== 'undefined' && window.lavish && typeof window.lavish.queuePrompt === 'function';

function stance(q, a) {
  if (!a) return 'open';
  if (a.skip) return 'skipped';
  if (a.dontKnow) return 'unsure';
  const chosen = a.choices && a.choices.length ? a.choices : arr(a.choice);
  const text = (a.text || '').trim();
  if (q.kind === 'confirm') return chosen.length ? 'answered' : 'open';
  if (q.kind === 'free') return text ? (q.recommended && text === String(q.recommended).trim() ? 'agreed' : 'own-words') : a.prototype ? 'prototype' : 'open';
  if (!chosen.length && !text) return a.prototype ? 'prototype' : 'open';
  if (!chosen.length) return 'own-words';
  const reco = arr(q.recommended);
  return chosen.length === reco.length && chosen.every((c) => reco.includes(c)) ? 'agreed' : 'differed';
}
const STANCE = { agreed: ['ok', 'Agreed'], differed: ['pri', 'Chose differently'], 'own-words': ['pri', 'Own words'], unsure: ['warn', "Don't know"], prototype: ['warn', 'Needs prototype'], skipped: ['mute', 'Out of scope'], answered: ['ok', 'Answered'], open: ['mute', 'Open'] };
const chip = (kind, text, title) => `<span class="chip ${kind}"${title ? ` title="${esc(title)}"` : ''}>${esc(text)}</span>`;

// ---------------------------------------------------------------- header
const settledN = S.tree.filter((n) => n.state === 'settled').length;
const parkedN = S.tree.filter((n) => n.state === 'parked').length;
const modeLabel = S.mode.value === 'docs' ? 'Codebase: paper trail on' : 'Stateless: nothing written';
function header() {
  return `<header class="hs-top">
    <div class="hs-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20h14M7 20v-5a5 5 0 0 1 10 0v5M9 15V6h6v9"/></svg>hot-seat</div>
    <div class="hs-topic">${S.title || S.topic ? esc(S.title || S.topic) : 'New session'}</div>
    ${chip(S.mode.value === 'docs' ? 'ok' : 'info', modeLabel, S.mode.reason)}
    ${chip('mute', S.status === 'done' ? 'Session complete' : `Round ${round.n}`)}
    ${chip('mute', `${settledN} settled${parkedN ? `, ${parkedN} parked` : ''} of ${S.tree.length}`)}
 <button type="button" class="chip pri jump" data-act="jump" aria-label="Jump to the tree, ledger and terms">Overview</button>
    <select id="theme" aria-label="Page theme" class="chip mute" style="cursor:pointer">${['dim', 'luxury', 'night', 'business', 'nord', 'light'].map((t) => `<option value="${t}">${t}</option>`).join('')}</select>
  </header>`;
}

// ---------------------------------------------------------------- cards
function figure(q) {
  const f = q.figure;
  if (!f) return '';
  const strip = (h) => String(h).replace(/<script[\s\S]*?<\/script>/gi, '').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi, '');
  const body = f.svg ? strip(f.svg) : f.html ? `<div class="hs-mock">${strip(f.html)}</div>` : f.frame ? `<iframe class="hs-frame" src="${esc(f.frame)}" title="${esc(f.alt || 'prototype')}" sandbox="allow-scripts" style="height:${+f.height || 360}px"></iframe>` : f.img ? `<img src="${esc(f.img)}" alt="${esc(f.alt || '')}">` : '';
  return body ? `<figure>${body}${f.caption ? `<figcaption>${esc(f.caption)}</figcaption>` : ''}</figure>` : '';
}
function card(q) {
  const a = A(q.id);
  const st = sentAt ? 'sent' : stance(q, a) === 'open' ? 'open' : 'draft';
  const [k, label] = STANCE[stance(q, a)];
  const reco = arr(q.recommended);
  const type = q.multi ? 'checkbox' : 'radio';
  const locked = sentAt ? 'disabled' : '';
  let choices = '';
  if (q.kind !== 'free') {
    choices = `<fieldset class="hs-choices" ${locked}><legend class="sr">Choices for ${esc(q.id)}</legend>` + arr(q.choices).map((c) => {
      const on = q.multi ? (a.choices || []).includes(c.id) : a.choice === c.id;
      return `<label class="hs-choice"><input type="${type}" name="${esc(q.id)}" value="${esc(c.id)}" data-q="${esc(q.id)}" data-role="choice" ${on ? 'checked' : ''}>
        <span><b>${inline(c.label)}</b>${c.detail ? `<small>${inline(c.detail)}</small>` : ''}</span>
        ${reco.includes(c.id) ? chip('ok', 'Recommended') : '<span></span>'}</label>`;
    }).join('') + '</fieldset>';
  }
  let recoBox = '';
  if (!q.noRecommendation && q.kind === 'choice') {
    const names = reco.map((r) => `(${esc(r)}) ${inline((q.choices.find((c) => c.id === r) || {}).label || r)}`).join(' + ');
    recoBox = `<div class="reco"><div><strong>Recommended:</strong> ${names}<br><span class="muted">${inline(q.why)}</span></div>
      <button type="button" class="btn2 sm" data-act="use-reco" data-q="${esc(q.id)}" ${locked}>Agree with this</button></div>`;
  } else if (!q.noRecommendation && q.kind === 'free') {
    recoBox = `<div class="reco"><div><strong>Recommended answer:</strong> ${inline(q.recommended)}<br><span class="muted">${inline(q.why)}</span></div>
      <button type="button" class="btn2 sm" data-act="use-reco-text" data-q="${esc(q.id)}" ${locked}>Use this text</button></div>`;
  }
  const ph = q.kind === 'free' ? 'Your answer' + (q.required ? ' (required)' : '') : q.kind === 'confirm' ? 'What is off? (needed if you say "Not yet")' : 'In your own words, or push back on the question itself (optional)';
  const flags = q.kind === 'confirm' ? '' : `<div class="hs-flags">
      <label class="flag"><input type="checkbox" data-q="${esc(q.id)}" data-role="dontKnow" ${a.dontKnow ? 'checked' : ''} ${locked}> I don't know</label>
      <label class="flag" title="Some questions cannot be answered by talking. I will try to show you something cheap to react to."><input type="checkbox" data-q="${esc(q.id)}" data-role="prototype" ${a.prototype ? 'checked' : ''} ${locked}> Needs a prototype</label>
      ${q.required ? '' : `<label class="flag" title="Not part of this session. I will park it and stop asking."><input type="checkbox" data-q="${esc(q.id)}" data-role="skip" ${a.skip ? 'checked' : ''} ${locked}> Out of scope</label>`}</div>`;
  return `<article class="hs-card" id="${esc(q.id)}" data-state="${st}" data-q="${esc(q.id)}">
    <header><span class="hs-qn">${esc(q.id)}</span><h3>${inline(q.title)}</h3>${q.stakes === 'low' ? chip('mute', 'low stakes', 'Safe to accept my recommendation') : ''}<span class="chip ${k}" data-role="stance">${sentAt ? 'Sent' : label}</span></header>
    <div class="hs-body">${md(q.body)}</div>${q.basis ? `<div class="small muted">Based on: ${inline(q.basis)}</div>` : ''}${figure(q)}${choices}${recoBox}
    <textarea class="hs-text" data-q="${esc(q.id)}" data-role="text" placeholder="${esc(ph)}" aria-label="${esc(ph)}" ${locked}>${esc(a.text)}</textarea>
    ${flags}<div class="err-msg" data-err="${esc(q.id)}" role="alert"></div>
  </article>`;
}

function historyRound(r) {
  const rows = r.questions.map((q) => {
    const a = q.answer, s = a ? a.stance : 'open';
    const [k, label] = STANCE[s] || STANCE.open;
    const chosen = a ? (a.choices && a.choices.length ? a.choices : arr(a.choice)) : [];
    const labs = chosen.map((id) => `(${esc(id)}) ${inline((q.choices || []).find((c) => c.id === id)?.label || id)}`).join(' + ');
    const reco = arr(q.recommended).map((id) => (q.choices || []).find((c) => c.id === id)?.label || id).join(' + ');
    return `<div class="hs-hq"><div><span class="hs-qn">${esc(q.id)}</span> <strong>${inline(q.title)}</strong> ${chip(k, label)}</div>
      ${labs ? `<div>You chose: ${labs}</div>` : ''}
      ${a && a.text ? `<blockquote>${esc(a.text)}</blockquote>` : ''}
      ${a && a.prototype ? '<div class="small muted">Flagged: needs a prototype.</div>' : ''}
      ${q.kind === 'choice' && reco && s !== 'agreed' ? `<div class="small muted">I recommended: ${inline(reco)}</div>` : ''}</div>`;
  }).join('');
  const c = {};
  r.questions.forEach((q) => { const s = q.answer ? q.answer.stance : 'open'; c[s] = (c[s] || 0) + 1; });
  return `<details class="panel hs-round"><summary><strong>Round ${r.n}</strong><span class="muted small">${r.questions.length} question${r.questions.length === 1 ? '' : 's'}: ${Object.entries(c).map(([s, n]) => `${n} ${(STANCE[s] || [0, s])[1].toLowerCase()}`).join(', ')}</span></summary>
    <div class="hs-hist">${r.note ? `<div class="small muted">${md(r.note)}</div>` : ''}${r.steer ? `<div><span class="small muted">Your steering:</span><blockquote>${esc(r.steer)}</blockquote></div>` : ''}${rows}${writesHtml(r, true)}</div></details>`;
}

function writesHtml(r, quiet) {
  if (S.mode.value !== 'docs') return '';
  if (!r.writes || !r.writes.length) return quiet ? '' : `<section class="panel trail"><h2>Paper trail</h2><p class="muted small">Nothing was written to the repository since your last answers. No term resolved and no decision cleared the three ADR gates.</p></section>`;

function drawTree() {

  const rows = [];

    }
    let sh;
    if (n.state === 'settled') sh = `<circle cx="${x}" cy="${y}" r="5.5" fill="var(--ok)"/>`;
    else if (n.state === 'frontier') sh = `<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="var(--pri)" stroke-width="2"/><circle cx="${x}" cy="${y}" r="2" fill="var(--pri)"/>`;
    else if (n.state === 'running') sh = `<circle class="pulse" cx="${x}" cy="${y}" r="5" fill="none" stroke="var(--info)" stroke-width="2"/>`;
    else if (n.state === 'parked') sh = `<path d="M${x} ${y - 6.5}L${x + 6.5} ${y}L${x} ${y + 6.5}L${x - 6.5} ${y}Z" fill="var(--warn)"/>`;
    else sh = `<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2.5 2.5"/>`;

  });

  svg.innerHTML = out;
}

document.addEventListener('click', (e) => {

});
