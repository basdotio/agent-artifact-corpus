name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile scripts/install.py scripts/smoke.py
      - run: python -c "import pathlib; skills=list(pathlib.Path('skills').glob('*/SKILL.md')); assert len(skills)>=6, skills; print('skills:', len(skills))"
