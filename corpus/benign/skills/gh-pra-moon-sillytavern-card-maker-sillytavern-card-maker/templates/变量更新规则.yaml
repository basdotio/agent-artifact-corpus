---
变量更新规则:
  世界:
    当前时间:
      format: YYYY-MM-DD HH:MM
    # 动态键对象：type 用 TS 索引签名；string 类型省略 type
    #近期事务:
    #  type: |-
    #    { [事务名: string]: string; }

  好感度:
    type: number
    range: 0~100
    check:
      - 根据角色对 <user> 行为的感知与态度更新，±(3~6)
      - 仅在角色能察觉到 <user> 行为时更新
      - 单次变化不超过 ±6，除非剧情有明确强烈转折

  # 固定键合并示例：
  #主角.能力面板.${力量|敏捷|体质|智力|感知|魅力}:
  #  type: number
  #  range: 0~100
  #  check:
  #    - 训练、战斗、重伤、奖励等显著事件才调整
