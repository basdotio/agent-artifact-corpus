<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Launch film</title>
    <style>
      /* Brand fonts: drop files into assets/fonts and point these at them. System fonts are the fallback. */
      @font-face { font-family: "Head"; src: local("SF Pro Display"), local("Helvetica Neue"); font-weight: 400 700; }
      @font-face { font-family: "Accent"; src: local("New York"), local("Georgia"); font-style: italic; font-weight: 400 700; }

      :root {
        --bg: #0e1330; /* brand rule: three colors */
        --accent: #ffc46b;
        --text: #f3eeff;
        --muted: #c9c1ea; /* a tint of the text color, for secondary lines only */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--bg); }
      #root { position: relative; width: var(--W); height: var(--H); overflow: hidden; color: var(--text); font-family: "Head", -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
      canvas.layer { position: absolute; left: 0; top: 0; width: var(--W); height: var(--H); pointer-events: none; }
      #grain { mix-blend-mode: overlay; opacity: 0.07; }
      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 50% 45%, rgba(5, 7, 22, 0) 55%, rgba(5, 7, 22, 0.55) 100%); }
      #fade { position: absolute; inset: 0; background: #05060f; pointer-events: none; }
      .scene { position: absolute; inset: 0; display: none; }
      .abs { position: absolute; }
      .center-x { left: 0; right: 0; text-align: center; }
      .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
      .em { font-family: "Accent", Georgia, serif; font-style: italic; font-weight: 600; color: var(--accent); }
      .headline { font-weight: 500; font-size: 74px; line-height: 1.1; letter-spacing: -0.025em; text-shadow: 0 4px 30px rgba(5, 7, 22, 0.55); }
      .headline .em { font-size: 1.08em; }
      img { display: block; }
      .phone { position: absolute; border-radius: 64px; background: linear-gradient(150deg, #3a3e52 0%, #15161e 30%, #0c0d12 70%, #2a2c38 100%); box-shadow: 0 0 0 2px #4a4f66, inset 0 0 0 3px #07080c, 0 60px 130px rgba(2, 3, 12, 0.7); }
      .screen { position: absolute; overflow: hidden; background: #10183b; }
      .pop { position: absolute; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root">
      <canvas id="bg" class="layer"></canvas>
      <div id="scenes" class="abs" style="inset: 0"></div>
      <canvas id="fx" class="layer"></canvas>
      <div id="vignette"></div>
      <canvas id="grain" class="layer"></canvas>
      <div id="fade"></div>
    </div>
    <script type="module" src="./stage.js"></script>
  </body>
</html>
