<!doctype html>

<meta charset="utf-8">
<title>第三十六张 — The 36th Frame (video-gaga · Cinematic Film)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@500;600&family=Courier+Prime:wght@400;700&family=Caveat:wght@500&display=block" rel="stylesheet">

<script src="build/narration.js"></script>
<script src="../../runtime/video-gaga.js"></script>
<script>
/* =============================================================================
   CINEMATIC FILM — a documentary shot on film and projected in a dark room.
   Scope letterbox (2.39:1), warm highlights over lifted teal blacks, halation
   around every light, grain, gate weave, a breath of exposure flicker, dust and
   the odd scratch. Nothing snaps: shots drift on slow dollies, titles fade up
   out of focus and keep tracking open while they hold, cuts are dissolves,
   dips to black and one film burn. Documentary furniture: a mono timecode
   kicker over a serif line, subtitles set in the lower bar.
   Rhythm: slow, but never still. Every shot moves (a push, a track, a tilt,
   a rack), and the cut lands on the beat of the video's own score. In the
   example below a first-person narrator sets the shot lengths, a second voice
   speaks one line, and the shutter, the pull back and the title are music only.
   ============================================================================= */
const { ease, clamp, lerp, fx, draw, color } = CV;

// === THEME (swap for brand) ==================================================
const T = {
  black: '#0B0A08',
  cream: '#F1E6D0',       // titles, highlights
  amber: '#E3A257',       // the one warm accent: timecodes, the light
  dim: '#8A7F70',
  leader: '#9C907E',      // countdown leader field
  warm: '#FFB46E',        // grade: soft-light over everything
  halation: '#FF6A2A',    // the red-orange bloom film gives a highlight
  lift: '#121A1B',        // the floor of the blacks: film never reaches pure black
  aspect: 2.39,           // scope; 1.85 for a flat frame, 1 to drop the bars
  serif: '"Cormorant Garamond", "Noto Serif SC", Georgia, serif',
  han: '"Noto Serif SC", "Songti SC", serif',
  mono: '"Courier Prime", "Courier New", monospace',
};
const F = (w, px, fam = T.serif, style = '') => `${style ? style + ' ' : ''}${w} ${px}px ${fam}`;
// the picture inside the letterbox bars
const picture = (W, H, aspect = T.aspect) => {
  const h = Math.min(H, W / aspect), y0 = (H - h) / 2;
  return { y0, y1: y0 + h, h };
};

// === KIT: the film gate ======================================================
// Everything the projector adds, drawn in the overlay over every frame:
// gate weave, halation, the warm grade with lifted blacks, exposure flicker,
// dust and scratches, vignette, grain. Pure functions of the frame index.
const gateBufs = {};
function gateBuf(key, w, h) {
  let c = gateBufs[key];
  if (!c || c.width !== w || c.height !== h) {
    c = gateBufs[key] = document.createElement('canvas');
    c.width = w; c.height = h;
    c.g = c.getContext('2d', { willReadFrequently: true });
  }
  return c;
}

function filmGate(ctx, g, o = {}) {
  const { weave = 1, halation = 0.5, grade = 0.2, flicker = 0.035, dust = 1, vignette = 0.55, grain = 0.08 } = o;
  const cv = ctx.canvas, pw = cv.width, ph = cv.height, f = g.frame, W = g.W, H = g.H;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // gate weave: the frame drifts a pixel or two in the gate (over-scanned so no edge shows)
  if (weave) {
    const b = gateBuf('weave', pw, ph), k = pw / W, z = 1.004;
    b.g.globalCompositeOperation = 'copy';
    b.g.drawImage(cv, 0, 0);
    const dx = CV.noise(f * 0.21, 3) * 1.4 * weave * k, dy = CV.noise(f * 0.17, 7) * 2 * weave * k;
    ctx.drawImage(b, (pw - pw * z) / 2 + dx, (ph - ph * z) / 2 + dy, pw * z, ph * z);
  }
  // halation: the highlights bloom red-orange. No ctx.filter and no high-quality
  // resampling (both can rasterise differently between pages): the frame is
  // halved four times (a box blur), multiplied by itself so only the highlights
  // survive, tinted, and scaled back up over the frame.
  if (halation) {
    let src = cv, w = pw, h = ph;
    for (let i = 0; i < 4; i++) {
      w = Math.max(4, w >> 1); h = Math.max(4, h >> 1);
      const b = gateBuf(`halation${i}`, w, h);
      b.g.globalCompositeOperation = 'copy';
      b.g.drawImage(src, 0, 0, w, h);
      src = b;
    }
    const hb = gateBuf('halation', w, h), g2 = hb.g;
    g2.globalCompositeOperation = 'copy';
    g2.drawImage(src, 0, 0);
    g2.globalCompositeOperation = 'multiply';
    g2.drawImage(src, 0, 0);
    g2.drawImage(src, 0, 0);
    g2.fillStyle = T.halation;
    g2.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = halation;
    ctx.drawImage(hb, 0, 0, pw, ph);
  }
  ctx.restore();
  ctx.save();
  // the grade: warm highlights, blacks lifted toward teal
  ctx.globalCompositeOperation = 'soft-light';
  ctx.globalAlpha = grade;
  ctx.fillStyle = T.warm;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighten';
  ctx.fillStyle = T.lift;
  ctx.fillRect(0, 0, W, H);
  // exposure flicker
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = (CV.noise(f * 0.9, 5) * 0.5 + 0.5) * flicker;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  // dust: a few specks and hairs, new every frame; a scratch that lives for a few dozen frames
  if (dust) {
    const r = CV.rand(f * 13 + 1), n = Math.floor(r() * 3.4 * dust);
    for (let i = 0; i < n; i++) {
      const x = r() * W, y = r() * H, light = r() < 0.25, sz = 1 + r() * 3.5;
      ctx.globalAlpha = 0.35 + r() * 0.35;
      ctx.fillStyle = ctx.strokeStyle = light ? T.cream : '#000';
      if (r() < 0.7) { ctx.beginPath(); ctx.ellipse(x, y, sz, sz * (0.6 + r() * 0.6), r() * 3, 0, Math.PI * 2); ctx.fill(); }
      else {
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.bezierCurveTo(x + (r() - 0.5) * 40, y + r() * 30, x + (r() - 0.5) * 40, y + r() * 30, x + (r() - 0.5) * 30, y + 20 + r() * 30);
        ctx.stroke();
      }
    }
    const seg = Math.floor(f / 37), rs = CV.rand(seg * 5 + 2);
    if (rs() < 0.4 * dust) {
      const x = rs() * W + CV.noise(f * 0.3, seg) * 6;
      ctx.globalAlpha = 0.12 + rs() * 0.1;
      ctx.fillStyle = T.cream;
      ctx.fillRect(x, 0, 1.2, H);
    }
  }
  ctx.restore();
  draw.vignette(ctx, W, H, vignette, '#000');
  draw.grain(ctx, f, grain, { blend: 'overlay' });
}

// Letterbox bars, drawn last. open: 0 = full frame, 1 = the full letterbox.
function letterbox(ctx, W, H, open = 1, aspect = T.aspect) {
  const bar = (H - picture(W, H, aspect).h) / 2 * clamp(open);
  if (bar <= 0) return;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, bar);
  ctx.fillRect(0, H - bar, W, bar);
}

// === KIT: camera and type ====================================================
// The slow cinematic ease: long, soft settle.
const drift = ease.bezier(0.33, 0, 0.15, 1);

// A slow dolly over the whole shot (zoom and/or lateral track), never a snap.
// The zoom holds (focusX, focusY) still on screen; x / y track the camera.
function dolly(ctx, s, fn, { zoom = [1, 1.06], x = [0, 0], y = [0, 0], focusX = s.W / 2, focusY = s.H / 2 } = {}) {
  const k = ease.inOutSine(s.p), z = lerp(zoom[0], zoom[1], k);
  draw.camera(ctx, s.W, s.H, { zoom: z, focusX, focusY, x: lerp(x[0], x[1], k) + (s.W / 2 - focusX) / z, y: lerp(y[0], y[1], k) + (s.H / 2 - focusY) / z }, fn);
}

// A title that fades up out of focus and keeps tracking open while it holds.
// spacing in em: [at t = 0, at t = life]. Returns 0..1 visibility.
function trackTitle(ctx, str, x, y, t, { font = F(600, 120), fill = T.cream, spacing = [0.12, 0.3], life = 8, fadeIn = 1.4, blur = 10, exit = 0, align = 'center' } = {}) {
  const a = ease.inOutSine(clamp(t / fadeIn)) * (1 - clamp(exit));
  if (a <= 0) return 0;
  ctx.save();
  ctx.font = font;
  const size = parseFloat(font.match(/(\d+(?:\.\d+)?)px/)[1]);
  const sp = lerp(spacing[0], spacing[1], clamp(t / life)) * size;
  ctx.letterSpacing = `${sp.toFixed(2)}px`;
  const w = ctx.measureText(str).width - sp; // trailing spacing doesn't count
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.textAlign = 'left';
  ctx.globalAlpha = a;
  ctx.fillStyle = fill;
  const b = (1 - a) * blur;
  if (b > 0.05) ctx.filter = `blur(${b.toFixed(2)}px)`;
  ctx.fillText(str, x0, y);
  ctx.restore();
  return a;
}

// Documentary super: a mono timecode kicker, a hairline that draws, a serif line.
function lowerThird(ctx, x, y, kicker, line, t, { exit = 0, font = F(500, 42, T.han), width = 520, scrim = 0.5 } = {}) {
  if (t <= 0) return;
  const o = 1 - clamp(exit);
  ctx.save();
  // a soft scrim keeps the super legible over a busy picture
  if (scrim > 0) {
    const g = ctx.createLinearGradient(0, y - 170, 0, y + 70);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(0,0,0,${scrim})`);
    ctx.globalAlpha = o * ease.inOutSine(clamp(t / 1.2));
    ctx.fillStyle = g;
    ctx.fillRect(0, y - 170, ctx.canvas.__cvW || ctx.canvas.width, 240);
  }
  ctx.globalAlpha = o * ease.inOutSine(clamp(t / 0.8));
  ctx.font = F(400, 24, T.mono);
  ctx.letterSpacing = '4px';
  ctx.fillStyle = T.amber;
  ctx.textAlign = 'left';
  ctx.fillText(kicker, x, y - 64 + (1 - clamp(t / 0.8)) * 8);
  ctx.letterSpacing = '0px';
  ctx.fillStyle = color.rgba(T.cream, 0.55);
  ctx.fillRect(x, y - 46, width * drift(clamp((t - 0.25) / 1.4)), 1.5);
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = o;
  ctx.font = font;
  ctx.fillStyle = T.cream;
  fx.charReveal(ctx, line, x, y, t - 0.5, { stagger: 0.05, dur: 0.9, rise: 0.08, blur: 6, ease: ease.inOutSine });
  ctx.restore();
}

// One frame of an academy countdown leader: n is the numeral, q 0→1 the sweep.
function leader(ctx, W, H, n, q) {
  const cx = W / 2, cy = H / 2, R = H * 0.36;
  ctx.fillStyle = T.leader;
  ctx.fillRect(0, 0, W, H);
  // the sweep: a darker wedge turning clockwise from twelve o'clock
  ctx.fillStyle = color.mix(T.leader, '#000', 0.28);
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, R * 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(q));
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = color.rgba('#000', 0.75);
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
  ctx.strokeStyle = color.rgba(T.cream, 0.9);
  ctx.lineWidth = 6;
  for (const r of [R, R * 0.84]) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.font = F(600, H * 0.5);
  ctx.fillStyle = '#111';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(n), cx, cy + H * 0.02);
  ctx.textBaseline = 'alphabetic';
}

// Film burn: the stock overexposes into orange and white, and the next shot
// comes through it. A custom transition; seed / x / y move where it burns from.
function filmBurn(ctx, A, B, p, o = {}) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  ctx.drawImage(A, 0, 0);
  const m = clamp((p - 0.38) / 0.24);
  if (m > 0) { ctx.globalAlpha = m; ctx.drawImage(B, 0, 0); ctx.globalAlpha = 1; }
  const k = Math.sin(Math.PI * p), r = CV.rand(o.seed ?? 3);
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 5; i++) {
    const x = W * ((o.x ?? 0.75) + (r() - 0.5) * 0.6 - p * 0.2), y = H * ((o.y ?? 0.45) + (r() - 0.5) * 0.7);
    const rad = W * (0.12 + r() * 0.3) * (0.35 + 1.4 * k);
    const gr = ctx.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(255,238,200,${0.95 * k})`);
    gr.addColorStop(0.3, `rgba(255,160,70,${0.8 * k})`);
    gr.addColorStop(0.65, `rgba(210,60,20,${0.4 * k})`);
    gr.addColorStop(1, 'rgba(120,20,0,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

// A camera move that zooms about a point that stays put on screen (a push
// toward something without re-centring it).
const zoomAt = (ctx, s, { zoom = 1, focusX = s.W / 2, focusY = s.H / 2, x = 0, y = 0, rotate = 0 }, fn) =>
  draw.camera(ctx, s.W, s.H, { zoom, rotate, focusX, focusY, x: x + (s.W / 2 - focusX) / zoom, y: y + (s.H / 2 - focusY) / zoom }, fn);

// Frame advance: the roll pulls through the gate to the next frame. The old
// picture slides off with the black frame line and the next one slides in,
// smeared by the pull-down. A custom transition for a run of stills on one roll.
function frameAdvance(ctx, A, B, p, o = {}) {
  const W = ctx.canvas.width, H = ctx.canvas.height, dir = o.direction === 'right' ? 1 : -1;
  const gap = W * 0.04, off = p * (W + gap) * dir, v = Math.sin(Math.PI * p);
  const n = 1 + Math.round(v * (o.samples ?? 7)), spread = v * W * (o.blur ?? 0.06);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < n; i++) {
    const d = n > 1 ? (i / (n - 1) - 0.5) * spread : 0;
    ctx.globalAlpha = 1 / (i + 1); // running average: every sample weighs the same
    ctx.drawImage(A, off + d, 0);
    ctx.drawImage(B, off + d - dir * (W + gap), 0);
  }
  // the gate darkens a touch while the film is moving
  ctx.globalAlpha = 0.3 * v;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

// === EXAMPLE: the last frame on a father's roll ==============================
// A daughter finds a roll of 36 in her father's old camera with 35 frames
// shot. Every photo is drawn in "print space": the 3:2 frame of the 35 mm
// negative at 1920×1280, centred on the screen, so the scope picture shows
// its middle band (y 238…1041) and a print or a contact sheet shows all of it.
const PW = 1920, PH = 1280, PYO = (1080 - PH) / 2;
const PIC = picture(1920, 1080); // { y0, y1, h } of the scope picture
const inPrint = (ctx, fn) => { ctx.save(); ctx.translate(0, PYO); fn(); ctx.restore(); };

// small geometry helpers
const area = (p) => p.reduce((s, q, i) => { const r = p[(i + 1) % p.length]; return s + q[0] * r[1] - r[0] * q[1]; }, 0);
function ellipsePts(cx, cy, rx, ry, rot = 0, n = 18) {
  const out = [], c = Math.cos(rot), sn = Math.sin(rot);
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, x = Math.cos(a) * rx, y = Math.sin(a) * ry; out.push([cx + x * c - y * sn, cy + x * sn + y * c]); }
  return out;
}
function capsule(a, b, r, n = 5) {
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), out = [];
  for (let i = 0; i <= n; i++) { const t = ang - Math.PI / 2 - (i / n) * Math.PI; out.push([a[0] + Math.cos(t) * r, a[1] + Math.sin(t) * r]); }
  for (let i = 0; i <= n; i++) { const t = ang + Math.PI / 2 - (i / n) * Math.PI; out.push([b[0] + Math.cos(t) * r, b[1] + Math.sin(t) * r]); }
  return out;
}
function glow(ctx, x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.rgba(col, a));
  g.addColorStop(1, color.rgba(col, 0));
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
const tracePoly = (ctx, pts) => { ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); };

// The orange date a 90s point-and-shoot burned into the corner of the frame:
// seven-segment digits, right-aligned at x, bottom at y, h tall.
const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg', 5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
function dateStamp(ctx, str, x, y, h, a = 1) {
  if (a <= 0) return;
  const w = h * 0.52, th = h * 0.12, adv = w + h * 0.3;
  const segs = { a: [th, 0, w - 2 * th, th], b: [w - th, th, th, h / 2 - 1.5 * th], c: [w - th, h / 2 + th / 2, th, h / 2 - 1.5 * th], d: [th, h - th, w - 2 * th, th], e: [0, h / 2 + th / 2, th, h / 2 - 1.5 * th], f: [0, th, th, h / 2 - 1.5 * th], g: [th, h / 2 - th / 2, w - 2 * th, th] };
  let width = 0;
  for (const ch of str) width += ch === ' ' ? adv * 0.6 : ch === "'" ? th * 2.6 : adv;
  ctx.save();
  ctx.translate(x - width, y - h);
  ctx.transform(1, 0, -0.1, 1, h * 0.1, 0);
  for (const pass of [0, 1]) {
    ctx.globalAlpha = a * (pass ? 0.92 : 0.22);
    ctx.fillStyle = pass ? '#FF9B52' : '#FF4E12';
    const grow = pass ? 0 : th * 1.1;
    let cx = 0;
    for (const ch of str) {
      if (ch === ' ') { cx += adv * 0.6; continue; }
      if (ch === "'") { ctx.fillRect(cx - grow / 2, -grow / 2, th + grow, th * 2.2 + grow); cx += th * 2.6; continue; }
      for (const k of SEG[ch] || '') { const [sx, sy, sw, sh] = segs[k]; ctx.fillRect(cx + sx - grow / 2, sy - grow / 2, sw + grow, sh + grow); }
      cx += adv;
    }
  }
  ctx.restore();
}

// An old print: warm, a little faded, blacks lifted to brown.
function printTone(ctx, x, y, w, h, k = 1) {
  if (k <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light';
  ctx.globalAlpha = 0.5 * k;
  ctx.fillStyle = '#F4B46A';
  ctx.fillRect(x, y, w, h);
  ctx.globalCompositeOperation = 'lighten';
  ctx.globalAlpha = k;
  ctx.fillStyle = '#2E2520';
  ctx.fillRect(x, y, w, h);
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 0.22 * k;
  ctx.fillStyle = '#EBD3A4';
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

// --- People are only ever their shadows ---------------------------------------
// A figure is a skeleton in figure space (u across, v up, 1 = head top), built
// from capsules, then cast onto the sand by the low sun behind the camera:
// stretched away from us and narrowing with distance. All its parts go in one
// path filled once (nonzero), so overlaps never darken.
const POSES = {
  eye: { lEl: [-0.2, 0.785], lHa: [-0.05, 0.895], rEl: [0.2, 0.785], rHa: [0.05, 0.895], cam: [0, 0.9] },   // the camera at the eye, elbows out
  low: { lEl: [-0.125, 0.665], lHa: [-0.05, 0.6], rEl: [0.125, 0.665], rHa: [0.05, 0.6], cam: [0, 0.605] }, // the camera held at the chest
  arm: { lEl: [-0.15, 0.665], lHa: [-0.25, 0.63], rEl: [0.115, 0.66], rHa: [0.125, 0.5], cam: null },      // her arm through his
};
function lerpPose(a, b, k) {
  const L = (p, q) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k)];
  return { lEl: L(a.lEl, b.lEl), lHa: L(a.lHa, b.lHa), rEl: L(a.rEl, b.rEl), rHa: L(a.rHa, b.rHa), cam: a.cam && b.cam ? L(a.cam, b.cam) : a.cam || b.cam };
}
function figurePolys(P, o) {
  const polys = [ellipsePts(0, 0.928, 0.05, 0.062), capsule([0, 0.84], [0, 0.9], 0.026)];
  if (o.ponytail) polys.push(ellipsePts(0.052, 0.885, 0.022, 0.058, -0.35, 12));
  polys.push([[-0.1, 0.836], [0.1, 0.836], [0.114, 0.8], [0.084, 0.63], [0.094, 0.5], [-0.094, 0.5], [-0.084, 0.63], [-0.114, 0.8]]);
  for (const sx of [-1, 1]) {
    const hip = [sx * 0.05, 0.52], knee = [sx * 0.056, 0.27], ank = [sx * 0.072, 0.035];
    polys.push(capsule(hip, knee, 0.044), capsule(knee, ank, 0.033), capsule(ank, [sx * 0.095, 0.012], 0.022));
    const sh = [sx * 0.094, 0.802], el = sx < 0 ? P.lEl : P.rEl, ha = sx < 0 ? P.lHa : P.rHa;
    polys.push(capsule(sh, el, 0.031), capsule(el, ha, 0.026));
  }
  if (P.cam) {
    const [cx, cy] = P.cam;
    polys.push([[cx - 0.09, cy - 0.036], [cx + 0.09, cy - 0.036], [cx + 0.09, cy + 0.04], [cx - 0.09, cy + 0.04]], [[cx - 0.034, cy], [cx + 0.034, cy], [cx + 0.034, cy + 0.075], [cx - 0.034, cy + 0.075]], [[cx + 0.045, cy + 0.04], [cx + 0.075, cy + 0.04], [cx + 0.075, cy + 0.06], [cx + 0.045, cy + 0.06]]);
  }
  return polys;
}
// f: { pose, x, base, len, width, lean, k, ponytail }
function castShadows(ctx, figs, col, a) {

  ctx.fillStyle = g; ctx.fillRect(760, -400, 160, DOOR_FLOOR + 400);

  ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(920, -400, 14, DOOR_FLOOR + 400);
  ctx.strokeStyle = 'rgba(60,80,70,0.25)'; ctx.lineWidth = 6;
  ctx.strokeRect(1010, 200, 640, 820); ctx.strokeRect(1010, 1180, 640, 900);
  ctx.fillStyle = '#C9A548'; ctx.beginPath(); ctx.arc(1700, 1180, 22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4B3A2C'; ctx.fillRect(-300, DOOR_FLOOR, W + 600, 400);
  ctx.fillStyle = '#E8E3D6'; ctx.fillRect(-300, DOOR_FLOOR - 26, 1060, 26);
  // chipped paint on the casing
  const r = CV.rand(4); ctx.fillStyle = 'rgba(150,130,100,0.35)';
  for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.ellipse(770 + r() * 140, r() * DOOR_FLOOR, 2 + r() * 6, 1 + r() * 3, r() * 3, 0, Math.PI * 2); ctx.fill(); }
  // the pencil marks, each drawn on, then its year written beside it
  for (let i = 0; i < MARKS.length; i++) {
    const k = marks[i] ?? 0;
    if (k <= 0) continue;
    const [year, cm] = MARKS[i], y = DOOR_FLOOR - cm * CM, wob = (i % 3) * 3 - 3;
    ctx.strokeStyle = 'rgba(50,50,56,0.9)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(766, y + wob * 0.3); ctx.lineTo(766 + 140 * drift(clamp(k * 2)), y - wob * 0.2); ctx.stroke();
    ctx.font = F(500, 50, '"Caveat", cursive'); ctx.fillStyle = 'rgba(55,55,60,0.85)'; ctx.textAlign = 'left';
    const label = `${year}`, n = Math.floor(clamp((k - 0.4) / 0.5) * label.length + 1e-6);
    ctx.fillText(label.slice(0, n), 784, y + 46);
  }
  // the afternoon light crossing the door, day after day
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const ph = (t * 0.32) % 1, lx = lerp(-700, 2300, ph);
  ctx.fillStyle = color.rgba('#FFCB8A', 0.16 * light * Math.sin(Math.PI * ph));
  ctx.beginPath(); ctx.moveTo(lx, -400); ctx.lineTo(lx + 380, -400); ctx.lineTo(lx + 120, DOOR_FLOOR + 400); ctx.lineTo(lx - 260, DOOR_FLOOR + 400); ctx.fill();
  ctx.restore();
}

// --- The contact sheet: the whole roll, 4 strips of 9 (world space) -----------
const CS = { cell: 300, ch: 200, pitch: 330, edge: 46, strip: 312, m: 40 };
CS.w = 9 * CS.pitch - 30 + 2 * CS.m; CS.h = 4 * CS.strip - 20 + 2 * CS.m;
const cellAt = (n) => ({ x: CS.m + ((n - 1) % 9) * CS.pitch, y: CS.m + Math.floor((n - 1) / 9) * CS.strip + CS.edge });
function contactSheet(ctx, live, marks) {
  ctx.fillStyle = '#EDE8DC'; ctx.fillRect(-4000, -4000, CS.w + 8000, CS.h + 8000);
  for (let row = 0; row < 4; row++) {
    const y = CS.m + row * CS.strip;
    ctx.fillStyle = '#0E0D0C'; ctx.fillRect(CS.m - 20, y, CS.w - 2 * CS.m + 40, CS.strip - 20);
    ctx.fillStyle = '#1D1B19';
    for (let x = CS.m - 6; x < CS.w - CS.m + 10; x += 41) { draw.roundRect(ctx, x, y + 10, 18, 24, 4); ctx.fill(); draw.roundRect(ctx, x, y + CS.strip - 20 - 34, 18, 24, 4); ctx.fill(); }
  }
  ctx.font = F(700, 24, T.mono); ctx.fillStyle = '#CFC8B8'; ctx.textAlign = 'left';
  for (let n = 1; n <= 36; n++) {
    const c = cellAt(n);
    if (n < 36) ctx.drawImage(rollThumb(ROLL[n - 1]), c.x, c.y, CS.cell, CS.ch);
    ctx.fillText(`${n}`, c.x + 6, c.y + CS.ch + 36);
    ctx.fillText(`▸${n}A`, c.x + CS.cell / 2, c.y + CS.ch + 36);
  }
  const c = cellAt(36);
  ctx.save();
  ctx.beginPath(); ctx.rect(c.x, c.y, CS.cell, CS.ch); ctx.clip();
  ctx.translate(c.x, c.y); ctx.scale(CS.cell / PW, CS.ch / PH);
  live(ctx);
  ctx.restore();
  // the grease pencil: frame 1, frame 36
  for (const [n, k, seed] of [[1, marks[0], 3], [36, marks[1], 8]]) {
    if (k <= 0) continue;
    const cc = cellAt(n), cx = cc.x + CS.cell / 2, cy = cc.y + CS.ch / 2;
    ctx.strokeStyle = '#E2482C'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    draw.drawOn(ctx, draw.sketchCircle(cx, cy, 205, { seed, roughness: 7, steps: 60 }).map(([x, y]) => [cx + (x - cx), cy + (y - cy) * 0.72]), drift(clamp(k)));
  }
}

const negCenter = (n) => {
  const x = negX(n) + NEG.cell / 2, y = NEG.h / 2, a = -0.025;
  return [x * Math.cos(a) - y * Math.sin(a), NEG.y + x * Math.sin(a) + y * Math.cos(a)];
};
// the pull back from the 36th frame to the whole contact sheet: q 0 → 1
function sheetCamera(ctx, q, fn) {
  const c = cellAt(36), ccx = c.x + CS.cell / 2, ccy = c.y + CS.ch / 2;
  const Z0 = 1920 / CS.cell, Z1 = 0.56, Z = Math.exp(lerp(Math.log(Z0), Math.log(Z1), q));
  const ax = lerp(960, 960 + (ccx - CS.w / 2) * Z1, q), ay = lerp(540, 545 + (ccy - CS.h / 2) * Z1, q);
  ctx.save();
  ctx.translate(ax, ay); ctx.scale(Z, Z); ctx.translate(-ccx, -ccy);
  fn();
  ctx.restore();
}
const PULL_BEATS = 7; // beats of pull-back, from the shutter scene's beat 2 into the sheet scene
const shot36 = (T, stamp) => (g) => {
  beachWorld(g, T, { era: 1, figs: [DAD(POSES.eye), HER()] });
  dateStamp(g, "'26 5 3", 1790, 1000, 46, stamp);
};

// === VIDEO ===================================================================
CV.create({
  width: 1920, height: 1080, fps: 30,
  background: T.black,
  lang: 'zh-CN',
  // the score designed for this video: tender, nostalgic, then lifting. A felt
  // piano arpeggio carries it from the first frame; a music box sings in the
  // gaps (her childhood); bass, a brushed kit and a strummed guitar come in as
  // the photos come alive; the empty years turn to the relative-minor loop, and
  // the return to the sea lifts on IV–V–I.
  music: {
    bpm: 76, seed: 36, key: 'Eb', mode: 'major', progression: [0, 4, 5, 3], kit: 'brush', swing: 0.12,
    layers: [
      { name: 'felt piano', inst: 'felt', notes: [0, 1, 2, 3, 2, 1, 2, 1], pattern: 'X.x.X.x.', gate: 1.8, vel: [0.11, 0.16], verb: 0.3 },
      { name: 'bass', inst: 'bass', notes: ['root', 'root', 'fifth'], octave: -1, pattern: 'X..x..X.', vel: [0.18, 0.24], from: 0.35 },
      { name: 'kick', inst: 'kick', pattern: 'X......xX.......', vel: [0.3, 0.42], from: 0.45 },
      { name: 'brush', inst: 'snare', pattern: '....X.......X...', vel: [0.14, 0.22], from: 0.45 },
      { name: 'strings', inst: 'strings', notes: 'chord', pattern: 'X---', vel: [0.04, 0.08], from: 0.5 },
      { name: 'guitar', inst: 'acoustic', notes: 'chord', pattern: 'X.xX.x.x', strum: 0.018, vel: [0.06, 0.1], from: 0.58 },
      { name: 'shaker', inst: 'shaker', pattern: 'x.x.x.x.x.x.x.x.', vel: [0.04, 0.07], from: 0.68 },
    ],
    lead: { inst: 'bell', kind: 'musicbox', range: [75, 91], rhythm: 'melodic', vel: 0.11, verb: 0.3 },
    parts: {
      years: { progression: [5, 3, 0, 4], seed: 5 },
      sea: { progression: [3, 4, 0, 0], seed: 7 },
    },
  },
  transition: { type: 'fade', duration: 1.2, ease: ease.inOutSine },
  subtitles: {
    // set in the lower letterbox bar, like a film print's subtitles
    style: { font: F(500, 38, T.han), color: T.cream, box: null, stroke: 'rgba(0,0,0,0.6)', strokeWidth: 4, y: 0.94 },
  },
  scenes: [
    // --- 1. Dark. The desk lamp clicks on: his old camera ---------------------
    {
      id: 'camera', voiceDelay: 3.3, tail: 1.2, energy: 0.35,
      sfx: [{ at: (s) => s.onBeat(2), type: 'click', gain: 0.9 }],
      draw(ctx, s) {
        const { t } = s, on = s.onBeat(2);
        // a tungsten lamp: a stutter, then it warms up
        const light = t < on ? 0.14 : (t - on < 0.12 ? 0.55 : t - on < 0.2 ? 0.15 : 0.35 + 0.65 * ease.outCubic(clamp((t - on - 0.2) / 0.9)));
        const k = ease.inOutSine(s.p);
        draw.camera(ctx, s.W, s.H, { zoom: lerp(1, 1.24, k), focusX: lerp(960, 1120, k), focusY: lerp(600, 520, k) }, () => deskScene(ctx, s, light));
        trackTitle(ctx, '2026 · 春', 170, PIC.y0 + 80, t - (on + 0.8), { font: F(400, 26, T.mono), fill: T.amber, spacing: [0.25, 0.4], life: s.dur, align: 'left', blur: 4, exit: s.out(0.8, ease.inOutSine) });
      },
    },
    // --- 2. The frame counter: it runs up to 35 and stops one short ----------
    {
      id: 'counter', tail: 1.6, energy: 0.4,
      sfx: [{ at: (s) => s.when('三十五', 2.5) + 0.45, type: 'click', gain: 0.7 }],
      draw(ctx, s) {
        const { t } = s, t36 = s.when('三十六', 0.1), t35 = s.when('三十五', 2.5);
        const v = -1 + 36 * ease.outQuart(clamp((t - t36 + 0.1) / (t35 + 0.45 - t36 + 0.1)));
        const fl = Math.floor(v + 1e-6), frame = fl + ease.outCubic(clamp((v - fl) * 2.5));
        const hl = s.at(t36 + 0.3, 0.6) * (1 - 0.5 * s.at(t35, 0.8));
        zoomAt(ctx, s, { zoom: lerp(1.0, 1.1, ease.inOutSine(s.p)), rotate: lerp(0.035, -0.01, ease.inOutSine(s.p)), focusX: 900, focusY: 520 }, () => counterDial(ctx, s, frame, hl, s.at(t35 + 0.45, 0.5)));
        const out = s.out(0.9, ease.inOutSine);
        trackTitle(ctx, '/ 36', 1640, 640, t - (t36 + 0.4), { font: F(500, 96), fill: color.rgba(T.cream, 0.7), spacing: [0.04, 0.12], life: s.dur, align: 'left', exit: out });
        trackTitle(ctx, '35', 1620, 640, t - (t35 + 0.35), { font: F(600, 230), fill: T.amber, spacing: [0.02, 0.06], life: s.dur, align: 'right', exit: out, blur: 14 });
      },
    },
    // --- 3. The darkroom: the first print comes up, and we fall into it -------
    {
      id: 'darkroom', tail: 4.6, energy: 0.45,
      transition: { type: 'dip', duration: 1.2, ease: ease.inOutSine, color: '#000' },
      draw(ctx, s) {
        const { t } = s, dev = clamp((t - s.voiceStart - 0.3) / 4.2);
        const push = ease.inOutCubic(clamp((t - (s.dur - 3.8)) / 2.4)); // done before the dissolve starts
        const Z = Math.exp(lerp(0, Math.log(1920 / 660), push));
        draw.camera(ctx, s.W, s.H, { zoom: Z * lerp(1.03, 1, push), focusX: 960, focusY: 540 }, () => darkroom(ctx, s, dev, push));
      },
    },
    // --- 4. The first photo comes alive: the sea, and his own shadow ---------
    {
      id: 'sea', tail: 1.4, energy: 0.55,
      transition: { type: 'fade', duration: 1.4, ease: ease.inOutSine, sfx: 'swell' },
      draw(ctx, s) {
        const { t } = s, k = ease.inOutSine(s.p);
        zoomAt(ctx, s, { zoom: lerp(1, 1.09, k), focusX: 900, focusY: 600 }, () => inPrint(ctx, () => {
          beachWorld(ctx, t, { figs: [DAD(POSES.eye)] });
          printTone(ctx, -600, -600, PW + 1200, PH + 1200, 1);
          dateStamp(ctx, "'99 8 14", 1790, 1000, 46);
        }));
        lowerThird(ctx, 160, 860, 'No. 01 · 1999.08.14', '北戴河', t - s.when('第一张', 0.1) - 0.6, { exit: s.out(0.7, ease.inOutSine), width: 420 });
      },
    },
    // --- 5–7. The roll advances: a bicycle, a lit window, the morning she was born
    {
      id: 'bike', tail: 1.7, energy: 0.6,
      transition: { type: frameAdvance, duration: 0.75, ease: ease.inOutCubic, sfx: 'click' },
      draw(ctx, s) {
        const { t } = s, k = ease.inOutSine(s.p);
        zoomAt(ctx, s, { zoom: 1.06, x: lerp(-60, 60, k) }, () => inPrint(ctx, () => {
          bikeWorld(ctx, t);
          printTone(ctx, -600, -600, PW + 1200, PH + 1200, 1);
          dateStamp(ctx, "'99 10 2", 1790, 1000, 46);
        }));
        lowerThird(ctx, 160, 860, 'No. 07 · 1999.10.02', '她家楼下', t - 0.5, { exit: s.out(0.6, ease.inOutSine), width: 420 });
      },
    },
    {
      id: 'window', tail: 1.8, energy: 0.6,
      transition: { type: frameAdvance, duration: 0.75, ease: ease.inOutCubic, sfx: 'click' },
      draw(ctx, s) {
        const { t } = s, k = ease.inOutSine(s.p), wave = s.at(s.when('妈妈', 4.5) - 0.35, 0.9, ease.inOutSine);
        zoomAt(ctx, s, { zoom: lerp(1.02, 1.16, k), focusX: 1180, focusY: 500 }, () => inPrint(ctx, () => {
          windowWorld(ctx, t, { wave });
          printTone(ctx, -600, -600, PW + 1200, PH + 1200, 1);
          dateStamp(ctx, "'99 12 31", 1790, 1000, 46);
        }));
        lowerThird(ctx, 160, 860, 'No. 19 · 1999.12.31', '千禧年前夜', t - 0.5, { exit: s.out(0.6, ease.inOutSine), width: 420, scrim: 0.3 });
      },
    },
    {
      id: 'born', tail: 1.9, energy: 0.7,
      transition: { type: frameAdvance, duration: 0.75, ease: ease.inOutCubic, sfx: 'click' },
      sfx: [{ at: (s) => s.when('天', 3.8), type: 'shimmer', gain: 0.5 }],
      draw(ctx, s) {
        const { t } = s, k = ease.inOutSine(s.p);
        zoomAt(ctx, s, { zoom: lerp(1.12, 1.0, k), focusX: 1000, focusY: 560 }, () => inPrint(ctx, () => {
          bornWorld(ctx, t, { dawn: lerp(0.3, 1, ease.inOutSine(s.p)) });
          printTone(ctx, -600, -600, PW + 1200, PH + 1200, 1);
          dateStamp(ctx, "'00 4 6", 1790, 1000, 46);
        }));
        lowerThird(ctx, 160, 860, 'No. 35 · 2000.04.06', '清晨 5:52', t - 0.5, { exit: s.out(0.7, ease.inOutSine), width: 420 });
      },
    },
    // --- 8. The negatives on the lightbox: frame 36 is clear film -------------
    {
      id: 'blank', part: 'years', tail: 2.0, energy: 0.4,
      transition: { type: 'dip', duration: 1.2, ease: ease.inOutSine, color: '#000' },
      draw(ctx, s) {
        const { t } = s, tGe = s.when('格', 0.7), t26 = s.when('二十六', 1.6);
        const track = ease.inOutCubic(clamp(t / (tGe + 0.9)));
        const [x0, y0] = negCenter(33.4), [x1, y1] = negCenter(36);
        const zoom = lerp(1.05, 2.1, ease.inOutCubic(clamp((t - tGe) / (t26 + 1.2 - tGe))));
        draw.camera(ctx, s.W, s.H, { zoom, focusX: lerp(x0, x1, track), focusY: lerp(y0, y1, track) - 10 }, () => lightbox(ctx, s, clamp((t - t26) / 2.4)));
      },
    },
    // --- 9. The years: the pencil marks on the door frame climb ---------------
    {
      id: 'grow', tail: 2.2, energy: 0.55,
      draw(ctx, s) {
        const { t } = s, start = s.when('他看着', 3.2) - 0.1, gap = s.beatLen / 2;
        const marks = MARKS.map((_, i) => clamp((t - start - i * gap) / 0.9));
        const idx = clamp((t - start) / gap, 0, MARKS.length - 1);
        const i0 = Math.floor(idx), f = ease.inOutSine(idx - i0), yOf = (i) => DOOR_FLOOR - MARKS[Math.min(i, MARKS.length - 1)][1] * CM;
        const follow = lerp(yOf(i0), yOf(i0 + 1), f) + 60;
        const camY = lerp(DOOR_FLOOR - MARKS[0][1] * CM + 170, follow, ease.inOutSine(clamp((t - start + 0.6) / 1.2)));
        draw.camera(ctx, s.W, s.H, { zoom: 1.5, focusX: lerp(880, 840, ease.inOutSine(s.p)), focusY: camY }, () => doorFrame(ctx, s, marks, 1));
      },
      sfx: MARKS.map((_, i) => ({ at: (s) => s.when('他看着', 3.2) - 0.1 + i * s.beatLen / 2, type: 'tick', gain: 0.35 })),
    },
    // --- 10. The film burns back to the sea: May, the two of them ------------
    {
      id: 'return', part: 'sea', tail: 1.4, energy: 0.75,
      transition: { type: filmBurn, duration: 1.6, ease: ease.inOutSine, sfx: 'swell', seed: 9, x: 0.3, y: 0.4 },
      draw(ctx, s) {
        const { t } = s, tilt = ease.inOutCubic(clamp(t / (s.dur - 0.4)));
        draw.camera(ctx, s.W, s.H, { y: lerp(-330, 0, tilt) }, () => inPrint(ctx, () => beachWorld(ctx, s.T, { era: 1, figs: [DAD(POSES.low), HER()] })));
        lowerThird(ctx, 160, 860, '2026.05.03', '北戴河', t - s.when('五月', 0.5) - 0.4, { exit: s.out(0.7, ease.inOutSine), width: 300 });
      },
    },
    // --- 11. His voice: he lifts the camera ----------------------------------
    {
      id: 'dad', tail: 0.9, energy: 0.62,
      transition: { type: 'cut' },
      draw(ctx, s) {
        const k = s.at(s.when('拍照', 2.2) - 0.75, 1.3, ease.inOutCubic);
        inPrint(ctx, () => beachWorld(ctx, s.T, { era: 1, figs: [DAD(lerpPose(POSES.low, POSES.eye, k)), HER()] }));
      },
    },
    // --- 12. The shutter. The frame freezes and we pull back -----------------
    {
      id: 'shutter', narration: false, beats: 6, energy: 0.9,
      transition: { type: 'cut' },
      sfx: [{ at: (s) => s.onBeat(1), type: 'click', gain: 1.2 }],
      draw(ctx, s) {
        const { t } = s, tb = s.onBeat(1), Tf = s.T - t + tb, frozen = t >= tb;
        const q = ease.inOutCubic(clamp((t - s.onBeat(2)) / (PULL_BEATS * s.beatLen)));
        const stamp = s.at(tb + 0.5, 0.4);
        if (!frozen) inPrint(ctx, () => beachWorld(ctx, s.T, { era: 1, figs: [DAD(POSES.eye), HER()] }));
        else sheetCamera(ctx, q, () => contactSheet(ctx, shot36(Tf, stamp), [0, 0]));
        // the shutter: two frames of black, then the flash of the frame being taken
        if (frozen && t - tb < 0.07) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, s.W, s.H); }
        else if (frozen) { ctx.fillStyle = color.rgba('#FFF6E6', 0.6 * Math.exp(-(t - tb - 0.07) / 0.14)); ctx.fillRect(0, 0, s.W, s.H); }
      },
    },
    // --- 13. The whole roll: frame 1 and frame 36 -----------------------------
    {
      id: 'sheet', tail: 2.4, energy: 0.8,
      transition: { type: 'cut' },
      draw(ctx, s) {
        const { t } = s, b = 4 + t / s.beatLen; // the first 4 beats of the pull happened in the shutter scene
        const q = ease.inOutCubic(clamp(b / PULL_BEATS));
        const Tf = s.T - t - 5 * s.beatLen; // the moment of the shutter, beat 1 of the 6-beat scene before
        const m1 = s.at(s.when('三十六', 0.1) + 0.2, 0.9), m36 = s.at(s.when('拍完', 1.6), 0.9);
        sheetCamera(ctx, q, () => contactSheet(ctx, shot36(Tf, 1), [m1, m36]));
      },
    },
    // --- 14. The title -------------------------------------------------------
    {
      id: 'title', narration: false, beats: 10, energy: 0.5,
      transition: { type: 'dip', duration: 1.4, ease: ease.inOutSine, color: '#000' },
      draw(ctx, s) {
        const { W, H, t } = s;
        const out = ease.inOutSine(clamp((t - s.onBeat(8)) / (s.dur - s.onBeat(8) - 0.2)));
        trackTitle(ctx, '第三十六张', W / 2, H / 2 + 20, t - s.onBeat(0.5), { font: F(600, 132, T.han), spacing: [0.16, 0.36], life: s.dur, exit: out, fadeIn: 2 });
        trackTitle(ctx, 'THE 36TH FRAME', W / 2, H / 2 + 110, t - s.onBeat(2.5), { font: F(500, 34), fill: T.amber, spacing: [0.5, 0.7], life: s.dur, exit: out, blur: 5 });
        trackTitle(ctx, '献给我的爸爸', W / 2, H / 2 + 220, t - s.onBeat(4.5), { font: F(500, 26, T.han), fill: T.dim, spacing: [0.3, 0.42], life: s.dur, exit: out, blur: 4 });
      },
    },
  ],
  // the projector: grain, weave, halation, grade, dust; then the scope bars
  overlay(ctx, g) {
    filmGate(ctx, g);
    letterbox(ctx, g.W, g.H);
  },
});
