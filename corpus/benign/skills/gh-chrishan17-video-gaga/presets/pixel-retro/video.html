<!doctype html>

<title>隐藏关卡 · 像素短片（video-gaga · Pixel Retro）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="../../runtime/video-gaga.js"></script>
<script>
/* =============================================================================
   PIXEL RETRO — an 8-bit console game, played straight.
   Every scene paints into a low-resolution buffer (one cell = T.px design px)
   that is locked to a 12-colour palette, with an optional 4×4 ordered dither for
   gradients, and blown up with nearest-neighbour sampling. Nothing is ever
   smoother than a cell: positions snap to the grid, motion moves in whole cells,
   sprites animate on eighth notes, and type is rasterised to 1-bit pixels (Latin
   in Press Start 2P, Chinese thresholded from Noto Sans SC).
   Colour is a story device: `mono` drains any part of the frame to the palette's
   five night→ink tones, `keep` lets one colour survive it, and `reveal` floods a
   second, full-colour world in through a dithered edge.
   Rhythm: things happen on the beat the way a game reacts to a button press:
   a hit, a bump, a hard punch-in, never a soft fade.
   ============================================================================= */
const { ease, clamp, lerp, fx, color, rand, text } = CV;

// === THEME ===================================================================
const T = {
  px: 5, // one art pixel = 5 design px (a 384×216 grid at 1920×1080, 216×384 at 9:16)
  // the whole frame is locked to these colours (lockPalette)
  pal: {
    night: '#16122B', shade: '#2C2554', dusk: '#4B3F86', dim: '#8C85BD',
    ink: '#FFF3D6', sky: '#5FA8E8', mint: '#57C98A', leaf: '#2E8A5C',
    gold: '#FFC93C', coral: '#F25F5C', rust: '#A3473A', sand: '#E8B07A',
  },
  bg: '#16122B',
  latin: '"Press Start 2P"', // an 8 px grid font: use sizes 8, 16, 24 … (grid px)
  cjk: '"Noto Sans SC"', // thresholded to 1-bit: 12 px minimum, 16 px for titles
};
// font at a size in GRID px (inside pixelFrame), e.g. F(8) or F(12, T.cjk)
const F = (size, fam = T.latin) => `${fam === T.cjk ? 700 : 400} ${size}px ${fam}`;

// === KIT: the pixel frame ====================================================
// pixelFrame(ctx, s, paint, opts): paint(g, w, h) draws in grid cells on a w×h
// buffer. Anything drawn (circles, gradients, rotated shapes) is snapped to the
// palette afterwards, so smooth drawing calls still come out as pixel art.
//   dither  4×4 ordered dither (true, or an amount) so gradients become bands
//   mono    true, or (x, y) => bool: those cells drop to the five night→ink tones
//   keep    palette names that keep their colour where mono applies (the one
//           thing that matters in a drained world)
//   zoom    { z, x, y }: a hard camera punch-in. The grid is cropped around cell
//           (x, y) and blown up z×, so the cells themselves get bigger.
let LO = null;
const PAL_NAMES = Object.keys(T.pal);
const PAL = Object.values(T.pal).map((c) => color.parse(c));
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16 - 0.5);
const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
const NEAREST = new Map();
function nearest(r, g, b) {
  const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
  let k = NEAREST.get(key);
  if (k !== undefined) return k;
  let best = 1e9;
  PAL.forEach(([pr, pg, pb], i) => {
    const d = 2 * (r - pr) ** 2 + 4 * (g - pg) ** 2 + 3 * (b - pb) ** 2;
    if (d < best) { best = d; k = i; }
  });
  NEAREST.set(key, k);
  return k;
}
// luminance → the nearest of the five ramp tones, as a 256-entry lookup
const RAMP = ['night', 'shade', 'dusk', 'dim', 'ink'].map((n) => PAL_NAMES.indexOf(n));
const lum = ([r, g, b]) => 0.299 * r + 0.587 * g + 0.114 * b;
const MONO = Array.from({ length: 256 }, (_, l) => RAMP.reduce((a, k) => (Math.abs(lum(PAL[k]) - l) < Math.abs(lum(PAL[a]) - l) ? k : a), RAMP[0]));
function lockPalette(g, w, h, dither, mono, keep) {
  const img = g.getImageData(0, 0, w, h), d = img.data;
  const amt = dither === true ? 44 : dither || 0;
  const kept = new Set((keep || []).map((n) => PAL_NAMES.indexOf(n)));
  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i += 4) {
    const o = amt ? bayer(x, y) * amt : 0;
    const r = clamp(d[i] + o, 0, 255) | 0, gg = clamp(d[i + 1] + o, 0, 255) | 0, b = clamp(d[i + 2] + o, 0, 255) | 0;
    let k = nearest(r, gg, b);
    if (mono && !kept.has(k) && (mono === true || mono(x, y))) k = MONO[clamp(lum([d[i], d[i + 1], d[i + 2]]) + o * 0.6, 0, 255) | 0];
    const c = PAL[k];
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}
function pixelFrame(ctx, s, paint, { dither = false, bg = T.bg, mono = false, keep = null, zoom = null } = {}) {
  const w = Math.round(s.W / T.px), h = Math.round(s.H / T.px);
  if (!LO || LO.width !== w || LO.height !== h) {
    LO = document.createElement('canvas');
    LO.width = w; LO.height = h;
  }
  const g = LO.getContext('2d', { willReadFrequently: true });
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.imageSmoothingEnabled = false;
  g.fillStyle = bg;
  g.fillRect(0, 0, w, h);
  g.save();
  paint(g, w, h);
  g.restore();
  lockPalette(g, w, h, dither, mono, keep);
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (zoom && zoom.z > 1) {
    const sw = Math.round(w / zoom.z), sh = Math.round(h / zoom.z);
    const sx = clamp(Math.round(zoom.x - sw / 2), 0, w - sw), sy = clamp(Math.round(zoom.y - sh / 2), 0, h - sh);
    ctx.drawImage(LO, sx, sy, sw, sh, 0, 0, s.W, s.H);
  } else ctx.drawImage(LO, 0, 0, s.W, s.H);
  ctx.restore();
}
// Two worlds in one frame: paintNew(g2, w, h) draws a second world, which is
// copied over the cells where inside(x, y). Pair it with a dithered circle
// (`inCircle`) to flood one world into another; pass the opposite test as the
// frame's `mono` to keep the old world drained.
let LO2 = null;
function reveal(g, w, h, paintNew, inside) {
  if (!LO2 || LO2.width !== w || LO2.height !== h) {
    LO2 = document.createElement('canvas');
    LO2.width = w; LO2.height = h;
  }
  const g2 = LO2.getContext('2d', { willReadFrequently: true });
  g2.setTransform(1, 0, 0, 1, 0, 0);
  g2.imageSmoothingEnabled = false;
  g2.fillStyle = T.bg;
  g2.fillRect(0, 0, w, h);
  g2.save();
  paintNew(g2, w, h);
  g2.restore();
  const a = g.getImageData(0, 0, w, h), b = g2.getImageData(0, 0, w, h).data;
  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i += 4) if (inside(x, y)) {
    a.data[i] = b[i]; a.data[i + 1] = b[i + 1]; a.data[i + 2] = b[i + 2];
  }
  g.putImageData(a, 0, 0);
}
// a circle with an ordered-dither edge `soft` cells wide: (x, y) => bool
const inCircle = (cx, cy, r, soft = 10) => (x, y) => Math.hypot(x - cx, y - cy) < r + bayer(x, y) * soft;

// === KIT: pixel type =========================================================
// Text rasterised once per (string, font) and thresholded to 1-bit, so glyph
// edges are hard cells. Cached; the key includes whether the webfont is ready.
const GLYPHS = new Map();
function bits(str, font) {
  const key = `${font}\u0001${str}\u0001${document.fonts.check(font, str) ? 1 : 0}`;
  let e = GLYPHS.get(key);
  if (e) return e;
  const c = document.createElement('canvas');
  let g = c.getContext('2d', { willReadFrequently: true });
  g.font = font;
  const m = g.measureText(str);
  const asc = Math.ceil(m.fontBoundingBoxAscent), w = Math.max(1, Math.ceil(m.width)), h = Math.max(1, asc + Math.ceil(m.fontBoundingBoxDescent));
  c.width = w; c.height = h;
  g = c.getContext('2d', { willReadFrequently: true });
  g.font = font;
  g.fillStyle = '#fff';
  g.fillText(str, 0, asc);
  const a = g.getImageData(0, 0, w, h).data, on = new Uint8Array(w * h);
  for (let i = 0; i < on.length; i++) on[i] = a[i * 4 + 3] >= 120 ? 1 : 0;
  // the inked rows only, so block type can be placed by its visible extent
  let top = h, bottom = 0;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (on[j * w + i]) { top = Math.min(top, j); bottom = Math.max(bottom, j); }
  e = { w, h, asc, on, top, bottom, tint: new Map() };
  GLYPHS.set(key, e);
  return e;
}
function tinted(b, col) {
  let c = b.tint.get(col);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = b.w; c.height = b.h;
  const g = c.getContext('2d', { willReadFrequently: true });
  const img = g.createImageData(b.w, b.h), [r, gg, bb] = color.parse(col);
  for (let i = 0; i < b.on.length; i++) if (b.on[i]) img.data.set([r, gg, bb, 255], i * 4);
  g.putImageData(img, 0, 0);
  b.tint.set(col, c);
  return c;
}
// Draws at (x, baseline y) in grid cells; returns the width. shadow: a colour
// stamped one cell down-right first (the classic drop shadow).
function pixelText(g, str, x, y, { font = F(8), color: col = T.pal.ink, align = 'left', shadow = null } = {}) {
  if (!str) return 0;
  const b = bits(str, font);
  const x0 = Math.round(align === 'center' ? x - b.w / 2 : align === 'right' ? x - b.w : x), y0 = Math.round(y - b.asc);
  if (shadow) g.drawImage(tinted(b, shadow), x0 + 1, y0 + 1);
  g.drawImage(tinted(b, col), x0, y0);
  return b.w;
}
// Wrap text to a width in cells (CJK-aware, via CV.text.wrap).
function wrapCells(g, str, font, maxW) {
  g.font = font;
  return str.split('\n').flatMap((p) => text.wrap(g, p, maxW));
}
// Block type: every 1-bit cell of `str` becomes a cell×cell block with a hard
// shadow, centred on x with its inked top at y. land(u, v) (u, v = 0..1 across
// and down the word) gives the local time a block lands; it drops `fall` cells
// on the way in. colour(u, v) can paint a glint or a gradient through it.
function blockText(g, s, str, font, x, y, cell, { colour = () => T.pal.ink, shade = T.pal.dusk, land = null, fall = 80 } = {}) {
  const b = bits(str, font), x0 = Math.round(x - (b.w * cell) / 2), y0 = Math.round(y - b.top * cell);
  for (let j = 0; j < b.h; j++) for (let i = 0; i < b.w; i++) {
    if (!b.on[j * b.w + i]) continue;
    const u = i / b.w, v = (j - b.top) / Math.max(1, b.bottom - b.top);
    let dy = 0;
    if (land) {
      const k = clamp((s.t - land(u, v) + 0.2) / 0.2);
      if (k <= 0) continue;
      dy = -Math.round((1 - k * k) * fall);
    }
    const px = x0 + i * cell, py = y0 + j * cell + dy;
    g.fillStyle = shade; g.fillRect(px + 1, py + 1, cell, cell);
    g.fillStyle = colour(u, v); g.fillRect(px, py, cell, cell);
  }
  return { w: b.w * cell, h: (b.bottom - b.top + 1) * cell, x0 };
}

// === KIT: sprites ============================================================
// Sprite art as rows of characters; `colours` maps a character to a colour
// ('.' and unmapped characters are transparent). Cached per art and colours.
const SPRITES = new Map();
function sprite(g, art, x, y, colours, { flip = false, scale = 1 } = {}) {
  const key = `${art.join('/')}|${JSON.stringify(colours)}|${flip}`;
  let c = SPRITES.get(key);
  if (!c) {
    c = document.createElement('canvas');
    c.width = art[0].length; c.height = art.length;
    const sg = c.getContext('2d', { willReadFrequently: true });
    art.forEach((row, j) => Array.from(row).forEach((ch, i) => {
      if (!colours[ch]) return;
      sg.fillStyle = colours[ch];
      sg.fillRect(flip ? row.length - 1 - i : i, j, 1, 1);
    }));
    SPRITES.set(key, c);
  }
  g.imageSmoothingEnabled = false;
  g.drawImage(c, Math.round(x), Math.round(y), c.width * scale, c.height * scale);
}

// === KIT: windows, meters, prompts, bubbles ==================================
// An RPG window: a dark rim, a light edge, cut corners. open: 0..1 grows the
// height in 4 steps from the top (a menu opening), the way consoles did it.
function win(g, x, y, w, h, { open = 1, fill = T.pal.shade, edge = T.pal.ink, rim = T.pal.night } = {}) {
  if (open <= 0) return false;
  const hh = Math.max(4, Math.round(h * steps(open, 4)));
  g.fillStyle = rim;
  g.fillRect(x, y + 1, w, hh - 2); g.fillRect(x + 1, y, w - 2, hh);
  g.fillStyle = edge;
  g.fillRect(x + 1, y + 2, w - 2, hh - 4); g.fillRect(x + 2, y + 1, w - 4, hh - 2);
  g.fillStyle = fill;
  g.fillRect(x + 2, y + 2, w - 4, hh - 4);
  return hh >= h;
}
// A segmented meter (HP, EXP, loading). value 0..1 is quantised to segments.
// outline: draw empty segments as hollow frames in that colour instead.
function meter(g, x, y, w, h, value, { segments = 10, gap = 1, fill = T.pal.gold, empty = T.pal.night, outline = null } = {}) {
  const sw = (w - gap * (segments - 1)) / segments, on = Math.round(clamp(value) * segments);
  for (let i = 0; i < segments; i++) {
    const sx = Math.round(x + i * (sw + gap)), ww = Math.round(sw);
    if (i >= on && outline) {
      g.fillStyle = outline;
      g.fillRect(sx, y, ww, 1); g.fillRect(sx, y + h - 1, ww, 1); g.fillRect(sx, y, 1, h); g.fillRect(sx + ww - 1, y, 1, h);
      continue;
    }
    g.fillStyle = i < on ? fill : empty;
    g.fillRect(sx, y, ww, h);
  }
}
// The advance prompt: a ▼ that blinks on the beat (on for the first half).
function prompt(g, s, x, y, col = T.pal.gold) {
  if (s.beatLen && s.beat % 1 >= 0.5) return;
  g.fillStyle = col;
  [[0, 5], [1, 3], [2, 1]].forEach(([r, w]) => g.fillRect(x - (w >> 1), y + r, w, 1));
}
// A menu cursor: a solid triangle pointing right (or 'up'), drawn cell by cell.
function cursor(g, x, y, col = T.pal.gold, dir = 'right') {
  g.fillStyle = col;
  for (let k = 0; k < 4; k++) dir === 'up' ? g.fillRect(x - k, y + k, 2 * k + 1, 1) : g.fillRect(x + k, y + k, 1, 7 - 2 * k);
}
// A dialogue box: `str` types at `cps` characters per second from local time
// `t0`, wrapped to the box; the prompt blinks once the line is complete.
// Returns the local time the line finishes typing.
// cps that finishes typing str as the narrator finishes saying it
const voiceCps = (s, str, from = s.voiceStart, to = s.voiceEnd) => Array.from(str.replace(/\s/g, '')).length / Math.max(0.5, to - from);
function dialogue(g, s, str, x, y, w, h, t0, { cps = 14, font = F(12, T.cjk), lineH = 16, open = 1 } = {}) {
  if (!win(g, x, y, w, h, { open })) return t0 + Array.from(str).length / cps;
  const lines = wrapCells(g, str, font, w - 16);
  const total = lines.reduce((n, l) => n + Array.from(l).length, 0);
  let left = Math.floor(clamp((s.t - t0) * cps, 0, total));
  lines.forEach((l, i) => {
    const n = Math.min(left, Array.from(l).length);
    left -= n;
    pixelText(g, fx.typewriter(l, n / Math.max(1, Array.from(l).length)), x + 8, y + 6 + lineH * (i + 1) - 4, { font });
  });
  const done = t0 + total / cps;
  if (s.t >= done) prompt(g, s, x + w - 10, y + h - 8);
  return done;
}
// A speech bubble with rounded cell corners and a stepped tail down to
// (tx, y + h + 4). open: 0..1 pops it in 3 steps out of the tail.
function bubble(g, x, y, w, h, tx, { open = 1, fill = T.pal.ink, edge = T.pal.night, tail = 'down' } = {}) {
  if (open <= 0) return false;
  const k = steps(open, 3), ty = y + h;
  const bw = Math.max(6, Math.round(w * k)), bh = Math.max(4, Math.round(h * k));
  const bx = Math.round(lerp(tx, x, k)), by = Math.round(lerp(ty - 4, y, k));
  g.fillStyle = edge;
  g.fillRect(bx + 1, by - 1, bw - 2, bh + 2); g.fillRect(bx - 1, by + 1, bw + 2, bh - 2); g.fillRect(bx, by, bw, bh);
  // the tail: three rows narrowing toward the speaker
  const dir = tail === 'down-left' ? -1 : 1;
  [[0, 5], [1, 4], [2, 3], [3, 2], [4, 1]].forEach(([r, ww]) => g.fillRect(tx + (dir < 0 ? -r : r) - 1, by + bh + r, ww + 2, 1));
  g.fillStyle = fill;
  g.fillRect(bx + 1, by, bw - 2, bh); g.fillRect(bx, by + 1, bw, bh - 2);
  [[0, 4], [1, 3], [2, 2], [3, 1]].forEach(([r, ww]) => g.fillRect(tx + (dir < 0 ? -r : r), by + bh - 1 + r, ww, 1));
  return k >= 1;
}
// An ellipsis drawn as square dots (fonts thin them out at 1-bit): n dots of
// sz cells, `gap` apart, left-aligned at (x, middle y). Returns the width.
function dots(g, x, y, n, { col = T.pal.night, sz = 2, gap = 2 } = {}) {
  g.fillStyle = col;
  for (let i = 0; i < n; i++) g.fillRect(x + i * (sz + gap), Math.round(y - sz / 2), sz, sz);
  return n * (sz + gap) - gap;
}

// === KIT: pixel motion =======================================================
// Quantised progress: n equal steps (like CSS steps()). Moves hop, never glide.
const steps = (p, n) => Math.floor(clamp(p) * n + 1e-6) / n;
// A jump arc in whole cells: 0 → height → 0 over `dur` from `t0`.
const jump = (t, t0, dur, height) => { const u = (t - t0) / dur; return u <= 0 || u >= 1 ? 0 : Math.round(4 * height * u * (1 - u)); };
// An impact jolt in whole cells: a few frames of alternating offset, then still.
const JOLT = [2, -2, 1, -1, 1, 0];
const jolt = (s, at, amt = 1) => { const k = Math.floor((s.t - at) * s.fps); return k >= 0 && k < JOLT.length ? JOLT[k] * amt : 0; };
// Two-frame cycles (walk, flicker) that advance on eighth notes.
const cycle = (s, n = 2, per = 0.5) => Math.floor((s.beatLen ? s.beat : s.T * 4) / per) % n;
// A value held in steps between keyframes [[t, v], …]: hops from one to the next
// over `n` steps in `dur` seconds, rounded to whole cells.
const hop = (t, keys, n = 4, dur = 0.2) => {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) v = lerp(v, keys[i][1], steps((t - keys[i][0]) / dur, n));
  return Math.round(v);
};
// Debris from an impact at local time `at`: seeded cells thrown up and out,
// falling under gravity, animated on twos (15 fps) like hand-made sprite FX.
function debris(g, s, at, x, y, { n = 16, seed = 1, cols = [T.pal.ink], speed = 60, up = 60, grav = 260, life = 1, size = 2 } = {}) {
  const dt = Math.floor((s.t - at) * 15) / 15;
  if (dt < 0 || dt > life) return;
  const r = rand(seed);
  for (let i = 0; i < n; i++) {
    const vx = (r() - 0.5) * 2 * speed, vy = -(0.3 + r() * 0.7) * up, sz = 1 + Math.floor(r() * size), c = cols[Math.floor(r() * cols.length)];
    g.fillStyle = c;
    g.fillRect(Math.round(x + vx * dt), Math.round(y + vy * dt + 0.5 * grav * dt * dt), sz, sz);
  }
}

// === KIT: tile-wipe transition ===============================================
// A staircase of square tiles closes over the old frame along the diagonal,
// then opens on the new one: the console screen change. cols: tiles across.
function tileWipe(ctx, A, B, p, o = {}) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const tile = W / (o.cols ?? 16), cols = Math.ceil(W / tile), rows = Math.ceil(H / tile);
  const maxD = cols + rows - 2, cover = p < 0.5;
  ctx.drawImage(cover ? A : B, 0, 0);
  ctx.fillStyle = o.color ?? T.pal.dusk;
  const q = cover ? p * 2 : (p - 0.5) * 2;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const d = (i + j) / maxD;
    const k = cover ? steps((q - d * 0.6) / 0.4, 4) : 1 - steps((q - d * 0.6) / 0.4, 4);
    if (k <= 0) continue;
    const sz = Math.ceil(tile * k);
    ctx.fillRect(Math.floor(i * tile + (tile - sz) / 2), Math.floor(j * tile + (tile - sz) / 2), sz, sz);
  }
}

// === EXAMPLE: the story ======================================================
// 《隐藏关卡》: a drained, grey main quest (alarm, subway, punch clock, repeat),
// a status screen where one meter is empty, words that collapse into "……",
// one step left where everyone runs right, a wall that breaks, colour flooding
// in, everything you make turning into bricks, and the empty meter filling.
const BEAT = 60 / 108;
// the player: 16×24, facing right. k outline · h hair · s skin · e eye · c hoodie ·
// r its shade · i drawstring · d trousers
const HERO_TOP = [
  '.....kkkkkk.....',
  '...kkhhhhhhkk...',
  '..khhhhhhhhhhk..',
  '.khhhhhhhhhhhhk.',
  '.khhhhhhhhhssshk',
  'khhhhhhhhsssssk.',
  'khhhhhhsssssesk.',
  'khhhhhsssssseskk',
  '.khhhhssssssssck',
  '.khhhssssscssk..',
  '..khhhssssssk...',
  '...kkkssssskk...',
  '....kkkkkkkk....',
  '...kccccicck....',
  '..kccccciccck...',
  '.kccccccccccssk.',
  '.krcccccccccck..',
  '.ksrcccccccck...',
  '..krrccccccck...',

// a brick of something made, 16×12: its colour and its little pictogram

// --- the grey city (the main quest), drawn at a camera offset ---
const TOWERS = (() => { const r = rand(31); return Array.from({ length: 14 }, (_, i) => ({ x: i * 40 + Math.floor(r() * 10), w: 26 + Math.floor(r() * 12), h: 50 + Math.floor(r() * 70) })); })();
function city(g, w, h, cam, ground, s) {
  const sky = g.createLinearGradient(0, 0, 0, ground);
  sky.addColorStop(0, T.pal.night); sky.addColorStop(1, T.pal.dusk);
  g.fillStyle = sky; g.fillRect(0, 0, w, ground);
  // far towers at 1/4 speed, near ones at 1/2, windows lit in a fixed seeded pattern
  [[4, T.pal.shade, 0.75, T.pal.dusk], [2, T.pal.night, 1, T.pal.dim]].forEach(([div, body, k, lit], layer) => {
    TOWERS.forEach((tw, i) => {
      const x = ((tw.x - Math.round(cam / div)) % 560 + 560) % 560 - 40, th = Math.round(tw.h * k) + layer * 10;
      g.fillStyle = body; g.fillRect(x, ground - th, tw.w, th);
      g.fillStyle = lit;
      for (let wy = ground - th + 6; wy < ground - 6; wy += 8) for (let wx = x + 4; wx < x + tw.w - 4; wx += 6) if ((wx * 7 + wy * 3 + i) % 5 < 2) g.fillRect(wx, wy, 2, 3);
    });
  });
  g.fillStyle = T.pal.dim; g.fillRect(0, ground, w, 2);
  g.fillStyle = T.pal.shade; g.fillRect(0, ground + 2, w, h - ground);
  g.fillStyle = T.pal.dusk;
  for (let y = ground + 6, r = 0; y < h; y += 7, r++) for (let x = -((cam + r * 9) % 18); x < w; x += 18) g.fillRect(x, y, 12, 1);
}

// --- the hidden stage: a dawn sky, a big sun, floating islands ---
const STARS = (() => { const r = rand(7); return Array.from({ length: 90 }, () => ({ x: r(), y: r() * 0.55, ph: r() })); })();
function stars(g, w, h, s, col = T.pal.ink) {
  STARS.forEach((st) => {
    if ((Math.floor(s.beat + st.ph * 4) % 4) === 0) return; // each star blinks once every 4 beats
    g.fillStyle = col;
    g.fillRect(Math.round(st.x * w), Math.round(st.y * h), 1, 1);
  });
}
function hidden(g, w, h, s, { camY = 0, ground = 176, sunR = 54, rays = 0 } = {}) {
  const far = Math.round(camY * 0.3); // the sky and the sun sit far away: they move a third as much
  const sky = g.createLinearGradient(0, far, 0, ground + far);
  sky.addColorStop(0, T.pal.night); sky.addColorStop(0.45, T.pal.dusk); sky.addColorStop(0.78, T.pal.coral); sky.addColorStop(1, T.pal.gold);
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  stars(g, w, h * 0.5, s);
  const sx = w / 2, sy = ground - 12 + far;
  if (rays) { // light rays turning one step per beat
    const turn = Math.floor(s.beat) * (Math.PI / 24);
    g.fillStyle = T.pal.sand;
    for (let i = 0; i < 16; i++) {
      const a = turn + (i * Math.PI) / 8;
      g.beginPath(); g.moveTo(sx, sy);
      g.lineTo(sx + Math.cos(a) * 500, sy + Math.sin(a) * 500); g.lineTo(sx + Math.cos(a + 0.1 * rays) * 500, sy + Math.sin(a + 0.1 * rays) * 500);
      g.fill();
    }
  }
  g.fillStyle = T.pal.sand; g.beginPath(); g.arc(sx, sy, sunR + 6, 0, 7); g.fill();
  g.fillStyle = T.pal.ink; g.beginPath(); g.arc(sx, sy, sunR, 0, 7); g.fill();
  // the sun's stripes (sky colour cut through its lower half)
  g.fillStyle = T.pal.gold;
  for (let k = 0; k < 5; k++) g.fillRect(sx - sunR - 8, sy + 8 + k * 9, 2 * sunR + 16, 2 + (k >> 1));
  // floating islands drift a cell per beat
  [[60, 70, 30], [312, 52, 24], [210, 30, 14]].forEach(([ix, iy, iw], i) => {
    const y = iy + Math.round(camY * 0.6) + ((Math.floor(s.beat / 2) + i) % 2);
    g.fillStyle = T.pal.rust; g.fillRect(ix - iw / 2 + 3, y + 4, iw - 6, 5); g.fillRect(ix - iw / 2 + 7, y + 9, iw - 14, 3);
    g.fillStyle = T.pal.mint; g.fillRect(ix - iw / 2, y, iw, 4);
    g.fillStyle = T.pal.leaf; g.fillRect(ix - iw / 2, y + 3, iw, 1);
  });
  // hills and the ground
  const gy = ground + camY;
  [[40, 60, T.pal.leaf], [150, 46, T.pal.mint], [270, 64, T.pal.leaf], [370, 40, T.pal.mint]].forEach(([hx, r, c]) => {
    g.fillStyle = T.pal.night; g.beginPath(); g.arc(hx, gy + 4, r + 1, Math.PI, 0); g.fill();
    g.fillStyle = c; g.beginPath(); g.arc(hx, gy + 4, r, Math.PI, 0); g.fill();
  });
  g.fillStyle = T.pal.mint; g.fillRect(0, gy, w, 3);
  g.fillStyle = T.pal.leaf; g.fillRect(0, gy + 3, w, 2);
  g.fillStyle = T.pal.rust; g.fillRect(0, gy + 5, w, h);
  g.fillStyle = T.pal.sand;
  for (let y = gy + 9, r = 0; y < h; y += 8, r++) for (let x = -(r * 8) % 16; x < w; x += 16) g.fillRect(x, y, 14, 1);
}
// the end of the street the player turns back to: a wall nobody looks at
function wall(g, x, top, ground, crack = 0) {
  g.fillStyle = T.pal.night; g.fillRect(x - 40, top, 40 + 30, ground - top);
  g.fillStyle = T.pal.shade;
  for (let y = top + 2, r = 0; y < ground; y += 8, r++) for (let bx = x - 40 + (r % 2) * 7; bx < x + 28; bx += 14) g.fillRect(bx, y, 12, 6);
  if (!crack) return;
  // the crack grows in steps; gold light leaks through it
  const path = [[28, 96], [22, 104], [26, 112], [18, 120], [24, 130], [16, 140], [22, 150]];
  const n = Math.ceil(path.length * crack);
  g.fillStyle = T.pal.gold;
  for (let i = 0; i < n - 1; i++) {
    const [ax, ay] = path[i], [bx, by] = path[i + 1];
    for (let k = 0; k <= 8; k++) g.fillRect(x - 30 + Math.round(lerp(ax, bx, k / 8)), Math.round(lerp(ay, by, k / 8)), 2, 2);
  }
}

  ],
  // an LCD cell grid over everything: the pixels read as a screen, not a blur
  overlay(ctx, g) {
    const { W, H } = g;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.13)';
    for (let x = T.px - 1; x < W; x += T.px) ctx.fillRect(x, 0, 1, H);
    for (let y = T.px - 1; y < H; y += T.px) ctx.fillRect(0, y, W, 1);
    ctx.restore();
  },
});
</script>
</body>
</html>
