<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tessel One — studio launch (video-gaga · Studio 3D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>

<body>
<!-- Narration timings (generated by `gaga tts` / `gaga render` from narration.json). Optional. -->
<script src="build/narration.js"></script>
<script src="../../runtime/video-gaga.js"></script>
<script type="module">
/* =============================================================================
   STUDIO 3D — a coloured seamless sweep, one hero object, light that models it.
   Depth carries meaning: the camera arrives on the reveal, orbits while the
   features are named, and the object separates into its layers on the words
   that name them. 2D type stays crisp on top. One accent. Nothing bounces.
   Rhythm: a 92 BPM keynote bed; a riser lands the name, colour swaps fall on
   the beat, a music-only breath before the end card.
   ============================================================================= */
import * as THREE from 'three';
const { ease, clamp, lerp, fx, draw, color } = CV;

// === THEME (swap for brand) ==================================================
const T = {
  sweepTop: '#C9D5E0',    // a cool slate-blue paper sweep: the warm accent pops off it
  sweepBottom: '#97A9BA',
  ink: '#111720',
  dim: '#4E5B69',
  accent: '#FF5A1F',     // the one signal colour: ring, labels, tagline
  display: '"Bricolage Grotesque", sans-serif',
};
const F = (w, px) => `${w} ${px}px ${T.display}`;
// === EXAMPLE: the product's colourways =======================================
const COLOURWAYS = [
  { name: 'Bone', base: '#E6E0D4', grille: '#D3CBBC' },
  { name: 'Graphite', base: '#3A3A3D', grille: '#2C2C2F' },
  { name: 'Sage', base: '#A1AD95', grille: '#8C9881' },
  { name: 'Clay', base: '#C98466', grille: '#B57257' },
];

// === KIT: studio stage (built once; every property is set from time) =========
const W = 1920, H = 1080;
const gl = CV.three(THREE, { width: W, height: H, shadows: true, exposure: 1.05 });

const world = new THREE.Scene();
// reflections from a real studio (octaboxes on a white cyc): assets/CREDITS.md
const STUDIO_HDR = 'assets/studio_small_09.hdr';
gl.hdri(STUDIO_HDR);
world.environmentRotation.y = -0.9; // the big softbox reads on the camera-left shoulder
const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);

const hemi = new THREE.HemisphereLight('#ffffff', '#93a3b3', 0.6);
const key = new THREE.DirectionalLight('#fff6ea', 2.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
const rim = new THREE.DirectionalLight('#ffffff', 1.6);
world.add(hemi, key, key.target, rim);

// floor: invisible except for the shadow it catches (a seamless sweep)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
world.add(floor);

// sound ripples on the floor ("room-filling")
const ripples = [0, 1, 2].map(() => {
  const m = new THREE.Mesh(new THREE.RingGeometry(1, 1.02, 160), new THREE.MeshBasicMaterial({ color: T.accent, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.y = 0.003;
  world.add(m);
  return m;
});

const lathe = (pts, seg = 128) => new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg);
const hero = new THREE.Group();
world.add(hero);
const shadowed = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };

// === EXAMPLE: the speaker ====================================================
// base shell: the lower half of a pebble
const basePts = [];
for (let i = 0; i <= 24; i++) { const a = (i / 24) * (Math.PI / 2); basePts.push([0.001 + 1.05 * Math.sin(a), 0.5 - 0.5 * Math.cos(a) ** 0.9]); }
// speckled stoneware under a satin glaze: the albedo was generated, its normal,
// roughness and ao derived by `gaga texture --neutral` (grey, so the colourway tints it)
const baseMat = new THREE.MeshPhysicalMaterial({ ...gl.pbr('assets/stoneware', { repeat: [8, 2], normalScale: 0.6 }), aoMapIntensity: 0.5, roughness: 0.9, clearcoat: 0.55, clearcoatRoughness: 0.22, side: THREE.DoubleSide });
const base = shadowed(new THREE.Mesh(lathe(basePts), baseMat));
const baseG = new THREE.Group();
baseG.add(base);

// battery pack (inside the base)
const battMat = new THREE.MeshStandardMaterial({ color: '#2B2B2E', roughness: 0.5, metalness: 0.2 });
const batt = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.78, 0.78, 0.2, 96), battMat));
const battBand = new THREE.Mesh(new THREE.CylinderGeometry(0.785, 0.785, 0.05, 96, 1, true), new THREE.MeshStandardMaterial({ color: T.accent, roughness: 0.4 }));
const battG = new THREE.Group();
battG.add(batt, battBand);
batt.position.y = 0.2;
battBand.position.y = 0.2;

// driver: cone + surround + dust cap
const coneMat = new THREE.MeshStandardMaterial({ color: '#232325', roughness: 0.65, metalness: 0.1, side: THREE.DoubleSide });
const cone = shadowed(new THREE.Mesh(lathe([[0.12, 0.0], [0.4, 0.06], [0.7, 0.13], [0.8, 0.15]], 96), coneMat));
const surround = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.82, 0.045, 18, 120), new THREE.MeshStandardMaterial({ color: '#3A3A3D', roughness: 0.8 })));
surround.rotation.x = Math.PI / 2;
surround.position.y = 0.15;
const cap = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.16, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#4A4A4E', roughness: 0.3, metalness: 0.6 })));
cap.scale.y = 0.45;
cap.position.y = 0.02;
const frame = shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.88, 0.02, 12, 120), new THREE.MeshStandardMaterial({ color: '#9A9AA0', roughness: 0.3, metalness: 0.9 })));
frame.rotation.x = Math.PI / 2;
frame.position.y = 0.15;
const driverG = new THREE.Group();
driverG.add(cone, surround, cap, frame);

// grille: a woven dome, plus the accent ring that seals it
const domePts = [];
for (let i = 0; i <= 28; i++) { const a = (i / 28) * (Math.PI / 2); domePts.push([0.001 + 1.05 * Math.cos(a), 0.4 * Math.sin(a)]); }
// a scanned melange knit (Poly Haven, CC0), albedo neutralised for the colourways
const grilleMat = new THREE.MeshPhysicalMaterial({ ...gl.pbr('assets/jersey_melange', { repeat: [11, 2] }), sheen: 0.5, sheenRoughness: 0.6, side: THREE.DoubleSide });
const grille = shadowed(new THREE.Mesh(lathe(domePts), grilleMat));
const ring = shadowed(new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.028, 18, 160), new THREE.MeshStandardMaterial({ color: T.accent, roughness: 0.35, metalness: 0.3 })));
ring.rotation.x = Math.PI / 2;
const grilleG = new THREE.Group();
grilleG.add(grille, ring);
hero.add(baseG, battG, driverG, grilleG);

// assembled heights of each layer, and how far each one lifts when exploded
const LAYERS = {
  grille: { g: grilleG, y: 0.5, lift: 2.05, mid: 0.2 },
  driver: { g: driverG, y: 0.34, lift: 1.25, mid: 0.08 },
  battery: { g: battG, y: 0.0, lift: 0.6, mid: 0.2 },
  base: { g: baseG, y: 0.0, lift: 0, mid: 0.25 },
};

const ca = new THREE.Color(), cb = new THREE.Color();
const right = new THREE.Vector3();

// === KIT: posing the stage ===================================================
// st = {cam:{r, az, el, ty, look, fov}, yaw, keyOn, keyAz, ripple (seconds since start or <0)}
function poseStage(st) {
  const c = st.cam;
  cam.fov = c.fov ?? 28;
  cam.position.set(c.r * Math.cos(c.el) * Math.sin(c.az), c.ty + c.r * Math.sin(c.el), c.r * Math.cos(c.el) * Math.cos(c.az));
  cam.lookAt(0, c.look ?? c.ty, 0);
  cam.updateProjectionMatrix();
  cam.updateMatrixWorld(true);
  // light: the key swings round the object (light is the storyteller)
  const kaz = st.keyAz ?? -0.7;
  key.position.set(6 * Math.sin(kaz), 7, 6 * Math.cos(kaz));
  key.intensity = 2.4 * (st.keyOn ?? 1);
  rim.position.set(-3, 3, -6);
  rim.intensity = 1.6 * (st.keyOn ?? 1);
  hemi.intensity = 0.25 + 0.35 * (st.keyOn ?? 1);
  world.environment = gl.hdri(STUDIO_HDR);
  world.environmentIntensity = 0.15 + 0.55 * (st.keyOn ?? 1);
  hero.rotation.set(0, st.yaw ?? 0, 0);
  // ripples
  ripples.forEach((m, i) => {
    const k = st.ripple == null || st.ripple < 0 ? -1 : (st.ripple - i * 0.45) / 1.8;
    m.visible = k > 0 && k < 1;
    if (!m.visible) return;
    const s = 1.15 + ease.outCubic(k) * 1.6;
    m.scale.set(s, s, s);
    m.material.opacity = 0.55 * (1 - k) * clamp(k * 6);
  });
  hero.updateMatrixWorld(true);
}

// === EXAMPLE: posing the speaker =============================================
// The single place the world is posed. st = poseStage's, plus ex:{grille, driver, battery} 0..1
// and col (colourway index, fractional = blend)
function pose(st) {
  poseStage(st);
  const ex = st.ex || {};
  for (const [k, L] of Object.entries(LAYERS)) L.g.position.y = L.y + L.lift * (ex[k] ?? 0);
  // colourway (fractional index blends between neighbours)
  const ci = clamp(st.col ?? 0, 0, COLOURWAYS.length - 1), i0 = Math.floor(ci), i1 = Math.min(COLOURWAYS.length - 1, i0 + 1), f = ci - i0;
  baseMat.color.copy(ca.set(COLOURWAYS[i0].base)).lerp(cb.set(COLOURWAYS[i1].base), f);
  grilleMat.color.copy(ca.set(COLOURWAYS[i0].grille)).lerp(cb.set(COLOURWAYS[i1].grille), f);
  grilleMat.sheenColor.copy(grilleMat.color).multiplyScalar(1.4);
  hero.updateMatrixWorld(true);
}

// === KIT: projection =========================================================
// screen position (design px) of a world point
const v3 = new THREE.Vector3();
function project(x, y, z) {
  v3.set(x, y, z).project(cam);
  return [(v3.x + 1) / 2 * W, (1 - v3.y) / 2 * H];
}
// === EXAMPLE: callout anchors ================================================
// the point on a layer's rim that faces screen-right (where a callout attaches)
function rimPoint(layer, dy, r) {
  right.setFromMatrixColumn(cam.matrixWorld, 0).setY(0).normalize();
  const y = LAYERS[layer].g.position.y + dy;
  return project(right.x * r, y, right.z * r);
}

// === KIT: backdrop and callouts ==============================================
// 2D backdrop: the sweep with a soft pool of light behind the object
function sweep(ctx, cx, cy, glow = 1) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, T.sweepTop);
  g.addColorStop(1, T.sweepBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const r = ctx.createRadialGradient(cx, cy, 0, cx, cy, H * 0.75);
  r.addColorStop(0, color.rgba('#ffffff', 0.7 * glow));
  r.addColorStop(1, color.rgba('#ffffff', 0));
  ctx.fillStyle = r;
  ctx.fillRect(0, 0, W, H);
}

// A callout: dot on the part, an elbow leader, a mono label (draws on at p).
function callout(ctx, [ax, ay], lx, label, value, p, out = 0) {
  if (p <= 0) return;
  const a = (1 - out);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = color.rgba(T.ink, 0.55);
  ctx.lineWidth = 2;
  const ex = ax + 40;
  draw.drawOn(ctx, [[ax, ay], [ex, ay - 40], [lx - 16, ay - 40]], ease.inOutCubic(clamp(p / 0.7)));
  ctx.fillStyle = T.accent;
  ctx.beginPath();
  ctx.arc(ax, ay, 7 * ease.outCubic(clamp(p / 0.25)), 0, Math.PI * 2);
  ctx.fill();
  const q = ease.enter(clamp((p - 0.45) / 0.5));
  ctx.globalAlpha = a * q;
  ctx.textAlign = 'left';
  ctx.font = F(500, 28);
  ctx.fillStyle = T.dim;
  ctx.fillText(label, lx, ay - 70 + (1 - q) * 10);
  ctx.font = F(700, 46);
  ctx.fillStyle = T.ink;
  ctx.fillText(value, lx, ay - 22 + (1 - q) * 10);
  ctx.restore();
}

// === EXAMPLE: camera home ====================================================
// shared camera "home" (assembled object, 3/4 view)
const HOME = { r: 6.4, az: -0.3, el: 0.32, ty: 0.45, look: 0.42 };

// === VIDEO ===================================================================
CV.create({
  width: W, height: H, fps: 30,
  background: T.sweepBottom,
  lang: 'en-US',
  fonts: [F(800, 120), F(700, 46), F(500, 28)],
  // the score designed for this video: dark stage, pulse and light: a minor-key pad, a ticking synth bass, the kick only when it lifts
  music: {
    bpm: 92, seed: 7, key: 'A', mode: 'minor', progression: [0, 5, 2, 6],
    layers: [
      { name: 'pad', inst: 'pad', notes: 'chord', pattern: 'X---', vel: 0.1, cutoff: [700, 1600], attack: 0.9 },
      { name: 'pulse', inst: 'bass', synth: true, octave: -1, pattern: 'XxXxXxXx', gate: 0.84, vel: 0.22, cutoff: [160, 320], envDecay: 0.08, from: 0.3 },
      { name: 'kick', inst: 'kick', pattern: 'X... .... ..x. ....', vel: 0.55, from: 0.55 },
      { name: 'keys', inst: 'keys', notes: [0, 1, 2], octave: 1, pattern: '....XXX.', gate: 3, vel: 0.06, bright: 0.5, echo: 0.25, from: 0.62 },
      { name: 'drive', inst: 'kick', pattern: '..X.', vel: 0.45, from: 0.72 },
      { name: 'hats', inst: 'hat', pattern: 'xxXx xxXx xxXx xxXx', vel: 0.08, from: 0.72 },
    ],
    lead: { inst: 'keys', range: [69, 84], rhythm: 'sparse', vel: 0.11, bright: 0.6, echo: 0.3 },
  },
  subtitles: {
    style: { font: `500 38px ${T.display}`, color: T.ink, box: 'rgba(233,239,245,0.88)', y: 0.93, radius: 10 },
  },
  scenes: [
    // --- 1. Reveal: one bar of music, the light comes up, the camera arrives ---
    {
      id: 'reveal', voiceDelay: 1.7, energy: 0.3, tail: 0.4,
      sfx: [
        { at: (s) => s.when('Tessel', 2.9), type: 'riser', dur: 2.0 },
        { at: (s) => s.when('Tessel', 2.9), type: 'hit', gain: 0.8 },
      ],
      draw(ctx, s) {
        const { t } = s;
        const tn = s.when('Tessel', 2.9);
        const arrive = ease.enter(clamp(t / (tn + 0.6)));
        const light = ease.inOutSine(clamp((t - 0.2) / 1.8));
        sweep(ctx, W / 2, H * 0.42, light);
        pose({
          cam: { ...HOME, r: lerp(12, HOME.r + 0.4, arrive), az: lerp(-0.75, HOME.az - 0.06, arrive), el: lerp(0.18, HOME.el, arrive) },
          yaw: lerp(-0.6, 0, arrive), keyOn: 0.15 + 0.85 * light, keyAz: lerp(-1.6, -0.7, light),
        });
        gl.render(ctx, world, cam);
        // the name lands on the hit
        ctx.textAlign = 'center';
        ctx.fillStyle = T.ink;
        ctx.font = F(800, 132);
        ctx.letterSpacing = '-3px';
        fx.charReveal(ctx, 'Tessel One', W / 2, H * 0.83, t - tn + 0.05, { stagger: 0.04, dur: 0.55, blur: 10, rise: 0.25, align: 'center', exit: s.out(0.35, ease.exit, 0.1) });
        ctx.letterSpacing = '0px';
        ctx.font = F(500, 28);
        ctx.fillStyle = T.dim;
        ctx.globalAlpha = s.at(0.4, 0.8) * (1 - s.at(tn - 0.4, 0.3));
        ctx.fillText('Tessel Audio', W / 2, H * 0.83);
        ctx.globalAlpha = 1;
      },
    },
    // --- 2. Orbit: the camera circles while the features are named ------------
    {
      id: 'orbit', energy: 0.55, tail: 0.5,
      transition: { type: 'cut' },
      draw(ctx, s) {
        const { t, dur } = s;
        const p = ease.inOutSine(clamp(t / dur));
        const tr = s.when('Room', 0.4), th = s.when('hand', 2.4);
        sweep(ctx, W * 0.42, H * 0.42);
        pose({ cam: { ...HOME, r: lerp(HOME.r + 0.4, HOME.r - 0.3, p), az: lerp(HOME.az - 0.06, HOME.az + 0.55, p), el: lerp(HOME.el, 0.42, p) }, yaw: 0, ripple: t - tr });
        gl.render(ctx, world, cam);
        // feature label on "room-filling"
        const q1 = ease.enter(clamp((t - tr) / 0.5)), o = s.out(0.35, ease.exit, 0.1);
        ctx.textAlign = 'left';
        ctx.globalAlpha = q1 * (1 - o);
        ctx.font = F(500, 28);
        ctx.fillStyle = T.accent;
        ctx.fillText('360° sound', 160, 700 + (1 - q1) * 14);
        ctx.font = F(700, 64);
        ctx.fillStyle = T.ink;
        ctx.fillText('Fills the room.', 160, 772 + (1 - q1) * 14);
        // dimension line across the object on "one hand"
        right.setFromMatrixColumn(cam.matrixWorld, 0).setY(0).normalize();
        const a = project(-right.x * 1.08, 0.5, -right.z * 1.08), b = project(right.x * 1.08, 0.5, right.z * 1.08);
        const y = Math.min(a[1], b[1]) - 150;
        const q2 = ease.inOutCubic(clamp((t - th + 0.4) / 0.6));
        ctx.globalAlpha = 1 - o;
        ctx.strokeStyle = color.rgba(T.ink, 0.6);
        ctx.lineWidth = 2;
        const mid = (a[0] + b[0]) / 2;
        draw.drawOn(ctx, [[mid, y], [a[0], y]], q2);
        draw.drawOn(ctx, [[mid, y], [b[0], y]], q2);
        const tick = clamp((q2 - 0.8) / 0.2) * 14;
        ctx.fillStyle = color.rgba(T.ink, 0.6);
        if (tick > 0) { ctx.fillRect(a[0] - 1, y - tick, 2, tick * 2); ctx.fillRect(b[0] - 1, y - tick, 2, tick * 2); }
        ctx.globalAlpha = clamp((q2 - 0.6) / 0.4) * (1 - o);
        ctx.textAlign = 'center';
        ctx.font = F(700, 44);
        ctx.fillStyle = T.ink;
        ctx.fillText('68 mm', mid, y - 22);
        ctx.globalAlpha = 1;
      },
    },
    // --- 3. Exploded view: each layer lifts on the word that names it ----------
    {
      id: 'explode', energy: 0.65, tail: 0.5,
      transition: { type: 'zoomBlur', duration: 0.6, ease: ease.inOutCubic, strength: 0.8 },
      sfx: ['grille', 'driver', 'battery'].map((w) => ({ at: w, type: 'tick', gain: 0.7 })),
      draw(ctx, s) {
        const { t } = s;
        const words = { grille: s.when('grille', 0.8), driver: s.when('driver', 2.0), battery: s.when('battery', 3.4) };
        const lift = (k) => ease.standard(clamp((t - words[k] + 0.25) / 0.8));
        const ex = { grille: lift('grille'), driver: lift('driver'), battery: lift('battery') };
        const spread = Math.max(ex.grille, ex.driver * 0.9);
        sweep(ctx, W * 0.4, H * 0.45);
        const o = s.out(0.4, ease.exit, 0.15);
        pose({ cam: { r: lerp(7.2, 10.6, ease.standard(spread)), az: lerp(-0.5, -0.62, s.p), el: 0.26, ty: lerp(0.45, 1.3, ease.standard(spread)), look: lerp(0.45, 1.45, ease.standard(spread)) }, ex, yaw: 0.2 });
        // shift the stack a little left so the labels have a column
        ctx.save();
        ctx.translate(-W * 0.1 * ease.standard(spread), 0);
        gl.render(ctx, world, cam);
        const lx = W * 0.64;
        callout(ctx, rimPoint('grille', 0.22, 0.98), lx, 'Woven grille', 'Acoustic knit', clamp((t - words.grille - 0.3) / 1.0), o);
        callout(ctx, rimPoint('driver', 0.12, 0.84), lx, 'Full-range driver', '20 mm', clamp((t - words.driver - 0.3) / 1.0), o);
        callout(ctx, rimPoint('battery', 0.22, 0.79), lx, 'Battery', '7 days', clamp((t - words.battery - 0.3) / 1.0), o);
        ctx.restore();
      },
    },
    // --- 4. Colour-ways: it closes up, then swaps colour on the beat -----------
    {
      id: 'colour', energy: 0.72, minDuration: 3.9,
      transition: { type: 'flash', duration: 0.7, ease: ease.inOutSine },
      sfx: [1, 2, 3].map((i) => ({ at: (s) => s.onBeat(1 + i), type: 'click', gain: 0.8 })),
      draw(ctx, s) {
        const { t } = s;
        const close = 1 - ease.standard(clamp((t - 0.1) / 0.9));
        // colour index steps on beats 2, 3, 4 of the scene (each blend 0.25 s)
        let col = 0;
        for (let i = 1; i <= 3; i++) col += ease.inOutSine(clamp((t - s.onBeat(1 + i)) / 0.25));
        sweep(ctx, W / 2, H * 0.42);
        pose({ cam: { ...HOME, r: 6.0, az: lerp(0.25, -0.15, ease.inOutSine(s.p)), el: 0.28 }, ex: { grille: close, driver: close, battery: close }, yaw: lerp(0.2, -0.4, s.p), col });
        gl.render(ctx, world, cam);
        // swatches row: the active one is ringed
        const n = COLOURWAYS.length, gap = 120, x0 = W / 2 - ((n - 1) * gap) / 2, y = H * 0.8;
        const q = ease.enter(clamp((t - s.onBeat(1)) / 0.5)), o = s.out(0.35, ease.exit, 0.1);
        COLOURWAYS.forEach((c, i) => {
          const qi = ease.enter(clamp((t - s.onBeat(1) - i * 0.07) / 0.45));
          const x = x0 + i * gap;
          const act = clamp(1 - Math.abs(col - i));
          ctx.globalAlpha = qi * (1 - o);
          ctx.fillStyle = c.base;
          ctx.beginPath();
          ctx.arc(x, y + (1 - qi) * 20, 26, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = color.rgba(T.ink, 0.15);
          ctx.lineWidth = 1.5;
          ctx.stroke();
          if (act > 0) {
            ctx.strokeStyle = T.accent;
            ctx.lineWidth = 3;
            draw.arc(ctx, x, y, 38, -Math.PI / 2, Math.PI * 1.5, act);
          }
        });
        ctx.globalAlpha = q * (1 - o);
        ctx.textAlign = 'center';
        ctx.font = F(500, 28);
        ctx.fillStyle = T.dim;
        ctx.fillText(COLOURWAYS[Math.round(clamp(col, 0, n - 1))].name, W / 2, y + 86);
        ctx.globalAlpha = 1;
      },
    },
    // --- 5. Breath: no voice; the light glides across the finish ---------------
    {
      id: 'breath', narration: false, beats: 4, energy: 0.8,
      transition: { type: 'cut' },
      draw(ctx, s) {
        const p = s.p;
        sweep(ctx, W / 2, H * 0.45);
        pose({ cam: { r: lerp(5.2, 4.7, ease.inOutSine(p)), az: lerp(-0.15, -0.35, ease.inOutSine(p)), el: 0.16, ty: 0.4, look: 0.3 }, yaw: lerp(-0.4, -0.55, p), col: 3, keyAz: lerp(-1.4, 0.6, ease.inOutSine(p)) });
        gl.render(ctx, world, cam);
      },
    },
    // --- 6. End card -------------------------------------------------------------
    {
      id: 'end', tail: 1.8, energy: 0.5,
      transition: { type: 'flash', duration: 0.7, ease: ease.inOutSine },
      draw(ctx, s) {
        const { t } = s;
        const settle = ease.enter(clamp(t / 1.4));
        sweep(ctx, W / 2, H * 0.36);
        pose({ cam: { r: lerp(7.6, 8.4, settle), az: lerp(-0.2, -0.3, settle), el: 0.3, ty: 0.2, look: -0.35 }, yaw: lerp(-0.2, 0, settle), col: 0 });
        gl.render(ctx, world, cam);
        ctx.textAlign = 'center';
        ctx.fillStyle = T.ink;
        ctx.font = F(800, 120);
        ctx.letterSpacing = '-3px';
        fx.lineReveal(ctx, ['Tessel One'], W / 2, H * 0.74, t - s.when('Tessel', 0.3) + 0.1, { dur: 0.7 });
        ctx.letterSpacing = '0px';
        ctx.font = F(500, 50);
        ctx.fillStyle = T.accent;
        fx.wordReveal(ctx, 'Small stone. Big room.', W / 2, H * 0.74 + 82, t, { sync: s, dur: 0.45, rise: 0.3, align: 'center' });
        const so = ease.enter(clamp((t - s.nextBeat(s.voiceEnd)) / 0.6));
        ctx.font = F(500, 28);
        ctx.fillStyle = T.dim;
        ctx.globalAlpha = so;
        ctx.fillText('Available this spring', W / 2, H * 0.74 + 150);
        ctx.globalAlpha = 1;
      },
    },
  ],
  // finishing layer: a touch of grain keeps the sweep from banding
  overlay(ctx, g) {
    draw.grain(ctx, g.frame, 0.03, { blend: 'soft-light' });
  },
});
</script>
