<script>
/* =============================================================================
   INK WASH — a Chinese ink painting (水墨) that paints itself on rice paper.
   Ink is the only colour, in tones from 淡墨 (pale wash) to 焦墨 (dense
   black); cinnabar (朱砂) is the one accent, kept for the single thing that
   matters most. Things arrive the way ink does: a drop soaks into the paper
   and keeps creeping along the fibres, a brush stroke presses in, runs and
   lifts with dry-brush streaks (飞白), a wash soaks in pale first and darkens.
   Things leave the way ink does too: they soften and dissolve into mist.
   Type is calligraphy set in vertical columns, read right to left. Empty
   paper is part of the composition, never filler to be used up.
   Strokes are quick and land on the beat; everything else (washes, mist, the
   camera over the painting) moves slowly and settles without overshoot
   (outCubic / inOutSine). The transition is a handscroll unrolling, its seam
   hidden in a band of mist; inside one painting the camera simply travels.
   ============================================================================= */
const { ease, clamp, lerp, draw, color, rand, noise, noise2 } = CV;

// === THEME ===================================================================
const T = {
  paper: '#EEE7D7',      // 宣纸 rice paper
  mist: '#F4EFE4',       // mist and clouds: a little lighter than the paper
  ink: '#141419',        // 墨, a cool black: every grey is this colour at a lower tone
  dim: '#857D6E',        // small labels, footnotes
  seal: '#B5342A',       // 朱砂 cinnabar: the one accent
  brush: '"Ma Shan Zheng", "Noto Serif SC", serif',   // 楷书 display
  serif: '"Noto Serif SC", serif',                    // labels and captions
};
const F = (w, px, fam) => `${w} ${px}px ${fam}`;
// tone 0..1: 0 = clean paper, 0.15 淡墨 pale wash, 0.5 中墨, 0.9 浓墨 dense
const inkAt = (tone) => color.rgba(T.ink, clamp(tone));

// === KIT: rice paper =========================================================
// 宣纸: warm paper with long fibres, faint cloudy sizing and a darker edge.
// Rendered once per size and reused every frame (a pure cache).
const paperTex = {};
function xuan(ctx, W, H) {
  const key = `${W}x${H}`;
  if (!paperTex[key]) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = T.paper;
    g.fillRect(0, 0, W, H);
    const r = rand(17);
    // cloudy sizing: large, very faint blotches
    for (let i = 0; i < 26; i++) {
      const x = r() * W, y = r() * H, rr = 120 + r() * 380;
      const gr = g.createRadialGradient(x, y, 0, x, y, rr);
      gr.addColorStop(0, `rgba(150,128,90,${0.025 + r() * 0.03})`);
      gr.addColorStop(1, 'rgba(150,128,90,0)');
      g.fillStyle = gr;
      g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }
    // long, curling fibres
    for (let i = 0; i < 900; i++) {
      g.strokeStyle = `rgba(120,100,70,${0.025 + r() * 0.045})`;
      g.lineWidth = 0.5 + r() * 0.8;
      let x = r() * W, y = r() * H, a = r() * Math.PI * 2;
      const n = 4 + Math.floor(r() * 6);
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < n; k++) { a += (r() - 0.5) * 0.9; x += Math.cos(a) * 7; y += Math.sin(a) * 7; g.lineTo(x, y); }
      g.stroke();
    }
    // specks
    for (let i = 0; i < 500; i++) {
      g.fillStyle = `rgba(90,75,50,${0.05 + r() * 0.1})`;
      g.fillRect(r() * W, r() * H, 1 + r() * 1.5, 1 + r() * 1.5);
    }
    const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(100,75,35,0.16)');
    g.fillStyle = v;
    g.fillRect(0, 0, W, H);
    paperTex[key] = c;
  }
  ctx.drawImage(paperTex[key], 0, 0, W, H);
}

// === KIT: brush, bloom, seep, wash ===========================================
// A brush stroke along a polyline, drawn on to fraction p of its length. The
// width follows the hand: it presses in, runs, and lifts to a point. `dry`
// (0..1) splits it into bristles that skip over the paper toward the end of
// the stroke: 飞白, dry brush. tone 0..1 as inkAt(); `color` swaps the ink
// for cinnabar (or anything else) at the same tone.
function brush(ctx, pts, p, o = {}) {
  const { width = 24, tone = 0.9, seed = 1, dry = 0.3, press = 0.12, lift = 0.35, bristles = 13, color: col = T.ink } = o;
  if (p <= 0 || pts.length < 2) return;
  const tint = (a) => color.rgba(col, clamp(a));
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = L[L.length - 1] || 1, upto = total * clamp(p);
  // resample every ~4 px up to the brush tip
  const S = [];
  for (let l = 0, i = 1; l <= upto; l += 4) {
    while (i < L.length - 1 && L[i] < l) i++;
    const k = (l - L[i - 1]) / (L[i] - L[i - 1] || 1);
    S.push([lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k), l]);
  }
  if (S.length < 2) return;
  const wAt = (l) => {
    const k = l / total;
    return width * (0.6 + 0.4 * ease.outQuad(clamp(k / press))) * (0.1 + 0.9 * Math.sqrt(clamp((1 - k) / lift))) * (1 + 0.16 * noise(l * 0.015, seed));
  };
  const nrm = S.map((q, i) => {
    const a = S[Math.max(0, i - 1)], b = S[Math.min(S.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
    return [-dy / d, dx / d];
  });
  ctx.save();
  // the wet core: a solid ribbon, narrower the drier the brush
  const core = 1 - dry * 0.7;
  ctx.fillStyle = tint(tone);
  ctx.beginPath();
  S.forEach((q, i) => { const w = wAt(q[2]) * core / 2; (i ? ctx.lineTo : ctx.moveTo).call(ctx, q[0] + nrm[i][0] * w, q[1] + nrm[i][1] * w); });
  for (let i = S.length - 1; i >= 0; i--) { const w = wAt(S[i][2]) * core / 2; ctx.lineTo(S[i][0] - nrm[i][0] * w, S[i][1] - nrm[i][1] * w); }
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(S[0][0], S[0][1], wAt(0) * core / 2, 0, Math.PI * 2);
  ctx.fill();
  // bristles: thin lines across the width that break up where the brush runs dry
  if (dry > 0) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = tint(tone * 0.9);
    const rb = rand(seed * 7 + 1);
    for (let j = 0; j < bristles; j++) {
      const off = (j / (bristles - 1) - 0.5) + (rb() - 0.5) * 0.04;
      ctx.lineWidth = Math.max(1, (width / bristles) * (0.8 + rb() * 1.4));
      ctx.beginPath();
      let pen = false;
      S.forEach((q, i) => {
        const k = q[2] / total;
        const skip = (0.7 * noise(q[2] * 0.009 + j * 13.7, seed + j) + 0.3 * noise(q[2] * 0.05 + j * 5.1, seed + j + 40)) * 0.5 + 0.5 < dry * (0.25 + 0.95 * k) * (0.55 + Math.abs(off));
        const w = wAt(q[2]);
        const x = q[0] + nrm[i][0] * off * w, y = q[1] + nrm[i][1] * off * w;
        if (skip) pen = false;
        else if (!pen) { ctx.moveTo(x, y); pen = true; }
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }
  }
  ctx.restore();
}

// A smooth path through control points (Catmull-Rom), as dense points for brush().
function curve(ctrl, n = 16) {
  const out = [];
  for (let i = 0; i < ctrl.length - 1; i++) {
    const p0 = ctrl[Math.max(0, i - 1)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(ctrl.length - 1, i + 2)];
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map((d) => 0.5 * (2 * p1[d] + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3)));
    }
  }
  out.push(ctrl[ctrl.length - 1]);
  return out;
}

// An ink drop blooming into the paper: a noisy-edged blot that grows fast and
// settles, paler inside, with the darker wet edge (水渍) where pigment gathers.
function bloom(ctx, x, y, r, p, o = {}) {
  const { tone = 0.8, seed = 1, rim = 0.4, rough = 0.2, halo = 0.12 } = o;
  if (p <= 0) return;
  const R = r * (0.12 + 0.88 * ease.outCubic(clamp(p)));
  const shape = (rr) => {
    ctx.beginPath();
    for (let i = 0; i <= 120; i++) {
      const a = (i / 120) * Math.PI * 2, cx = Math.cos(a), cy = Math.sin(a);
      const n = 0.65 * noise2(cx * 1.6 + 5, cy * 1.6 + 5, seed) + 0.35 * noise2(cx * 5 + 9, cy * 5 + 9, seed + 1);
      const k = rr * (1 + rough * n);
      (i ? ctx.lineTo : ctx.moveTo).call(ctx, x + cx * k, y + cy * k);
    }
    ctx.closePath();
  };
  const a = clamp(p * 4);
  ctx.save();
  // the halo where water ran ahead of the pigment
  ctx.fillStyle = inkAt(tone * halo * a);
  shape(R * 1.16);
  ctx.fill();
  const g = ctx.createRadialGradient(x, y, 0, x, y, R * (1 + rough));
  g.addColorStop(0, inkAt(tone * 0.7 * a));
  g.addColorStop(0.62, inkAt(tone * 0.62 * a));
  g.addColorStop(0.84, inkAt(tone * (0.62 + rim * 0.4) * a));
  g.addColorStop(1, inkAt(tone * 0.25 * a));
  ctx.fillStyle = g;
  shape(R);
  ctx.fill();
  ctx.restore();
}

// 洇: ink soaking into rice paper and still travelling. A pale water front runs
// ahead of the pigment with a feathered edge, the body is mottled (pools of
// denser ink, 焦墨, where the drop landed), a darker wet edge sits just inside
// the rim, pale backruns open inside, and hair-fine capillary threads creep
// out along the fibres. The edge grows more ragged the further it spreads.
// p 0..1 = how far it has spread (drive it with a slowing ease); sx/sy
// stretch it.
function seep(ctx, x, y, r, p, o = {}) {
  const { tone = 0.9, seed = 1, rough = 0.34, threads = 90, grain = 60, sx = 1, sy = 1, soft = 1 } = o;
  if (p <= 0) return;
  const e = clamp(p);
  const R = r * (0.05 + 0.95 * e);
  const rg = rough * (0.4 + 0.6 * e);
  const m = ctx.getTransform(), sc = Math.hypot(m.a, m.b) || 1;
  const blur = (k) => { ctx.filter = k * soft * sc > 0.4 ? `blur(${(k * soft * sc).toFixed(1)}px)` : 'none'; };
  const edge = (a, k, extra = 0, sd = seed) => {
    const cx = Math.cos(a), cy = Math.sin(a);
    const n = 0.55 * noise2(cx * 1.3 + 3, cy * 1.3 + 3, sd) + 0.3 * noise2(cx * 3.2 + 7, cy * 3.2 + 7, sd + 1) + 0.15 * noise2(cx * 9 + 11, cy * 9 + 11, sd + 2);
    return R * k * (1 + (rg + extra) * n);
  };
  const ring = (k, extra = 0, dx = 0, dy = 0, rev = false, sd = seed) => {
    const n = 168;
    for (let i = 0; i <= n; i++) {
      const a = ((rev ? n - i : i) / n) * Math.PI * 2, d = edge(a, k, extra, sd);
      (i ? ctx.lineTo : ctx.moveTo).call(ctx, x + dx + Math.cos(a) * d * sx, y + dy + Math.sin(a) * d * sy);
    }
    ctx.closePath();
  };
  const fill = (style, k, extra, dx, dy, sd) => { ctx.fillStyle = style; ctx.beginPath(); ring(k, extra, dx, dy, false, sd); ctx.fill(); };
  ctx.save();
  // the water front, feathered
  blur(R * 0.07);
  fill(inkAt(tone * 0.09), 1.3, 0.16);
  // capillary threads, wicking past the rim along the fibres
  blur(0);
  const r1 = rand(seed * 31 + 5);
  ctx.lineCap = 'round';
  for (let j = 0; j < threads; j++) {
    let a = r1() * Math.PI * 2;
    const len = R * (0.04 + 0.2 * r1() * r1()) * e, w = (0.35 + r1() * 0.55) / Math.sqrt(sc), tn = tone * (0.1 + 0.16 * r1());
    let d = edge(a, 0.98), px = x + Math.cos(a) * d * sx, py = y + Math.sin(a) * d * sy;
    ctx.strokeStyle = inkAt(tn);
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(px, py);
    for (let k = 0; k < 7; k++) {
      a += (r1() - 0.5) * 0.9;
      px += Math.cos(a) * len / 7; py += Math.sin(a) * len / 7;
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  // the body, its edge softened a little
  blur(R * 0.018);
  fill(inkAt(tone * 0.5), 1);
  // mottled pools of denser ink
  blur(R * 0.06);
  fill(inkAt(tone * 0.22), 0.78, 0.3, R * 0.05, R * 0.04, seed + 20);
  fill(inkAt(tone * 0.2), 0.55, 0.35, -R * 0.12, -R * 0.08, seed + 30);
  fill(inkAt(tone * 0.25), 0.32, 0.3, -R * 0.06, -R * 0.02, seed + 40);
  // the wet edge: a darker band just inside the rim
  blur(R * 0.012);
  ctx.fillStyle = inkAt(tone * 0.2);
  ctx.beginPath(); ring(1); ring(0.93, 0.02, 0, 0, true); ctx.fill();
  // pale backruns (水花) and granulated pigment
  blur(0);
  const r2 = rand(seed * 17 + 3);
  for (let i = 0; i < grain; i++) {
    const a = r2() * Math.PI * 2, d = Math.sqrt(r2()) * edge(a, 0.85);
    const gx = x + Math.cos(a) * d * sx, gy = y + Math.sin(a) * d * sy;
    if (i % 6 === 0) {
      const br = R * (0.05 + r2() * 0.1);
      const bg = ctx.createRadialGradient(gx, gy, 0, gx, gy, br);
      bg.addColorStop(0, color.rgba(T.paper, 0.12 * e));
      bg.addColorStop(1, color.rgba(T.paper, 0));
      ctx.fillStyle = bg;
      ctx.fillRect(gx - br, gy - br, br * 2, br * 2);
    } else {
      ctx.fillStyle = inkAt(tone * (0.1 + r2() * 0.25));
      ctx.beginPath(); ctx.ellipse(gx, gy, 0.4 + r2() * R * 0.018, 0.3 + r2() * R * 0.012, r2() * 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

// A wash under an edge: ink gathers along `top` (points left to right) and
// thins out over `depth` px below it, so a ridge reads dark at its crest and
// fades into mist at its feet. Two layers, both soft-edged so they never show
// bands: a body that fades from the crest down, and a blurred line of ink
// pooled just under the crest. It soaks in: pale first, settling to its tone.
// `floor` is the bottom of the shape (for a ridge, its base).
function wash(ctx, top, depth, p, o = {}) {
  const { tone = 0.3, floor = Infinity, lift = 10, crest = 1 } = o;
  if (p <= 0 || top.length < 2) return;
  const e = ease.outCubic(clamp(p));
  const m = ctx.getTransform(), sc = Math.hypot(m.a, m.b) || 1;
  let y0 = Infinity;
  top.forEach(([, y]) => { y0 = Math.min(y0, y); });
  const y1 = Number.isFinite(floor) ? floor : y0 + depth * 1.6;
  const shape = () => {
    ctx.beginPath();
    top.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
    for (let i = top.length - 1; i >= 0; i--) ctx.lineTo(top[i][0], Math.min(floor, Math.max(top[i][1], top[i][1] + depth)));
    ctx.closePath();
  };
  ctx.save();
  ctx.translate(0, lift * (1 - e));
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, inkAt(tone * 0.75 * e));
  g.addColorStop(0.45, inkAt(tone * 0.42 * e));
  g.addColorStop(1, inkAt(0));
  ctx.fillStyle = g;
  shape();
  ctx.fill();
  if (crest > 0) {
    shape();
    ctx.clip();
    ctx.filter = `blur(${(depth * 0.07 * sc).toFixed(1)}px)`;
    ctx.strokeStyle = inkAt(tone * 0.55 * crest * e);
    ctx.lineWidth = depth * 0.22;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    top.forEach(([px, py], i) => (i ? ctx.lineTo(px, py + depth * 0.06) : ctx.moveTo(px, py + depth * 0.06)));
    ctx.stroke();
    ctx.filter = 'none';
  }
  ctx.restore();
}

// A ridge line for a mountain, river bank or cloud edge: a seeded profile
// between x0 and x1 that rises to `height` above `base` near `peak` (0..1).
function ridgeLine(seed, x0, x1, base, height, peak = 0.5, step = 8) {
  const pts = [];
  for (let x = x0; x <= x1; x += step) {
    const k = (x - x0) / (x1 - x0);
    const w = k < peak ? 0.5 * (k / peak) : 0.5 + 0.5 * ((k - peak) / (1 - peak));
    const env = Math.pow(Math.sin(Math.PI * w), 1.4);
    const n = 0.78 + 0.22 * noise(x * 0.005, seed) + 0.1 * noise(x * 0.021, seed + 3) + 0.04 * noise(x * 0.08, seed + 5);
    pts.push([x, base - height * env * n]);
  }
  return pts;
}

// === KIT: mist ===============================================================
// 云雾: a soft band of mist, slightly lighter than the paper, that drifts over
// the painting and swallows what it passes. x is its centre; drive it from
// s.T (global time) and it stays continuous across cuts.
function mist(ctx, x, y, w, h, o = {}) {
  const { alpha = 0.9, seed = 1, puffs = 9 } = o;
  if (alpha <= 0) return;
  const r = rand(seed);
  ctx.save();
  for (let i = 0; i < puffs; i++) {
    const px = x + (r() - 0.5) * w, py = y + (r() - 0.5) * h * 0.5;
    const rx = w * (0.18 + r() * 0.22), ry = h * (0.35 + r() * 0.3);
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(rx / ry, 1);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, ry);
    g.addColorStop(0, color.rgba(T.mist, alpha * 0.8));
    g.addColorStop(0.6, color.rgba(T.mist, alpha * 0.45));
    g.addColorStop(1, color.rgba(T.mist, 0));
    ctx.fillStyle = g;
    ctx.fillRect(-ry, -ry, ry * 2, ry * 2);
    ctx.restore();
  }
  ctx.restore();
}

// === KIT: calligraphy ========================================================
// Characters that soak into the paper: each one arrives soft and slightly
// large, then sharpens, leaving a faint bleed around the strokes. Vertical by
// default (top to bottom); exit (0..1) dissolves it back into the paper.
// Returns the layout [{ ch, x, y }] so other marks can anchor to a glyph.
function inkText(ctx, str, x, y, t, o = {}) {
  const { size = 120, font = T.brush, tone = 0.92, vertical = true, gap = 1.1, stagger = 0.22, dur = 0.8, times = null, exit = 0, bleed = 0.25 } = o;
  const chars = [...str];
  ctx.save();
  ctx.font = F(400, size, font);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let cx = x;
  const out = chars.map((ch, i) => {
    const w = ctx.measureText(ch).width;
    // in a vertical column, ，。、 sit in the upper right of their cell
    const punct = vertical && /[，。、．,.]/.test(ch);
    const pos = vertical ? { ch, x: x + (punct ? size * 0.32 : 0), y: y + size * gap * (i + 0.5) - (punct ? size * 0.32 : 0) } : { ch, x: cx + w / 2, y };
    cx += w;
    const q = clamp((t - (times ? times[i] : i * stagger)) / dur);
    if (q <= 0 || exit >= 1) return pos;
    const e = ease.outCubic(q);
    const blur = (1 - e) * size * 0.07 + exit * size * 0.12;
    ctx.filter = blur > 0.3 ? `blur(${blur.toFixed(2)}px)` : 'none';
    ctx.globalAlpha = e * (1 - ease.inCubic(exit));
    ctx.shadowColor = inkAt(tone * bleed);
    ctx.shadowBlur = size * 0.05;
    ctx.fillStyle = inkAt(tone);
    const sc = 1 + 0.05 * (1 - e) + 0.04 * exit;
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.scale(sc, sc);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
    return pos;
  });
  ctx.restore();
  return out;
}

// === KIT: seal ===============================================================
// 印章: a cinnabar seal pressed onto the paper (白文: the characters are paper
// showing through). It lands in one press, scale 1.12 → 1 with a quick
// settle, and the red multiplies into the paper fibres. 1, 2 or 4 characters
// laid out right-to-left, top-to-bottom.
function seal(ctx, str, x, y, size, p, o = {}) {
  const { seed = 3 } = o;
  if (p <= 0) return;
  const chars = [...str];
  const e = ease.outCubic(clamp(p / 0.35));
  const r = rand(seed);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1.12 - 0.12 * e, 1.12 - 0.12 * e);
  ctx.globalAlpha = clamp(p / 0.1);
  const h = size / 2;
  // a slightly irregular square
  ctx.beginPath();
  const corners = [[-h, -h], [h, -h], [h, h], [-h, h]];
  corners.forEach(([cx, cy], i) => {
    const [nx, ny] = corners[(i + 1) % 4];
    for (let k = 0; k < 8; k++) {
      const q = k / 8, jx = (r() - 0.5) * size * 0.025, jy = (r() - 0.5) * size * 0.025;

    ctx.restore();
  }
}
function reeds(ctx, T, A) {
  const t0 = A.m(7);
  const r = rand(130);
  for (let i = 0; i < 11; i++) {
    const bx = 1250 + r() * 190, h = 50 + r() * 80, lean = -30 + r() * 80;
    const sway = 5 * Math.sin(T * 1.3 + i * 0.7);
    brush(ctx, curve([[bx, 948], [bx + lean * 0.25, 948 - h * 0.55], [bx + lean + sway, 948 - h]], 8), ease.inOutSine(clamp((T - t0 - i * 0.03) / 0.35)), { width: 3 + r() * 2, tone: 0.55 + r() * 0.3, seed: 130 + i, dry: 0.2, press: 0.08, lift: 0.7 });
  }
}
// The whole painting at global time T, in world coordinates.
function painting(ctx, T, A) {
  const q = (t0, d, e = ease.inOutSine) => e(clamp((T - t0) / d));
  // the moon, a pale disc behind everything
  bloom(ctx, 1230, 250, 150, q(A.m(5), 1.6, ease.outCubic), { tone: 0.085, seed: 140, rough: 0.04, rim: 0.25, halo: 0.25 });
  // far peaks, pale
  wash(ctx, FAR, 300, q(A.m(0), 1.8), { tone: 0.14, floor: 760 });
  brush(ctx, FAR, q(A.m(0) - 0.1, 0.7), { width: 4, tone: 0.3, seed: 26, dry: 0.6, press: 0.05, lift: 0.2 });
  // the main peak around the blot
  const guide = q(A.guide, 1.1) * (1 - q(A.ridge + 0.6, 0.8));
  if (guide > 0) {
    ctx.save(); ctx.globalAlpha = guide; ctx.setLineDash([6, 12]); ctx.lineWidth = 2.4; ctx.strokeStyle = inkAt(0.35);
    ctx.beginPath(); MAIN.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    ctx.restore();
  }
  wash(ctx, MAIN, 480, q(A.ridge + 0.25, 2.2), { tone: 0.42, floor: 805 });
  // the blot: lands, spreads, keeps creeping a little
  const blotP = T < A.dropEnd ? 0.86 * ease.outCubic(clamp((T - A.impact) / (A.dropEnd - A.impact))) : 0.86 + 0.14 * ease.outQuad(clamp((T - A.dropEnd) / 6));
  if (T >= A.impact) {
    SPLASH.forEach((d, i) => {
      const out = ease.outCubic(clamp((T - A.impact) / 0.22));
      seep(ctx, BLOT.x + Math.cos(d.a) * BLOT.r * d.d * 0.8 * out, BLOT.y + Math.sin(d.a) * BLOT.r * d.d * 0.8 * out, d.s, clamp((T - A.impact) / 1.2), { tone: 0.75, seed: 150 + i, threads: 6, grain: 0, rough: 0.3 });
    });
    // once it is a mountain, the blot's ink runs down into the slopes (破墨)
    seep(ctx, BLOT.x - 6, BLOT.y + 120, 150, q(A.ridge + 0.4, 2.4, ease.outCubic), { tone: 0.3, seed: 165, sx: 0.9, sy: 1.25, threads: 0, grain: 0, soft: 3, rough: 0.45 });
    seep(ctx, BLOT.x, BLOT.y, BLOT.r, blotP, { tone: 0.94, seed: 160, sy: 0.92 });
    // the ring that runs out the moment it lands
    const k = clamp((T - A.impact) / 0.32);
    if (k > 0 && k < 1) {
      ctx.save(); ctx.strokeStyle = inkAt(0.25 * (1 - k)); ctx.lineWidth = 3 * (1 - k);
      ctx.beginPath(); ctx.ellipse(BLOT.x, BLOT.y, BLOT.r * (0.15 + 0.6 * ease.outCubic(k)), BLOT.r * (0.15 + 0.6 * ease.outCubic(k)) * 0.95, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
  }
  // the contour, from the blot down each side, in two strokes per slope
  const down = [...SLOPE_L].reverse(), cutL = Math.round(down.length * 0.55), cutR = Math.round(SLOPE_R.length * 0.5);
  brush(ctx, down.slice(0, cutL), q(A.ridge - 0.05, 0.6), { width: 11, tone: 0.88, seed: 21, dry: 0.45, press: 0.05, lift: 0.3 });
  brush(ctx, down.slice(cutL + 3), q(A.ridge + 0.5, 0.55), { width: 9, tone: 0.8, seed: 22, dry: 0.6, press: 0.1, lift: 0.4 });
  brush(ctx, SLOPE_R.slice(0, cutR), q(A.ridge + 0.1, 0.6), { width: 11, tone: 0.88, seed: 23, dry: 0.45, press: 0.05, lift: 0.3 });
  brush(ctx, SLOPE_R.slice(cutR + 3), q(A.ridge + 0.65, 0.55), { width: 9, tone: 0.8, seed: 25, dry: 0.6, press: 0.1, lift: 0.4 });
  FOLDS.forEach((pts, i) => brush(ctx, curve(pts, 8), q(A.ridge + 0.9 + i * 0.12, 0.45), { width: 6, tone: 0.45, seed: 190 + i, dry: 0.75, press: 0.1, lift: 0.5 }));
  CUN.forEach((c, i) => brush(ctx, c.pts, q(A.cun + i * 0.035, 0.25), { width: c.w, tone: c.tone, seed: 170 + i, dry: 0.75, press: 0.15, lift: 0.5, bristles: 7 }));
  // the waterfall in the gorge between the peaks
  waterfall(ctx, T, A);
  // the near ridge on the left, darker
  wash(ctx, LEFT, 300, q(A.left + 0.2, 1.8), { tone: 0.55, floor: 860 });
  brush(ctx, LEFT, q(A.left, 0.9), { width: 13, tone: 0.9, seed: 24, dry: 0.45, press: 0.05, lift: 0.2 });
  // mist along the feet of the mountains
  const fog = q(A.m(6), 2.2);
  mist(ctx, 400 + T * 14 % 2400 - 400, 800, 1100, 170, { seed: 7, alpha: 0.85 * fog });
  mist(ctx, 1500 - ((T * 9) % 2400) + 600, 640, 900, 140, { seed: 8, alpha: 0.7 * fog });
  river(ctx, T, A);
  boat(ctx, T, A);
  reeds(ctx, T, A);
  pine(ctx, T, A);
  birds(ctx, T, A);
}
// The painting through its camera, for any scene from the brush onwards.
function paintingShot(ctx, s) {
  const A = anchors();
  const [zoom, fx, fy] = cameraAt(s.T, A);
  xuan(ctx, s.W, s.H);
  draw.camera(ctx, s.W, s.H, { zoom, focusX: fx, focusY: fy }, () => painting(ctx, s.T, A));
  return { A, zoom, fx, fy };
}
// world → screen under the painting's camera
const toScreen = (cam, x, y, W = 1920, H = 1080) => [W / 2 + (x - cam.fx) * cam.zoom, H / 2 + (y - cam.fy) * cam.zoom];
// The brush over the paper (screen space): it comes down, swings to rest, a
// bead gathers on the tip, the hand trembles, the bead falls, the brush lifts.
function brushShot(ctx, s, cam) {
  const { A } = cam, T = s.T;
  const [bx, by] = toScreen(cam, BLOT.x, BLOT.y);
  const tipY = 410;
  const down = ease.outCubic(clamp((T - (A.land - 1.6)) / 1.7));
  const up = ease.inCubic(clamp((T - (A.impact - 0.1)) / 0.7));
  const y = lerp(-140, tipY, down) - 1100 * up;
  const settle = T - A.land;
  let rot = settle > 0 ? 0.05 * Math.sin(settle * 3.6) * Math.exp(-settle * 1.1) : -0.05 * (1 - down);
  rot += CV.fx.shake(T, A.shake, 0.012, { decay: 0.35, freq: 18, seed: 4 }).x;
  const bead = 20 * ease.outCubic(clamp((T - A.land - 0.3) / 2.2));
  const falling = T >= A.release;
  const tip = penBrush(ctx, bx, y, { rot, drop: falling ? 0 : bead, load: 1, reach: 1500, scale: 1.5 });
  if (falling && T < A.impact) {
    // the bead in free fall, stretching as it speeds up
    const k = clamp((T - A.release) / (A.impact - A.release));
    const dy = lerp(tip.y + bead * 0.9, by, k * k);
    const st = 1 + 0.9 * k;
    ctx.save();
    ctx.translate(lerp(tip.x, bx, k), dy);
    ctx.scale(1 / Math.sqrt(st), st);
    ctx.fillStyle = inkAt(0.94);
    ctx.beginPath(); ctx.arc(0, 0, bead * 0.95, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color.rgba(T.mist, 0.45);
    ctx.beginPath(); ctx.ellipse(-bead * 0.3, -bead * 0.25, bead * 0.18, bead * 0.3, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}
