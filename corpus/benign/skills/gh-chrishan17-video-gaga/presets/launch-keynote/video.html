<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit One — launch teaser (video-gaga · Launch Keynote)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;800&display=block" rel="stylesheet">
</head>
<body>
<!-- Narration timings (generated by `gaga tts` / `gaga render` from narration.json). Optional. -->
<script src="build/narration.js"></script>
<script src="../../runtime/video-gaga.js"></script>
<script>
/* =============================================================================
   LAUNCH KEYNOTE — dark stage, one hero object, light as the storyteller.
   Motion grammar: a hairline of light that opens the stage, masked reveals,
   specular sweeps, slow camera arrive-push, numbers that count on the word.
   Rhythm: a 92 BPM keynote bed. One bar of music before the first word, a
   riser into the reveal and ONE hit on the product name, a music-only breath
   where the core "thinks" on the beat, and a final chord under the end card.
   One accent colour. Nothing bounces.
   ============================================================================= */
const { ease, clamp, lerp, fx, draw, color } = CV;

// === THEME (swap for brand) ==================================================
const T = {
  bg: '#050506',
  ink: '#F5F5F7',
  dim: '#86868B',
  accent: '#4D7CFF',      // brand accent: glows, units, highlights
  accent2: '#9BE7FF',     // highlight tint inside the sweep
  display: '"Geist", "Noto Sans SC", sans-serif',
};
const F = (w, px) => `${w} ${px}px ${T.display}`;

// === EXAMPLE: the hero chip ==================================================
// The hero object: a chip with a core grid. `wave` lights cells as a radial
// front passes them (0 → dark, ≥1.25 → fully lit). `front` (optional) sends a
// bright band through the grid — the core "thinking".
function chip(ctx, cx, cy, size, wave, glow, front = null) {
  const r = size * 0.12;
  ctx.save();
  ctx.shadowColor = color.rgba(T.accent, 0.55 * clamp(glow));
  ctx.shadowBlur = size * 0.35 * glow;
  const body = ctx.createLinearGradient(cx - size / 2, cy - size / 2, cx + size / 2, cy + size / 2);
  body.addColorStop(0, '#1d1f25');
  body.addColorStop(1, '#0b0c0f');
  ctx.fillStyle = body;
  draw.roundRect(ctx, cx - size / 2, cy - size / 2, size, size, r);
  ctx.fill();
  ctx.shadowBlur = 0;
  // rim light
  const rim = ctx.createLinearGradient(cx - size / 2, cy - size / 2, cx + size / 2, cy + size / 2);
  rim.addColorStop(0, color.rgba('#ffffff', 0.5));
  rim.addColorStop(0.45, color.rgba(T.accent, 0.25));
  rim.addColorStop(1, color.rgba('#ffffff', 0.08));
  ctx.strokeStyle = rim;
  ctx.lineWidth = Math.max(1.5, size * 0.006);
  ctx.stroke();
  // pins
  ctx.fillStyle = color.rgba('#9a9aa2', 0.35);
  const pins = 14, pl = size * 0.05, pw = Math.max(2, size * 0.011);
  for (let i = 0; i < pins; i++) {
    const k = (i + 0.5) / pins, o = -size / 2 + size * 0.12 + k * size * 0.76;
    ctx.fillRect(cx + o - pw / 2, cy - size / 2 - pl, pw, pl * 0.7);
    ctx.fillRect(cx + o - pw / 2, cy + size / 2 + pl * 0.3, pw, pl * 0.7);
    ctx.fillRect(cx - size / 2 - pl, cy + o - pw / 2, pl * 0.7, pw);
    ctx.fillRect(cx + size / 2 + pl * 0.3, cy + o - pw / 2, pl * 0.7, pw);
  }
  // core grid
  const n = 8, pad = size * 0.16, cell = (size - pad * 2) / n, gap = cell * 0.18;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x = cx - size / 2 + pad + i * cell, y = cy - size / 2 + pad + j * cell;
    const d = Math.hypot(i - (n - 1) / 2, j - (n - 1) / 2) / (n * 0.71);
    let on = ease.outCubic(clamp((wave - d) * 3));
    if (front != null) on = Math.max(on * 0.45, Math.exp(-((front - d) ** 2) / 0.012));
    ctx.fillStyle = color.mix('#16181d', T.accent, on * (0.55 + 0.45 * ((i * 7 + j * 3) % 5) / 4));
    draw.roundRect(ctx, x + gap / 2, y + gap / 2, cell - gap, cell - gap, cell * 0.18);
    ctx.fill();
  }
  ctx.restore();
}

// === KIT: light and type =====================================================
// Text filled with a moving specular band (p: 0→1 sweep position).
function sweepFill(ctx, x0, x1, p, base, hi) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  const c = clamp(p, 0, 1);
  g.addColorStop(0, base);
  g.addColorStop(clamp(c - 0.12), base);
  g.addColorStop(c, hi);
  g.addColorStop(clamp(c + 0.12), base);
  g.addColorStop(1, base);
  return g;
}

// The hairline of light (centre-out). w = fraction of its full width.
function hairline(ctx, W, y, w, a, thick = 2) {
  if (w <= 0 || a <= 0) return;
  const half = W * 0.32 * w;
  const g = ctx.createLinearGradient(W / 2 - half, 0, W / 2 + half, 0);
  g.addColorStop(0, color.rgba(T.ink, 0));
  g.addColorStop(0.5, color.rgba(T.ink, a));
  g.addColorStop(1, color.rgba(T.ink, 0));
  ctx.save();
  ctx.shadowColor = color.rgba(T.accent2, 0.9 * a);
  ctx.shadowBlur = thick * 6;
  ctx.fillStyle = g;
  ctx.fillRect(W / 2 - half, y - thick / 2, half * 2, thick);
  ctx.restore();
}

// === EXAMPLE: end-card layout ================================================
// Where the end card keeps the chip (the breath lands exactly here: match cut).
const END_CHIP = { y: 0.3, size: 120 };
const SPLIT = 0.9; // hook → reveal: the stage opens along the hairline

// === VIDEO ===================================================================
CV.create({
  width: 1920, height: 1080, fps: 30,
  background: T.bg,
  lang: 'en-US',
  // the score designed for this video: dark stage, pulse and light: a minor-key pad, a ticking synth bass, the kick only when it lifts
  music: {
    bpm: 92, seed: 7, key: 'A', mode: 'minor', progression: [0, 5, 2, 6],
    layers: [
      { name: 'pad', inst: 'pad', notes: 'chord', pattern: 'X---', vel: 0.1, cutoff: [700, 1600], attack: 0.9 },
      { name: 'pulse', inst: 'bass', synth: true, octave: -1, pattern: 'XxXxXxXx', gate: 0.84, vel: 0.22, cutoff: [160, 320], envDecay: 0.08, from: 0.3 },
      { name: 'kick', inst: 'kick', pattern: 'X... .... ..x. ....', vel: 0.55, from: 0.55 },
      { name: 'keys', inst: 'keys', notes: [0, 1, 2], octave: 1, pattern: '....XXX.', gate: 3, vel: 0.06, bright: 0.5, echo: 0.25, from: 0.62 },
      { name: 'drive', inst: 'kick', pattern: '..X.', vel: 0.45, from: 0.72 },
      { name: 'hats', inst: 'hat', pattern: 'xxXx xxXx xxXx xxXx', vel: 0.08, from: 0.72 },
    ],
    lead: { inst: 'keys', range: [69, 84], rhythm: 'sparse', vel: 0.11, bright: 0.6, echo: 0.3 },
  },
  fonts: [F(600, 80), F(800, 120), F(500, 34), F(400, 30)],
  subtitles: {
    style: { font: `500 40px ${T.display}`, color: '#EDEDF0', box: 'rgba(18,18,22,0.72)', y: 0.915 },
  },
  scenes: [
    // --- 1. Hook: one bar of light and music, then the question -----------------
    {
      id: 'hook', voiceDelay: 1.7, tail: 1.7, energy: 0.3,
      draw(ctx, s) {
        const { W, H, t } = s;
        // floor glow breathing in over the pre-roll
        const g = ctx.createRadialGradient(W / 2, H * 1.1, 0, W / 2, H * 1.1, H * 0.9);
        g.addColorStop(0, color.rgba(T.accent, 0.18 * s.at(0, 2.5, ease.gentle)));
        g.addColorStop(1, color.rgba(T.accent, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // a point of light on the first beat opens into a hairline on the third
        const pt = ease.enter(clamp((t - s.onBeat(0)) / 0.4));
        const lp = ease.swift(clamp((t - s.onBeat(2)) / 1.1));
        // before the cut it glides to the centre line and brightens: the split opens there
        const go = s.out(0.55, ease.swift, SPLIT);
        const y = lerp(H * 0.62, H / 2, go);
        ctx.fillStyle = color.rgba(T.ink, 0.9 * pt * (1 - lp));
        ctx.beginPath();
        ctx.arc(W / 2, y, 3 + 2 * pt, 0, Math.PI * 2);
        ctx.fill();
        hairline(ctx, W, y, Math.max(lp, 0.02 * pt), lerp(0.55, 1, go), lerp(2, 4, go));

        // the question, word by word as it is spoken; it leaves before the split
        ctx.font = F(600, 84);
        ctx.fillStyle = T.ink;
        const out = s.out(0.45, ease.exit, SPLIT + 0.05);
        fx.wordReveal(ctx, 'What if your computer', W / 2, H * 0.37, t, { sync: s, dur: 0.5, rise: 0.35, blur: 8, align: 'center', exit: out });
        const tk = s.when('ahead', 3.6);
        ctx.fillStyle = sweepFill(ctx, W * 0.25, W * 0.75, s.at(tk - 0.1, 1.3, ease.inOutCubic) * 1.3 - 0.15, T.ink, T.accent2);
        fx.wordReveal(ctx, 'could think one step ahead?', W / 2, H * 0.37 + 104, t, { sync: s, dur: 0.5, rise: 0.35, blur: 8, align: 'center', exit: out });
      },
    },
    // --- 2. Reveal: the stage opens, the riser lands on the name ------------------
    {
      id: 'reveal', minDuration: 3.8, tail: 1.2, energy: 0.55,
      transition: { type: 'split', direction: 'vertical', duration: SPLIT, ease: ease.swift, zoom: 1.08 },
      sfx: [
        { at: (s) => s.when('Orbit', 1.4) - 0.04, type: 'riser', dur: 1.8, gain: 0.9 },
        { at: (s) => s.when('Orbit', 1.4) - 0.04, type: 'hit' },
      ],
      draw(ctx, s) {
        const { W, H, t } = s;
        const th = s.when('Orbit', 1.4) - 0.04;          // the hit
        const hit = t >= th ? Math.exp(-(t - th) / 0.45) : 0;
        const lit = clamp((t - th) / 0.01);
        const push = lerp(0.9, 1, s.at(0, 1.6, ease.enter)) + 0.03 * s.p; // arrive, then drift
        draw.camera(ctx, W, H, { zoom: push }, () => {
          const halo = ctx.createRadialGradient(W / 2, H * 0.40, 0, W / 2, H * 0.40, H * 0.62);
          halo.addColorStop(0, color.rgba(T.accent, 0.06 + 0.16 * lit + 0.3 * hit));
          halo.addColorStop(1, color.rgba(T.accent, 0));
          ctx.fillStyle = halo;
          ctx.fillRect(0, 0, W, H);
          // dark until its name is said, then the core lights in a radial wave
          chip(ctx, W / 2, H * 0.40, 360, (t - th) / 1.3 * 1.25, 0.25 + 0.75 * lit + 0.6 * hit);
        });
        // "Introducing" lands on its word, steps back before the cut
        ctx.textAlign = 'center';
        ctx.font = F(500, 34);
        ctx.fillStyle = T.dim;
        fx.wordReveal(ctx, 'Introducing', W / 2, H * 0.685, t, { sync: s, dur: 0.6, rise: 0.4, align: 'center', exit: s.out(0.35, ease.exit, 0.75) });
        ctx.font = F(800, 132);
        ctx.letterSpacing = '-3px';
        ctx.fillStyle = sweepFill(ctx, W * 0.3, W * 0.7, s.at(th + 0.45, 1.2, ease.inOutCubic) * 1.4 - 0.2, T.ink, '#ffffff');
        fx.charReveal(ctx, 'Orbit One', W / 2, H * 0.80, t - th, { stagger: 0.045, dur: 0.6, blur: 14, rise: 0.25, align: 'center' });
        ctx.letterSpacing = '0px';
      },
    },
    // --- 3. Specs: three numbers, each counts on its spoken word ----------------
    {
      id: 'specs', tail: 1.7, energy: 0.7,
      transition: { type: 'push', direction: 'up', duration: 0.7, ease: ease.swift },
      sfx: ['Forty', 'Twenty', 'Under'].map((w) => ({ at: w, type: 'tick', gain: 0.8 })),
      draw(ctx, s) {
        const { W, H, t } = s;
        // faint dot grid drifting upward (parallax depth)
        ctx.fillStyle = color.rgba(T.ink, 0.07);
        const off = (t * 14) % 48;
        for (let x = 24; x < W; x += 48) for (let y = -48 + (48 - off); y < H; y += 48) ctx.fillRect(x, y, 2, 2);

        // kicker so the push lands on something, not an empty frame
        ctx.font = F(500, 34);
        ctx.textAlign = 'center';
        ctx.fillStyle = T.dim;
        fx.lineReveal(ctx, ['Orbit One at a glance'], W / 2, H * 0.26, t - 0.25, { dur: 0.6, exit: s.out(0.35, ease.exit, 0.75) });

        const cols = [
          { at: s.when('Forty', 0.6), to: 40, unit: 'TOPS', label: 'on-device AI' },
          { at: s.when('Twenty', 2.4), to: 22, unit: 'hours', label: 'battery life' },
          { at: s.when('Under', 4.2), to: 0.9, dec: 1, unit: 'kg', label: 'all-day carry', prefix: '<' },
        ];
        // focus: the column being spoken is bright, earlier ones recede, and
        // all three come back together once the line is finished
        const active = cols.reduce((k, c, i) => (t >= c.at - 0.1 ? i : k), -1);
        const together = s.at(s.voiceEnd + 0.1, 0.6);
        const cw = W / 3;
        cols.forEach((c, i) => {
          const cx = cw * i + cw / 2, lt = t - c.at + 0.1;
          if (lt < 0) return;
          const p = ease.outQuart(clamp(lt / 1.0));
          // exit: columns drop away left to right just before the cut
          const q = s.out(0.45, ease.exit, 0.75 - i * 0.07);
          const focus = i === active ? 1 : lerp(0.38, 1, together);
          ctx.save();
          ctx.globalAlpha = clamp(lt / 0.25) * (1 - q) * focus;
          ctx.translate(0, q * 60);
          ctx.textAlign = 'center';
          ctx.font = F(800, 168);
          ctx.letterSpacing = '-4px';
          const num = (c.prefix ?? '') + fx.countUp(p, 0, c.to, { decimals: c.dec ?? 0 });
          const nw = ctx.measureText(num).width;
          ctx.fillStyle = sweepFill(ctx, cx - nw / 2, cx + nw / 2, s.at(c.at + 0.9, 0.9, ease.inOutCubic) * 1.4 - 0.2, T.ink, '#ffffff');
          ctx.fillText(num, cx, H * 0.52 + (1 - p) * 30);
          ctx.letterSpacing = '0px';
          ctx.font = F(500, 44);
          ctx.fillStyle = T.accent;
          ctx.fillText(c.unit, cx, H * 0.52 + 76);
          ctx.font = F(400, 30);
          ctx.fillStyle = T.dim;
          ctx.globalAlpha *= clamp((lt - 0.3) / 0.4);
          ctx.fillText(c.label, cx, H * 0.52 + 132);
          ctx.restore();
          // divider draws down after the column lands
          if (i > 0) {
            ctx.fillStyle = color.rgba(T.ink, 0.16 * (1 - q));
            const dh = 300 * ease.outCubic(clamp(lt / 0.8));
            ctx.fillRect(cw * i, H * 0.5 - dh / 2, 1.5, dh);
          }
        });
      },
    },
    // --- 4. Breath: no voice. The core "thinks" on every beat ----------------------
    {
      id: 'think', narration: false, beats: 4, energy: 0.8,
      transition: { type: 'zoomBlur', duration: 0.7, ease: ease.inOutCubic, strength: 0.8 },
      draw(ctx, s) {
        const { W, H, t } = s;
        // the last beat carries the chip up into its end-card position (match cut)
        const m = ease.inOutCubic(clamp((t - s.onBeat(3)) / (s.dur - s.onBeat(3))));
        const cy = lerp(H * 0.47, H * END_CHIP.y, m), size = lerp(300, END_CHIP.size, m);
        const halo = ctx.createRadialGradient(W / 2, cy, 0, W / 2, cy, H * 0.55);
        halo.addColorStop(0, color.rgba(T.accent, (0.16 + 0.1 * s.pulse(0.25)) * (1 - m)));
        halo.addColorStop(1, color.rgba(T.accent, 0));
        ctx.fillStyle = halo;
        ctx.fillRect(0, 0, W, H);
        // one band of light runs through the core on each of the first three beats
        const beat = s.beat - Math.floor(s.beat + 1e-6);
        const thinking = t < s.onBeat(3);
        const front = thinking && t >= s.onBeat(0) ? beat * 1.5 - 0.1 : null;
        chip(ctx, W / 2, cy, size, thinking ? 0.6 : lerp(0.6, 2, m), lerp(0.9, 0.7, m), front);
        // a quiet caption under the chip on the second beat
        ctx.textAlign = 'center';
        ctx.font = F(500, 30);
        ctx.fillStyle = T.dim;
        ctx.globalAlpha = ease.enter(clamp((t - s.onBeat(1)) / 0.5)) * (1 - clamp(m * 2.5));
        ctx.fillText('One step ahead', W / 2, H * 0.47 + 230);
        ctx.globalAlpha = 1;
      },
    },
    // --- 5. End card -------------------------------------------------------------
    {
      id: 'end', transition: 'cut', voiceDelay: 0.45, tail: 1.8, energy: 0.45,
      sfx: [{ at: 'Think', type: 'shimmer', gain: 0.6 }],
      draw(ctx, s) {
        const { W, H, t } = s;
        chip(ctx, W / 2, H * END_CHIP.y, END_CHIP.size, 2, 0.7 + 0.12 * s.pulse(0.3));
        ctx.textAlign = 'center';
        ctx.font = F(800, 112);
        ctx.letterSpacing = '-3px';
        ctx.fillStyle = T.ink;
        fx.lineReveal(ctx, ['Orbit One'], W / 2, H * 0.56, t - s.when('Orbit', 0.4) + 0.1, { dur: 0.8 });
        ctx.letterSpacing = '0px';
        ctx.font = F(500, 56);
        const tt = s.when('Think', 1.0);
        ctx.fillStyle = sweepFill(ctx, W * 0.4, W * 0.6, s.at(tt + 0.4, 1.1, ease.inOutCubic) * 1.4 - 0.2, T.accent, T.accent2);
        fx.wordReveal(ctx, 'Think ahead.', W / 2, H * 0.56 + 92, t, { sync: s, dur: 0.6, rise: 0.4, blur: 6, align: 'center' });
        // the date lands on the first beat after the voice
        const dp = ease.enter(clamp((t - s.nextBeat(s.voiceEnd)) / 0.7));
        ctx.font = F(400, 30);
        ctx.fillStyle = T.dim;
        ctx.globalAlpha = dp;
        ctx.fillText('Available October 14', W / 2, H * 0.78 + (1 - dp) * 14);
        ctx.globalAlpha = 1;
      },
    },
  ],
  // Persistent finishing layer: vignette + a touch of grain (keeps gradients from banding)
  overlay(ctx, g) {
    draw.vignette(ctx, g.W, g.H, 0.4);
    draw.grain(ctx, g.frame, 0.035);
  },
});
</script>
</body>
</html>
