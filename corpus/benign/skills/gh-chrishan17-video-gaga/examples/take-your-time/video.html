<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>慢慢说</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;900&family=Noto+Sans+SC:wght@500;700;900&family=Noto+Serif+SC:wght@600;700;900&display=block" rel="stylesheet">
</head>
<body>
<script src="build/narration.js"></script>
<script src="../../runtime/video-gaga.js"></script>
<script>
/* =============================================================================
   慢慢说 — a 2.5-minute personal story in the Swiss Kinetic style, set in Chinese.
   A man who stutters tells how a word gets stuck, how he learned to go round it,
   and how a wedding toast took eight seconds to start. Type is the picture: the
   red caret is his voice, the red slab is the wall it hits. The wall comes back
   in every chapter until it falls, and the opening line returns at the end.
   Two voices: his (Yunxi, set in sans) and his sister's (Xiaoxiao, set in serif).
   ============================================================================= */
const { ease, clamp, lerp, fx, draw, color, text, rand, noise } = CV;

// === THEME ===================================================================
const T = {
  paper: '#F2F0EB',
  ink: '#111111',
  red: '#E62E2D',
  mute: '#BDB9B0',     // receded type on paper
  dim: '#55524C',      // receded type on ink
  sans: '"Noto Sans SC", sans-serif',
  serif: '"Noto Serif SC", serif',
  latin: '"Archivo", "Noto Sans SC", sans-serif',
};
const F = (w, px, fam = T.sans) => `${w} ${px}px ${fam}`;
const W = 1920, H = 1080, M = 96, COLS = 12, CW = (W - M * 2) / COLS;
const X0 = M + CW;                       // the main text column

// === KIT: snap moves, grid, labels (Swiss Kinetic) ===========================
// Snap: fast start, dead stop.
const snap = ease.bezier(0.7, 0, 0.1, 1);
// eased 0→1 of a move that starts at local time t0
const win = (t, t0, d = 0.35, e = snap) => e(clamp((t - t0) / d));

function grid(ctx, p, col) {
  if (p <= 0) return;
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    const q = snap(clamp(p * 1.6 - i * 0.05));
    if (q <= 0) continue;
    const x = Math.round(M + i * CW) + 0.5;
    ctx.beginPath();
    ctx.moveTo(x, M);
    ctx.lineTo(x, M + (H - M * 2) * q);
    ctx.stroke();
  }
  ctx.restore();
}

function label(ctx, str, x, y, col = T.ink, align = 'left', size = 24) {
  ctx.save();
  ctx.font = F(500, size, T.latin);
  ctx.letterSpacing = '4px';
  ctx.textAlign = align;
  ctx.fillStyle = col;
  ctx.fillText(str, x, y);
  ctx.restore();
}

// A line of type that rises out of its own mask (pin) and drops back into it (pout).
function slam(ctx, str, x, y, size, pin, pout = 0, { w = 900, fam = T.sans, col = T.ink, align = 'left', track = 0 } = {}) {
  if (pin <= 0 || pout >= 1) return 0;
  ctx.save();
  ctx.font = F(w, size, fam);
  ctx.letterSpacing = `${track}px`;
  ctx.textAlign = align;
  ctx.fillStyle = col;
  const width = ctx.measureText(str).width;
  fx.mask(ctx, 0, y - size * 1.08, W, size * 1.36, () => ctx.fillText(str, x, y + (1 - pin) * size * 1.2 + pout * size * 1.2));
  ctx.restore();
  return width;
}

// A camera move: scale z about (fx, fy), drift by (dx, dy).
function cam(ctx, z, fx0, fy0, fn, dx = 0, dy = 0) {
  ctx.save();
  ctx.translate(fx0 + dx, fy0 + dy);
  ctx.scale(z, z);
  ctx.translate(-fx0, -fy0);
  fn();
  ctx.restore();
}

// === KIT: the voice and the wall (this video) ================================
// Type as it is typed. keys = [[time, text], …] in time order: a stutter types,
// deletes and types again. New characters drop in; the red caret (his voice)
// sits after the text, shivers inside `stuck` = [from, to] and blinks on the
// beat when idle. Returns the width of the text.
function typed(ctx, s, keys, x, y, size, o = {}) {
  const { w = 900, fam = T.sans, col = T.ink, caret = true, stuck = null, out = 0, solid = false, caretCol = T.red } = o;
  const t = s.t;
  let cur = [], born = [], last = -1e9;
  for (const [kt, str] of keys) {
    if (kt > t) break;
    const a = Array.from(str);
    let k = 0;
    while (k < a.length && k < cur.length && a[k] === cur[k]) k++;
    born = born.slice(0, k).concat(a.slice(k).map(() => kt));
    cur = a;
    last = kt;
  }
  ctx.save();
  ctx.font = F(w, size, fam);
  ctx.textAlign = 'left';
  const dy = out * size * 1.25;
  ctx.beginPath();
  ctx.rect(0, y - size * 1.08, W, size * 1.4);
  ctx.clip();
  let acc = 0;
  cur.forEach((ch, i) => {
    const p = ease.outCubic(clamp((t - born[i]) / 0.14));
    ctx.globalAlpha = p;
    ctx.fillStyle = col;
    ctx.fillText(ch, x + acc, y - (1 - p) * size * 0.2 + dy);
    acc += ctx.measureText(ch).width;
  });
  if (caret) {
    const isStuck = stuck && t >= stuck[0] && t < stuck[1];
    const idle = !isStuck && t - last > 0.45;
    const on = solid || !idle || ((s.beat % 1) + 1) % 1 < 0.55;
    if (on) {
      const j = isStuck ? noise(Math.floor(s.frame / 2) * 1.9, 11) * size * 0.06 : 0;
      ctx.globalAlpha = 1;
      ctx.fillStyle = caretCol;
      ctx.fillRect(x + acc + size * 0.08 + j, y - size * 0.82 + dy, Math.max(8, size * 0.09), size * 0.94);
    }
  }
  ctx.restore();
  return acc;
}

// keys for a string typed one character at a time from `times` (one per char)
const spell = (str, times) => Array.from(str).map((_, i) => [times[i], Array.from(str).slice(0, i + 1).join('')]);
// keys for a stutter: the first character typed, deleted and typed again n times
function stammer(ch, t0, n = 3, beat = 0.17) {
  const keys = [];
  for (let i = 0; i < n; i++) {
    keys.push([t0 + i * beat * 2, ch]);
    if (i < n - 1) keys.push([t0 + i * beat * 2 + beat, '']);
  }
  return keys;
}

// A character that will not come out: it shivers on twos and leaves echoes behind it.
function tremble(ctx, s, ch, x, y, size, amt, { col = T.ink, w = 900, fam = T.sans, align = 'center', alpha = 1 } = {}) {
  ctx.save();
  ctx.font = F(w, size, fam);
  ctx.textAlign = align;
  ctx.fillStyle = col;
  const f = Math.floor(s.frame / 2);
  if (amt > 0.01) {
    for (let k = 3; k >= 1; k--) {
      ctx.globalAlpha = alpha * 0.1 * amt * (4 - k);
      ctx.fillText(ch, x - k * size * 0.06 * amt, y);
    }
  }
  ctx.globalAlpha = alpha;
  ctx.fillText(ch, x + noise(f * 1.7, 3) * size * 0.035 * amt, y + noise(f * 1.3, 7) * size * 0.02 * amt);
  ctx.restore();
}

// The wall: a red slab that draws down from y0 to y1.
function slab(ctx, x, y0, y1, p, w = 30) {
  if (p <= 0) return;
  ctx.fillStyle = T.red;
  ctx.fillRect(x - w / 2, y0, w, (y1 - y0) * p);
}

// 00:SS in fixed-width cells, so the digits don't wobble while they count.
function timer(ctx, sec, x, y, size, col, align = 'left') {
  const str = `00:${String(sec).padStart(2, '0')}`;
  const cell = (c) => (c === ':' ? size * 0.32 : size * 0.6);
  const total = Array.from(str).reduce((a, c) => a + cell(c), 0);
  let cx = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
  ctx.save();
  ctx.font = F(900, size, T.latin);
  ctx.textAlign = 'center';
  ctx.fillStyle = col;
  for (const c of str) {
    ctx.fillText(c, cx + cell(c) / 2, y);
    cx += cell(c);
  }
  ctx.restore();
  return total;
}

// Chapter shutter: a red slab crosses the frame and the cut happens behind it.
function shutterFn(ctx, A, B, p) {
  const Wc = ctx.canvas.width, Hc = ctx.canvas.height;
  ctx.drawImage(p < 0.5 ? A : B, 0, 0);
  const a = snap(clamp(p * 2)), b = snap(clamp(p * 2 - 1));
  ctx.fillStyle = T.red;
  ctx.fillRect(Wc * b, 0, Wc * (a - b), Hc);
}
const shutter = { type: shutterFn, duration: 0.7, ease: ease.linear, sfx: 'swish' };

// A chapter card (music only): the number in outline rises out of the floor,
// the title slams in, a red square sets the full stop.
function card(id, n, title, sub, part, energy) {
  return {
    id, ch: n, card: true, narration: false, beats: 3, part, energy, background: T.ink, transition: shutter,
    draw(ctx, s) {
      const t = s.t, b = (i) => s.onBeat(i);
      grid(ctx, 1, color.rgba(T.paper, 0.06));
      const out = win(t, b(2.5), 0.28, ease.inCubic);
      ctx.save();
      ctx.font = F(900, 560, T.latin);
      ctx.letterSpacing = '-24px';
      ctx.strokeStyle = color.rgba(T.paper, 0.9);
      ctx.lineWidth = 3;
      const pin = win(t, b(0) - 0.2, 0.6, ease.enter);
      fx.mask(ctx, 0, 0, W, H - M + 6, () => ctx.strokeText(String(n).padStart(2, '0'), M - 24 - s.p * 60, H - M + (1 - pin) * 480 + out * 480));
      ctx.restore();
      ctx.globalAlpha = win(t, b(0.5), 0.3) * (1 - out);
      label(ctx, sub, X0 + CW * 5, 590, color.rgba(T.paper, 0.6));
      ctx.globalAlpha = 1;
      const tw = slam(ctx, title, X0 + CW * 5, 800, 190, win(t, b(1) - 0.05, 0.4), out, { col: T.paper, track: lerp(40, -4, win(t, b(1) - 0.05, s.beatLen * 1.6, ease.enter)) });
      const q = win(t, b(1.6), 0.3) * (1 - out);
      ctx.fillStyle = T.red;
      if (q > 0) ctx.fillRect(X0 + CW * 5 + tw + 22, 800 - 40, 40 * q, 40);
    },
  };
}

// === DATA (seeded, built once) ===============================================
const LAUGH = (() => {
  const r = rand(41), out = [];
  for (let i = 0; i < 96; i++) {
    out.push({ x: 40 + r() * 1840, y: 120 + r() * 880, size: 60 + r() ** 2 * 230, a: 0.25 + r() * 0.75, d: r() * 0.9, fall: r() * 0.5, spin: (r() - 0.5) * 0.8 });
  }
  return out.sort((a, b) => a.d - b.d);
})();
const CROWD = (() => {
  const r = rand(7), out = [];
  for (let row = 0; row < 13; row++) for (let col = 0; col < 30; col++) out.push({ x: 90 + col * 60 + (r() - 0.5) * 14, y: 190 + row * 58 + (r() - 0.5) * 12, row, col });
  return out;
})();
const ME_IN_CROWD = CROWD.find((c) => c.row === 6 && c.col === 19);
const DRAFT = (() => { const r = rand(19), out = []; for (let i = 0; i < 44; i++) out.push(0.45 + r() * 0.55); return out; })();
const KEEP = [7, 15, 22];                // the three lines that survive the edit
const SHARDS = (() => {
  const r = rand(23), out = [];
  for (let i = 0; i < 16; i++) out.push({ y0: i / 16, h: 1 / 16, vx: (r() - 0.25) * 900, vy: -200 - r() * 700, rot: (r() - 0.5) * 9 });
  return out;
})();
const IDEAS = ['先做个小样', '砍掉一半功能', '直接问用户', '换个名字', '周五就能上线', '数据口径不对', '这块我来做', '推迟一周', '可以更简单', '别再加班了'];
const MENU = [['01', '牛肉面', '28'], ['02', '番茄鸡蛋面', '22'], ['03', '宫保鸡丁饭', '26'], ['04', '炒饭', '18']];
// the classroom: 6 × 4 desks, mine is the 23rd
const DESK = { x0: 170, y0: 270, w: 150, h: 84, gx: 36, gy: 46, cols: 6, rows: 4, me: 22 };
const deskPos = (i) => ({ x: DESK.x0 + (i % DESK.cols) * (DESK.w + DESK.gx), y: DESK.y0 + Math.floor(i / DESK.cols) * (DESK.h + DESK.gy) });
// the city map: blocks, the straight street, the wall, the detour
const MAP = { x0: 170, y0: 210, bw: 174, bh: 118, sx: 60, sy: 56, cols: 7, rows: 4 };
const ROUTE = [[130, 530], [374, 530], [374, 704], [842, 704], [842, 356], [1310, 356], [1310, 704], [1544, 704], [1544, 530], [1790, 530]];

function cityMap(ctx, p, col = '#E2DED6') {
  ctx.save();
  for (let r = 0; r < MAP.rows; r++) for (let c = 0; c < MAP.cols; c++) {
    const q = snap(clamp(p * 2 - (r + c) * 0.06));
    if (q <= 0) continue;
    const x = MAP.x0 + c * (MAP.bw + MAP.sx), y = MAP.y0 + r * (MAP.bh + MAP.sy);
    ctx.fillStyle = col;
    ctx.globalAlpha = q;
    draw.roundRect(ctx, x + (1 - q) * MAP.bw * 0.5, y + (1 - q) * MAP.bh * 0.5, MAP.bw * q, MAP.bh * q, 10);
    ctx.fill();
  }
  ctx.restore();
}
// a polyline drawn on to p, with the red square riding its head
function route(ctx, pts, p, { col = T.red, width = 10, head = true } = {}) {
  if (p <= 0) return;
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth = width;
  ctx.lineJoin = 'miter';
  ctx.lineCap = 'butt';
  draw.drawOn(ctx, pts, p);
  if (head) {
    const a = fx.along(pts, p);
    ctx.fillStyle = col;
    ctx.fillRect(a.x - 16, a.y - 16, 32, 32);
  }
  ctx.restore();
}

// the stage: a spotlight, a floor and an audience of small lights
function stage(ctx, s, { light = 1, lit = 0, wave = null, pulse = 0 } = {}) {
  if (light > 0) {
    ctx.save();
    ctx.globalAlpha = light;
    const g = ctx.createLinearGradient(0, 0, 0, 760);
    g.addColorStop(0, color.rgba(T.paper, 0.02));
    g.addColorStop(1, color.rgba(T.paper, 0.16));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(860, -10);
    ctx.lineTo(1060, -10);
    ctx.lineTo(1340, 760);
    ctx.lineTo(580, 760);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = color.rgba(T.paper, 0.2);
    ctx.beginPath();
    ctx.ellipse(960, 760, 380, 46, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // four rows of guests, back to front
  for (let r = 0; r < 4; r++) {
    const y = 812 + r * 36, n = 22 + r * 2, span = 1240 + r * 160;
    for (let i = 0; i < n; i++) {
      const x = 960 - span / 2 + (i + (r % 2) * 0.5) * (span / n);
      const k = wave == null ? lit : clamp(wave - (3 - r) * 0.18 - Math.abs(x - 960) / 2600) * 1;
      const glow = clamp(Math.max(lit, k));
      ctx.fillStyle = color.rgba(T.paper, 0.2 + 0.7 * glow);
      const rad = 6 + r * 1.2 + glow * 3 + pulse * glow * 2.5;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// a microphone on a stand
function mic(ctx, x, y, p) {
  if (p <= 0) return;
  ctx.save();
  ctx.translate(0, (1 - p) * 400);
  ctx.strokeStyle = T.paper;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(x, y + 60);
  ctx.lineTo(x, 760);
  ctx.stroke();
  ctx.fillStyle = T.paper;
  draw.roundRect(ctx, x - 22, y - 50, 44, 92, 22);
  ctx.fill();
  ctx.restore();
}

// === CHROME ==================================================================
const CH = ['', '卡住', '十一秒', '绕路', '请柬', '八秒', '现在'];
function chrome(ctx, g) {
  const cur = g.scenes.filter((sc) => sc.start <= g.T + 1e-6).pop();
  if (!cur) return;
  const dark = cur.background === T.ink || cur.background === T.red;
  const col = dark ? T.paper : T.ink;
  const endFade = clamp((g.duration - g.T - 1.8) / 0.5);
  if (!cur.card && cur.ch) {
    const first = g.scenes.find((sc) => sc.ch === cur.ch && !sc.card);
    ctx.save();
    ctx.globalAlpha = clamp((g.T - first.start - 0.3) / 0.4) * endFade * 0.85;
    ctx.fillStyle = cur.background === T.red ? T.paper : T.red;
    ctx.fillRect(M, 54, 16, 16);
    ctx.font = F(600, 22, T.latin);
    ctx.letterSpacing = '3px';
    ctx.fillStyle = col;
    ctx.textAlign = 'left';
    ctx.fillText(String(cur.ch).padStart(2, '0'), M + 30, 70);
    ctx.font = F(500, 22);
    ctx.fillText(CH[cur.ch], M + 76, 70);
    ctx.textAlign = 'right';
    ctx.fillText('阿哲  自述', W - M, 70);
    ctx.restore();
  }
  // time made visible: a hairline at the foot of the frame steps on every beat
  if (Number.isFinite(g.beat)) {
    const total = Math.round(g.duration / g.beatLen);
    const k = clamp(Math.floor(g.beat + 1e-6) + 1, 0, total) / total;
    ctx.fillStyle = color.rgba(col, 0.35 * endFade);
    ctx.fillRect(M, H - 38, (W - M * 2) * k, 2);
  }
}

// === VIDEO ===================================================================
CV.create({
  width: 1920, height: 1080, fps: 30,
  background: T.paper,
  lang: 'zh-CN',
  transition: 'cut',
  voiceDelay: 0.3, tail: 0.5,
  subtitles: {
    style: { font: '500 40px "Noto Sans SC", sans-serif', color: T.paper, box: 'rgba(17,17,17,0.86)', y: 0.925, radius: 0, padX: 22, padY: 12 },
  },
  overlay: chrome,
  // intimate, tense, then free · 88 BPM · A minor, opening into C major at the
  // wedding · a felt-piano arpeggio is the signature (it is there from the first
  // bar), strings and a finger bass come in as the story moves, a room kit with
  // brushes-light hats carries the groove, an acoustic guitar joins at the peak ·
  // celesta melody in the gaps.
  music: {
    bpm: 88, seed: 7, key: 'A', mode: 'minor', progression: [0, 5, 2, 6], kit: 'room', swing: 0.12, volume: 0.8, duck: -13,
    parts: {
      school: { progression: [0, 5, 3, 4], seed: 12 },                                              // a classroom, a countdown
      detour: { mode: 'dorian', progression: [0, 3, 0, 6], seed: 5, lead: { rhythm: 'rhythmic' } }, // clever detours, a little wry
      invite: { key: 'C', mode: 'major', progression: [0, 4, 5, 3], seed: 9 },                      // the invitation: first light
      stage: { progression: [0, 5], chordBars: 2, seed: 3, lead: { rhythm: 'sparse' } },            // eight seconds, held breath
      free: { key: 'C', mode: 'major', progression: [5, 3, 0, 4], seed: 21 },                       // the wall falls
      home: { key: 'C', mode: 'major', progression: [3, 4, 0, 0], seed: 2 },                        // now: IV–V–I, uplifting
    },
    layers: [
      { name: 'felt piano', inst: 'felt', notes: [0, 1, 2, 1, 3, 1, 2, 1], pattern: 'XxXxXxXx', gate: 1.8, vel: [0.1, 0.15] },
      { name: 'strings', inst: 'strings', notes: 'chord', pattern: 'X---', vel: [0.03, 0.06], from: 0.3 },
      { name: 'bass', inst: 'bass', octave: -1, notes: ['root', 'root', 'fifth'], pattern: 'X..x..X.', vel: 0.26, from: 0.35 },
      { name: 'kick', inst: 'kick', pattern: 'X.....x.X.......', vel: 0.4, from: 0.45 },
      { name: 'snare', inst: 'snare', pattern: '....X.......X...', vel: 0.15, from: 0.5 },
      { name: 'hat', inst: 'hat', pattern: 'x.x.x.x.x.x.x.x.', vel: 0.06, from: 0.55 },
      { name: 'guitar', inst: 'acoustic', notes: 'chord', pattern: 'X..x..x.', strum: 0.02, vel: 0.1, from: 0.8 },
      { name: 'shaker', inst: 'shaker', pattern: 'xXxXxXxXxXxXxXxX', vel: 0.05, from: 0.85 },
    ],
    lead: { inst: 'bell', kind: 'celesta', range: [74, 88], rhythm: 'melodic', vel: 0.13, echo: 0.2 },
  },
  scenes: [
    // ===== 01 · 卡住 ============================================================
    {
      // the red caret waits through the pre-roll; then the name, then the line
      // that will not come out in one go
      id: 'open', ch: 1, voiceDelay: 2.4, tail: 0.7, energy: 0.4, captions: 'file',
      draw(ctx, s) {
        const t = s.t;
        grid(ctx, clamp((t - s.onBeat(0)) / (s.beatLen * 2)), color.rgba(T.ink, 0.07));
        const out = s.out(0.35, ease.inCubic);
        const l1 = '我叫阿哲。';
        const k1 = spell(l1, s.syncTimes(Array.from(l1)));
        const a = s.when('我说话', 4.0);
        const recede = win(t, a - 0.1, 0.4, ease.standard);
        typed(ctx, s, [[0, ''], ...k1], X0, 400, 110, { col: color.mix(T.ink, T.mute, recede), caret: t < a - 0.05, out });
        if (t >= a - 0.05) {
          const rest = '说话，会卡住。';
          const tRest = [s.when('说话'), s.when('说话') + 0.07, s.when('说话') + 0.14, s.when('会卡'), s.when('会卡') + 0.12, s.when('住'), s.when('住') + 0.1];
          let tt = a + 1.0;
          const keys = [...stammer('我', a, 3, 0.16)];
          Array.from(rest).forEach((ch, i) => { tt = Math.max(tt + 0.06, tRest[i]); keys.push([tt, '我' + Array.from(rest).slice(0, i + 1).join('')]); });
          typed(ctx, s, keys, X0, 700, 180, { stuck: [a, a + 0.95], out });
        }
      },
    },
    {
      // the word runs at an invisible wall, twice, then hits it, and the wall shows itself
      id: 'wall', ch: 1, tail: 1.0, energy: 0.45,
      sfx: [
        { at: (s) => s.when('出不来') + 0.12, type: 'tick', gain: 0.5 },
        { at: (s) => s.when('出不来') + 0.47, type: 'tick', gain: 0.5 },
        { at: (s) => s.when('撞上') + 0.1, type: 'boom', gain: 0.55 },
      ],

        ctx.globalAlpha = 1;
        ctx.fillStyle = color.mix(T.paper, T.dim, dimmed);
        const n = 96, x0 = X0, span = W - M - X0 - CW;
        for (let i = 0; i < n; i++) {
          const h = 6 + env * (0.25 + 0.75 * Math.abs(noise(i * 0.37 + t * 7, 4))) * 300 * Math.sin(Math.PI * (i + 0.5) / n);
          ctx.fillRect(x0 + i * (span / n), 560 - h / 2, span / n * 0.55, h);
        }
        const tp = win(t, tN - 0.05, 0.3);
        if (tp > 0) {
          const k = lerp(1.5, 1, tp);
          ctx.save();
          ctx.translate(960, 560);
          ctx.scale(k, k);
          ctx.globalAlpha = tp;
          ctx.fillStyle = T.red;
          ctx.fillRect(-250, -80, 500, 160);
          ctx.font = F(900, 92);
          ctx.textAlign = 'center';
          ctx.fillStyle = T.paper;
          ctx.fillText('借来的', 0, 32);
          ctx.restore();
        }
      },
    },
    {
      // the script of this video, every line of it his; the words light up in order
      id: 'mine', ch: 6, tail: 1.1, energy: 0.55,
      draw(ctx, s) {
        const t = s.t;
        const tE = s.when('每一个字', 1.9), tM = s.when('我自己的', 3.1);
        const lines = Object.entries(window.CV_NARRATION?.segments || {}).filter(([id]) => id !== 'ask' && id !== 'wait').map(([, g]) => g.text);
        label(ctx, '旁白稿  第 7 稿', X0, 200, T.ink);
        ctx.font = F(500, 26);
        const per = Math.ceil(lines.length / 2);
        let idx = 0;
        const total = lines.reduce((a, l) => a + Array.from(l).length, 0);
        lines.forEach((ln, i) => {
          const col = Math.floor(i / per), row = i % per;
          const x = X0 + col * 760, y = 280 + row * 50;
          const ap = win(t, 0.1 + i * 0.03, 0.3);
          if (ap <= 0) { idx += Array.from(ln).length; return; }
          let cx = x;
          for (const ch of Array.from(ln)) {
            const lit = clamp((t - tE - (idx / total) * 1.4) / 0.12);
            ctx.fillStyle = color.mix(T.mute, T.ink, lit);
            ctx.globalAlpha = ap;
            ctx.fillText(ch, cx, y + (1 - ap) * 20);
            cx += ctx.measureText(ch).width;
            idx++;
          }
        });
        ctx.globalAlpha = 1;
        slam(ctx, '— 阿哲', W - M, 950, 64, win(t, tM - 0.05, 0.35), 0, { w: 700, fam: T.serif, col: T.red, align: 'right' });
      },
    },
    {
      // the end card: the title, and the caret, waiting
      id: 'end', ch: 6, tail: 2.4, energy: 0.5, captions: 'file',
      sfx: [{ at: (s) => s.when('慢慢说', 2.2), type: 'chime', gain: 0.6 }],
      draw(ctx, s) {
        const t = s.t;
        const tS = s.when('慢慢说', 2.2);
        grid(ctx, 1, color.rgba(T.ink, 0.07));
        ctx.save();
        ctx.font = F(700, 64);
        ctx.fillStyle = T.ink;
        fx.wordReveal(ctx, '如果你也有话卡在心里，', X0, 330, t, { sync: s, dur: 0.3, rise: 0.2 });
        ctx.restore();
        const track = lerp(-6, 48, ease.inOutSine(clamp((t - tS) / 4)));
        const tw = slam(ctx, '慢慢说', X0, 700, 300, win(t, tS - 0.08, 0.45), 0, { track });
        const solid = t > s.dur - 1.3;
        if (t > tS + 0.4) {
          const on = solid || ((s.beat % 1) + 1) % 1 < 0.55;
          if (on) { ctx.fillStyle = T.red; ctx.fillRect(X0 + tw + 30, 700 - 250, 28, 290); }
        }
        ctx.save();
        ctx.font = F(500, 56);
        ctx.fillStyle = T.ink;
        fx.wordReveal(ctx, '总会有人愿意等你。', X0, 860, t, { sync: s, dur: 0.35, rise: 0.2 });
        ctx.restore();
      },
    },
  ],
});

// the classroom from above (drawn by `class` and `count`): `reader` is the desk reading now
function classroom(ctx, s, reader, p) {
  const t = s.t;
  ctx.fillStyle = T.ink;
  const bw = DESK.cols * DESK.w + (DESK.cols - 1) * DESK.gx;
  ctx.fillRect(DESK.x0, 180, bw * win(t, 0, 0.5), 12);
  ctx.globalAlpha = s.id === 'class' ? win(t, 0.3, 0.3) : 0;
  label(ctx, '讲台', DESK.x0, 160, T.ink, 'left', 22);
  ctx.globalAlpha = 1;
  for (let i = 0; i < DESK.cols * DESK.rows; i++) {
    const { x, y } = deskPos(i);
    const c = i % DESK.cols, r = Math.floor(i / DESK.cols);
    const q = s.id === 'class' ? win(t, s.onBeat(0) + (r + c) * 0.05, 0.35) : 1;
    if (q <= 0) continue;
    const me = i === DESK.me, reading = i === reader, done = i < reader;
    ctx.save();
    ctx.translate(x + DESK.w / 2, y + DESK.h / 2);
    ctx.scale(lerp(0.6, 1, q), lerp(0.6, 1, q));
    ctx.globalAlpha = q;
    if (me) {
      ctx.fillStyle = T.red;
      ctx.fillRect(-DESK.w / 2, -DESK.h / 2, DESK.w, DESK.h);
      ctx.font = F(900, 44);
      ctx.textAlign = 'center';
      ctx.fillStyle = T.paper;
      ctx.fillText('我', 0, 16);
    } else if (reading) {
      ctx.fillStyle = T.ink;
      ctx.fillRect(-DESK.w / 2, -DESK.h / 2, DESK.w, DESK.h);
    } else {
      ctx.strokeStyle = done ? T.mute : T.ink;
      ctx.lineWidth = 3;
      ctx.strokeRect(-DESK.w / 2, -DESK.h / 2, DESK.w, DESK.h);
    }
    ctx.restore();
  }
}
