<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dial indicator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@500;700&display=block" rel="stylesheet">
</head>
<body>
<script src="../../runtime/video-gaga.js"></script>
<script type="module">
// An isometric figure in a video: the anatomy kit's dial indicator (examples/
// dial-indicator in github.com/wheresryan22/anatomy), rebuilt so every part is
// a pure function of time. The carriage slides from block to block, the
// plunger springs onto the block under it, the needle turns by the same amount,
// and the reading on screen comes from the same model.
import * as k from 'https://cdn.jsdelivr.net/gh/wheresryan22/anatomy@dbf697a527bbf7d358668e1557cb1e35ff725d46/kit/iso-kit.mjs';
const { ease, clamp, lerp, draw, color } = CV;
const W = 1920, H = 1080;

// === THEME ===================================================================
const T = {
  bg: '#131313', ink: '#E6E6E6', accent: '#F2C14E', muted: '#8A8A8A',
  mono: '"JetBrains Mono", monospace', sans: 'Inter, sans-serif',
};
const iso = CV.iso({ paper: T.bg, ink: T.ink, lit: T.accent, weight: 1.4 });

// === MODEL (world units ≈ 1 px of the real thing, z up) =======================
const PLATE = { x: -128, y: -64, w: 262, d: 128, r: 8 }, PLATE_H = 12, FOOT_H = 5;
const MAG = { x: -112, y: -20, w: 44, d: 40, r: 3 }, MAG_H = 24;
const POST = [-98, 0], POST_TOP = 122, CLAMP_Z = 100;
const DIAL = [58, 0], DIAL_R = 20, DIAL_Z = 82, DIAL_H = 10, DIAL_TOP = DIAL_Z + DIAL_H;
const PER_TURN = 20;                       // one needle turn = 20 units of plunger travel
const RAIL_FROM = 2, RAIL_TO = 124;
const CARRIAGE = { x: -28, y: -24, w: 56, d: 48, r: 3 }, CARRIAGE_Z = 3, CARRIAGE_TOP = 8;
const BLOCKS = [18, 14, 10], BLOCK_W = 15.6, STEP = 16, TIP_R = 2.6;
const CENTRE = -24 + BLOCK_W / 2;
const STOPS = BLOCKS.map((_, i) => DIAL[0] - CENTRE - STEP * i);

const heightUnder = (cx) => {
  let top = CARRIAGE_TOP;
  BLOCKS.forEach((h, i) => {
    const from = cx - 24 + STEP * i, to = from + BLOCK_W;
    if (to > DIAL[0] - TIP_R && from < DIAL[0] + TIP_R) top = Math.max(top, CARRIAGE_TOP + h);
  });
  return top;
};
const blockUnder = (cx) => BLOCKS.findIndex((_, i) => { const from = cx - 24 + STEP * i; return DIAL[0] >= from && DIAL[0] <= from + BLOCK_W; });

// Motion as functions of time: the carriage is re-targeted at fixed moments;
// the plunger's targets are found once by sampling the carriage, then sprung.
const SLIDE = CV.spring({ ratio: 0.9, hz: 0.9 });
const TIP = { ratio: 0.63, hz: 3.3 };      // the kit's plunger spring (stiffness 420, damping 26)
const MOVES = [[0, STOPS[0]], [1.6, STOPS[1]], [3.6, STOPS[2]], [5.6, STOPS[1]], [9.4, STOPS[0]]];
const carriageAt = (t) => CV.springTrack(t, MOVES, SLIDE);
const TIP_KEYS = (() => {
  const keys = [[0, heightUnder(MOVES[0][1])]];
  for (let t = 0; t < 12; t += 1 / 240) {
    const h = heightUnder(carriageAt(t));
    if (h !== keys[keys.length - 1][1]) keys.push([t, h]);
  }
  return keys;
})();
const tipAt = (t) => CV.springTrack(t, TIP_KEYS, TIP);

// === GEOMETRY, built once ====================================================
const BOX = { w: 1500, h: 860 };
const P = k.fitProjection(
  [...k.boxCorners(PLATE, -PLATE_H - FOOT_H, 0), [POST[0], POST[1], POST_TOP + 2], [DIAL[0] + DIAL_R, 0, DIAL_TOP]],
  BOX.w, BOX.h, { pad: 30, azimuth: 42 },
);
const at = (p) => k.iso(p, P);
const byDepth = (pts) => [...pts].sort((a, b) => k.depthOf([a[0], a[1], 0], P) - k.depthOf([b[0], b[1], 0], P));

// Each part is a list of paint calls, so the painter's order is the list order.
const S = (paths, style) => (ctx) => iso.solid(ctx, paths, style);
const L = (d, style) => (ctx) => iso.line(ctx, d, style);
const D = (pts, style) => (ctx) => iso.dots(ctx, pts, style);
const Hl = (d, style) => (ctx) => iso.halo(ctx, d, style);

function plate() {
  const out = [Hl(k.haloOf(PLATE, -PLATE_H - FOOT_H, PLATE_H, P), { blur: 14, dy: 5 })];
  for (const [x, y] of byDepth(k.corners(PLATE, 22))) {
    out.push(S(k.cylinder(x, y, 7, -PLATE_H - FOOT_H, 1.6, P, 28), { tone: 'lo' }));
    out.push(S(k.cylinder(x, y, 5.4, -PLATE_H - FOOT_H + 1.6, FOOT_H - 1.6, P, 28), { tone: 'mid' }));
  }
  out.push(S(k.slabOf(PLATE, -PLATE_H, PLATE_H, P, 8, 1.6), { tone: 'mid' }));
  out.push(L(k.planOutline(k.insetPlan(PLATE, 5), 0, P), { tone: 'lo' }));
  const screws = k.corners(PLATE, 10);
  out.push(L(screws.map(([x, y]) => k.ring(x, y, 2.2, 0, P, 16)).join(''), { tone: 'lo' }));
  out.push(D(screws.map(([x, y]) => at([x, y, 0])), { size: 0.5 }));
  const strip = { x: -110, y: PLATE.y + PLATE.d - 15, w: 230, d: 7, r: 1 };
  out.push(S(k.slabOf(strip, 0, 0.6, P, 3), { tone: 'lo', crease: 'none' }));
  const ticks = k.topTicks(strip.x + 4, strip.x + strip.w - 4, 4, 5, strip.y + 0.8, 0.6, [2, 3.6], P);
  out.push(L(ticks.minor, { tone: 'lo' }), L(ticks.major, { tone: 'mid' }));
  out.push(D([at([strip.x + 2, strip.y + 3.5, 0.6]), at([strip.x + strip.w - 2, strip.y + 3.5, 0.6])], { size: 0.45 }));
  return out;
}
function rails() {
  const out = [];
  for (const y of [-20, 15]) {
    out.push(S(k.slabOf({ x: RAIL_FROM, y, w: RAIL_TO - RAIL_FROM, d: 5, r: 1 }, 0, 3, P, 3, 0.4), { tone: 'mid' }));
    out.push(D([RAIL_FROM + 6, RAIL_TO - 6].map((x) => at([x, y + 2.5, 3])), { size: 0.4 }));
  }
  for (const x of [RAIL_FROM - 5, RAIL_TO]) {
    out.push(S(k.slabOf({ x, y: -23, w: 5, d: 46, r: 1.2 }, 0, 7, P, 3, 0.5), { tone: 'mid' }));
    out.push(D([at([x + 2.5, -18, 7]), at([x + 2.5, 18, 7])], { size: 0.45 }));
  }
  return out;
}
function fixture() {
  const out = [];
  out.push(S(k.slabOf(MAG, 0, 11, P, 6, 0.8), { tone: 'mid' }));
  out.push(S(k.slabOf(k.insetPlan(MAG, 0.8), 11, MAG_H - 11, P, 6, 0.8), { tone: 'mid' }));
  out.push(L(k.planOutline(k.insetPlan(MAG, 3), MAG_H, P), { tone: 'faint' }));
  out.push(D([at([MAG.x + 5, MAG.y + 5, MAG_H]), at([MAG.x + 5, MAG.y + MAG.d - 5, MAG_H]), at([MAG.x + MAG.w - 5, MAG.y + 5, MAG_H])], { size: 0.45 }));
  const knob = [MAG.x + 32, MAG.y + 28];
  out.push(S(k.cylinder(knob[0], knob[1], 6, MAG_H, 4, P, 32), { tone: 'mid' }));
  out.push(L(k.knurl(knob[0], knob[1], 6, MAG_H, MAG_H + 4, 36, P), { tone: 'lo' }));
  out.push(L(k.lineOnTop([knob[0], knob[1]], [knob[0] + 6, knob[1]], MAG_H + 4, P), { tone: 'hi' }));
  out.push(D([at([knob[0], knob[1], MAG_H + 4])], { size: 0.5, tone: 'hi' }));
  out.push(S(k.cylinder(POST[0], POST[1], 5, MAG_H, 4, P, 28), { tone: 'mid' }));
  const clampPlan = { x: POST[0] - 7, y: POST[1] - 7, w: 14, d: 14, r: 2.5 };
  out.push(S(k.cylinder(POST[0], POST[1], 3.2, MAG_H + 4, CLAMP_Z - 4 - MAG_H - 4, P, 28), { tone: 'mid', crease: 'none' }));
  out.push(L([60, 80].map((z) => k.sideArc(POST[0], POST[1], 3.2, z, P, 16)).join(''), { tone: 'faint' }));
  out.push(S(k.slabOf(clampPlan, CLAMP_Z - 4, 12, P, 4, 0.6), { tone: 'mid' }));
  out.push(S(k.cylinder(POST[0], POST[1], 3.2, CLAMP_Z + 8, POST_TOP - CLAMP_Z - 8, P, 28), { tone: 'mid', crease: 'none' }));
  out.push(S(k.cylinder(POST[0], POST[1], 3.8, POST_TOP, 2, P, 28), { tone: 'mid' }));
  const arm = { x: POST[0] + 7, y: -3, w: DIAL[0] - DIAL_R - POST[0] - 7 + 2, d: 6, r: 2 };
  out.push(S(k.slabOf(arm, CLAMP_Z, 4, P, 4, 0.5), { tone: 'mid' }));
  out.push(D([at([arm.x + 4, 0, CLAMP_Z + 4]), at([arm.x + arm.w - 5, 0, CLAMP_Z + 4])], { size: 0.45 }));
  const thumb = [clampPlan.x + 7, clampPlan.y + clampPlan.d + 3];
  out.push(S(k.slabOf({ x: thumb[0] - 1.4, y: clampPlan.y + clampPlan.d, w: 2.8, d: 3, r: 0.8 }, CLAMP_Z + 1, 4, P, 2), { tone: 'mid', crease: 'none' }));
  out.push(S(k.cylinder(thumb[0], thumb[1] + 1.4, 2.6, CLAMP_Z, 6, P, 20), { tone: 'mid' }));
  out.push(L(k.knurl(thumb[0], thumb[1] + 1.4, 2.6, CLAMP_Z, CLAMP_Z + 6, 18, P), { tone: 'lo' }));
  return out;
}
function carriage() {
  const out = [Hl(k.haloOf(k.insetPlan(CARRIAGE, 3), CARRIAGE_Z, 0.1, P), { blur: 4, dy: 2 })];
  out.push(S(k.slabOf(CARRIAGE, CARRIAGE_Z, CARRIAGE_TOP - CARRIAGE_Z, P, 5, 0.6), { tone: 'mid' }));
  out.push(D([-22, -8, 8, 22].map((x) => at([x, CARRIAGE.y + CARRIAGE.d - 2.6, CARRIAGE_TOP])), { size: 0.4, tone: 'lo' }));
  out.push(L(k.lineOnTop([CARRIAGE.x, -15.5], [CARRIAGE.x + CARRIAGE.w, -15.5], CARRIAGE_TOP, P), { tone: 'faint' }));
  out.push(L(k.lineOnTop([CARRIAGE.x, 15.5], [CARRIAGE.x + CARRIAGE.w, 15.5], CARRIAGE_TOP, P), { tone: 'faint' }));
  BLOCKS.forEach((h, i) => {
    const plan = { x: -24 + STEP * i, y: -12, w: BLOCK_W, d: 24, r: 1 };
    out.push(S(k.slabOf(plan, CARRIAGE_TOP, h, P, 3, 0.5), { tone: 'hi', crease: 'lo' }));
    out.push(L(k.planOutline(k.insetPlan(plan, 2), CARRIAGE_TOP + h, P, 3), { tone: 'faint' }));
  });
  const handle = [CARRIAGE.x + CARRIAGE.w - 8, CARRIAGE.y + CARRIAGE.d + 3];
  out.push(S(k.slabOf({ x: handle[0] - 2, y: CARRIAGE.y + CARRIAGE.d - 1, w: 4, d: 4, r: 1 }, CARRIAGE_Z + 1, 3, P, 2), { tone: 'mid', crease: 'none' }));
  out.push(S(k.cylinder(handle[0], handle[1] + 1, 3, CARRIAGE_Z, 5, P, 20), { tone: 'mid' }));
  out.push(L(k.knurl(handle[0], handle[1] + 1, 3, CARRIAGE_Z, CARRIAGE_Z + 5, 18, P), { tone: 'lo' }));
  return out;
}
function plunger() {
  return [
    S(k.cylinder(DIAL[0], DIAL[1], TIP_R, 0, 2.4, P, 20), { tone: 'hi', lit: true }),
    S(k.cylinder(DIAL[0], DIAL[1], 1.4, 2.4, 50, P, 16), { tone: 'hi', crease: 'none', lit: true }),
  ];
}
function dial() {
  const out = [];
  const [x, y] = DIAL;
  out.push(S(k.cylinder(x, y, 2.9, 54, DIAL_Z - 54, P, 20), { tone: 'mid' }));
  out.push(L(k.sideArc(x, y, 2.9, 60, P, 12), { tone: 'lo' }));
  out.push(S(k.slabOf({ x: x - DIAL_R - 6, y: -4, w: 8, d: 8, r: 1.5 }, DIAL_Z + 2, CLAMP_Z - DIAL_Z - 2, P, 3, 0.4), { tone: 'mid' }));
  out.push(S(k.cylinder(x, y, DIAL_R, DIAL_Z, DIAL_H, P, 64, 0.8), { tone: 'hi', crease: 'lo' }));
  out.push(L(k.knurl(x, y, DIAL_R, DIAL_TOP - 3.4, DIAL_TOP, 84, P, 0.3), { tone: 'lo' }));
  out.push(L(k.sideArc(x, y, DIAL_R, DIAL_TOP - 3.4, P, 40), { tone: 'faint' }));
  out.push(L(k.ring(x, y, DIAL_R - 2.2, DIAL_TOP, P, 64), { tone: 'lo' }));
  const ticks = k.radialTicks(x, y, DIAL_R - 3, 50, 5, DIAL_TOP, [1.3, 2.8], P);
  out.push(L(ticks.minor, { tone: 'lo' }), L(ticks.major, { tone: 'mid' }));
  out.push(S(k.slabOf({ x: x + DIAL_R - 1, y: -2.4, w: 5, d: 4.8, r: 1.2 }, DIAL_Z + 2, 5, P, 3), { tone: 'mid' }));
  out.push(S(k.slabOf({ x: x + DIAL_R + 3.6, y: -3.2, w: 2.6, d: 6.4, r: 1.2 }, DIAL_Z + 1.2, 6.6, P, 3), { tone: 'mid' }));
  out.push(L(k.ring(x, y, 1.6, DIAL_TOP, P, 16), { tone: 'mid' }));
  return out;
}
const needleAt = (turn) => {
  const a = turn * Math.PI * 2, [x, y] = DIAL;
  return k.lineOnTop([x - Math.sin(a) * 3.4, y + Math.cos(a) * 3.4], [x + Math.sin(a) * (DIAL_R - 4), y - Math.cos(a) * (DIAL_R - 4)], DIAL_TOP + 0.2, P);
};
const PARTS = { plate: plate(), rails: rails(), fixture: fixture(), carriage: carriage(), plunger: plunger(), dial: dial() };
const paint = (ctx, list) => { for (const f of list) f(ctx); };

// The whole figure at time t, in its BOX (0..BOX.w, 0..BOX.h).
function figure(ctx, t) {
  const cx = carriageAt(t), tip = tipAt(t);
  paint(ctx, PARTS.plate);
  paint(ctx, PARTS.rails);
  paint(ctx, PARTS.fixture);
  const [mx, my] = k.axisVector(P, [cx, 0, 0]);
  ctx.save(); ctx.translate(mx, my); paint(ctx, PARTS.carriage); ctx.restore();
  const [px, py] = k.axisVector(P, [0, 0, tip]);
  ctx.save(); ctx.translate(px, py); paint(ctx, PARTS.plunger); ctx.restore();
  paint(ctx, PARTS.dial);
  iso.line(ctx, needleAt((tip - CARRIAGE_TOP) / PER_TURN), { tone: 'lit', width: 2.2 });
  return { cx, tip };
}
const OX = (W - BOX.w) / 2, OY = (H - BOX.h) / 2 + 30;
const dialOnScreen = (() => { const [x, y] = at([DIAL[0], DIAL[1], DIAL_TOP]); return [OX + x, OY + y]; })();

function readout(ctx, s, cx, tip, x, y, size) {
  const i = blockUnder(cx);
  ctx.save();
  ctx.font = `600 ${size}px ${T.mono}`;
  ctx.fillStyle = T.ink;
  ctx.textAlign = 'right';
  ctx.fillText(`${(tip - CARRIAGE_TOP).toFixed(1)}`, x, y);
  ctx.font = `400 ${Math.round(size * 0.42)}px ${T.mono}`;
  ctx.fillStyle = T.muted;
  ctx.fillText(i < 0 ? 'BETWEEN BLOCKS' : `BLOCK ${i + 1} · READS`, x, y - size * 1.0);
  ctx.restore();
}

CV.create({
  width: W, height: H, fps: 30,
  background: T.bg,
  lang: 'en',
  scenes: [
    {
      id: 'bench', duration: 7.6,
      draw(ctx, s) {
        const rise = ease.enter(s.at(0, 1.2));
        ctx.save();
        ctx.globalAlpha = rise;
        ctx.translate(OX, OY + (1 - rise) * 24);
        const { cx, tip } = figure(ctx, s.t);
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = ease.enter(s.at(0.6, 0.8));
        ctx.font = `700 44px ${T.sans}`;
        ctx.fillStyle = T.ink;
        ctx.fillText('A dial reads what it rests on.', 120, 150);
        ctx.restore();
        ctx.globalAlpha = ease.enter(s.at(1.2, 0.6));
        readout(ctx, s, cx, tip, W - 120, H - 120, 96);
        ctx.globalAlpha = 1;
      },
    },
    {
      id: 'dial', duration: 5,     // a cut on the same framing: the push carries on from the bench
      draw(ctx, s) {
        // the camera pushes in on the dial; lines keep their width on screen
        const t = s.T;                        // the machine keeps running from where the bench left it
        const push = ease.inOutCubic(s.at(0, 3.2));
        draw.camera(ctx, W, H, { zoom: lerp(1, 3.4, push), focusX: lerp(W / 2, dialOnScreen[0], push), focusY: lerp(H / 2, dialOnScreen[1] - 20, push) }, () => {
          ctx.save(); ctx.translate(OX, OY); figure(ctx, t); ctx.restore();
        });
        const cx = carriageAt(t), tip = tipAt(t);
        ctx.globalAlpha = ease.enter(s.at(1.8, 0.8));
        readout(ctx, s, cx, tip, W - 120, H - 120, 120);
        ctx.globalAlpha = 1;
      },
    },
  ],
});
</script>
</body>
</html>
