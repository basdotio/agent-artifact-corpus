<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Motion Video Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- make.mjs replaces this link with the story's font. -->
<link id="font" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&display=block" rel="stylesheet" />
<style>
  :root { --page: #e9e7e1; --ink: #1c1c1b; --muted: #6b6a66; --control: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --page: #121211; --ink: #f4f3ef; --muted: #9a9993; --control: #1f1f1d; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; overflow: hidden; }
  #frame { max-height: calc(100vh - 90px); max-width: calc(100vw - 32px); height: 100%; position: relative; border-radius: 18px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.18); }
  #frame > * { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .controls { display: flex; align-items: center; gap: 10px; width: min(100%, 560px); }
  .controls button { font: 600 14px system-ui, sans-serif; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--control); color: var(--ink); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.12); min-width: 76px; }
  .controls input { flex: 1; }
  .controls time { font: 500 13px system-ui, sans-serif; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
  body.capture { padding: 0; display: block; background: #000; }
  body.capture #frame { max-width: none; max-height: none; border-radius: 0; box-shadow: none; }
  body.capture .controls { display: none; }
</style>
</head>
<body>
<div id="frame">
  <svg id="back" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
  <canvas id="media"></canvas>
  <svg id="front" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Motion video"></svg>
</div>
<div class="controls">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="60" step="0.001" value="0" aria-label="Timeline" />
  <time id="clock">0.00s</time>
</div>
<audio id="sound" src="soundtrack.wav" preload="auto"></audio>
<script src="story.js"></script>
<script src="voices.js"></script>
<script src="media.js"></script>
<script>
  // In capture mode the frame is exactly the video size.
  if (new URLSearchParams(location.search).has("capture")) {
    const f = document.getElementById("frame");
    f.style.width = `${window.STORY.format?.width ?? 1080}px`;
    f.style.height = `${window.STORY.format?.height ?? 1920}px`;
  }
</script>
<script src="engine.js"></script>
</body>
</html>
