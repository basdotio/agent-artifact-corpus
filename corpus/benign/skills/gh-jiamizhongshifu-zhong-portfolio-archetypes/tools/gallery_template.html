<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设计师网站总览</title>
<style>
:root { --bg:#f6f5f2; --card:#fff; --ink:#1b1b1a; --sub:#77746d; --line:#e4e1da; --chip:#efece6; --on:#1b1b1a; --onInk:#fff; }
@media (prefers-color-scheme: dark) { :root { --bg:#141413; --card:#1e1e1c; --ink:#ecebe7; --sub:#97948c; --line:#2e2d2a; --chip:#2a2926; --on:#ecebe7; --onInk:#141413; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 20px; }
h1 { margin:0 0 4px; font-size:18px; }
.meta { color:var(--sub); font-size:12px; }
.filters { display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; }
.group { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
.group b { font-size:12px; color:var(--sub); font-weight:500; margin-right:2px; }
button { border:0; background:var(--chip); color:var(--ink); padding:3px 9px; border-radius:99px; font-size:12px; cursor:pointer; }
button.on { background:var(--on); color:var(--onInk); }
input { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:4px 10px; font-size:13px; width:200px; }
main { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; padding:20px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
.shots { position:relative; aspect-ratio:16/10; background:var(--chip); }
.shots img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
.shots img.alt { position:absolute; inset:0; opacity:0; transition:opacity .2s; }
.card:hover .shots img.alt { opacity:1; }
.mob { position:absolute; right:8px; bottom:8px; width:22%; border-radius:6px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.25); aspect-ratio:390/844; }
.mob img { width:100%; height:100%; object-fit:cover; object-position:top; }
.body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; }
.name { font-weight:600; display:flex; justify-content:space-between; gap:8px; }
.name a { color:inherit; text-decoration:none; }
.name a:hover { text-decoration:underline; }
.id { color:var(--sub); font-weight:400; font-variant-numeric:tabular-nums; }
.tags { display:flex; flex-wrap:wrap; gap:4px; }
.tag { background:var(--chip); border-radius:4px; padding:0 6px; font-size:11px; color:var(--sub); }
.tag.hot { color:var(--ink); }
.pal { display:flex; height:8px; border-radius:4px; overflow:hidden; }
.font { font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fail { padding:20px; color:var(--sub); font-size:12px; }
@media (max-width:600px) { header { padding:12px 16px; } main { padding:16px; grid-template-columns:1fr; } input { width:100%; } }
</style>
</head>
<body>
<header>
  <h1>设计师网站总览</h1>
  <div class="meta" id="meta"></div>
  <div class="filters" id="filters"></div>
</header>
<main id="grid"></main>
<script>
const DATA = /*DATA*/null;
const FILTERS = {
  archetype: { label: '原型', get: s => s.archetype ? (DATA.archetypes[s.archetype]?.zh || s.archetype) : undefined },
  kind: { label: '类型', get: s => s.kind },
  theme: { label: '明暗', get: s => s.color?.theme },
  motionLevel: { label: '动效', get: s => s.motionLevel },
  builder: { label: '搭建', get: s => s.builder },
  is3D: { label: '3D', get: s => s.ok ? (s.is3D ? '3D' : '非3D') : undefined },
  heroClass: { label: '标题字体', get: s => s.typography?.heroClass },
};
const state = Object.fromEntries(Object.keys(FILTERS).map(k => [k, null]));
let query = '';
const sites = DATA.sites;
const $ = s => document.querySelector(s);

function renderFilters() {
  const box = $('#filters');
  box.innerHTML = '';
  const search = document.createElement('input');
  search.placeholder = '搜索名字 / 字体 / 技术';
  search.value = query;
  search.oninput = e => { query = e.target.value.toLowerCase(); renderGrid(); };
  box.appendChild(search);
  for (const [key, f] of Object.entries(FILTERS)) {
    const counts = {};
    sites.forEach(s => { const v = f.get(s); if (v !== undefined && v !== null) counts[v] = (counts[v] || 0) + 1; });
    const g = document.createElement('div');
    g.className = 'group';
    g.innerHTML = `<b>${f.label}</b>`;
    for (const [v, n] of Object.entries(counts).sort((a, b) => b[1] - a[1])) {
      const btn = document.createElement('button');
      btn.textContent = `${v} ${n}`;
      if (state[key] === v) btn.className = 'on';
      btn.onclick = () => { state[key] = state[key] === v ? null : v; renderFilters(); renderGrid(); };
      g.appendChild(btn);
    }
    box.appendChild(g);
  }
}

function card(s) {
  const el = document.createElement('article');
  el.className = 'card';
  const sh = s.screenshots || {};
  const tags = s.ok ? [
    [s.archetype && (DATA.archetypes[s.archetype]?.zh || s.archetype), true], [s.kind, false], [s.builder, s.builder !== 'custom-code'], [s.framework, false],
    ...(s.motionLibs || []).map(m => [m, true]),
    [s.webgl && 'WebGL', true], [s.layout?.customCursor && '自定义光标', true], [s.layout?.preloader && 'preloader', true],
    [s.layout?.pageTransitions && '页面转场', true], [s.color?.theme, false], [s.color?.saturation, false],
    ...(s.roles || []).map(r => [r, false]),
  ].filter(t => t[0]) : [];
  const pal = (s.color?.palette || []).map(p => `<i style="flex:${p.share};background:${p.hex}"></i>`).join('');
  el.innerHTML = `
    <div class="shots">
      ${sh.desktop ? `<img loading="lazy" src="${sh.desktop}" alt="">` : ''}
      ${sh['desktop-2'] ? `<img class="alt" loading="lazy" src="${sh['desktop-2']}" alt="">` : ''}
      ${sh.mobile ? `<div class="mob"><img loading="lazy" src="${sh.mobile}" alt=""></div>` : ''}
    </div>
    <div class="body">
      <div class="name"><a href="${s.url}" target="_blank" rel="noopener">${s.name}</a><span class="id">#${s.id}</span></div>
      ${s.ok ? `<div class="pal">${pal}</div>
      <div class="font">${s.typography?.heroFont || '—'} · ${Math.round(s.typography?.heroSizePx || 0)}px · ${s.typography?.heroScale}</div>
      <div class="tags">${tags.map(([t, hot]) => `<span class="tag${hot ? ' hot' : ''}">${t}</span>`).join('')}</div>`
      : `<div class="fail">抓取失败：${s.error || '未知'}</div>`}
    </div>`;
  return el;
}

function renderGrid() {
  const grid = $('#grid');
  grid.innerHTML = '';
  const list = sites.filter(s => Object.entries(state).every(([k, v]) => v === null || FILTERS[k].get(s) === v)
    && (!query || JSON.stringify([s.name, s.title, s.typography, s.motionLibs, s.builder, s.framework, s.roles]).toLowerCase().includes(query)));
  list.forEach(s => grid.appendChild(card(s)));
  $('#meta').textContent = `显示 ${list.length} / ${sites.length} · 抓取成功 ${DATA.okCount} · 悬停卡片看第二屏 · 来源：${DATA.source}`;
}
renderFilters();
renderGrid();
</script>
</body>
</html>
