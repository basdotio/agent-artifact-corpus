name: CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint and Syntax Validation
      run: |
        python -m py_compile scripts/builder.py
        python -m py_compile scripts/render_terminal.py
        python -m py_compile scripts/qa_inspector.py
        python -m py_compile scripts/init_config.py
