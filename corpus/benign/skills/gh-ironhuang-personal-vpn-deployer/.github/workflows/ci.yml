name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash 语法检查 (bash -n)
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/diagnose.sh

      - name: 安装 shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck（仅 error 级阻断，warning 不影响构建）
        run: shellcheck --severity=error scripts/deploy.sh scripts/diagnose.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Python 语法检查 (py_compile)
        run: python -m py_compile scripts/gen_client.py
