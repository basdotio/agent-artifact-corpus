# Package-owned transport contract, not a native vendor import format.
# Date rule: playbooks/research-and-memory.md#ask-date-rule
# Fill null fields from actual evidence before requesting gate acceptance.
# Reviewer returns this body; Coordinator captures it unchanged.
stage: null
status: BLOCKED
input_revision: null
artifact_revision: null
producer_role: null
producer_model_family: null
artifacts: []
checks: []
limitations: []
next_owner: null
changed_assumptions: []
framing_reset: null
# Each check: name/check ID, result, artifact revision, method, environment,
# inputs/claim IDs, actual run/access time, observed result and evidence path.
# Research checks link scope date/rung/precision, library revision,
# source-opening receipts, staleness and any derived-floor qualification.
# Model-family evidence belongs in a check; a role label is not family proof.
# Explicit empty lists mean none, not missing. Null required fields block acceptance.
# PASS requires actual opened artifacts and completed checks, never proposed actions.
