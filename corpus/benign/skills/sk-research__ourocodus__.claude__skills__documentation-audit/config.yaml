# Documentation Audit Configuration

# Exclusions - paths to skip during audit
exclusions:
  # Vendor dependencies
  - "vendor/**"
  - "third_party/**"

  # Build artifacts
  - "build/**"
  - "dist/**"
  - "bin/**"

  # Auto-generated code
  - "**/*.pb.go"
  - "**/*_gen.go"
  - "**/*_generated.go"
  - "mocks/**"

  # Version control and IDE
  - ".git/**"
  - ".github/**"
  - ".worktrees/**"
  - "node_modules/**"
  - ".vscode/**"
  - ".idea/**"

# Documentation patterns to discover
doc_patterns:
  - "README.md"
  - "CONTRIBUTING.md"
  - "SECURITY.md"
  - "CODE_OF_CONDUCT.md"
  - "LICENSE"
  - "docs/**/*.md"
  - "doc.go"
  - "**/doc.go"
  - "pkg/**/README.md"
  - "cmd/**/README.md"
