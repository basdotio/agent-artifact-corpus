table: documents
label: Documents
unique:
- name
due_fields:
- expires_at
columns:
  name:
    type: text
    required: true
    aliases:
    - Document name
    - Document
  category:
    type: text
  reference:
    type: text
    sensitive: true
  expires_at:
    type: date
    aliases:
    - Expiry date
    - Expiration
  location:
    type: text
    sensitive: true
  notes:
    type: text
