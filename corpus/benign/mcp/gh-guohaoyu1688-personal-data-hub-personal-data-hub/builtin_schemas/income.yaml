table: income
label: Income
unique:
- date
- category
- reference
columns:
  date:
    type: date
    required: true
  category:
    type: text
    required: true
  reference:
    type: text
    required: true
  amount:
    type: decimal
    required: true
    sensitive: true
  currency:
    type: text
    default: CNY
  notes:
    type: text
