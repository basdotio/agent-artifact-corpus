<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shader Preview — MCP App Sample</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--color-background-primary, #000);
        color: var(--color-text-primary, #fff);
        font-family: var(--font-mono, monospace);
      }
      #wrap {
        position: relative;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #preview {
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        max-height: 40%;
        overflow: auto;
        padding: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #0f0;
        font-size: 0.75rem;
        white-space: pre-wrap;
        border-radius: 4px;
        display: none;
      }
      #info {
        position: absolute;
        bottom: 8px;
        left: 8px;
        font-size: 0.75rem;
        opacity: 0.7;
      }
      #fs {
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        border: 1px solid #444;
        border-radius: 4px;
        font: inherit;
        font-size: 0.75rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="c"></canvas>
      <pre id="preview"></pre>
      <div id="info">shader idle</div>
      <button id="fs">⛶ Fullscreen</button>
    </div>
    <script type="module" src="/src/shader.ts"></script>
  </body>
</html>
