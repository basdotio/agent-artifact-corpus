<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard — MCP App Sample</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: var(--font-sans, system-ui, sans-serif);
        background: var(--color-background-primary, #fff);
        color: var(--color-text-primary, #000);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }
      .info {
        opacity: 0.7;
        font-size: 0.85rem;
        margin-bottom: 12px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .metric {
        border: 1px solid var(--color-border, #ccc);
        border-radius: var(--border-radius-md, 6px);
        padding: 8px;
      }
      .metric .label {
        font-size: 0.75rem;
        opacity: 0.7;
      }
      .metric .value {
        font-size: 1.4rem;
        font-weight: 600;
      }
      .bar-chart {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 60px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--color-border, #ccc);
      }
      .bar {
        flex: 1;
        background: var(--color-accent-primary, #3b82f6);
        border-radius: 2px 2px 0 0;
        transition: height 0.3s;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
      button {
        padding: 6px 10px;
        background: var(--color-button-background, #e5e7eb);
        color: var(--color-button-text, inherit);
        border: 1px solid var(--color-border, #ccc);
        border-radius: var(--border-radius-md, 4px);
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        opacity: 0.9;
      }
      .log {
        margin-top: 12px;
        padding: 8px;
        background: var(--color-background-secondary, #f4f4f4);
        border-radius: 4px;
        max-height: 120px;
        overflow-y: auto;
        font-family: var(--font-mono, monospace);
        font-size: 0.75rem;
      }
      .log .entry {
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Dashboard</h1>
    <div class="info" id="info">Connecting…</div>
    <div class="metrics" id="metrics"></div>
    <div class="bar-chart" id="chart"></div>
    <div class="actions">
      <button id="refresh">Refresh (app-only tool)</button>
      <button id="fullscreen">Toggle Fullscreen</button>
      <button id="send-message">Send Message to Chat</button>
      <button id="update-context">Update Model Context</button>
      <button id="open-link">Open Link</button>
      <button id="call-echo">Call echo Tool</button>
    </div>
    <div class="log" id="log"></div>
    <script type="module" src="/src/dashboard.ts"></script>
  </body>
</html>
