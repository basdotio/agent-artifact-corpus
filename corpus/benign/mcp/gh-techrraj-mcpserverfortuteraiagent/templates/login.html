<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP RAG - Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>MCP RAG Assistant</h1>
        <p class="subtitle">Multi-department AI assistant</p>

        <div class="tabs">
            <button class="tab active" onclick="showTab('login', event)">Login</button>
            <button class="tab" onclick="showTab('register', event)">Register</button>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>

        <form id="register-form" onsubmit="handleRegister(event)" style="display:none;">
            <input type="email" id="reg-email" placeholder="Email" required>
            <input type="password" id="reg-password" placeholder="Password" required>
            <label style="font-size:13px; color:#888; margin-top:8px;">Your department:</label>
            <select id="reg-department" required></select>
            <button type="submit">Create Account</button>
        </form>

        <p id="auth-error" class="error"></p>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
