<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - MCP RAG</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="chat-page">
    <header>
        <div class="brand">MCP RAG Assistant</div>
        <div class="user-info">
            <span id="user-dept" style="color:#3b82f6; font-weight:500;"></span>
            <span id="user-email"></span>
            <a href="/admin" id="admin-link" style="display:none;">Admin</a>
            <button onclick="logout()">Logout</button>
        </div>
    </header>

    <main class="chat-container">
        <div id="messages" class="messages">
            <div class="welcome">
                <h2>👋 Welcome</h2>
                <p>Ask anything about the documents in your department's knowledge base.</p>
            </div>
        </div>

        <div class="input-bar">
            <input type="text" id="question" placeholder="Ask a question..."
                   onkeypress="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </main>

    <script src="/static/script.js"></script>
    <script>initChat();</script>
</body>
</html>
