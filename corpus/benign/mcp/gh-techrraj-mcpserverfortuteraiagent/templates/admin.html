<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - MCP RAG</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-page">
    <header>
        <div class="brand">Admin Panel</div>
        <div class="user-info">
            <a href="/chat">← Back to Chat</a>
            <button onclick="logout()">Logout</button>
        </div>
    </header>

    <main class="admin-container">
        <section class="admin-card">
            <h2>📊 Stats</h2>
            <div id="stats"></div>
        </section>

        <section class="admin-card">
            <h2>🏢 Departments</h2>
            <div style="display:flex; gap:8px; margin-bottom:12px;">
                <input type="text" id="new-dept-name" placeholder="Department name (e.g., Finance)" style="flex:1;">
                <input type="text" id="new-dept-desc" placeholder="Description (optional)" style="flex:2;">
                <button onclick="createDepartment()">Add</button>
            </div>
            <div id="departments"></div>
        </section>

        <section class="admin-card">
            <h2>📤 Upload Document</h2>
            <label style="font-size:13px; color:#888; display:block; margin-bottom:6px;">Target department:</label>
            <select id="upload-department" style="width:100%; margin-bottom:12px;"></select>
            <textarea id="doc-content" placeholder="Paste document content here..." rows="8"></textarea>
            <input type="text" id="doc-source" placeholder="Source name (e.g., HR Policy)">
            <button onclick="uploadDoc()">Upload</button>
        </section>

        <section class="admin-card">
            <h2>📚 All Documents</h2>
            <div id="documents"></div>
        </section>

        <section class="admin-card">
            <h2>👥 Users</h2>
            <div id="users"></div>
        </section>
    </main>

    <script src="/static/script.js"></script>
    <script>initAdmin();</script>
</body>
</html>
