[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-linkedin"
version = "1.0.0"
description = "Professional Model Context Protocol (MCP) server for LinkedIn automation and AI agents with FastMCP, Playwright, and Human-in-the-Loop safeguards."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jesús Moronta" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "linkedin",
    "fastmcp",
    "playwright",
    "ai-agents",
    "human-in-the-loop",
    "automation",
    "productivity"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "mcp>=1.2.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "websocket-client>=1.8.0"
]

[project.urls]
Homepage = "https://github.com/solari21/mcp-linkedin"
Repository = "https://github.com/solari21/mcp-linkedin"
Issues = "https://github.com/solari21/mcp-linkedin/issues"

[project.scripts]
mcp-linkedin = "linkedin_server:main"
linkedin-mcp = "linkedin_server:main"

[tool.setuptools]
py-modules = ["linkedin_server", "linkedin_extended", "linkedin_interactive_login"]
