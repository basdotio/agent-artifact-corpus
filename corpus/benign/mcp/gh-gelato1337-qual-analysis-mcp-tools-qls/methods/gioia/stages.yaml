# Gioia: the stages of a run, in order. The researcher moves a run from one stage to the next
# (`qls stage RUN next`); agents cannot. In each stage an agent may use the method actions in
# `create` and change (revise, merge, withdraw, regroup, add evidence to) objects of the types in
# `edit`. Memos, codebook proposals and checkpoints are allowed in every stage. Researchers are
# not limited by stages. A stage change is an event, so a run can be forked at the start of any
# stage (`qls run fork RUN --at-stage themes`).
stages:
  - id: calibrate
    title: Calibration on a few interviews; codebook v1
    create: [add_concept]
    edit: [concept]
  - id: first_order
    title: 1st-order concepts for the remaining interviews
    create: [add_concept]
    edit: [concept]
  - id: themes
    title: 2nd-order themes
    create: [add_theme]
    edit: [concept, theme]
  - id: dimensions
    title: Aggregate dimensions and negative cases
    create: [add_dimension]
    edit: [theme, dimension]
  - id: revise
    title: Revisit the whole structure; the grounded model
    create: [add_concept, add_theme, add_dimension]
    edit: [concept, theme, dimension]
