# Content analysis: the stages of a run, in order. The researcher moves a run from one stage to the
# next (`qls stage RUN next`); agents cannot. `create` = method actions an agent may use in the stage,
# `edit` = object types it may change. Memos, codebook proposals and checkpoints are always allowed.
# `run` tells `qls pipeline` how to schedule sessions: once (one session), per_source (one session per
# interview, then the `after` task once).
stages:
  - id: frame
    title: Set up the coding frame from the brief
    create: [add_category]
    edit: [content-category]
    run: once
    task: frame
  - id: guide_coding
    title: Code every interview into the guide's categories
    create: [code_segment]
    edit: [segment]
    run: per_source
    sources: uncoded
    task: guide_coding
    after: guide_review
  - id: emergent
    title: Let finer categories emerge within the guide's categories
    create: [add_category]
    edit: [segment, content-category]
    run: once
    task: emergent
  - id: theory
    title: Re-read the coded material through the theory frame
    create: [add_category]
    edit: [segment, content-category]
    run: once
    task: theory
  - id: cases
    title: Case descriptions and growth paths, then the cross-case answer
    create: []
    edit: [segment]
    run: per_source
    sources: all
    task: case
    after: synthesis
