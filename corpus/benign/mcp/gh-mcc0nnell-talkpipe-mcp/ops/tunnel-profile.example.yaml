# Example only. No tunnel identifiers, keys, or environment-specific private data.
# Generate the real profile using scripts/private-tunnel.sh configure.
config_version: 1
control_plane:
  base_url: "https://api.openai.com"
  tunnel_id: "tunnel_REPLACE_WITH_PLATFORM_ID"
  api_key: "file:/home/REPLACE_USER/.config/tunnel-client/windanvil-runtime-key"
health:
  listen_addr: "127.0.0.1:0"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  commands:
    - channel: main
      command: "/home/REPLACE_USER/lab/talkpipe-runtime/.venv/bin/python -u /home/REPLACE_USER/lab/talkpipe-mcp/windanvil_commander_mcp.py"
