[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wikipeatia-mcp"
version = "1.0.0"
description = "MCP server for WikiPeatia: Ray Peat wiki + full corpus search (articles, books, interviews, newsletters)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Berkay Çelik" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "ray-peat",
    "wikipeatia",
    "bioenergetics",
    "health",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/BerkayCelk/wikipeatia-mcp"
"Bug Tracker" = "https://github.com/BerkayCelk/wikipeatia-mcp/issues"
"Data: WikiPeatia" = "https://wikipeatia.org"

[project.scripts]
wikipeatia-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
