[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-mcp-server"
version = "0.1.0"
description = "An MCP server that exposes your GitHub profile and repository data to Claude"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Omkar Ramesh", email = "omkarr1012@gmail.com"},
]
license = {text = "MIT"}
dependencies = [
    "mcp>=0.1.0",
    "requests>=2.31.0",
]

[project.urls]
Repository = "https://github.com/Thunderx10/github-mcp-server"
