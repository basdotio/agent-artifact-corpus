[project]
name = "mcp-aca"
version = "0.1.0"
description = "MCP Server Solution Accelerator for Azure Container Apps"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp[fastmcp]>=1.0.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
mcp-aca = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
