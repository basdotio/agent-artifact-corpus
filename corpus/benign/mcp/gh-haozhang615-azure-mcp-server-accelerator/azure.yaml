name: mcp-aca
metadata:
  template: mcp-aca@0.0.1-beta

# Infrastructure configuration
infra:
  provider: bicep
  path: infra
  module: main

workflows:
  up:
    steps:
      - azd: provision
      - azd: deploy

services:
  slogan-mcp-python:
    project: .
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      context: .
      target: release

hooks:
  preprovision:
    posix:
      shell: sh
      run: |
        echo "🔧 Preparing deployment configuration..."
        # Ensure we have required environment variables set by azd prompts
        if [ -z "$AZURE_ENV_NAME" ]; then
          echo "❌ Environment name not set"
          exit 1
        fi
        if [ -z "$AZURE_LOCATION" ]; then
          echo "❌ Location not set"
          exit 1
        fi
        echo "✅ Environment: $AZURE_ENV_NAME"
        echo "✅ Location: $AZURE_LOCATION"
    windows:
      shell: pwsh
      run: |
        Write-Host "🔧 Preparing deployment configuration..." -ForegroundColor Cyan
        # Ensure we have required environment variables set by azd prompts
        if (-not $env:AZURE_ENV_NAME) {
          Write-Host "❌ Environment name not set" -ForegroundColor Red
          exit 1
        }
        if (-not $env:AZURE_LOCATION) {
          Write-Host "❌ Location not set" -ForegroundColor Red
          exit 1
        }
        Write-Host "✅ Environment: $env:AZURE_ENV_NAME" -ForegroundColor Green
        Write-Host "✅ Location: $env:AZURE_LOCATION" -ForegroundColor Green
  
  postprovision:
    posix:
      shell: sh
      run: |
        echo "🎉 Infrastructure provisioned successfully!"
        echo "🔗 Your MCP server will be available at the Container App URL shown above"
        echo "📝 Test your deployment with: curl https://your-app-url/mcp"
    windows:
      shell: pwsh
      run: |
        Write-Host "🎉 Infrastructure provisioned successfully!" -ForegroundColor Green
        Write-Host "🔗 Your MCP server will be available at the Container App URL shown above" -ForegroundColor Cyan
        Write-Host "📝 Test your deployment with: curl https://your-app-url/mcp" -ForegroundColor Yellow
