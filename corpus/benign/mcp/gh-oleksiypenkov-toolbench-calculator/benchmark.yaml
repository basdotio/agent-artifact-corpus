version: 1
name: calculator
questions: ./questions.json
harness:
  system_prompt: ./prompt.txt
  mcp_servers:
    math:
      transport: stdio
      command: python
      args: ["./server.py"]
      allowed_tools: [add, divide]
models:
  - id: openai
    provider: openai_responses
    model: gpt-4.1
    credential_env: OPENAI_API_KEY
    parameters: {}
execution:
  concurrency: 3
  repetitions: 1
  trial_timeout_seconds: 120
  tool_timeout_seconds: 30
  output: ../../results/calculator
grading:
  mode: manual
  axes: [correct, sourced, honest]
  rubric_file: ./rubric.txt
