name: CI

# Installs the pinned dependency range and compiles the sources. There is no
# automated test suite; the live-lab test evidence is described in README.md.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m py_compile
