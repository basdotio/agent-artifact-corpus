[project]
name = "trello-guardrails-mcp"
version = "0.1.0"
description = "MCP server that lets Claude read and organise Trello boards by name, with archive-only writes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sami Porkka" }]
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0"]

[project.scripts]
trello-mcp = "trello_mcp:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["trello_mcp"]
