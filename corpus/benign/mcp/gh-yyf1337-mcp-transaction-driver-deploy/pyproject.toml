[project]
name = "mcp-transaction-driver-deploy"
version = "0.1.0"
description = "Example: transactional Windows driver deployment with mcp-transaction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp-transaction-server",
    "mcp-transaction-client",
]

[tool.uv]
package = false

[tool.uv.sources]
mcp-transaction-server = { workspace = true }
mcp-transaction-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
