[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-google-ads-mcp"
version = "1.0.0"
description = "Enterprise FastMCP server for Google Ads API with two-layer Pydantic shields, W3C distributed tracing, and zero-hallucination guardrails."
readme = "README.md"
authors = [{ name = "Mikhail-Azhyshchev", email = "azhyshchev@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "google-ads>=24.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0"
]

[project.scripts]
safe-google-ads-mcp = "server:mcp.run"
