<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Arzonama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.98);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #6366f1;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --error-border: #fecaca;
      --success-bg: #f0fdf4;
      --success-text: #166534;
      --success-border: #bbf7d0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 15% 15%, #312e81 0%, transparent 40%),
                  radial-gradient(circle at 85% 85%, #1e1b4b 0%, transparent 45%),
                  #090d16;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4),
                  0 0 0 1px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
    }

    .brand-logo svg {
      width: 28px;
      height: 28px;
      color: #fff;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .brand-header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Notification Banner */
    .banner {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      animation: fadeIn 0.25s ease-out;
    }

    .banner.error {
      display: flex;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .banner.success {
      display: flex;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .banner svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Form Fields */
    .names-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    @media (max-width: 480px) {
      .names-row {
        grid-template-columns: 1fr;
      }
    }

    .field-group {
      margin-bottom: 18px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: #94a3b8;
      pointer-events: none;
      transition: color 0.2s;
    }

    .input-field {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 42px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: #1e293b;
      background: #f8fafc;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      background: #fff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    .input-field:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: var(--primary);
    }

    /* Password Toggle Button */
    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .toggle-pwd:hover {
      color: #475569;
    }

    .toggle-pwd svg {
      width: 18px;
      height: 18px;
    }

    /* Password Strength Indicator */
    .strength-meter {
      height: 4px;
      background: #e2e8f0;
      border-radius: 4px;
      margin-top: 8px;
      overflow: hidden;
      display: flex;
    }

    .strength-bar {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .strength-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      height: 48px;
      margin-top: 10px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      transition: all 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    /* Footer Info */
    .card-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }

    .card-footer a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-logo">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 0110.374 21c-2.331 0-4.512-.645-6.374-1.765z" />
          </svg>
        </div>
        <h1>Create Account</h1>
        <p>Join Arzonama to access your dashboard</p>
      </div>

      <!-- Feedback Alert -->
      <div id="alertBanner" class="banner" role="alert">
        <svg id="alertIcon" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"></svg>
        <span id="alertText"></span>
      </div>

      <!-- Sign Up Form -->
      <form id="signupForm" novalidate>
        <!-- Name Row: First Name & Last Name -->
        <div class="names-row">
          <div class="field-group" style="margin-bottom: 0;">
            <label class="field-label" for="firstName">First Name</label>
            <div class="input-wrapper">
              <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
              </svg>
              <input
                type="text"
                id="firstName"
                name="first_name"
                class="input-field"
                placeholder="John"
                required
                autocomplete="given-name"
              />
            </div>
          </div>
          <div class="field-group" style="margin-bottom: 0;">
            <label class="field-label" for="lastName">Last Name</label>
            <div class="input-wrapper">
              <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
              </svg>
              <input
                type="text"
                id="lastName"
                name="last_name"
                class="input-field"
                placeholder="Doe"
                required
                autocomplete="family-name"
              />
            </div>
          </div>
        </div>

        <!-- Email -->
        <div class="field-group">
          <label class="field-label" for="email">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.25 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              class="input-field"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              class="input-field"
              placeholder="At least 6 characters"
              minlength="6"
              required
              autocomplete="new-password"
            />
            <button type="button" id="togglePassword" class="toggle-pwd" title="Toggle password visibility">
              <svg id="eyeIcon" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
          <!-- Strength bar -->
          <div class="strength-meter">
            <div id="strengthBar" class="strength-bar"></div>
          </div>
          <div class="strength-text">
            <span>Password strength</span>
            <span id="strengthLabel">-</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <div class="spinner" id="spinner"></div>
          <span id="btnText">Create Account</span>
        </button>
      </form>

      <!-- Footer -->
      <div class="card-footer">
        Already have an account? <a href="#">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const alertBanner = document.getElementById('alertBanner');
    const alertText = document.getElementById('alertText');
    const alertIcon = document.getElementById('alertIcon');
    const strengthBar = document.getElementById('strengthBar');
    const strengthLabel = document.getElementById('strengthLabel');

    // Toggle Password Visibility
    let showPassword = false;
    toggleBtn.addEventListener('click', () => {
      showPassword = !showPassword;
      passwordInput.type = showPassword ? 'text' : 'password';
      if (showPassword) {
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />`;
      } else {
        eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />`;
      }
    });

    // Password strength indicator
    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      if (val.length === 0) {
        strengthBar.style.width = '0%';
        strengthBar.style.background = '#e2e8f0';
        strengthLabel.textContent = '-';
      } else if (score <= 2) {
        strengthBar.style.width = '33%';
        strengthBar.style.background = '#ef4444';
        strengthLabel.textContent = 'Weak';
        strengthLabel.style.color = '#ef4444';
      } else if (score <= 3) {
        strengthBar.style.width = '66%';
        strengthBar.style.background = '#f59e0b';
        strengthLabel.textContent = 'Fair';
        strengthLabel.style.color = '#f59e0b';
      } else {
        strengthBar.style.width = '100%';
        strengthBar.style.background = '#10b981';
        strengthLabel.textContent = 'Strong';
        strengthLabel.style.color = '#10b981';
      }
    });

    // Alert display helper
    function showAlert(type, message) {
      alertBanner.className = `banner ${type}`;
      alertText.textContent = message;
      if (type === 'success') {
        alertIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />`;
      } else {
        alertIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />`;
      }
    }

    function hideAlert() {
      alertBanner.className = 'banner';
    }

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const firstName = firstNameInput.value.trim();
      const lastName = lastNameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!firstName) {
        showAlert('error', 'Please enter your first name.');
        firstNameInput.focus();
        return;
      }

      if (!lastName) {
        showAlert('error', 'Please enter your last name.');
        lastNameInput.focus();
        return;
      }

      if (!email || !email.includes('@')) {
        showAlert('error', 'Please enter a valid email address.');
        emailInput.focus();
        return;
      }

      if (!password || password.length < 6) {
        showAlert('error', 'Password must be at least 6 characters long.');
        passwordInput.focus();
        return;
      }

      // Loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Creating account...';
      spinner.style.display = 'block';

      try {
        const response = await fetch(window.location.pathname, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            first_name: firstName,
            last_name: lastName,
            email: email,
            password: password
          })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('success', data.message || 'Account created successfully! Welcome aboard.');
          form.reset();
          strengthBar.style.width = '0%';
          strengthLabel.textContent = '-';
        } else {
          showAlert('error', data.detail || 'Sign up failed. Please try again.');
        }
      } catch (err) {
        showAlert('error', 'Network error. Could not connect to the server.');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Create Account';
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
