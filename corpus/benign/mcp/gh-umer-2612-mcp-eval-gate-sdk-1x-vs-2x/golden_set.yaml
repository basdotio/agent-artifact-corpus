# Server A is the mcp 1.x build. `compare --against` runs the same cases on the mcp 2.x build.
server:
  command: uv
  args: ["run", "--no-project", "--with", "mcp==1.30.0", "python", "validation/sdk-1x-vs-2x/server_v1.py"]

cases:
  - id: add
    tool_name: add
    tool_args: {a: 2, b: 3}
    match_type: snapshot

  - id: greet
    tool_name: greet
    tool_args: {name: Ada}
    match_type: snapshot

  # The tool raises, so the result is an error. A gate that fails on any error can't express this.
  - id: boom-explains-the-failure
    tool_name: boom
    match_type: contains
    expected_output: "kaboom"
    expect_error: true
