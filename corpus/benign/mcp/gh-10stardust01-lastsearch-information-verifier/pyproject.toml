[project]
name = "bengaluru-misinfo-layer"
version = "0.1.0"
description = "Grounded Bengaluru civic misinformation checker using Elasticsearch hybrid search, ELSER, Jina reranking, and Bedrock."
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
live = [
  "boto3>=1.34.0",
  "elasticsearch>=8.15.0",
  "python-dotenv>=1.0.1",
]
mcp = [
  "mcp>=0.1.0",
]
crawler = [
  "beautifulsoup4>=4.12.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
]
web = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.110.0",
  "requests>=2.31.0",
  "uvicorn>=0.24.0",
  "python-multipart>=0.0.6",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
bengaluru-fact-check = "app.cli:main"
bengaluru-mcp-server = "mcp_server:main"
bengaluru-crawler = "crawler:main"
bengaluru-web = "app.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
exclude = ["kibana*", "elastic*", "agent_builder*"]
