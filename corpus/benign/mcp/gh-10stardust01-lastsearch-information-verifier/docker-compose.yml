version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: bengaluru-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=trial
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - bengaluru-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: bengaluru-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - bengaluru-network
    volumes:
      - ./kibana/dashboard.ndjson:/usr/share/kibana/dashboard.ndjson

  crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    container_name: bengaluru-crawler
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=bengaluru-sources
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - bengaluru-network
    volumes:
      - .:/app
    command: ["python", "crawler.py", "--dry-run"]

volumes:
  elasticsearch-data:
    driver: local

networks:
  bengaluru-network:
    driver: bridge