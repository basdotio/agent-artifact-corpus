output_index: bengaluru-sources
ingest_pipeline: bengaluru-sources-pipeline

crawl_rules:
  - { policy: allow, type: begins, pattern: "https://www.bmrcl.co.in/" }
  - { policy: allow, type: begins, pattern: "https://bbmp.gov.in/" }
  - { policy: allow, type: begins, pattern: "https://site.bbmp.gov.in/" }
  - { policy: allow, type: begins, pattern: "https://bwssb.gov.in/" }
  - { policy: allow, type: begins, pattern: "https://bescom.karnataka.gov.in/" }
  - { policy: allow, type: begins, pattern: "https://pib.gov.in/PressReleasePage.aspx" }
  - { policy: allow, type: begins, pattern: "https://www.thehindu.com/news/cities/bangalore/" }
  - { policy: allow, type: begins, pattern: "https://www.deccanherald.com/india/karnataka/bengaluru/" }
  - { policy: deny, type: regex, pattern: ".*\\.(jpg|jpeg|png|gif|svg|css|js|ico|woff|woff2)$" }

extraction_rules:
  - url_filters:
      - { type: begins, pattern: "https://www.bmrcl.co.in/" }
    fields:
      - { field_name: title, selector: "h1, .page-title, title", source: html }
      - { field_name: body, selector: "article, .content-area, main, .press-release-body, body", source: html }
      - { field_name: published_date, selector: "meta[name='date'], meta[property='article:published_time'], .date, .last-updated", source: html }
      - { field_name: source_name, value: "BMRCL" }
      - { field_name: content_type, value: "text/html" }

  - url_filters:
      - { type: begins, pattern: "https://bbmp.gov.in/" }
      - { type: begins, pattern: "https://site.bbmp.gov.in/" }
    fields:
      - { field_name: title, selector: "h1, h2, h3, .page-title, title", source: html }
      - { field_name: body, selector: "article, main, .content, .field--name-body, body", source: html }
      - { field_name: published_date, selector: "meta[name='date'], .date, .last-updated", source: html }
      - { field_name: source_name, value: "BBMP" }
      - { field_name: content_type, value: "text/html" }

  - url_filters:
      - { type: begins, pattern: "https://bwssb.gov.in/" }
    fields:
      - { field_name: title, selector: "h1, .page-title, title", source: html }
      - { field_name: body, selector: "article, main, .content, .notice-content, body", source: html }
      - { field_name: published_date, selector: "meta[name='date'], .date, .last-updated", source: html }
      - { field_name: source_name, value: "BWSSB" }
      - { field_name: content_type, value: "text/html" }

  - url_filters:
      - { type: begins, pattern: "https://bescom.karnataka.gov.in/" }
    fields:
      - { field_name: title, selector: "h1, .page-title, title", source: html }
      - { field_name: body, selector: "article, main, .content, body", source: html }
      - { field_name: published_date, selector: "meta[name='date'], .date, .last-updated", source: html }
      - { field_name: source_name, value: "BESCOM" }
      - { field_name: content_type, value: "text/html" }

  - url_filters:
      - { type: begins, pattern: "https://pib.gov.in/PressReleasePage.aspx" }
    fields:
      - { field_name: title, selector: "h1, .innner-page-main-about-us-content-right-part h2, title", source: html }
      - { field_name: body, selector: ".innner-page-main-about-us-content-right-part, main", source: html }
      - { field_name: published_date, selector: ".ReleaseIdSubHeaddateTime, meta[property='article:published_time']", source: html }
      - { field_name: source_name, value: "PIB Karnataka" }
      - { field_name: content_type, value: "text/html" }

  - url_filters:
      - { type: begins, pattern: "https://www.thehindu.com/news/cities/bangalore/" }
    fields:
      - { field_name: title, selector: "h1.title, h1, title", source: html }
      - { field_name: body, selector: "article, .articlebodycontent", source: html }
      - { field_name: published_date, selector: "meta[property='article:published_time'], .publish-time", source: html }
      - { field_name: source_name, value: "The Hindu" }
      - { field_name: content_type, value: "text/html" }

  - url_filters:
      - { type: begins, pattern: "https://www.deccanherald.com/india/karnataka/bengaluru/" }
    fields:
      - { field_name: title, selector: "h1, title", source: html }
      - { field_name: body, selector: "article, .content, .story-element-text", source: html }
      - { field_name: published_date, selector: "meta[property='article:published_time'], .date", source: html }
      - { field_name: source_name, value: "Deccan Herald" }
      - { field_name: content_type, value: "text/html" }

  - url_filters:
      - { type: ends, pattern: ".pdf" }
    fields:
      - { field_name: content_type, value: "application/pdf" }

schedule:
  full_crawl: "0 2 * * *"
  incremental_crawl: "0 */4 * * *"
