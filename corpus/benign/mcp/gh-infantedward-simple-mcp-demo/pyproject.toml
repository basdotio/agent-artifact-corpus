[project]
name = "simple-mcp-demo"
version = "0.1.0"
description = "A small FastMCP demo with math tools and two client styles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "requests>=2.32.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
