<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Math Demo</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="hero">
        <p class="eyebrow">Model Context Protocol Demo</p>
        <h1>Interactive math tools over MCP</h1>
        <p class="intro">
          The browser talks to a tiny web app, and the web app calls the MCP
          server. The math functions stay plain Python tools.
        </p>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Calculator</h2>
          <button id="refresh-tools" type="button">Refresh tools</button>
        </div>

        <form id="tool-form" class="tool-form">
          <label>
            Tool
            <select id="tool-name" name="tool"></select>
          </label>

          <div class="inputs">
            <label>
              A
              <input id="value-a" name="a" type="number" step="any" value="12" required />
            </label>
            <label>
              B
              <input id="value-b" name="b" type="number" step="any" value="3" required />
            </label>
          </div>

          <button class="primary" type="submit">Call MCP tool</button>
        </form>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>Available tools</h2>
          <ul id="tool-list" class="tool-list"></ul>
        </article>

        <article class="panel">
          <h2>Response</h2>
          <pre id="result" class="result">Waiting for a tool call...</pre>
        </article>
      </section>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
