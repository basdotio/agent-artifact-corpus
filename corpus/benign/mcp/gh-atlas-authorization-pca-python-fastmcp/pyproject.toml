[project]
name = "atlas-pca-fastmcp"
version = "0.4.1"
description = "Per-tool Proof-Carrying Authority enforcement for FastMCP (verify a PCActn on every tools/call)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atlas" }]
keywords = ["authorization", "agents", "proof-carrying-authority", "pca", "fastmcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = ["atlas-pca>=0.4.1,<0.5"]  # the shared reference verifier; this package adds no crypto

[project.optional-dependencies]
test-real = ["pytest>=7", "fastmcp==4.1.0", "pytest-asyncio"]  # pinned framework versions the end-to-end tests are validated against (see Makefile / sdks/scripts/test-adapters-real.sh)
fastmcp = ["fastmcp>=2.3"]        # optional: the FastMCP middleware base + ToolError; logic stays importable without it
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Atlas-Authorization/pca-python"
Repository = "https://github.com/Atlas-Authorization/pca-python"
Issues = "https://github.com/Atlas-Authorization/pca-python/issues"
Specification = "https://github.com/Atlas-Authorization/pca"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_pca_fastmcp"]
