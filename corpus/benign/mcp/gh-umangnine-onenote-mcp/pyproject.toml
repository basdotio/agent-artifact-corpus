[project]
name = "onenote-mcp"
version = "0.1.0"
description = "Windows Model Context Protocol (MCP) server for Microsoft OneNote Desktop"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Umang Kathiyara" }
]
keywords = [
    "mcp",
    "onenote",
    "model-context-protocol",
    "fastmcp",
    "windows",
    "office",
    "ai",
    "claude",
    "antigravity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Office/Business :: Office Suites"
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.26.0",
    "pyonenote>=0.0.2",
]

[project.urls]
Homepage = "https://github.com/umangnine/onenote-mcp"
Repository = "https://github.com/umangnine/onenote-mcp.git"
Issues = "https://github.com/umangnine/onenote-mcp/issues"
