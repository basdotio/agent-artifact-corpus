[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-file-server"
version = "0.1.0"
description = "A sandboxed file-system MCP server: read / write / list / search, confined to a whitelisted root directory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "fastmcp", "agent", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# 运行时依赖 —— 只有这一条
dependencies = [
    "fastmcp>=4.0",
]

[project.urls]
# 上传 GitHub 后把这两行改成你的真实地址
Homepage = "https://github.com/pharaoh-2727/mcp-file-server"
Repository = "https://github.com/pharaoh-2727/mcp-file-server"

# 单文件模块：告诉 setuptools 打包哪个 .py
[tool.setuptools]
py-modules = ["agent_mcp"]
