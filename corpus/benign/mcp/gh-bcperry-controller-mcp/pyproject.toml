[project]
name = "controller-mcp"
version = "0.1.0"
description = "MCP server for Xbox controller emulation using FastMCP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0",
    "vgamepad>=0.1.0",
    "typing-extensions>=4.0.0",
    "mcp[cli]>=1.9.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
controller-mcp = "controller_mcp:main"
