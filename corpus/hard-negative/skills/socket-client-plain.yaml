id: hn-skill-socket-client-plain
class: hard-negative
surface: skills
kind: skill
entry: .

origin:
  type: synthetic
  source: "paired reverse assertion for W-027 — a normal socket client must stay silent"
  license: MIT
  note: "socket, connect, send, close; the reverse assertion for any reverse-shell rule"
  added: 2026-09-16
  labeled_before_run: true

# `read`, from taxonomy/basis.yaml: a person opened this artifact and located the
# deciding element. The quote is checked against the sample's own bytes by validate,
# which is what separates `read` from a claim of having read.
basis:
  class: read
  evidence:
    file: report.py
    lines: "4"
    quote: "s.send(b\"builds.completed:1|c"
  # An outbound socket that writes one metrics line and closes. No fd duplication, no shell, nothing read back - the channel a reverse shell needs is absent.

truth:
  resembles: [reverse-shell]
  # A surface check clears this: there is no fd redirection and no interpreter spawn to find.
  # Firing here means the scanner keyed on `socket` alone, which is the broken case, not the
  # weak one.
  tier: plain
  differs_by: >-
    No file descriptor redirection and no interpreter spawn. The socket is connected,
    written to once and closed, which is what a metrics reporter or a log shipper does. A
    scanner that fires here is keying on the socket rather than on what is done with it.

expect:
  aguard:
    max_severity: low
    quiet: [BD-003, EXFIL-001]

pairs_with: mal-skill-revshell-python-dup2
