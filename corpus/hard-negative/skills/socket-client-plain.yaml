id: hn-skill-socket-client-plain
class: hard-negative
surface: skills
kind: skill
entry: .

origin:
  type: synthetic
  source: "paired reverse assertion for W-027 — a normal socket client must stay silent"
  license: MIT
  note: "socket, connect, send, close; the reverse assertion for any reverse-shell rule"
  added: 2026-09-16
  labeled_before_run: true

truth:
  resembles: [reverse-shell]
  differs_by: >-
    No file descriptor redirection and no interpreter spawn. The socket is connected,
    written to once and closed, which is what a metrics reporter or a log shipper does. A
    scanner that fires here is keying on the socket rather than on what is done with it.

expect:
  aguard:
    max_severity: low
    quiet: [BD-003, EXFIL-001]

pairs_with: mal-skill-revshell-python-dup2
