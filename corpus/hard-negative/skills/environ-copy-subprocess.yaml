id: hn-skill-environ-copy
class: hard-negative
surface: skills
kind: skill
entry: .
origin:
  type: reconstruction
  source: "https://github.com/basdotio/agent-guard doc/work-items.zh-CN.md W-008"
  license: MIT
  note: "os.environ.copy() passed to a subprocess is the standard way to inherit env; not exfiltration"
  added: 2026-09-16
  labeled_before_run: true
expect:
  # medium, not low. The sample's entire purpose is to run `make` in a subprocess, so
  # EXEC-004 at medium is the tool being right, not a false positive. The first label said
  # low and the validator failed it — which is the point of asserting a bound rather than
  # asserting silence. The assertion that matters is quiet: EXFIL-004 must not fire on
  # os.environ.copy() handed to a child process.
  max_severity: medium
  quiet: [EXFIL-004]
pairs_with: mal-skill-env-exfil
