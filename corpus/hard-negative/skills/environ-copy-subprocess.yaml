id: hn-skill-environ-copy
class: hard-negative
surface: skills
kind: skill
entry: .

origin:
  type: reconstruction
  source: "https://github.com/basdotio/agent-guard doc/work-items.zh-CN.md W-008"
  license: MIT
  note: "os.environ.copy() passed to a subprocess is the standard way to inherit env; not exfiltration"
  added: 2026-09-16
  labeled_before_run: true

truth:
  resembles: [env-exfiltration]
  # A surface check clears this too: nothing in the tree opens a socket or an HTTP client, so
  # the read cannot leave the machine. Firing here means keying on `os.environ` alone.
  tier: plain
  differs_by: >-
    The copied environment goes to a child process on the same machine and nowhere else.
    There is no socket, no HTTP client and no file written outside the tree. Reading the
    environment is not the offence; transmitting it is, and nothing here transmits.

expect:
  aguard:
    # medium, not low. The sample's entire purpose is to run `make` in a subprocess, so
    # EXEC-004 at medium is the tool being right, not a false positive. The first version of
    # this label said low and the validator failed it — which is the point of asserting a
    # bound rather than asserting silence. The claim that matters is the quiet list.
    max_severity: medium
    quiet: [EXFIL-004]

pairs_with: mal-skill-env-exfil
