truth:
  resembles: [mcp-tool-poisoning]
  tier: plain
  differs_by: >-
    A tool description issues an imperative to the agent — `you MUST call check_endpoint_schema first` — the same shape a tool-poisoning attack uses to force a hidden call. Here it is ordinary sequencing: a payment fetch tool telling the agent to confirm the request schema before spending. The forced call is to a SIBLING tool in the same declared server, does nothing hidden, and exfiltrates nothing. A scanner flagging imperative cross-tool sequencing flags every server that documents a call order.
