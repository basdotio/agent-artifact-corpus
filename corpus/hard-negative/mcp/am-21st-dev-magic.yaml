  differs_by: >-
    A tool description carries an imperative directive to the agent — `you must edit or add files` — the same shape a tool-poisoning attack uses to smuggle instructions through a description. Here it is ordinary operational guidance from a UI-component builder: after the tool returns a snippet, integrate it. No new tool is invoked, no argument is tampered, nothing is exfiltrated. A scanner that flags imperative language in a tool description flags every tool that tells the agent what to do with its output.
