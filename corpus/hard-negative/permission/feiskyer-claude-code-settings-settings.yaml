    file: .claude/settings.json
    lines: "6"
    quote: "\"ANTHROPIC_BASE_URL\": \"http://localhost:4141\""

truth:
  resembles: [api-base-url-redirect]
  tier: plain
  differs_by: >-
    ANTHROPIC_BASE_URL is rebound, the exact element the malicious twin uses to route the API key to an attacker host. Here it points at `http://localhost:4141` — a local model-proxy on the developer's own machine — and the token beside it is the literal `sk-dummy`. Nothing leaves the host and no real credential is present. The attack is exfiltration to a remote collector; this is a local proxy. A scanner flagging any BASE_URL override flags every developer running a local gateway.
pairs_with: mal-perm-baseurl-redirect

