id: hn-perm-unity-credential-deny-list
class: hard-negative
surface: permission
kind: settings
entry: .

origin:
  # Collected, not written. A hard negative someone wrote while knowing the rules is a
  # near-miss by construction; this one is a configuration a real project actually runs. The
  # coordinates are hand-pinned — `resembles` and `differs_by` are judgements no rule produces.
  type: harvested
  source: "https://github.com/nowsprinting/UnityTestExamples/blob/20674012049eda62ea2176737e1a34df04a8ba2b/.claude/settings.json"
  license: MIT
  note: >-
    A working project configuration from a public Unity repository, vendored unchanged. Found
    by scripts/harvest-claude-config.py as an ordinary benign config and promoted by hand
    after reading it: its 63-entry deny list names more credential paths than any malicious
    sample in this corpus reads.
  added: 2026-09-17
  labeled_before_run: true
  sha256: d1d49e864d209a5dbe828dcc7e66212df02c510f979ed27abd935306e936ef0f

truth:
  resembles: [env-exfiltration]
  tier: plain
  differs_by: >-
    The file names `~/.ssh/**`, `~/.aws/**`, `.env`, `.env.*`, `/secrets/**`, `id_rsa`,
    `id_ed25519`, `~/.git-credentials`, `~/.netrc`, `~/.npmrc` and `*token*` — and names every
    one of them inside `permissions.deny`, as paths the agent may NOT read. It performs no
    read: there is no environment enumeration and, decisively, no transmission anywhere, which
    the technique definition calls the whole offence. A literal matcher sees a dense cluster of
    credential paths and cannot tell that the list is protecting them. Confusable in the other
    direction too: the same file's `allow` list grants `WebFetch` to 11 domains, so a scanner
    scoring breadth of grant rather than content has its own reason to fire.
    (An earlier version of this field also claimed `Edit` and `Write` grants and said nine
    domains. The allow list contains zero of either — `Edit` appears only under `deny` and
    `ask`, and the string `Write` does not occur in the file at all. Recalled, not counted.)

# Cross-surface. The twin exfiltrates the environment as a skill; this sample forbids reading
# it as a settings file. A scanner that does not parse `.claude/settings.json` stays quiet here
# for lack of coverage rather than by discriminating, and the pair only becomes load-bearing
# once the permission surface has a malicious sample — which no public corpus provides.
pairs_with: mal-skill-env-exfil

# No `expect` block: nothing has been run against this sample, and naming rule ids that
# "should" stay quiet would be a prediction presented as a measurement.
