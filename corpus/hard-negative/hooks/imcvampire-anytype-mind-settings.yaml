  differs_by: >-
    The SessionStart hook runs a command on every session begin — the same load path and trigger as the malicious twin, which fetches and pipes remote code. Here the command is `bash .claude/scripts/session-start.sh`: a script committed INSIDE the repository, versioned and reviewable, with no network fetch. The attack is remote code arriving at startup; this is local code the author wrote. A scanner keying on "SessionStart runs bash" flags both; telling them apart needs reading whether the target is a fetch or a tracked file.
