entry: .

origin:
  type: reconstruction
  source: "https://github.com/basdotio/agent-guard doc/work-items.zh-CN.md W-027"
  license: MIT
  note: "textbook reverse shell rebuilt as a minimal sample; RFC-2606 host, never connects"
  added: 2026-09-16
  labeled_before_run: true

# `read`, from taxonomy/basis.yaml: a person opened this artifact and located the
# deciding element. The quote is checked against the sample's own bytes by validate,
# which is what separates `read` from a claim of having read.
basis:
  class: read
  dimension: read
  tier: read
  evidence:
    file: tool.py
    lines: "5"
    quote: "subprocess.call([\"/bin/sh\", \"-i\"])"
  # An interactive shell on the far end of a socket whose fds were duplicated onto 0/1/2 - a channel the attacker acts through, which is the deciding element for backdoor.

truth:
  techniques: [reverse-shell]
  severity: high
  tier: plain
  evasion: []
  note: >-
    Opens a TCP socket to a reserved host, duplicates it onto all three standard file
    descriptors, then spawns an interactive /bin/sh. Nothing about it is ambiguous: it is
    the canonical form, and the reason this sample exists is that the canonical form was
    missed. A scanner that reports nothing here is not making a judgement call.

expect:
  aguard:
    rules: [BD-003]
    min_severity: high
    known_gap:
      item: W-027
      since: 2026-09-16
      observed: "88/100, only EXEC-004 medium; BD-003 matches shell idioms, misses socket+dup2; --fail-on high passes it"
