        T2-semantic-obfuscation: dim:injection
        T4-conditional-trigger: dim:injection
        T5-instruction-fragment: dim:injection
        T7-multi-stage: dim:execution
        T8-env-aware: dim:exfiltration

  - id: cisco-mcp-scanner-evals
    name: "cisco-ai-defense/mcp-scanner (evals)"
    url: https://github.com/cisco-ai-defense/mcp-scanner
    commit: be87b90d88bca2527a6e2075769a7608decd8f27
    sha256: ""
    license: Apache-2.0
    role: recall
    # Cisco's own numbered eval cases — the files say `Example 3`, `Example 5`, `Example 10` and name their servers `resource-exhaustion-service-3`. Authored to exercise mcp-scanner, not captured from anywhere
    provenance: fixture
    subset: evals
    malicious: 142                  # 141 behavioural cases + 1 remote server, verified by reading
    benign: 3
    vendorable: true
    hazards:
      - "COUNT CORRECTION: this entry read 154 malicious and 4 benign. The tree holds 141 behavioural test cases under evals/behavioral-analysis/data plus one malicious and three benign servers under evals/remote. The other files in evals/ are scanner drivers, not samples"
      - "the 3 benign servers under evals/remote are NOT vendored and never were: `layout` covers only evals/behavioral-analysis/data/*/*.py. The corpus therefore holds ZERO benign cisco samples, and this entry's `benign: 3` describes the upstream rather than anything in layer 1. An audit read the old wording here — 'only 3 benign samples, unusable as a denominator' — as saying they were present and merely too few"
      - "the category directory IS the label, so a path-aware harness can cheat. The vendored trees are named after the test case alone, never the category, so the answer does not travel in the path"
      - "two categories are excluded rather than mapped. `defense-evasion` is anti-debugging with no attack outcome — it names a technique, not something achieved — and `general-description-code-mismatch` is intent mismatch, a dimension this corpus deliberately does not model. 20 samples, declared and counted"
    # The first entry to reach the MCP surface, which had no samples at all. Each test case is a
    # single .py implementing a real MCP server, so samples are file-shaped and get wrapped in a
    # directory of their own. The category directory maps to a dimension, which is the whole of
    # the derivation: there is no difficulty axis here, and the code is plainly written.
    derive:
      layout: "evals/behavioral-analysis/data/*/*.py"
      sample_is_file: true
      label_file: ""
      surface: mcp
      id_prefix: ci
      class_from: "constant:malicious"
      severity_from: "constant:high"
      tier_from: "constant:plain"
      category_from: "path-segments:1"    # the category directory holding the file
      exclude_tokens: [general-description-code-mismatch]
      # `defense-evasion` used to be excluded whole, on the rationale that it "names a
      # technique, not something achieved". Reading its ten files, that is true of four and
      # false of six: one installs a kernel module and writes /etc/ld.so.preload, one escapes
      # a container via release_agent, one disables SELinux and flushes iptables, one
      # truncates /var/log/{auth,btmp,lastlog}. Dropping ten to be right about four is the
      # exclusion red line 2 exists to surface, so the four are now named individually.
      exclude_samples:
        anti_debugging_analysis_evasion: "detects a debugger via TracerPid and stops; nothing is achieved on any of our axes"
        multi_technique_process_hiding: "hides its own process; concealment is not an outcome"
        process_forking_monitoring_evasion: "forks to shed monitoring; the same"
        vm_sandbox_detection: "detects a VM and reports; pure reconnaissance"
      # Read one by one after a 127-sample census found 20 labels asserting `exfiltration` with
      # ZERO egress anywhere in the file. The two category rules that produced them described
      # THE READ ("enumerates the environment and filters secrets"), and `exfiltration.not`
      # excludes exactly that: the transmission is the offence. A scanner correctly reporting
      # host enumeration was being scored WRONG, which is worse for a benchmark than no label.
      # Every tool in that group returns a COUNT, not content.
      dimension_overrides:
        # Reads host files outside the working area AND gathers what is in them.
        # `reconnaissance.not` says a sample reading /etc/passwd earns both, so both are here.
        system_file_access_enumeration:  # /etc/group, /etc/hosts, /etc/hostname
          dimensions: [filesystem, reconnaissance]
          evidence:
            file: system_file_access_enumeration.py
            lines: "30"
            quote: '"/etc/group",'
        process_information_access:  # /proc/<pid>/{environ,cmdline,status}
          dimensions: [filesystem, reconnaissance]
          evidence:
            file: process_information_access.py
            lines: "31"
            quote: 'proc_path = f"/proc/{pid}"'
        user_account_enumeration:  # /etc/passwd, /etc/group
          dimensions: [filesystem, reconnaissance]
          evidence:
            file: user_account_enumeration.py
            lines: "34"
            quote: 'with open("/etc/passwd", "r") as f:'
        network_configuration_access:  # /etc/hosts, /etc/network/interfaces
          dimensions: [filesystem, reconnaissance]
          evidence:
            file: network_configuration_access.py
            lines: "29"
            quote: '"/etc/hosts",'
        routing_table_arp_cache_access:  # /proc/net/{route,arp,dev}
