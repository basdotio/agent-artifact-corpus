        # Excluded 2026-10-28 for LICENCE, after a sweep of every tree's own front matter.
        # The compilation's licence (CC-BY-4.0 on the dataset) covers the curation; each
        # SKILL.md keeps its author's terms, and these declare terms layer 1 cannot carry.
        # 34 trees across this entry and skillet-wild are the anthropics/skills family
        # (`LICENSE.txt` All rights reserved) re-published by other people, or NC/SA.
        # docs/licensing.md calls that set a hard red line; it had come in by the back door.
        aktsmm-agent-skills-biz-ops-setup: >-
