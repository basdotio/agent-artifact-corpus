  - id: skillet-wild
    name: "shenyimings/skillet (benchmark/wild)"
    url: https://github.com/shenyimings/skillet
    commit: b778fe53f45646c48793e81a7da6cd6b30a0e9af
    sha256: ""
    license: MIT
    role: fp-denominator
    subset: benchmark/wild
    malicious: 0
    benign: 483                     # 338 dev + 145 heldout, verified by reading wild.lock.tsv
    vendorable: true
    hazards:
      - "PROVENANCE IS TWO HOPS AND THE FIRST ONE IS UNDOCUMENTED HERE. skillet did not classify these itself: the safe/suspicious labels come from MaliciousAgentSkillsBench v0.2 (Liu et al., MIT, zenodo.org/records/20286334), 98,380 real skills of which only 157 are behaviourally-confirmed malicious. How the remaining 98,223 earned `safe` is not stated in anything fetched here, and a residual `safe` most likely means `not flagged` rather than `reviewed and found benign`. Red line 3 applies: never let this alone carry a headline false-positive figure"
      - "the 206 `suspicious` rows are NOT imported. `suspicious` is a weaker claim than malicious and importing them as malicious would overclaim a label nobody made"
      - "MaliciousAgentSkillsBench may overlap protectskills/MaliciousSkillBench, which the catalogue records as aggregating 13 sources. The relationship is unverified, so do not pool this entry with that one"
    prep:
      - "report per source. Each sample records its originating repository in origin.source, because 483 samples from 131 repositories reported as one number is the pooled figure this repository forbids"
    # skillet already applies the sampling discipline design.md demands: repo-disjoint dev and
    # heldout splits, and a cap of 5 samples per repository (73 of the 131 safe-class repos sit at exactly
    # 5). That is why this is usable as a denominator at all.
    derive:
      layout: "benchmark/wild/*/safe/*"
      label_file: ""                # the class is the directory, there is no per-sample label
      surface: skills
      id_prefix: sk
      class_from: "constant:benign"

      # Excluded after the refutation ruleset flagged them as holding nothing a scanner
      # could form a judgement about. Each is named with its reason: an exclusion with no
      # recorded cause is how a denominator quietly starts flattering itself.
      exclude_samples:
        Andeveling__glasify-lite__.qwen__skills__openspec-apply-change: >-
          Byte-identical to the same project's `.claude` copy: one skill placed under two tools'
          directories. Counting it twice weights that author's content double in the denominator.
        JordanCoin__codemap__plugins__codemap__skills__codemap: >-
          Byte-identical to the `.claude/skills` copy in the same repository — the project ships its
          skills in both layouts.
        JordanCoin__codemap__plugins__codemap__skills__config-setup: >-
          The second half of the same duplication.
        hacket__AICodingGuide__.claude__skills__pptx: >-
          Byte-identical to `MUmerRazzaq__claude-code-skills-lab__...__pptx`, in a DIFFERENT
          repository: two authors vendored the same upstream pptx skill. Real-world duplication, and
          still one artifact, so it is counted once. The retained copy is arbitrary; what matters is
          that the bytes appear once.
        Azeem-2__final-docusarus__.cursor__skills: >-
          This is the `.cursor/skills` DIRECTORY, which contains four skills that are each already
          vendored as their own sample. It is a container, not a skill, and it made four separate
          containment findings on its own.
        small-java-world__todo-manage__todo-api-skills__api.task-listing.minimal-v1: >-
          Wholly contained in the same project's `todo-api-client-sample__.claude__skills` copy.
        small-java-world__todo-manage__todo-api-skills__tdd.red-case.write-v1: >-
          The second half of the same containment.
        breverdbidder__brevard-bidder-landing__.claude__skills__canvas-design: >-
          The entire content is `404: Not Found` — a fetch failure captured as a sample. It is not any
          body's skill, and it sat in the denominator as one.
        breverdbidder__brevard-bidder-landing__.claude__skills__internal-comms: >-
          The other half of the same fetch failure, byte-identical to the one above, which is why the 
          duplicate report paired them.
      source_from: "dirname-parts:2"   # trees are named owner__repo__path__…
      benign_note: >-
        A real public skill, pinned to its originating repository and commit by
        shenyimings/skillet. Its `safe` label is inherited from MaliciousAgentSkillsBench and
        most likely means "not flagged" rather than "reviewed and found benign", so it is
        usable as a false-positive denominator but not as evidence that any particular sample
        is harmless.
      fidelity: >-
        Class is a constant: only the `safe` directories are matched by the layout, so nothing
        is inferred. Benign samples carry no tier, dimension or severity, so there is no lossy
        axis mapping here at all — this is the most mechanical derivation in the corpus. What
        is weak is not the derivation but the upstream label, and that is recorded in hazards.

  # ---------- hard negatives ----------
  - id: automatelab-mcp-tools
    name: "HF automatelab/mcp-servers-tool-catalog"
    # A HuggingFace dataset, not a GitHub repo. The GitHub side is
    # AutomateLab-tech/mcp-tool-catalog, which is the generator, not the data.
    url: https://huggingface.co/datasets/automatelab/mcp-servers-tool-catalog
    commit: a413afb7b02ac7d615ddf1e8dfcccc815893110d
    sha256: ""
    license: CC-BY-4.0
    role: hard-negative
    malicious: 0
    benign: 9922                    # tool declarations, across 357 PACKAGES (285 distinct server_names; 359 was the count of servers whose probe returned ok, two of which shipped no tools)
    vendorable: true
    hazards:
      - "none known for the data itself"
      - "MCP tool-description rules in this space are typically validated against a few dozen tools; 9,922 real ones is a two-order-of-magnitude expansion and may surface many false positives at once"
      - "COUNT CLARIFICATION: 9,922 tools, but they group into 357 PACKAGES and only 285 distinct server_names — 34 different packages all call themselves `mcp-server`. Package is the provenance; server_name is a display label"
      - "the poisoning-shaped strings a rule looks for occur legitimately at low but non-trivial rates: `IMPORTANT:` in 0.9% of descriptions, angle-bracket placeholders in 1.4%, URLs in 1.1%, token/secret/api-key wording in 3.1%, must/always/never imperatives in 4.5%. That is the whole reason this is a hard negative"
      - "SHAPE: this is the only upstream in the corpus that ships a TABLE rather than files. It needs the extraction step below before anything can be pointed at it"
      - "SERIALISATION MISMATCH ON THE MCP SURFACE, and it is the sharpest caveat here. The malicious MCP samples (cisco) are Python server IMPLEMENTATIONS; these benign ones are JSON tool DECLARATIONS. A false-positive rate computed across the two measures how a scanner handles .json versus .py at least as much as it measures over-alerting. Report them separately, or compare only against malicious samples in the same serialisation — of which this corpus has none"
      - "`file:tools.json` appears in 357 of 357 of these samples and in no malicious sample anywhere, and unlike skillet's LICENSE.txt that filename is an artifact of OUR extraction script rather than a property of the data. The leakage gate reports it as cross-population structure on every run. It cannot be avoided while the two halves of this surface are different artifact forms"
    prep:
      - "run scripts/extract-automatelab.py after fetching; it groups the parquet into one tree per package. Same pinned parquet plus that script gives the same trees"
      - "tool lists are deliberately NOT truncated: capping tools per sample would delete content that could trip a rule, moving a false-positive rate in the flattering direction"
    # One sample is one package, which is also one source, so per-source reporting is automatic
    # here and needs no source_from: every source contributes exactly one sample. That is a
    # better balance than skillet's 483 samples across 131 repositories.
    derive:
      layout: "extracted/*"
      label_file: ""
      surface: mcp
      id_prefix: am
      class_from: "constant:benign"
      benign_note: >-
        A real MCP server's complete tool declaration, as published. Its descriptions
        legitimately contain the shapes a tool-poisoning rule looks for — IMPORTANT:,
        angle-bracket placeholders, URLs, credential wording — which is what makes it a
        false-positive probe rather than filler. Nothing here was selected for being
        difficult; this is simply what real tool catalogues look like.
      fidelity: >-
        The most mechanical derivation in the corpus alongside skillet's. Class is a constant
        and only benign trees exist, so nothing is inferred; benign samples carry no tier,
        dimension or severity, so there is no lossy axis mapping at all. The one judgement is
        upstream of the derivation: that a package, not a tool, is the artifact — because a
        scanner on the MCP surface reads a server's whole declaration, which is the same
        granularity as the cisco samples already here.

  - id: nvidia-skillspector-fixtures
