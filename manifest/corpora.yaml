# Layer 2 — referenced, never vendored.
#
# Only url + commit + sha256 + labels live here. Recording a URL and a hash is not
# distribution, which is why this file may reference no-license, NonCommercial and copyleft
# corpora that corpus/ must never contain. See docs/licensing.md.
#
# Every entry declares `hazards`. An entry with no known hazard says "none known" explicitly
# — the validator rejects an empty list, because an undeclared hazard is how the next person
# uses a corpus wrong.
#
# `commit` is pinned deliberately. A moving reference makes every number already published
# against it irreproducible, and the fetcher refuses to silently re-pull a checkout that has
# drifted.

entries:
  # ---------- recall ----------
  - id: datadog-ai-skills
    name: "DataDog malicious-software-packages-dataset (samples/ai-skills)"
    url: https://github.com/DataDog/malicious-software-packages-dataset
    commit: d156188d1e45763d6cb7995543a428de6c4056b8
    sha256: ""
    license: Apache-2.0
    role: recall
    # malware captured from real campaigns; the ~13% that are other scanners' synthetic tests are named in the hazards and were excluded by hand
    provenance: wild
    subset: samples/ai-skills
    malicious: 204
    benign: 0
    vendorable: true
    overlaps: [trailofbits-overt, agent-skill-malware, malskillbench]
    hazards:
      - "40% of samples (81/204) carry one vendor's name; ~40 are near-duplicates"
      - "~26/204 (13%) are other scanners' synthetic tests, not in-the-wild samples"
      - "samples are zip-encrypted with the password `infected`"
      - "the archives are zip-encrypted with the password `infected`, the malware-corpus convention. scripts/prep-datadog.py unpacks them; `corpus fetch` deliberately does not, because unpacking an arbitrary upstream means running arbitrary code from the manifest"
      - "DataDog ships NO per-sample label: manifest.json maps every one of the 204 names to null. `malicious_intent/` is the whole of the upstream's judgement, and it is a judgement about the PACKAGE. Several samples in it are ordinary skills whose malicious part is one line, and at least two are not malicious at all — `dtinth-agent-skills-discord` is a working Discord notifier"
      - "12 samples are cisco-ai-defense's own scanner fixtures, which this corpus already derives 127 samples from. Counting both would double-count one author's synthetic tests"
      - "10 samples are Charpup's skill-security-auditor fixtures — another scanner's synthetic tests, which the parent entry's hazards already warn about at 13% of the set"
      - "54 of 204 are from one author (openclaw). Deriving them all would rebuild the source concentration this entry exists to relieve. `openclaw` is the openclaw/skills archive of ClawHub, so the real publishers sit one level down (hightower6eu, thiagoruss0, stveenli …) — and most of them are one campaign"
      - "CAMPAIGN CONCENTRATION — a rate here is over distinct PAYLOADS, not over prevalence. 55 samples carry one fake-prerequisite lure (`openclawcli must be installed`, downloaded from openclawcli.vercel.app, openclawcli.forum or a glot.io snippet + github.com/Ddoy233 zip); 6 are derived, at most two per download host from different carrier skills, preferring the one that hides the lure in README.md. 14 carry the 91.92.242.30 base64 curl-pipe-bash / github.com/Aslaep123 zip campaign; the 4 derived before this pass stand and the other 10 are excluded. Counting every copy would turn the wild rate into `does the scanner catch these two lures`"
      - "FIXTURES WERE IN THE WILD BUCKET. 11 of the 22 samples derived before 2026-10-23 were proofs of concept or demonstrations (3bkader, cybertechajju ×2, gchan-bad-humanizer, h1paastha, nickoc-clawscan, ronyparra-fake-dep-check, and the security researcher's zackkorman/skills set ×4) and were scored as wild. A derived sample cannot carry its own provenance — this entry is `wild` — so they are excluded by name with the line that gives them away. Their coverage value could come back through a sibling entry declared `provenance: fixture`"
      - "ClawHub registry metadata (`_meta.json`: ownerId, slug, version, publishedAt; `.clawhub/origin.json`) ships inside every openclaw-sourced sample. No benign sample in the corpus carries either file, so pooled across populations the filename marks class; inside this single-class population it marks nothing. Vendored byte for byte rather than edited — it is part of the artifact as the registry served it"
      - "`pauldelavallaz-morpheus-fashion-design` hardcodes what looks like a live Google API key (AIza…) as a fallback. It is excluded by name: vendoring it would republish a credential that may still work"
      - "READ BY AI AGENTS, NOT BY A PERSON. The 2026-10-23 pass below was read by AI agents (six readers and an assistant) for the corpus maintainer, who has not read the samples. Every quote was then checked mechanically against its exact line and a sample of verdicts was re-read, but `read` is defined as a person's reading: whether the 12 labels this pass derived keep that basis — each says `read_by` — and whether its exclusions stand is the maintainer's call. The 11 labels derived before this pass are unchanged by it. DECIDED 2026-10-27 in the review of #10: the maintainer accepted the 12 labels as `read` with the reading disclosed in each, following the precedent #7 set for benign review records read by an AI assistant"
      - "ALL 204 READ (2026-10-23). 23 derived; 181 excluded by name, each with its reason: 74 read as not malicious (DataDog's flag is on the package — many are ordinary skills, several leak only their own author's keys), 56 further copies of a derived campaign payload, 39 fixtures (other scanners' tests, PoCs, demos), 6 with a SKILL.md byte-identical to a derived sample, 3 identical trees, 2 unlicensed upstream content, 1 live-looking credential. Keyword triage had been tried and abandoned — it ranked `api_key = os.environ.get(...)` and `fs.writeFileSync(...)` as attacks — so every verdict is a reading, with the deciding line quoted for each derived sample"
      - "run scripts/prep-datadog.py to unpack the archives into cache/datadog-ai-skills/_extracted/"
    prep:
      - "run scripts/prep-datadog.py to unpack the archives into cache/datadog-ai-skills/_extracted/"
