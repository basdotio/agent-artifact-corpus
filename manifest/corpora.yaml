        fankachang-mutillanguagetranslate-runpowershell: >-
          same template; the repository is no longer reachable.
        golab-ai-huntianling-mm-com: >-
          front matter declares `Proprietary. LICENSE.txt has complete terms`.
        gravesjacob778-circuit-simulation-design-app-logic-gates: >-
          anthropics/skills template inside an MIT repository: the host's licence does not relicense Anthropic's text.
        ipixeldust-apryse-pdf-skills-apryse-redact: >-
          front matter declares `Proprietary. LICENSE.txt has complete terms`.
        jimmc414-kosmos-docx: >-
          anthropics/skills `docx`, declared proprietary.
        kvokka-dotfiles-skill-creator: >-
          anthropics/skills `skill-creator` inside an MIT dotfiles repository.
        malhashemi-dotfiles-pdf: >-
          anthropics/skills `pdf`, declared proprietary.
        neversight-skills-feed-swift-structure: >-
          front matter declares `Proprietary`.
        orestudio-orestudio-skill-review: >-
          anthropics/skills template inside a GPL-3.0 repository: wrong twice over.
        organvm-iv-taxis-a-i-skills-docx: >-
          anthropics/skills `docx`, declared proprietary, inside an Apache-2.0 repository.
        otowoorg-stellar-k8s-rust-blockchain: >-
          anthropics/skills template inside an Apache-2.0 repository.
        plebann-eastron-sdm-ha-integration-ha-test-harness: >-
          anthropics/skills template inside an Apache-2.0 repository.
        sandraschi-advanced-memory-mcp-astronomy-astrophysics-expert: >-
          front matter declares `Proprietary`.
        sidetoolco-org-charts-kleva-business: >-
          front matter declares `Proprietary`.
        thomasansems-heysummon-heysummon: >-
          front matter declares `SEE LICENSE IN LICENSE.md`; the repository is no longer reachable, so the terms cannot be read.
        tiandiyiqi-ai-skills-e64f4f53: >-
          anthropics/skills template, repository has no licence.
        toddward-claude-skills-playground-resume-builder: >-
          anthropics/skills template, repository has no licence.
      # Directory names are slugs and cannot carry a repository path, and a provenance file
      # inside the tree would be fed to the scanner as sample content — which has corrupted a
      # measurement in this corpus once already. So it sits beside the tree and is read here.
      source_from: "sidecar:<name>.provenance.json:repo"
      # The author's licence, not the dataset's. The dataset card: each SKILL.md "retains the
