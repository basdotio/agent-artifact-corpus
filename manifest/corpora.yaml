        # Excluded 2026-10-28 for LICENCE, after a sweep of every tree's own front matter.
        # The compilation's licence (MIT on skillet) covers the curation; each
        # SKILL.md keeps its author's terms, and these declare terms layer 1 cannot carry.
        # 34 trees across this entry and skillet-wild are the anthropics/skills family
        # (`LICENSE.txt` All rights reserved) re-published by other people, or NC/SA.
        # docs/licensing.md calls that set a hard red line; it had come in by the back door.
        MUmerRazzaq__claude-code-skills-lab__.claude__skills__prebuilt__pptx: >-
          anthropics/skills `pptx`, front matter declares `Proprietary. LICENSE.txt has complete terms`.
        MUmerRazzaq__claude-code-skills-lab__.claude__skills__prebuilt__theme-factory: >-
          anthropics/skills `theme-factory`, same declaration.
        Okeysir198__P20251122-claude-skills__canvas-design: >-
          anthropics/skills `canvas-design`.
        Okeysir198__P20251122-claude-skills__mcp-builder: >-
          anthropics/skills `mcp-builder`.
        Okeysir198__P20251122-claude-skills__skills-reference__webapp-testing: >-
          anthropics/skills `webapp-testing`.
        aaron-howard__training-certify__.claude__skills__frontend-design: >-
          anthropics/skills `frontend-design` inside an MIT repository: the host's licence does not relicense Anthropic's text.
        dakesan__hiro-favorite-skills__skills__skill-creator: >-
          anthropics/skills `skill-creator` inside an Apache-2.0 repository.
        hacket__AICodingGuide__.claude__skills__algorithmic-art: >-
          anthropics/skills `algorithmic-art`.
        hacket__AICodingGuide__.claude__skills__internal-comms: >-
          anthropics/skills `internal-comms`.
        nextblock-cms__nextblock__.agent__skills__frontend-design: >-
          anthropics/skills `frontend-design`.
      source_from: "dirname-parts:2"   # trees are named owner__repo__path__…
      # skillet's README: "Third-party sample content retains its upstream licence." Its MIT
      # covers the benchmark harness; each tree's licence is its repository's, pinned by
      # scripts/resolve-repo-licenses.py.
      license_from: "pins:manifest/pins/repo-licenses.json:source-repo"
      benign_note: >-
        A real public skill, pinned to its originating repository and commit by
        shenyimings/skillet. Its `safe` label is inherited from MaliciousAgentSkillsBench and
        most likely means "not flagged" rather than "reviewed and found benign", so it is
        usable as a false-positive denominator but not as evidence that any particular sample
        is harmless.
      fidelity: >-
        Class is a constant: only the `safe` directories are matched by the layout, so nothing
        is inferred. Benign samples carry no tier, dimension or severity, so there is no lossy
        axis mapping here at all — this is the most mechanical derivation in the corpus. What
        is weak is not the derivation but the upstream label, and that is recorded in hazards.

  # ---------- MCP server source — the benign side the mcp surface never had ----------
  # The mcp surface held 353 real tool CATALOGUES (automatelab) and 127 malicious server SOURCE
  # trees (cisco), and nothing benign that was source. A scanner that reads server code was
  # therefore measurable for recall on this surface and not for over-alerting: every flag it
  # raised on source was on a sample labelled malicious. These four entries are real server
  # source somebody publishes, vendored at a pinned commit, class a constant. Two are servers
  # people run (wild); two are the SDKs' own examples (fixture) — authored to show the API, not
  # captured from anywhere, and `corpus score` keeps the two rates apart.
  #
  # Language is not filtered. The reference repositories mix TypeScript and Python servers, and
  # a scanner that reads only one language sees only part of each entry. That is the scanner's
  # coverage to declare, not this corpus's population to trim; the per-entry counts say how many
  # of each there are so a reader can tell a miss from a boundary.
  - id: mcp-reference-servers
    name: "modelcontextprotocol/servers (src)"
    url: https://github.com/modelcontextprotocol/servers
    commit: bbb701e7ac1e57f3edd1c2836b94c5457eaf7b9c
    sha256: ""
    license: Apache-2.0
    role: fp-denominator
    # the project's maintained reference servers, published to be installed and run
    provenance: wild
    subset: src
    malicious: 0
    benign: 7                       # 3 Python (fetch, git, time), 4 TypeScript (everything, filesystem, memory, sequentialthinking)
    vendorable: true
    hazards:
      - "LICENCE IS IN TRANSITION. The repository's LICENSE says contributions are Apache-2.0 where relicensing consent was obtained and remain MIT otherwise; both are permissive and both are honoured in NOTICE. Apache-2.0 is recorded here as the project's stated destination"
      - "4 of 7 are TypeScript. A Python-only reader scores 3 samples from this entry and reads nothing on the other 4; a NoVerdict there is a declared boundary, not a miss, and it must not be folded into a benign verdict"
      - "`everything` and `filesystem` do by design what a malicious server would do by stealth — read and write arbitrary paths, run subprocesses — because that is their declared purpose. A flag on them is a flag on a benign sample and not yet a false positive; the reviewed block is how one becomes the other"
      - "the trees carry lockfiles and package manifests as published. Nothing was removed: a transform may strip an upstream's label, never the artifact's contents"
    derive:
      layout: "src/*"
      label_file: ""
      surface: mcp
      kind: server
      id_prefix: ref
      class_from: "constant:benign"
      benign_note: >-
        The source of a reference MCP server published by the protocol's maintainers, vendored
        unchanged from the pinned commit. Benign means `people install and run this`: no security
        review is claimed, and several of these servers read, write and execute by design. A rate
        measured here says how often a scanner objects to the servers users are told to start with.
      fidelity: >-
        Class is a constant and the layout matches every directory under src/, so nothing is
        selected or mapped. The only judgement is which repository was pinned, and at what commit.

