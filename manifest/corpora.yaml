        small-java-world__todo-manage__todo-api-skills__api.task-listing.minimal-v1: >-
          Wholly contained in the same project's `todo-api-client-sample__.claude__skills` copy.
        small-java-world__todo-manage__todo-api-skills__tdd.red-case.write-v1: >-
