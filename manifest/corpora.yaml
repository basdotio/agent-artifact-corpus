  - id: datadog-npm-mcp
    name: "DataDog malicious-software-packages-dataset (samples/npm, MCP servers)"
    url: https://github.com/DataDog/malicious-software-packages-dataset
    commit: d156188d1e45763d6cb7995543a428de6c4056b8
    sha256: ""
    license: Apache-2.0
    role: recall
    # malicious npm packages captured from the registry that are ALSO real MCP servers. The
    # count is what reading established, not the upstream headline (see hazards): samples/npm
    # holds 1,000+ malicious_intent packages, almost none of them agent artifacts.
    provenance: wild
    subset: samples/npm/malicious_intent
    malicious: 5
    benign: 0
    vendorable: true
    hazards:
      - "NOT the whole of samples/npm. That subset carries 1,000+ malicious_intent packages, overwhelmingly generic npm malware (droppers, /etc/passwd preinstalls, wallet stealers) on no surface this corpus models. ~128 have an agent-ish name; ~23 are MCP-shaped; these 5 are the ones that are BOTH a real MCP server AND malicious on reading. A recall figure here is over 5 read samples, not over the subset"
      - "the 5 are selected by READING, not by name. Name matches rejected by reading include clean republishes flagged by mistake (an airtable-mcp, a WaterCrawl fork, a Playwright-MCP fork) and generic malware wearing an mcp-ish name — kept out the same way ~175 datadog-ai-skills samples are"
      - "disjoint from datadog-ai-skills despite the shared upstream repo and commit: that entry vendors samples/ai-skills (SKILL.md trees), this one vendors samples/npm packages. No sample is in both, so they are NOT declared as overlaps — a false overlap would suppress correct pooling"
      - "ONE VERSION PER PACKAGE is vendored. A package ships many near-duplicate versioned zips; the version carrying the payload is pinned by hand, because the malice is not always in the latest tag, and `corpus validate` refuses near-duplicates"
      - "these are LIVE malware. The archives are zip-encrypted with the password `infected`, the malware-corpus convention. scripts/prep-datadog-npm.py copies already-extracted bytes; it never executes them, and `corpus fetch` deliberately does not unpack"
      - "@lanyer640 (reverse shell :2333) and mcp-server-todo (wallet exfil :4433) hardcode the same C2 host 45.115.38.27 — plausibly one actor. Counted as two samples because they are two published packages with two distinct techniques, but a source-diversity read should know they may share an author"
    prep:
      - "extract the five keeper packages (unzip with password `infected`) into cache/datadog-npm-mcp/_extracted/, then run scripts/prep-datadog-npm.py to vendor them into corpus/malicious/mcp/dd-npm-*"
      - "labels are hand-pinned, not derived: each carries basis.class read with a quote validate locates in the sample's own bytes"

  - id: clawhub-live
    name: "HF OpenClaw/clawhub-security-signals-live (weekly intake of judge=malicious rows)"
    url: https://huggingface.co/datasets/OpenClaw/clawhub-security-signals-live
    commit: c2f898973da85feaa62789f5e1e934d2aad6a667   # the export at the first intake; each tree's sidecar records the commit it came from
    sha256: ""
    license: MIT
    role: recall
    # real skills published to a real registry; the registry's own pipeline flagged them
    provenance: wild
    malicious: 284                  # candidates (rows with clawscan_verdict=malicious) in the pinned export; 11 derived after reading, grows weekly
    benign: 0
    vendorable: true
    overlaps: [datadog-ai-skills, agent-skill-malware, clawhub-security-signals]
    hazards:
      - "A MOVING SOURCE, TAKEN IN WEEKLY. The dataset is re-exported every Sunday and `main` changes; the entry's commit is the export of the first intake and the count grows. What pins a sample is its own sidecar (`<name>.source.json`: hf_commit, row id, ClawHub owner/slug@version), written by scripts/intake-clawhub.py, and the intake state in manifest/pins/clawhub-intake.json names every row ever seen with the decision taken"
      - "THE REGISTRY'S VERDICT IS A SCANNER'S OPINION. `malicious` is the GPT judge merging VirusTotal, static rules and SkillSpector; a 276-sample human reference set (arXiv 2609.17274) measured it at 61% sensitivity and 81% specificity. So a row is a CANDIDATE: it enters this corpus only through dimension_overrides, with the line a person read and quoted, and a row read as not malicious is excluded by name with the reason. Nothing from this entry is derived on the verdict alone"
      - "HELD-OUT EXCLUSION IS MECHANICAL. agent-skill-malware is ClawHub content no scanner author has read, and must stay so. The intake refuses any candidate matching a held-out row by normalised SKILL.md hash or by skill name (manifest/pins/heldout-skillmd-sha256.json holds hashes and names, not content) and refuses to run without that pin file"
      - "AT MOST 5 SAMPLES PER PUBLISHER, ACROSS ALL WEEKS. ClawHub campaigns are one account re-publishing one lure under many slugs (DataDog's set: 54 of 204 from one account; 55 copies of one fake-prerequisite lure). The cap is enforced by the intake and counts queued and derived samples; excluded ones do not count. Campaign copies that differ in bytes still reach the reader, who excludes them as `copy of <name>` — the read list names the corpus samples a candidate shares a lure host with"
      - "SANITIZED EXPORT, NOT THE REGISTRY BUNDLE. Rows carry the SKILL.md and bundle files as OpenClaw's public export sanitizes them (secret-like values redacted, some package contents excluded). A judged-malicious skill is hidden from the registry API and the documentation forbids mirroring hidden content, so the export is the only copy there is; a tree here may lack a file the publisher shipped, and the sidecar lists what it has"
      - "LICENCE: MIT-0 BY THE REGISTRY'S TERMS. OpenClaw's documentation (docs.openclaw.ai/clawhub/skill-format and /clawhub/cli, read 2026-10-29): `All skills published on ClawHub are licensed under MIT-0` and `ClawHub does not support per-skill license overrides`. The pins file records MIT-0 per sample. A bundle that ships its own LICENSE file or a front-matter `license:` line is flagged on the read list, because the acceptable-usage policy forbids republishing someone else's code and such a file is what that looks like; the reader decides"
      - "ClawHub registry metadata (`_meta.json`) ships inside some bundles, as it does in datadog-ai-skills; vendored as the export carries it. Inside this single-class population it predicts nothing; pooled, it marks class, and the cross-population report says so"
      - "READ BY AI AGENTS, 2026-10-29 (first intake, 279 candidates). Every tree was read by one AI reader; every tree that reader did not call confidently not-malicious, plus a seeded fifth of those it did, was read again by a second, independent reader who did not see the first verdict. A sample is KEPT only when both readers called it malicious and a quote passed the mechanical line check; EXCLUDED when both called it not-malicious or fixture, or the single reader was highly confident and the tree was not sampled; everything else — disagreement, unsure, a safety system stopping a reader, a SkillPay disclosed-fee/fake-output template whose siblings were read both ways, a live-looking credential in the deciding line — is left QUEUED for the maintainer and appears in neither map. Result: 6 kept, 204 excluded, 69 queued. THEN, SAME DAY, the maintainer had two models (gpt-6.1-sol and gpt-5.5, each reading every file of each tree alone, same definitions) read the 69 in place of a person, under the same two-reader rule: 5 kept, 48 excluded, 16 still queued (the models split; pranamya55's live-looking webhook token; three SkillPay templates the models called malicious while 23 siblings were excluded; two whose deciding line reads as an unfilled placeholder or the author's own chat id). Trees a safety system had stopped a reader on were among the 69 the models read, at the maintainer's direction. Same disclosure as the datadog-ai-skills pass the maintainer accepted in the review of #10: `read` here means read by AI agents, each label says so in read_by, and the maintainer spot-reads the kept samples"
      - "`suspicious` rows are NOT candidates. The frozen set's suspicious tier disagrees with its own paper by two orders of magnitude and nobody has explained it; the live set's is the same pipeline"
    prep:
      - "scripts/intake-clawhub.py heldout-pin      # once, needs cache/agent-skill-malware (scripts/prep-agent-skill-malware.py)"
      - "scripts/intake-clawhub.py                  # weekly: fetch the export, queue new malicious rows under cache/clawhub-live/_queue/, write READ-LIST.md"
      - "read cache/clawhub-live/_queue/READ-LIST.md; for each candidate add EITHER a dimension_overrides entry with the quoted line OR an exclude_samples line with the reason"
      - "scripts/intake-clawhub.py promote          # decided trees move to _extracted/; then make derive E=clawhub-live, derive-write, validate"
    derive:
      layout: "_extracted/*"
      surface: skills
      id_prefix: ch
      class_from: "constant:malicious"
      label_file: ""
      tier_from: "constant:plain"
      severity_from: "constant:high"
      source_from: "sidecar:<name>.source.json:source"
      license_from: "pins:manifest/pins/clawhub-licenses.json:name"
      fidelity: >-
        The class is a constant this repository asserts after a person read the sample — the
        registry's verdict put it on the read list and nothing else. Every dimension is read off
