  - id: skillmd-138k
    name: "HF FayeZC/SkillMD-138K"
    url: https://huggingface.co/datasets/FayeZC/SkillMD-138K
    commit: 0d73048abf2fb6ee91f6f9f5ac598d5be8d6bdd7
    sha256: ""
    license: CC-BY-4.0
    role: fp-denominator
    malicious: 0
    benign: 138133                  # the population; 2,000 strata of it are vendored
    vendorable: true
    overlaps: [skillet-wild]
    hazards:
      - "SKILL.md body only, no scripts — every script-surface rule is untested by it"
      - "ONE REPOSITORY HOLDS 12.5% OF THE 138,133 SKILLS. NeverSight/skills_feed is an aggregator, not an author: 2,765 different original authors are inside it. Stratifying by repository would count it as one source, which is the exact failure this corpus was founded on — a machine-wide 12.9% that turned out to describe two authors' writing habits"
      - "CONVERSELY, `corpus stats` counts by repository, so it shows skills_feed as one source holding 5.3% of the benign class (it was 6.1% before the 393-config harvest grew the benign side; the share moves whenever the denominator does, which is why the figure to trust is the one `make stats` prints today). Measured: those 173 sampled skills come from 171 DIFFERENT author directories inside it. The concentration in that report is an artifact of counting repositories; the stratification is what made it 171 writers instead of 1"
      - "46% of the 20,556 repositories hold exactly one skill, so a per-repository cap does nothing for most of the population and only shaves the top"
      - "90% of rows carry source=registry. If that registry applies any admission filter of its own then this denominator is not `what people write`, it is `what one registry accepted`. The dataset does not document the filter"
      - "stars ranges 0..344,007 with a median of 3. Popularity is not a security review, so it is recorded and never used for selection"
    prep:
      - "sample with scripts/sample-skillmd.py: stratify by repo + package path, one skill per stratum, 2,000 strata, fixed seed, and drop the 100 repositories skillet already covers so the two denominators stay disjoint and summable"
      - "the exclusion costs 447 skills of 138,133 (0.32%) and 180 strata of 37,307. Red line 2 applies, so the script prints the population with AND without it on every run rather than recording it here once"
      - "report per stratum, and publish both the sample-weighted and the source-unweighted rate"
    # A population, not a corpus. The sampling design lives in the script rather than in this
    # block because the design IS the claim the resulting rate is allowed to make, and a seeded
    # script that reprints both denominators every run is a stronger record than a paragraph.
    derive:
      layout: "extracted/*"
      label_file: ""
      surface: skills
      id_prefix: md
      class_from: "constant:benign"

      # Excluded after the refutation ruleset flagged them as holding nothing a scanner
      # could form a judgement about. Each is named with its reason: an exclusion with no
      # recorded cause is how a denominator quietly starts flattering itself.
      exclude_samples:
        chongdashu-threejs-toonshooter-threejs-builder: >-
          Wholly contained in `sk-chongdashu__threejs-forest-census__...__threejs-builder` from
          skillet-wild — the same author's skill, collected independently by two upstreams. This one
          crosses POPULATIONS, which matters because the reporting design treats them as independent
          strata.
        fullfran-hybrid-rag-example-skill-creator: >-
          SKILL.md is nothing but the path `../../../.agents/skills/skill-creator/SKILL.md` — an upstr
          eam symlink whose target text was captured as a regular file. There is no skill here to judg
          e, and the traversal-looking path draws an alert while testing nothing.
        hidorakai002-ai-workspace-archive-product-discovery: >-
          Same shape: 48 bytes, entirely `../../../product-team/product-discovery/SKILL.md`. Occupies 
          a slot in the false-positive denominator and exercises no judgement.
        wiggitywhitney-commit-story-v2-prd-done: >-
          Content is an absolute path into the author's own machine (`/Users/whitney.lee/Documents/...
          `). Nothing to scan, and it would publish a stranger's local directory layout.
      # Directory names are slugs and cannot carry a repository path, and a provenance file
      # inside the tree would be fed to the scanner as sample content — which has corrupted a
      # measurement in this corpus once already. So it sits beside the tree and is read here.
      source_from: "sidecar:<name>.provenance.json:repo"
      benign_note: >-
        A real public SKILL.md, one drawn from each of 2,000 strata of SkillMD-138K. Benign in
        the only sense this denominator supports: it is what people actually published, not
        something reviewed and found harmless. 90% of the population reached the dataset through
        a registry whose admission criteria are undocumented, so an alert rate measured here
        describes over-alerting on ordinary published skills and nothing stronger than that.
      fidelity: >-
        Mechanical, and narrowly so: class is a constant, only benign trees exist, and benign
        samples carry no tier, dimension or severity, so no axis is mapped and none can be lost.
        Every judgement in this entry is in the sampling instead — which strata exist, one per
        stratum, and which repositories are excluded — and that is in a seeded script under
        version control, not in this file.

