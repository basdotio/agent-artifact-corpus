    hazards:
      - "CONTENT CORRECTION: this is not a malicious/benign corpus of paired twins. Its 24 SKILL.md fixtures are SkillSpector's own rule-category fixtures and span three unrelated things: real attacks (malicious_skill posts os.environ out, ssd* are natural-language injections, mcp_* poison tool descriptions), INTENT MISMATCH (sdi*, where a description claims no network access while the code calls out — a dimension this corpus deliberately does not model), and QUALITY problems (sqp*: vague triggers, missing warnings, locale forcing, which are not attacks at all). Importing it wholesale would label lint fixtures malicious and score a scanner as missing something that was never there"
      - "the safe_skill/malicious_skill pair is NOT near-identical, so it does not test discrimination: one is a greeting skill, the other a chef assistant whose helper.py posts the environment to a remote host"
