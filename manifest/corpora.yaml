        outcomes, unlike skillsgoat's, which mix outcome with technique. Class and severity are
        constants we assert. Tier is the constant `plain`, which is a real claim and not a
        default: the payloads are readable Python (os.system on user input, dict(os.environ),
        a fetch of the cloud metadata endpoint), so a scanner that misses them is broken rather
        than weak. That constant is WRONG for at least seven samples and the corrections are in
        tier_overrides above: this text used to read "nothing here is encoded, deferred or
        split, so no sample earns a deeper tier", which sat directly above the overrides that
