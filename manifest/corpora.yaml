# Decisions about refutation matches, keyed by sample id. Every match needs one: a pattern
# that reports and changes nothing is the defect this repository keeps finding in its own
# instrumentation.
#
# `keep` dominates on purpose. An audit read 250 benign samples and found 39% contain
# something a defensible scanner fires on — all of those belong in the denominator, because
# they ARE the precision test. What a `keep` buys is that somebody looked once and wrote down
# why, so the next reader does not have to redo it.
adjudications:
  ben-skill-md-idanbeck-claude-skills-slack-skill:
    pattern: credential
    verdict: keep
    reason: >-
      The two `xoxb-` strings are `xoxb-default-token` and `xoxb-work-token` — the words name what
      the slot is for. A Slack token scanner fires on the prefix and is right to; that is the
      measurement.
  ben-skill-md-jaeyeom-claude-toolbox-semgrep-review:
    pattern: credential
    verdict: keep
    reason: >-
      Four `-----BEGIN PRIVATE KEY-----` headers inside a semgrep rule document that exists to
      teach detection of exactly this. Content ABOUT a credential, not a credential.
  ben-skill-sk-Ketomihine__my_skills__scarches-docs-complete:
    pattern: credential
    verdict: keep
    reason: >-
      `AKIAIYCQYOYV5JSSROOA` is a complete, well-formed AWS key id — and it sits inside a pasted
      wget log from 2023 downloading a public dataset from figshare. An S3 pre-signed URL carries
      the issuer's key id by construction. Nothing leaked; the strongest-looking hit in the corpus
      is a documentation artefact, which is why it is worth keeping.
  ben-skill-sk-SecKatie__katies-ai-skills__skills__llm:
    pattern: credential
    verdict: keep
    reason: >-
      `sk-my-key-goes-here` says what it is.
  ben-skill-sk-duplocloud__ai-ops__skills__tf-module:
    pattern: credential
    verdict: keep
    reason: >-
      `-----BEGIN RSA PRIVATE KEY-----` followed by a literal `...` and the END line. A PEM-header
      rule fires on the anchor and cannot see that the body is an ellipsis.
  ben-skill-sk-jbmiller10__semantik-plugin-template__.claude__skills__semantik-plugin-development:
    pattern: credential
    verdict: keep
    reason: >-
      `sk-actual-key-value` is the placeholder spelled out in words.
  ben-skill-sk-jbmiller10__semantik-plugin-template__.codex__skills__semantik-plugin-development:
    pattern: credential
    verdict: keep
    reason: >-
      The same template vendored under .codex as well as .claude.
  ben-skill-md-compendiumlabs-gum-jsx-gum-jsx:
    pattern: codepoint
    verdict: keep
    reason: >-
      A single U+00AD soft hyphen before an em dash — typography from whatever editor wrote the
      file.
  ben-skill-md-copyleftdev-sk1llz-deterministic-simulation:
    pattern: codepoint
    verdict: keep
    reason: >-
      212 zero-width characters in a deliberate encoding: U+200B/U+200C as bits, U+200D as the
      separator, U+2060 as the boundary. Decoding the first group yields the magic `SK1L` — the
      repository is `sk1llz`, so this is the author watermarking their own skill. Not an
      instruction, and a scanner flagging it is doing its job: this is what the technique looks
      like when it is used for something harmless, which is exactly the hard case.
  ben-skill-md-gw-ai-security-ats-cv-scorer-project-phase-planner:
    pattern: codepoint
    verdict: keep
    reason: >-
      A UTF-8 BOM at byte zero.
  ben-skill-sk-DeevsDeevs__agent-system__anti-ai-slop:
    pattern: codepoint
    verdict: keep
    reason: >-
      A U+200B inside `name = "ab\u200bc" # zero-width space` — the document is demonstrating the
      character it contains.
  ben-skill-sk-Ketomihine__my_skills__liana-py-complete:
    pattern: codepoint
    verdict: keep
    reason: >-
      One U+200B mid-sentence in prose, left by a copy-paste out of rendered documentation.
  ben-skill-sg-long-legitimate:
    pattern: no-content
    verdict: keep
    reason: >-
      60,403 bytes, 905 non-blank lines, 5 distinct: one sentence repeated 900 times. As a
      false-positive decoy it tests nothing, and the audit said so. Kept anyway because it is the
      corpus's only large single artifact and it does test something real — whether a scanner
      truncates, times out or falls over on bulk. Any precision figure quoting this sample is
      quoting the wrong measurement.
  # ---- harvest-mcp-servers.py, 2026-10-15. Four of the 273 code-search trees matched a
  # pattern and stay; five others left the denominator under DROPPED in the script itself
  # (attack fixtures by their own file names, a botnet tool, live-looking keys), where the
  # reason travels with the code that would otherwise vendor them again.
  ben-mcp-gh-0x7556-wolfshell:
    pattern: live-credential
    verdict: keep
